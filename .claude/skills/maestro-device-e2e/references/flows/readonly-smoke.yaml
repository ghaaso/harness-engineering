# <!-- Authored for FixFlow, 2026-11-04 -->
# Read-only navigation smoke (P5d-1b, optional, one roster phone per OEM, only with the owner's
# per-phone approval). Never signs in (the technician does, O-10 E4), never taps a write.
# Proves only that the installed build reaches the jobs lists in the foreground on this OEM.
appId: com.fixflow.technician
name: FixFlow read-only smoke
tags:
  - fixflow-readonly
---
- assertNotVisible: "Technician sign-in"
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 30000
- runFlow: subflows/preconditions.yaml
- takeScreenshot: readonly-dashboard
- tapOn: "Jobs"
- extendedWaitUntil:
    visible: "Task Management"
    timeout: 15000
- tapOn: "On-Going Tasks"
- extendedWaitUntil:
    visible: "ACTIVE ON-GOING JOBS"
    timeout: 30000
- takeScreenshot: readonly-ongoing
- back
- back
