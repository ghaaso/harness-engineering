# <!-- Authored for FixFlow, 2026-11-04 -->
# O-10 drain smoke for P2c: the fleet APK on the SPARE phone, FixFlow's network OFF for the whole
# test, app opened by the person at the phone; "the Drain Report renders (empty: the spare phone
# cannot log in)" (docs/program/SHIP-PLAN-2026-11.md:488-490 on PR #182). Read-only: no taps.
# The Drain Report is built in P2b-1 and is NOT on main @ a31924a, so its strings are unknown here.
# Before the run, grep the P2b-1 source for the report's title and pass it as -e DRAIN_TITLE=…;
# the default below is a placeholder and will fail until confirmed.
appId: com.fixflow.technician
name: FixFlow drain report smoke (O-10, P2c)
tags:
  - fixflow-readonly
env:
  DRAIN_TITLE: ${DRAIN_TITLE || "Drain Report"}
---
- extendedWaitUntil:
    visible: ".*${DRAIN_TITLE}.*"
    timeout: 30000
- assertNotVisible: "Welcome back,"
- takeScreenshot: drain-report-rendered
