# <!-- Authored for FixFlow, 2026-11-04 -->
# Refuse to start on a phone that holds queued or parked writes, or that was never onboarded.
# A smoke never runs over real field data (O-10 A1) and never grants permissions itself
# (the grants are part of the device state the O-01 protocol measures).
# Strings: App.tsx:45-46 (offline banner), OnboardingScreen.tsx:61.
appId: com.fixflow.technician
---
- assertNotVisible: ".*need attention \\(see the job\\).*"
- assertNotVisible: ".*saved offline — syncing when reconnected.*"
- assertNotVisible: "Never forget to clock in"
