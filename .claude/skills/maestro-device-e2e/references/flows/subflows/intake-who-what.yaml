# <!-- Authored for FixFlow, 2026-11-04 -->
# Intake wizard steps 1-2 (CreateJobWizard.tsx:231-258). Starts on "Task Management".
# Phone 03000000000 is typed on the in-app keypad, open by default (CreateJobStep1Screen.tsx:30,
# :144-151); change the taps here if the owner names another test number. The problem is typed,
# not recorded (Type toggle, CreateJobStep2.tsx:338).
appId: com.fixflow.technician
---
- tapOn: "\\+"
- extendedWaitUntil:
    visible: "Who"
    timeout: 15000
- tapOn: "0"
- tapOn: "3"
- repeat:
    times: 9
    commands:
      - tapOn: "0"
- tapOn: "Name"
- inputText: ${CUSTOMER_NAME}
- hideKeyboard
- tapOn: "Next"
- extendedWaitUntil:
    visible: "What's the issue\\?"
    timeout: 15000
- tapOn: ".*${APPLIANCE}"
- tapOn: ${BRAND}
- tapOn: "Type"
- tapOn: "E\\.g\\., It's making.*"
- inputText: "Maestro smoke test, not a real repair"
- hideKeyboard
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Where & how"
    timeout: 15000
