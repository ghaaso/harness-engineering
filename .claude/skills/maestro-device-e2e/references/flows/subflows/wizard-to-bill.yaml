# <!-- Authored for FixFlow, 2026-11-04 -->
# The on-site wizard, 1/6 to the bill (ArrivalJobWizard.tsx:308-357). OPERATOR-ASSISTED: every
# capture opens the phone's own camera app (ImagePicker.launchCameraAsync,
# ArrivalCapturesScreen.tsx:67, :110; ArrivalAfterVideoScreen.tsx:41) and the voice summary is a
# hold-to-record icon with no text or testID (ArrivalJobStep2.tsx:200-216). The person at the
# phone shoots/holds; the flow waits up to 3 min per capture for the next screen state.
# Stops on the bill: it never sends on WhatsApp, takes a payment, negotiates or closes.
appId: com.fixflow.technician
---
- extendedWaitUntil:
    visible: "1 / 6"
    timeout: 20000
- tapOn: "Capture Serial Plate"
- extendedWaitUntil:
    visible: "Condition Snap.*"
    timeout: 180000
- tapOn: "Condition Snap.*"
- extendedWaitUntil:
    visible: "Condition Snap \\(2 of 2\\)"
    timeout: 180000
- tapOn: "Condition Snap.*"
- extendedWaitUntil:
    visible: "Is there an error code\\?"
    timeout: 180000
- tapOn: "No"
- tapOn: "Record Before-Video"
- extendedWaitUntil:
    visible: "Evidence Secured"
    timeout: 180000
- takeScreenshot: wizard-captures-done
- tapOn: "Continue to Voice Summary"
- extendedWaitUntil:
    visible: "Voice summary"
    timeout: 15000
- extendedWaitUntil:
    visible: "Summary Recorded"
    timeout: 180000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Diagnosis"
    timeout: 15000
- tapOn: "skip — codes stay optional"
- extendedWaitUntil:
    visible: "Materials"
    timeout: 15000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "After-video"
    timeout: 15000
- tapOn: "Record After-Video"
- extendedWaitUntil:
    visible: "After-video captured"
    timeout: 180000
- tapOn: "Continue to Outcome & Time"
- extendedWaitUntil:
    visible: "Outcome & time"
    timeout: 15000
- tapOn: "Repaired"
- tapOn: "Submit → bill opens"
- extendedWaitUntil:
    visible: "Bill · job #.*"
    timeout: 60000
- takeScreenshot: bill-opened
