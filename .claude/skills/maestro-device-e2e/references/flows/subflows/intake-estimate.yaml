# <!-- Authored for FixFlow, 2026-11-04 -->
# Intake step 4 (CreateJobStep4.tsx:42-113). The WhatsApp switch is NEVER tapped: it is the
# only input to the consent gate and defaults OFF (CreateJobWizard.tsx:73-82). The approval chip
# stays at its default "Approve now" (CreateJobWizard.tsx:72).
appId: com.fixflow.technician
---
- extendedWaitUntil:
    visible: "Estimate & Approval"
    timeout: 15000
- tapOn: "0\\.00"
- inputText: ${ESTIMATE}
- hideKeyboard
- assertVisible: "WhatsApp updates"
- scrollUntilVisible:
    element: "Create Task"
    direction: DOWN
    timeout: 10000
- tapOn: "Create Task"
