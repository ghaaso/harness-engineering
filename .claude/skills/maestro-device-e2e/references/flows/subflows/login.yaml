# <!-- Authored for FixFlow, 2026-11-04 -->
# One sign-in attempt, never retried: the per-account lock blocks a correct PIN too and
# escalates (CLAUDE.md "The login lock deliberately blocks a correct PIN too").
# MAESTRO_FIXFLOW_TECH (the roster name as shown) and MAESTRO_FIXFLOW_PIN are set by the owner
# in their own shell at run time. Neither value is ever written into this file.
# Strings: LoginScreen.tsx:64, :85, :99, :112, :56; DashboardScreen.tsx:50.
appId: com.fixflow.technician
---
- assertVisible: "Technician sign-in"
- tapOn: ${MAESTRO_FIXFLOW_TECH}
- tapOn: "••••"
- inputText: ${MAESTRO_FIXFLOW_PIN}
- hideKeyboard
- tapOn: "Log in"
- extendedWaitUntil:
    visible: "Welcome back,"
    timeout: 30000
- assertNotVisible: "Wrong PIN, or login failed."
