g base image breaks the Railway build","story":"A Dockerfile hardcoded the bookworm package line, but the floating python:3.12-slim image moved to trixie. The image build failed and production stayed on the old version.","when":"2026-06-16","source":"Commits afb7065, 9c561b0; deploy workflow first run","entry":"Trap. Railway image build fails: postgresql-client-17 cannot be installed. The Dockerfile hardcodes the bookworm-pgdg apt line, but python:3.12-slim now follows trixie. Build the line from the image's VERSION_CODENAME. CI does not build this Dockerfile.","steps":[{"step":1,"status":"strains","note":"The first deploy run failed. The writer believed 'bookworm ships 15', the same picture a cheap model brings from training."},{"step":2,"status":"works","note":"'Before retrying a failed deploy' fires."},{"step":3,"status":"strains","note":"The apt error sits in the Railway build log. The session may reach the Actions log through gh. The Railway log needs a paste."},{"step":4,"status":"works","note":"First time: the store is empty for this. A miss is the right answer."},{"step":5,"status":"not_reached","note":"Nothing is delivered on a miss."},{"step":6,"status":"not_reached","note":"Nothing to adapt."},{"step":7,"status":"breaks","note":"The authoritative check is a re-triggered Railway deploy. The strong model's own output was the defect, so 'equal to the strong model' is not success."},{"step":8,"status":"strains","note":"Miss, claim, then escalate with the lookup id only. The receiving Opus must fetch the build log again."},{"step":9,"status":"strains","note":"It meets the write rule, because a deploy was burned. 'Won't break on the next base-image change' predicts a vendor."},{"step":10,"status":"strains","note":"A floating tag moves with no local trace, so the store cannot re-check the entry. The Dockerfile comment carried the lesson at no cost."}],"worked":""},{"id":"f04-C4","family":"vendor-build-deploy","title":"Staging VM unreachable after a PC reboot","story":"After a reboot the Hyper-V switch gets a new address range. The firewall rule allowed ssh only from the old one. The 11-04 entry was half right and spread through three later documents.","when":"2026-11-04 entry; 2026-11-09 recurrence","source":"Staging rig scripts; commit db6c8fa; session S11 lead","entry":"Trap (staging rig). After a PC reboot rig.sh start brings the VM up at a new address, then 'ssh did not come up'. The Default Switch gets a new /20 inside 172.16.0.0/12 each boot. The rule must name 172.16.0.0/12.","steps":[{"step":1,"status":"works","note":"Sonnet 5.5 held the drills task, the rig scripts and the provision script with its comment in a resumed window."},{"step":2,"status":"works","note":"rig.sh start failed after 5 min 23 s, so 'before retrying a failed deploy' fires."},{"step":3,"status":"works","note":"The command output is local. No paste is needed."},{"step":4,"status":"breaks","note":"It returns the 11-04 entry, which is half right. The error line is a generic ssh wait failure and fits any reason ssh is down."},{"step":5,"status":"works","note":"The card lands in the main window. The compaction summary kept the subnet fact."},{"step":6,"status":"not_reached","note":"The entry's fix was already applied. Nothing to adapt."},{"step":7,"status":"breaks","note":"The store then learns 'not this entry' for a recurrence of the entry's own cause."},{"step":8,"status":"not_reached","note":"Sonnet solved it in two turns without escalating."},{"step":9,"status":"breaks","note":"Nothing can test the generalisation from two samples, yet it is stored as fact."},{"step":10,"status":"breaks","note":"Repair needs two Opus calls for a two-turn Sonnet fix. Cross-project use is not specified. On a real host 'both private blocks' is wrong."}],"worked":""},{"id":"f04-C5","family":"vendor-build-deploy","title":"Queued writes deleted on a non-network error","story":"A fix classified errors by status. Later, Railway's edge answered some requests with 4xx text and phones parked or dropped writes for weeks. No session ran. An agent first saw it on 10-31.","when":"2026-07-03; outage from about 2026-08; seen 2026-10-31","source":"Commit c27bb39; O-08-design.md line 62; O-03-design.md line 7","entry":"A queued write that synced into a non-network error was deleted. A typed ApiError carries the status. 401 pauses the queue. 400, 403, 404, 409 and 422 are definitive: move to a visible failed list. 5xx, 429 and timeouts retry. Bias every ambiguity toward keeping the record.","steps":[{"step":1,"status":"strains","note":"On 07-03 the task is a real defect in the new queues, and the outbox contract is in the window."},{"step":2,"status":"breaks","note":"From about 2026-08 phones park and drop for weeks while no session runs. No trigger exists for a failure that never reaches a window."},{"step":3,"status":"not_reached","note":"Nothing to query during the outage. On 10-31 the only text is the host's 'Application not found', which shares no words with any entry."},{"step":4,"status":"works","note":"The diff check surfaces the outbox contract by its identifiers on the changed lines. It is the right entry for the task as posed."},{"step":5,"status":"works","note":"The card sits in the window of the session doing the work."},{"step":6,"status":"works","note":"Adapting to pings, 'droppable, so drop', is what Opus 4.8 did. The output was equal."},{"step":7,"status":"breaks","note":"Tests mock a 404. Nothing can test who answers a 404. The equal output carried the same exposure."},{"step":8,"status":"not_reached","note":"No visible failure until 10-31. Then the top tier ran the program directly."},{"step":9,"status":"strains","note":"The replacement entry comes from a multi-agent workflow. Its premise is dashboard configuration, outside git and outside any footprint."},{"step":10,"status":"breaks","note":"The vendor change left no local event, so the entry stayed validated. Reuse spread its premise to queues where a 4xx means drop."}],"worked":""},{"id":"f05-1","family":"flaky-race-data","title":"Old queued completion replays over a newer one","story":"An offline completion is replayed over a newer live one. The fix drops the queued copy after a live send. Later it deleted a real queued completion when the live send was a blank form.","when":"Fixed 2026-07-03; door found 27 days later","source":"Commit 76061e0; later 8dafcec; completionPrefill.ts lines 26-30","entry":"Mobile outbox defect. A completion queued offline is replayed over a newer live send under the same stable id. Fix: after a successful live send, remove the queued item. Payments and notes use unique ids, so they never collide.","steps":[{"step":1,"status":"strains","note":"Later tasks are features. The race is not a problem the model has. Only CLAUDE.md's always-loaded known-defect note names it."},{"step":2,"status":"works","note":"No error, so no lookup after failure. The diff check matches named handles on changed lines, and an outbox edit warns."},{"step":3,"status":"works","note":"The diff check is mechanical. The model does not choose the words."},{"step":4,"status":"strains","note":"Two entries look like one problem: 'stale write over newer send: fixed' and 'same id, concurrent flush: open'."},{"step":5,"status":"works","note":"One warning line per entry in the main session and the decisions journal. The Opus reviewer rules."},{"step":6,"status":"breaks","note":"The only stored fix is a rule: on live success, drop the queued copy. Adapting it to a new kind copies the door."},{"step":7,"status":"breaks","note":"A race's footprint is identical in a good and a bad run. The old Jest case passes even where its rule destroys a bill."},{"step":8,"status":"breaks","note":"Nothing fails in a session. In the field the winner is whichever request the server finishes last. Nothing climbs. The finder was code reading."},{"step":9,"status":"strains","note":"Written at solve time, it is stored with 'never collide' true and the deletion unseen."},{"step":10,"status":"breaks","note":"The entry stayed true by its own test while a later fix found it was a door through screens outside its footprint."}],"worked":""},{"id":"f05-2","family":"flaky-race-data","title":"Dispatcher flip sends the whole history","story":"Nothing fails until FIXFLOW_ENABLE_DISPATCHER is switched on. Then an unseeded cursor drains 87 events as live WhatsApp messages, 36 of them triggers. Later tasks are a drain audit and a host move.","when":"Entry from 2026-08-01 review; ship plan later","source":"Commit c731e66; migration 0046; HANDOFF lines 157-166; SHIP-PLAN line 102","entry":"Trap, operator action. With no cursor row, run_dispatch_once starts at last_seq=0 and drains all of job_event as live messages. Measured on prod: 87 events, 36 triggers. Fix: migration 0046 seeds the cursor at the latest seq. A 2-day age skip covers a hand reset.","steps":[{"step":1,"status":"strains","note":"Later tasks are a drain audit and a host move. Neither is 'a dispatcher problem'. The hazard is a state the next operator action meets."},{"step":2,"status":"strains","note":"No error exists. The diff check cannot see state outside git, such as an env flip or database rows."},{"step":3,"status":"strains","note":"The entry's action is 'enable dispatcher'. Later sessions act as drain, restore, re-point or close the window. A hit depends on guessing those verbs."},{"step":4,"status":"strains","note":"At best a candidate. Entries about prod data are capped at candidate until a probe and an age-guard test exist."},{"step":5,"status":"works","note":"The main session gets one card."},{"step":6,"status":"breaks","note":"Events pile up above the July seed while OFF, and months-old writes count as fresh."},{"step":7,"status":"breaks","note":"The probe runs on a throwaway database migrated to head. It cannot count events above the prod cursor. The 36 came from a prod query."},{"step":8,"status":"strains","note":"What must go up is a prod query result, which an operator runs, not a model."},{"step":9,"status":"works","note":"Write-then-approve by a different Opus matched what happened. The review fixed the dead-letter guard, the downgrade and a test that pinned the consent leak."},{"step":10,"status":"breaks","note":"'Enabling is forward-only' decays with prod rows no footprint item sees. The entry stays validated. The ship plan, not the store, carries the live rule."}],"worked":""},{"id":"f05-3","family":"flaky-race-data","title":"Clinic check stalls with no test named","story":"A parallel check ends 'no test made progress for 600s'. The cause is unknown. The related entry from a faster-check session covers a different cause, a crashed worker, and the rerun passed with no fix.","when":"2026-11-09 stall; related entry 2026-11-05","source":"Transcript 7b3031d3 line 1152; HARNESS-BOTTLENECKS line 427","entry":"No entry from the 9 Nov stall. The related entry: parallel pass ends 'no test made progress for 600s' after a worker died. Under pytest-xdist loadfile the run hangs. Under load the crash is reported at once. Set DIST_MODE to 'load'.","steps":[{"step":1,"status":"works","note":"Sonnet was measuring runs mid-task. The log tail, with dots to 96 %, 'exit 1, 961.0s' and the watchdog line, was in the window."},{"step":2,"status":"works","note":"A cheap agent that hits an unexpected gate error looks it up before retrying."},{"step":3,"status":"strains","note":"What may matter is not in it: the watchdog reports no test id, and low memory and load show only in load samples."},{"step":4,"status":"strains","note":"An exact template hit on the 11-05 entry, a different cause. The ambiguity flag needs more than one recorded cause."},{"step":5,"status":"works","note":"The main session holds it."},{"step":6,"status":"strains","note":"Nothing to adapt. The entry only rules out one cause. The model then does what it did without a library: rerun once more."},{"step":7,"status":"breaks","note":"But the only verdict on the failure is the rerun. It passed with no fix, so 'resolved' is recorded for nothing."},{"step":8,"status":"breaks","note":"Escalating hands up the same silence: dots, one watchdog line, no test id, no stack, machine state gone. A higher model gets no more evidence."},{"step":9,"status":"breaks","note":"Nothing is solved, so nothing is written. The next stall starts from zero."},{"step":10,"status":"strains","note":"The 11-05 entry stays validated and matches every stall's exact line. Each non-crash stall pays a lookup and a 'not applies'."}],"worked":""},{"id":"f05-4","family":"flaky-race-data","title":"Flaky clinic tests read random tags as figures","story":"Attack tests fail by chance because a number helper reads ids, a CSRF token and random hex tags as money figures. Three writers made three fixes in about 7 hours.","when":"2026-11-05, about 7 hours, three fixes","source":"Commits 44d115b, 6ac4577, 8259fa3; transcripts df1db0b9 line 1369","entry":"Flaky test, clinic withholding tests. S09/S07 attack tests fail by chance: a difference of two numbers on a page equals a hidden amount. numbers() reads ids, CSRF token and random hex tags as figures. Fix: strip those; a unit test pins what is read and ignored.","steps":[{"step":1,"status":"works","note":"Sonnet was in a faster-check session. The task is speed. The failing assertion is in the run log."},{"step":2,"status":"works","note":"An unexpected gate error is looked up before retry."},{"step":3,"status":"strains","note":"The canonicaliser masks hex runs, ids and free numbers. A figure coinciding with a hex tag is the only clue, and masking removes it."},{"step":4,"status":"works","note":"At 23:49 UTC the test frame hits the root's entry. At 23:00, in a file outside its footprint, a miss is likely."},{"step":5,"status":"works","note":"The main Sonnet session gets a candidate card with a summary and unverified negatives, no fix. The branch lacks the fix commit."},{"step":6,"status":"strains","note":"The summary gives the cause, not the fix. The root's fix is half right: a review found its mask 'would hide SYN Till 654321 moved'."},{"step":7,"status":"strains","note":"A planted-tag unit test makes the chance repeatable, so a control pair can flip. The session's own check was 'tests passing'."},{"step":8,"status":"strains","note":"A second Opus review caught the wrong sequence guess. The same review approved a retry delay that was still over the race window."},{"step":9,"status":"strains","note":"Three writers made three fixes for one cause in about 7 hours. The write trigger likely skips the root's routine fix."},{"step":10,"status":"strains","note":"In-project, a later test fails at merge naming random_tag, so the entry becomes redundant. Cross-project, FixFlow's backend has no Hypothesis and no uuid4().hex labels."}],"worked":""},{"id":"f05-5","family":"flaky-race-data","title":"Two pytest runs deadlock on one test database","story":"22 integration tests failed together with no code change. A lone rerun passed. Two pytest processes, from different sessions, shared one test database and deadlocked on its schema setup.","when":"Recorded in commit 65c2c3b","source":"Commit 65c2c3b; HANDOFF lines 133-134","entry":"Trap, FixFlow backend tests. Many integration tests fail together (22 in one run) with no code change; a rerun alone passes. Two pytest processes ran against one test database. Never run two pytest processes against that database at once.","steps":[{"step":1,"status":"works","note":"In FixFlow, a test run with 22 red tests puts the failure in the window."},{"step":2,"status":"works","note":"An unexpected gate error is looked up before retry."},{"step":3,"status":"breaks","note":"The deciding fact, a second pytest process from another session, is in no log the failing session holds."},{"step":4,"status":"strains","note":"At best a candidate. In the clinic, a word match returns a rule with a different mechanism."},{"step":5,"status":"strains","note":"In FixFlow the runner is often a subagent in a worktree. Its window starts empty and cannot see the sibling agent holding the lock."},{"step":6,"status":"strains","note":"The fix is a rule about other sessions. The failing agent cannot stop the other process. It can only rerun alone."},{"step":7,"status":"breaks","note":"Process state at the moment of failure is gone once the other process exits. No check, no control pair."},{"step":8,"status":"strains","note":"It was traced once. The cost of that trace is recorded nowhere and the session is gone."},{"step":9,"status":"works","note":"HANDOFF traps are seeded as trap entries. A one-line rule is cheap and true in FixFlow."},{"step":10,"status":"breaks","note":"In the clinic, 'never two at once' contradicts the designed two slots and misses its mechanism, a database drop."}],"worked":""},{"id":"f05-6","family":"flaky-race-data","title":"Clinic socket refusal retry and its timing","story":"A race test failed 2 of 22 runs with 'No buffer space available' on loopback. A 0.05 s retry was added. Reviews found its total delay could make a call look blocked.","when":"Commits dd74a3d and 030c6cb; reviews over several hours","source":"Commits dd74a3d, 030c6cb; round2.md line 8; task.md lines 105, 344","entry":"Gate flake, clinic check on Windows. The serial race pass fails with 'No buffer space available (10055)' on loopback connect. connect_retry retries psycopg.connect up to 6 times for that message only. Delay is 0.05 s per attempt, under the race window's 0.6 s.","steps":[{"step":1,"status":"works","note":"A full-check log with a refused connect in a race test is in the window."},{"step":2,"status":"works","note":"An unexpected gate error is looked up before retry."},{"step":3,"status":"works","note":"The error line is exact and distinctive."},{"step":4,"status":"works","note":"Exact template, one recorded cause: a clean hit."},{"step":5,"status":"works","note":"The main session holds it."},{"step":6,"status":"strains","note":"Copying the retry copies a hidden c ":2,"status":"not_specified","note":"The triggers do not fire for a research lane. The owner's design does not say when research looks up."},{"step":3,"status":"breaks","note":"The query is built from the brief, so it carries the wrong hypothesis. The right lead, 'unclean shutdown', shares only '6 November'."},{"step":4,"status":"breaks","note":"The best match is the wrong entry, labelled as solved by the top model. Nothing outranks it."},{"step":5,"status":"works","note":"It is delivered to the lane's subagent window and stays for its short life."},{"step":6,"status":"breaks","note":"This happened for real through the brief. A lane researched usage-limit pause settings. The later review said the stops were power-offs."},{"step":7,"status":"breaks","note":"'Equal to the strong model' means equal to a wrong guess. The truth came from data outside git and a brief to attack."},{"step":8,"status":"breaks","note":"The lane's output looks complete. An Opus 5.5 refuter, a rung below the Fable author, corrected it because of its brief and its data."},{"step":9,"status":"breaks","note":"Fable wrote the cause 33 seconds after 'Docker down' with nothing checked. Its write rule would exclude the correction too."},{"step":10,"status":"breaks","note":"Two documents still say 'usage limit'. The evidence is a Windows event log, so nothing watches it for change."}],"worked":""},{"id":"f07-2","family":"research-design","title":"Would a graph database cut tokens?","story":"A research verdict said no graph database and no cache. The owner said it was not the strongest form. The new question was about joining reasoning branches, a different meaning of 'graph'.","when":"2026-11-12","source":"Session 0bf1c4f3; HB lines 247-263; HV2 line 371; record #185","entry":"Would a graph database with a traversal cache cut tokens in coding sessions? Built a file-level import graph (618 files, 1,119 links). SQLite answers in 0.05 ms. 13 to 14 of 200 searches were connection questions. Verdict: no gra lings. A pull-only lookup would not have fired there. The DLL rule never reached FixFlow."}],"worked":"The memory index pushed the fix to sibling sessions, and one later session used the flag on its first clone with zero failures."},{"id":"f08-2","family":"cross-project","title":"Subagents blocked from writing report files","story":"Two clinic subagents could not write report files. A FixFlow correction said 'They can'. Next day eight of eight report.md writes were refused, 187,160 characters in all.","when":"2026-11-11 to 2026-11-12","source":"HARNESS-BOTTLENECKS line 159; session cb58bdc7 line 360","entry":"Two Opus subagents could not write their report files and returned the text instead. Sonnet extractors in the same session wrote .md outputs. Cause not isolated (agent type? output size?). Workaround: brief subagents to return the full result; the parent saves it.","steps":[{"step":1,"status":"works","note":"One was a Fable session verifying the owner's list. Others were subagents whose brief says 'Put a full report.md there'."},{"step":2,"status":"breaks","note":"Checking a claim raises no error. The window that needed the entry was the Fable writing the brief. Nothing triggers then."},{"step":3,"status":"strains","note":"Paraphrase matches paraphrase. The exact harness string matches nothing, because no entry ever stored it."},{"step":4,"status":"breaks","note":"The top result would be FixFlow's 11-11 correction 'They can', the opposite of what had just happened to 8 agents."},{"step":5,"status":"not_specified","note":"The design reads by the escalating session. How a workflow subagent's one-shot window receives an entry is not stated."},{"step":6,"status":"breaks","note":"The correction was used. 8 of 8 report.md writes were refused, 187,160 characters."},{"step":7,"status":"breaks","note":"A probe wrote a .txt in bypass mode. The original refusals were analysis-*.md. A check at another scope 'refuted' a right entry."},{"step":8,"status":"not_reached","note" ow gets the entry. The error was made by read-only Opus reviewers and the Fable root."},{"step":6,"status":"breaks","note":"The lesson was in every brief and followed in form. They held after deferred checks, ran on an earlier variant, or removed the wrong layer."},{"step":7,"status":"strains","note":"What decided was a reviewer reading, then model-run experiments, at least four later shown misleading."},{"step":8,"status":"breaks","note":"Opus reviewers noticed and handed up finding tables. The Fable root's round-1 premise was wrong. Removing locks one at a time settled it."},{"step":9,"status":"breaks","note":"Round 1 said scope lock, round 2 counter, round 3 proved counter. A capture at the strong model's verdict stores the wrong lock."},{"step":10,"status":"breaks","note":"Any added guard changes the answer without touching the test. Race footprints are identical in good and bad runs."}],"worked":""},{"id":"f09-2","family":"ladder-real-life","title":"A reversal test leaves the database short","story":"A migration reversal test migrated forward only to the old step. On the merged tree, 2 of 2570 tests failed in the same worker. The session had copied the template into two new tests.","when":"2026-11-11, merged tree check","source":"Commit 6a2fd45; f6b5c6c; test_followup_guards.py","entry":"Clinic, Django, pytest-xdist. Full check on merged main fails 2 of 2570 with CheckViolation. A test migrates back to 0013 and forward only to 0014; once 0015 exists the worker's database stays at 0014. Fix: in the finally, migrate to the leaf nodes of the app.","steps":[{"step":1,"status":"strains","note":"The Opus session held its design, code and the earlier test it copied. A stored 'how to test a reversal' would be that same test."},{"step":2,"status":"breaks","note":"The session's full check passed 2570 and two Opus reviews found no P1. The failure appeared only on the merged tree, in another test order."},{"step":3,"status":"breaks","note":"A query in those words finds the [{"step":1,"status":"works","note":"On 11 Nov the Fable root had 'subagents cannot write files' as an explicit question and had read the memory note."},{"step":2,"status":"works","note":"The task was the question itself, so a lookup had a clear trigger."},{"step":3,"status":"works","note":"'Subagent write file refused' matches the entry's words."},{"step":4,"status":"strains","note":"The entry carried a paraphrase, not the tool error, and its hedge pointed at the wrong variables."},{"step":5,"status":"works","note":"The entry sat in the root's main window and stayed there through the compile."},{"step":6,"status":"breaks","note":"It called the rule an unchecked self-report. The probe tested another condition."},{"step":7,"status":"breaks","note":"The refusal text that decides it sat in 1 Nov transcripts, never read."},{"step":8,"status":"breaks","note":"The ladder ran downward. A Haiku probe overruled two Opus observations and the Fable root sided with the probe. The original observers were right."},{"step":9,"status":"breaks","note":"Each write widened or flipped the entry: 'report files', then 'file writes are refused', then 'They can'. Two contradictory entries, neither naming the condition."},{"step":10,"status":"breaks","note":"They adapted silently and the root never saw it. The saved compile keeps 'They can' and a remedy the refusal blocks."}],"worked":""},{"id":"f09-4","family":"ladder-real-life","title":"A 'not found' that was a search gap","story":"A critic searched task.md files, found no 34-minute wait, and called the owner's figure unsupported. The wait was printed in a root transcript never searched. A wider refuter corrected it.","when":"2026-11-11","source":"Critic check-wait-max; task.md files; root transcript 7f348b2c; verdicts.txt line 30","entry":"Check-wait-max. The owner says check waits reach 34 minutes. Searched docs/tasks/*/task.md for 'waited' and '34 min'. Largest recorded waits: 742 s and 726 s. '34 minutes' not found. The owner's figure ell back in one command with no extra call, so the stored 'no' saved calls."},{"id":"f10-4","family":"libraries-over-time","title":"Production is down and phones lose writes","story":"Both Railway hostnames return the edge's own 404. The phone treats that 404 as a definitive rejection, so punches, presence and jobs park and pings drop. Nothing in git changed.","when":"Down about 2026-08; probed 2026-10-31 and 11-01","source":"syncClassification.ts line 18; Critique-3 line 196; commit 093b793; CLAUDE.md","entry":"Production is down. Both Railway hostnames return the edge's own 404 'Application not found'. The phone cannot tell it from FastAPI's 404. 404 is in the definitive-4xx list, so punches, presence and jobs park, and pings and travel drop. Techs must not open the app.","steps":[{"step":1,"status":"works","note":"The memory index ('prod dead') and the orchestrators' briefs put the state into later windows. CLAUDE.md's stale three-service row sits beside it."},{"step":2,"status":"strains","note":"The hazard is an operator action such as a deploy or clock-in, reachable only through the action handle."},{"step":3,"status":"strains","note":"It works only if the plan's wording overlaps the entry's action handles. Zero overlap is a miss."},{"step":4,"status":"works","note":"The 404 body string and the definitive-4xx name are exact handles."},{"step":5,"status":"works","note":"In the record, push delivery already worked. The 11-04 briefs carried 'prod dead'."},{"step":6,"status":"works","note":"After 10-31 no session live-probed the dead hosts. A critique cites the earlier result rather than re-deriving."},{"step":7,"status":"breaks","note":"The code half is capped at candidate. The world half has no probe at all, because production state is not in git."},{"step":8,"status":"not_reached","note":"No escalation in the record."},{"step":9,"status":"strains","note":"One says 'v4' but never touched the plan file, which stayed at v3. An entry built from the message would anchor the wrong version."},{"step":10,"status":"breaks","note":"Production went dark around 2026-08 and nothing in git changed. When production is restored, the entry will go stale just as silently."}],"worked":""},{"id":"f10-5","family":"libraries-over-time","title":"Clinic memory says 'no uv'; uv arrives that night","story":"A probe recorded no uv and no Python 3.13. uv and 3.13 were installed that same evening. Three projects wrote three scoped notes. 86 windows started within 22 minutes.","when":"Probed 2026-11-02; 86 windows 2026-11-03","source":"Clinic note clinic-s00-readiness-2026-11.md line 13; workflow wf_1cc608d4; house-expenses note line 16","entry":"Machine facts probed 2026-11-02: no Python 3.13, no uv, no pipx, no py launcher. The only Python is the Codex runtime 3.12.14 at its folder path. The EMS note of 11-01 had the same path.","steps":[{"step":1,"status":"strains","note":"House-expenses workflow briefs and a MEMORY.md have no Python line. The task does not say 'you need Python'. The agent assumes it."},{"step":2,"status":"strains","note":"There is no signal before the error. Under pull, each of the 86 windows pays one failed python call before any lookup."},{"step":3,"status":"works","note":"'Python was not found' is exact."},{"step":4,"status":"strains","note":"On 11-03 the EMS and clinic entries agree on the codex path. The clinic's uv run python works only in its venv."},{"step":5,"status":"not_specified","note":"The design is FixFlow-only and silent on other projects. The existing memory is per project, so nothing crossed."},{"step":6,"status":"strains","note":"The entry answers 'is there a Python?', but the task needs Pillow. Whether the Codex Python imported PIL on 11-03 is not recorded."},{"step":7,"status":"works","note":"The cropped image is its own check."},{"step":8,"status":"works","note":"No ladder was needed. The agents switched tools in one call. 17 retried python and failed again."},{"step":9,"status":"breaks","note":"Three projects ords":[["Piece of work","One fix-sized task of about ten cheap calls, where a result is made and checked. The model files call it an episode."],["Visible or latent","Visible: something signals a problem (an error, a failing check, a stated bug). Latent: nothing signals that a choice matters."],["Entry","One stored conclusion in the library."],["Look-alike","A stored entry that looks like a match but has a different cause."],["Gate","Whatever decides a result is right: tests, and sometimes a review by Opus."],["Ladder","What happens after a caught failure: one cheap retry, then Opus, then Fable."],["Tier","A model level on the ladder: the cheap model (Sonnet), Opus, Fable."],["Cost","Counted in cheap-call equivalents. One cheap-model call costs one. An Opus call costs the Opus price ratio."],["Wrong rate","The share of pieces of work that do not end accepted and right: escaped (found later or never) or caught and never solved."],["Stock","Something that piles up over time, drawn as a box. Here: good entries and bad entries."],["Flow","What fills or drains a stock each period, drawn as a thick arrow with a valve."],["Loop R or B","A chain of causes that returns to where it started. R (reinforcing) feeds itself. B (balancing) holds itself back."]],"sections":{"map":{"title":"The map","lede":"Pick one piece of work and a way of working. The graph shows where that piece can go. The tree under it lists every route, heaviest first. Tap a route to light it up on the graph, then step through it.","graph_note":"Boxes are states. Lines are branches. Line weight is the share of this piece of work that takes the branch. A dashed hairline carries nothing under these settings. Top band: the model's stages. Under each stage: which of the design's ten steps it stands for.","tree_note":"Every route from start to outcome for this piece of work. Branches shared by several routes are drawn once. Heaviest first."},"cases":{"title":"Where real cases broke","lede":"{{c:cases}} real cases from the owner's two repositories and session records were walked through the design's ten steps. Each cell is one step of one case.","warning":"These are chosen problem cases. They show where the design breaks. They do not show how often.","judged":"Each status is the judgment of the agent that walked the case, from the records. Tap a row to read the case."},"lims":{"title":"The limitations, placed on the map","lede":"{{c:lims}} limitations came out of the walks and two thought-experiment lists. Each sits at the design step where it acts. Tap one to see its steps and branches on the map.","map_note":"Shaded stages: the steps the limitation touches; the darker band is its main step. Heavy lines: the branches whose chance or cost uses one of its unknowns.","works_lede":"Places where the design worked, or would have helped, in a real case. They come from the same walks."},"run":{"title":"Run it","lede":"Every unknown in the model has a slider. Move one and the whole page follows: the map, the routes, the outputs and the stock drawing.","outputs_note":"Cost per piece of work, in cheap-call equivalents. Wrong rate: the share of pieces of work that do not end accepted and right.","two_comparisons":"Two comparisons, always together. Against the cheap model with the ladder: what the library itself adds. Against the strong model directly: the owner's goal, which also depends on the ladder and the gate.","ratio_read":"A ratio is the library's figure divided by the other way's figure. Below one: the library's figure is lower. Above one: it is higher."},"many":{"title":"Many runs","lede":"Most unknowns are guesses. So the model is run many times. Each run draws every unknown at random, evenly, from its range. The result is a spread, not one answer.","follows":"This spread follows from the assumed ranges. Change a range and it changes. It is not a measurement of the library.","rank_read":"How strongly each ratio rises (+) or falls (-) as one unknown rises across the runs. One means it always moves with it; zero means no steady link. The measure is the rank correlation."},"leaves":{"title":"What the map leaves out","lede":"The model's own limits, in plain words. They come from the model brief and from the independent check of the engine."}},"loops":[{"id":"R1","kind":"R","name":"Bad entries bring more bad entries","text":"More bad entries raise the share of bad entries a lookup returns. More wrong entries reach the cheap attempt and spoil work. More work climbs to Opus or Fable. More strong-tier solves and escapes get written, some of them bad."},{"id":"R2","kind":"R","name":"More entries, more look-alikes","text":"Every entry, good or bad, raises the chance a misleading look-alike can be retrieved. Accepted look-alikes spoil work, more work climbs the ladder, and more entries get written."},{"id":"B1","kind":"B","name":"Good entries thin their own supply","text":"More good entries fill the library. The cheap model is right more often with an entry in hand, so less work climbs to Opus or Fable, and fewer new entries are written."},{"id":"B2","kind":"B","name":"Good entries go stale","text":"Each period a share of the good entries goes stale and moves to the bad stock. The more good entries there are, the more go stale."}],"design_steps":{"1":["L1"],"2":["L1"],"3":["L2"],"4":["L2"],"5":["L4"],"6":["L3","L5"],"7":["L6"],"8":["L7","L8","L9"],"9":["L10"],"10":["L11"]},"design_steps_note":"The walkthroughs used the design's ten steps. The model splits the work into eleven stages and an outcome. This match between them was set by hand: step 1 (what is in the window) has no stage of its own and is shown with the trigger; step 6 (use) covers the screen and the cheap attempt.","leaves_out":[{"t":"A model of the mechanism, not a forecast","x":"Its numbers follow from its settings. {{c:guess}} of the {{c:drawn}} unknowns that are drawn are guesses."},{"t":"Chosen cases, not a sample of work","x":"The {{c:cases}} cases were chosen because something went wrong. They show which routes exist and where steps break. They never show how often."},{"t":"Case statuses are judgments","x":"Works, strains and breaks were set by the agents that walked the cases from the records. Another reader could set some differently."},{"t":"One size of work","x":"Every piece of work is treated as about ten cheap calls. Real work varies far more in size, and a large piece is not the same as many small ones."},{"t":"Calls are the same size inside a tier","x":"The cost unit is one cheap-model call. The price ratios are per token, so they equal the per-call ratio only if calls are the same size in every tier. On this PC's records an Opus call averaged {{n:about 222,000|M}} cache-read tokens and a Sonnet call {{n:about 440,000|M}}. On that data the per-call ratio would be near one, while the model fixes it at two."},{"t":"Time and attention are not counted","x":"Tests at the gate cost nothing. Waiting, wall-clock time and the owner's attention are left out. A lookup counts as calls; a mechanical check, carrying an entry and a handoff cost cheap-call equivalents but count as no calls."},{"t":"Pieces of work are independent","x":"A piece's kind, what the cheap model would do, what the library holds and whether a look-alike exists are combined by multiplying their chances. Real work clusters: a hard problem may also be the one the library lacks."},{"t":"Averages, not one library","x":"The two stocks change by their expected amounts each period. A real library has one history, with luck in it. Each period is worked out on the stocks at its start, and staleness acts on those starting stocks."},{"t":"Entries are all-or-nothing","x":"A good entry is good wherever it applies, and a bad one bad. Partly right shows up only as the composite 'some parts' result."},{"t":"One pool of entries","x":"Projects are not separated. Facts that differ between projects act only through the look-alike and wrong-entry chances."},{"t":"A wrong entry acts once","x":"A wrong accepted entry acts only at the cheap attempt. It does not follow the work up the ladder."},{"t":"A fixed ladder and one gate","x":"One cheap retry, then Opus, then Fable, in that order. Real sessions skip rungs, repeat them, or end with the owner. The chance the gate catches a wrong output does not depend on which model made it."},{"t":"Bad entries stay bad","x":"A bad entry turns good only when a found escape is repaired. Staleness moves good entries to bad, never the other way."},{"t":"Two settings are fixed","x":"The number of periods is a chosen horizon, never drawn. The Opus price ratio has a range of one value, so the runs never vary it."},{"t":"Ranges are drawn evenly and on their own","x":"If two unknowns move together in reality, the runs do not know it. The ranking measures steady rise or fall inside the ranges. It misses an effect that rises and then falls."},{"t":"Some limitations act through nothing here","x":"{{c:noparam}} limitations name no unknown, so the model cannot show them: {{c:noparam_ids}}."},{"t":"Some tags are generous","x":"Several figures tagged M or S were measured on a different unit than the setting they stand for; each slider's source says how. One outside figure supports two settings in a row: the chance a wrong entry is accepted, and the chance it then spoils the work."},{"t":"Two guards on impossible draws","x":"If a draw makes 'all parts' plus 'some parts' exceed certainty, both are scaled down in proportion; the three ceilings on what the library can hold likewise. With the current ranges neither happens."},{"t":"The step match is drawn by hand","x":"The walkthroughs' ten steps and the model's stages are matched by a table, shown on the map. A limitation is placed on the map through that table and through its unknowns."}],"layout":{"note":"Positions of the states on the map: [column, row]. Branches between neighbouring columns are drawn as curves; longer ones run along a lane row (given here, else the target's row).","col_w":88,"row_h":50,"x0":52,"y0":104,"node_w":72,"node_h":38,"states":{"L1_trigger":[0,3],"L2_lookup":[1,3],"L3_exact":[2,1],"L3_similar":[2,2],"L3_full":[2,3],"L3_part":[2,4],"L3_wrong":[2,5.2],"L4_exact":[3,1],"L4_similar":[3,2],"L4_full":[3,3],"L4_part":[3,4],"L4_wrong":[3,5.2],"L5_none":[4,0],"L5_exact":[4,1],"L5_similar":[4,2],"L5_full":[4,3],"L5_part":[4,4],"L5_wrong":[4,5.2],"L6_right":[5,1.6],"L6_wrong":[5,4.6],"L7_retry":[6,4.6],"L7_right":[7,3.6],"L7_wrong":[7,5.6],"L8_handoff":[8,5.6],"L8_opus":[9,5.6],"L8_right":[10,4.6],"L8_wrong":[10,6.6],"L9_fable":[11,6.4],"L9_right":[12,5.4],"L9_wrong":[12,7.6],"L10_opus":[13,2.2],"L10_fable":[13,3.4],"L10_opus_escape":[13,7],"L10_fable_escape":[13,8.2],"L11_escaped":[14,7.2],"L11_stored":[14,8.5],"EQUAL":[15,1],"ESCAPED_FOUND":[15,6.6],"ESCAPED_SILENT":[15,8],"UNRESOLVED":[15,9.4]},"lanes":{"l1_no_lookup":-0.95,"l2_nothing":-0.78,"l3_exact_set_aside":-0.6,"l3_similar_set_aside":-0.6,"l3_full_set_aside":-0.6,"l3_part_set_aside":-0.6,"l3_wrong_check":-0.6,"l3_wrong_set_aside":-0.6,"l6_escaped":10.2,"l7_escaped":10.35}}},"build":{"date":"2026-11-12"}}</script>
<script>
/*
 * Pathway engine for the reasoning-library map.
 *
 * Reads the declarative description in map.json and computes, for a parameter
 * set and a policy: outcome chances, expected cost (total and by tier), calls,
 * every route with its chance and cost, the time path of the two stocks of
 * entries, the headline ratios, the ensemble and the one-at-a-time swings.
 *
 * Pure functions, no dependencies. In node: require('./engine.js').
 * Inlined in a page: a global named PathwayEngine.
 *
 * Parameter kinds: chance and fraction lie in [0, 1]; scale is above zero; the
 * rest must not be negative. A measure is the flow into listed states
 * (flow_into) or along listed branches (flow_on); stock updates may use measures.
 *
 * Expressions in map.json are parsed by a small parser in this file. They may
 * use numbers, + - * / and brackets, the functions exp, min, max and safediv,
 * and only the names the map declares. Nothing is passed to eval.
 */
/* global module */
(function (root, factory) {
  'use strict';
  var api = factory();
  if (typeof module === 'object' && module && module.exports) module.exports = api;
  else if (root) root.PathwayEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  // ---------------------------------------------------------------- expressions

  var FUNCS = {
    exp: { min: 1, max: 1, f: Math.exp },
    min: { min: 2, max: 8, f: Math.min },
    max: { min: 2, max: 8, f: Math.max },
    safediv: { min: 2, max: 2, f: function (a, b) { return b === 0 ? 0 : a / b; } }
  };
  var hasOwn = Object.prototype.hasOwnProperty;

  function tokenize(src) {
    var toks = [];
    var i = 0;
    while (i < src.length) {
      var c = src[i];
      if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }
      var rest = src.slice(i);
      var m;
      if ((m = /^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/.exec(rest))) {
        toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) {
        toks.push({ t: 'id', v: m[0] }); i += m[0].length; continue;
      }
      if ('+-*/(),'.indexOf(c) >= 0) { toks.push({ t: c }); i++; continue; }
      throw new Error('Unexpected character "' + c + '" in expression: ' + src);
    }
    toks.push({ t: 'end' });
    return toks;
  }

  /**
   * Compile an expression string against a whitelist of names.
   * Returns { src, fn(scope) -> number, ids: array of names used }.
   */
  function compileExpr(src, allowed) {
    if (typeof src === 'number') src = String(src);
    if (typeof src !== 'string' || src.trim() === '') throw new Error('Expression must be a non-empty string');
    var toks = tokenize(src);
    var p = 0;
    var ids = {};
    function peek() { return toks[p]; }
    function next() { return toks[p++]; }
    function expect(t) {
      if (toks[p].t !== t) throw new Error('Expected "' + t + '" in expression: ' + src);
      p++;
    }
    // Each operator node gets its own closure over its own two operands.
    function binary(op, a, b) {
      if (op === '+') return function (s) { return a(s) + b(s); };
      if (op === '-') return function (s) { return a(s) - b(s); };
      if (op === '*') return function (s) { return a(s) * b(s); };
      return function (s) { return a(s) / b(s); };
    }
    function expr() {
      var left = term();
      while (peek().t === '+' || peek().t === '-') {
        var op = next().t;
        left = binary(op, left, term());
      }
      return left;
    }
    function term() {
      var left = unary();
      while (peek().t === '*' || peek().t === '/') {
        var op = next().t;
        left = binary(op, left, unary());
      }
      return left;
    }
    function unary() {
      if (peek().t === '-') { next(); var a = unary(); return function (s) { return -a(s); }; }
      if (peek().t === '+') { next(); return unary(); }
      return primary();
    }
    function primary() {
      var tk = next();
      if (tk.t === 'num') { var v = tk.v; return function () { return v; }; }
      if (tk.t === '(') { var inner = expr(); expect(')'); return inner; }
      if (tk.t === 'id') {
        var name = tk.v;
        if (peek().t === '(') {
          if (!hasOwn.call(FUNCS, name)) throw new Error('Unknown function "' + name + '" in expression: ' + src);
          var def = FUNCS[name];
          next();
          var args = [];
          if (peek().t !== ')') {
            args.push(expr());
            while (peek().t === ',') { next(); args.push(expr()); }
          }
          expect(')');
          if (args.length < def.min || args.length > def.max) throw new Error('Wrong number of arguments to ' + name + ' in expression: ' + src);
          var f = def.f;
          if (args.length === 1) { var a1 = args[0]; return function (s) { return f(a1(s)); }; }
          if (args.length === 2) { var x = args[0], y = args[1]; return function (s) { return f(x(s), y(s)); }; }
          return function (s) { return f.apply(null, args.map(function (g) { return g(s); })); };
        }
        if (!allowed.has(name)) throw new Error('Unknown name "' + name + '" in expression: ' + src);
        ids[name] = true;
        return function (s) {
          var val = s[name];
          if (typeof val !== 'number') throw new Error('No value for "' + name + '" while evaluating: ' + src);
          return val;
        };
      }
      throw new Error('Unexpected token in expression: ' + src);
    }
    var fn = expr();
    expect('end');
    return { src: src, fn: fn, ids: Object.keys(ids) };
  }

  // ---------------------------------------------------------------- compile the map

  var cache = typeof WeakMap === 'function' ? new WeakMap() : null;

  function compile(map) {
    if (map && map.__compiled) return map;
    if (cache && cache.has(map)) return cache.get(map);
    var cm = buildModel(map);
    if (cache) cache.set(map, cm);
    return cm;
  }

  function setOf() {
    var s = new Set();
    for (var i = 0; i < arguments.length; i++) arguments[i].forEach(function (x) { s.add(x); });
    return s;
  }

  function buildModel(map) {
    if (!map || !Array.isArray(map.parameters) || !Array.isArray(map.states) || !Array.isArray(map.branches)) {
      throw new Error('The map needs parameters, states and branches');
    }
    var params = map.parameters;
    var paramIds = params.map(function (p) { return p.id; });
    var P = new Set(paramIds);
    if (P.size !== paramIds.length) throw new Error('Duplicate parameter id');

    var stockIds = Object.keys(map.stocks.initial);
    var S = new Set(stockIds);

    // stock values (wrong_share, fill, distract)
    var svAllowed = setOf(P, S);
    var stockValues = map.stocks.values.map(function (v) {
      var c = compileExpr(v.expr, svAllowed);
      svAllowed.add(v.id);
      return { id: v.id, label: v.label, fn: c.fn, ids: c.ids, src: v.expr };
    });
    var svIds = stockValues.map(function (v) { return v.id; });

    // attribute flags
    var flagNames = new Set();
    map.attributes.forEach(function (a) {
      var keys = null;
      a.values.forEach(function (v) {
        var k = Object.keys(v.flags).sort().join(',');
        if (keys === null) keys = k;
        else if (keys !== k) throw new Error('Values of attribute ' + a.id + ' must set the same flags');
        Object.keys(v.flags).forEach(function (f) { flagNames.add(f); });
      });
    });
    var policyFlagNames = new Set();
    map.policies.forEach(function (pol) { Object.keys(pol.flags).forEach(function (f) { policyFlagNames.add(f); }); });
    map.policies.forEach(function (pol) {
      policyFlagNames.forEach(function (f) {
        if (!hasOwn.call(pol.flags, f)) throw new Error('Policy ' + pol.id + ' does not set flag ' + f);
      });
    });

    var classAllowed = setOf(P, S, new Set(svIds), flagNames, policyFlagNames);
    var derived = map.derived.map(function (d) {
      if (classAllowed.has(d.id)) throw new Error('Derived value ' + d.id + ' shadows another name');
      var c = compileExpr(d.expr, classAllowed);
      classAllowed.add(d.id);
      return { id: d.id, label: d.label, fn: c.fn, ids: c.ids, src: d.expr };
    });

    var attributes = map.attributes.map(function (a) {
      return {
        id: a.id,
        label: a.label,
        values: a.values.map(function (v) {
          var c = compileExpr(v.chance, classAllowed);
          return { id: v.id, label: v.label, flags: v.flags, fn: c.fn, ids: c.ids, src: v.chance };
        })
      };
    });

    // tiers
    var tiers = map.tiers.map(function (t) { return t.id; });
    var tierIndex = {};
    tiers.forEach(function (t, i) { tierIndex[t] = i; });

    // states
    var stateIndex = {};
    var states = map.states.map(function (s, i) {
      if (hasOwn.call(stateIndex, s.id)) throw new Error('Duplicate state ' + s.id);
      stateIndex[s.id] = i;
      return { id: s.id, label: s.label, step: s.step, entry: s.entry, outcome: !!s.outcome };
    });
    var outcomes = map.outcomes.map(function (o) {
      if (!hasOwn.call(stateIndex, o.id) || !states[stateIndex[o.id]].outcome) throw new Error('Outcome ' + o.id + ' is not an outcome state');
      return { id: o.id, label: o.label, right: !!o.right, index: stateIndex[o.id] };
    });
    states.forEach(function (s) {
      if (s.outcome && !outcomes.some(function (o) { return o.id === s.id; })) throw new Error('Outcome state ' + s.id + ' is not listed in outcomes');
    });

    // branches
    var branchIndex = {};
    var out = states.map(function () { return []; });
    var branches = map.branches.map(function (b, i) {
      if (hasOwn.call(branchIndex, b.id)) throw new Error('Duplicate branch ' + b.id);
      branchIndex[b.id] = i;
      if (!hasOwn.call(stateIndex, b.from)) throw new Error('Branch ' + b.id + ' starts at unknown state ' + b.from);
      if (!hasOwn.call(stateIndex, b.to)) throw new Error('Branch ' + b.id + ' ends at unknown state ' + b.to);
      if (states[stateIndex[b.from]].outcome) throw new Error('Branch ' + b.id + ' leaves an outcome');
      var tier = b.tier === null || b.tier === undefined ? -1 : tierIndex[b.tier];
      if (tier === undefined) throw new Error('Branch ' + b.id + ' has unknown tier ' + b.tier);
      var ch = compileExpr(b.chance, classAllowed);
      var co = compileExpr(b.cost, classAllowed);
      var ca = compileExpr(b.calls, classAllowed);
      if (tier === -1 && (b.cost !== '0' || b.calls !== '0')) throw new Error('Branch ' + b.id + ' has a cost but no tier');
      out[stateIndex[b.from]].push(i);
      return {
        id: b.id, from: stateIndex[b.from], to: stateIndex[b.to], label: b.label, tier: tier,
        chance: ch, cost: co, calls: ca, limitations: Array.isArray(b.limitations) ? b.limitations.slice() : []
      };
    });
    states.forEach(function (s, i) {
      if (!s.outcome && out[i].length === 0) throw new Error('State ' + s.id + ' has no way out');
    });

    // order: reverse post-order of a depth-first walk; topological when there is no cycle
    var mark = new Array(states.length).fill(0);
    var post = [];
    var hasCycle = false;
    function visit(i) {
      if (mark[i] === 2) return;
      if (mark[i] === 1) { hasCycle = true; return; }
      mark[i] = 1;
      out[i].forEach(function (b) { visit(branches[b].to); });
      mark[i] = 2;
      post.push(i);
    }
    states.forEach(function (_, i) { visit(i); });
    var order = post.reverse();

    // measures
    // A measure is the flow into a list of states (flow_into) or along a list of branches (flow_on).
    var measures = map.measures.map(function (m) {
      var into = m.flow_into || [];
      var on = m.flow_on || [];
      if (into.length + on.length === 0) throw new Error('Measure ' + m.id + ' names no state and no branch');
      return {
        id: m.id, label: m.label,
        into: into.map(function (sid) {
          if (!hasOwn.call(stateIndex, sid)) throw new Error('Measure ' + m.id + ' names unknown state ' + sid);
          return stateIndex[sid];
        }),
        on: on.map(function (bid) {
          if (!hasOwn.call(branchIndex, bid)) throw new Error('Measure ' + m.id + ' names unknown branch ' + bid);
          return branchIndex[bid];
        })
      };
    });
    var updAllowed = setOf(P, S, new Set(svIds), new Set(measures.map(function (m) { return m.id; })));
    var updates = map.stocks.update.map(function (u) {
      if (!S.has(u.id)) throw new Error('Update for unknown stock ' + u.id);
      var c = compileExpr(u.expr, updAllowed);
      return { id: u.id, fn: c.fn, ids: c.ids, src: u.expr };
    });

    // policies and their classes
    var attrById = {};
    attributes.forEach(function (a) { attrById[a.id] = a; });
    var policies = map.policies.map(function (pol) {
      if (!hasOwn.call(stateIndex, pol.start)) throw new Error('Policy ' + pol.id + ' starts at unknown state');
      var fixed = pol.fixed || {};
      Object.keys(fixed).forEach(function (aid) {
        if (!attrById[aid] || !attrById[aid].values.some(function (v) { return v.id === fixed[aid]; })) {
          throw new Error('Policy ' + pol.id + ' fixes an unknown attribute value ' + aid + '=' + fixed[aid]);
        }
      });
      var combos = [{ values: {}, flags: {}, fns: [] }];
      attributes.forEach(function (a) {
        var choices = hasOwn.call(fixed, a.id)
          ? a.values.filter(function (v) { return v.id === fixed[a.id]; }).map(function (v) { return { v: v, fixedHere: true }; })
          : a.values.map(function (v) { return { v: v, fixedHere: false }; });
        var nextCombos = [];
        combos.forEach(function (c) {
          choices.forEach(function (ch) {
            var values = Object.assign({}, c.values); values[a.id] = ch.v.id;
            var flags = Object.assign({}, c.flags, ch.v.flags);
            var fns = ch.fixedHere ? c.fns : c.fns.concat([ch.v.fn]);
            nextCombos.push({ values: values, flags: flags, fns: fns });
          });
        });
        combos = nextCombos;
      });
      combos.forEach(function (c) {
        c.id = attributes.map(function (a) { return c.values[a.id]; }).join('/');
      });
      return { id: pol.id, label: pol.label, start: stateIndex[pol.start], flags: pol.flags, fixed: fixed, combos: combos };
    });
    var policyIndex = {};
    policies.forEach(function (pol, i) { policyIndex[pol.id] = i; });

    var constraints = (map.constraints || []).map(function (c) {
      if (c.kind !== 'sum_at_most') throw new Error('Unknown constraint kind ' + c.kind);
      c.ids.forEach(function (id) { if (!P.has(id)) throw new Error('Constraint names unknown parameter ' + id); });
      return { id: c.id, ids: c.ids.slice(), limit: c.limit };
    });

    return {
      __compiled: true,
      map: map,
      params: params,
      paramIds: paramIds,
      stockIds: stockIds,
      stockValues: stockValues,
      derived: derived,
      attributes: attributes,
      tiers: tiers,
      states: states,
      stateIndex: stateIndex,
      outcomes: outcomes,
      branches: branches,
      branchIndex: branchIndex,
      out: out,
      order: order,
      hasCycle: hasCycle,
      measures: measures,
      updates: updates,
      policies: policies,
      policyIndex: policyIndex,
      constraints: constraints
    };
  }

  // ---------------------------------------------------------------- parameters

  /**
   * Check and tidy a parameter set. Chances and fractions must lie in [0, 1]; costs, calls and
   * multipliers must not be negative; scales must be positive. Groups bound by a
   * sum_at_most constraint are scaled down in proportion when they break it.
   * Returns { values, adjusted: [notes] }.
   */
  function prepareParams(model, params) {
    var cm = compile(model);
    var values = {};
    var missing = [];
    cm.params.forEach(function (p) {
      var v = params ? params[p.id] : undefined;
      if (typeof v !== 'number' || !isFinite(v)) { missing.push(p.id); return; }
      if (p.integer) v = Math.round(v);
      if ((p.kind === 'chance' || p.kind === 'fraction') && (v < 0 || v > 1)) throw new Error(p.id + ' is a ' + p.kind + ' and must lie between 0 and 1 (got ' + v + ')');
      if (p.kind === 'scale' && !(v > 0)) throw new Error(p.id + ' must be above zero (got ' + v + ')');
      if (v < 0) throw new Error(p.id + ' must not be negative (got ' + v + ')');
      values[p.id] = v;
    });
    if (missing.length) throw new Error('Missing or non-numeric parameter values: ' + missing.join(', '));
    var adjusted = [];
    cm.constraints.forEach(function (c) {
      var sum = 0;
      c.ids.forEach(function (id) { sum += values[id]; });
      if (sum > c.limit) {
        var k = c.limit / sum;
        c.ids.forEach(function (id) { values[id] *= k; });
        adjusted.push(c.id);
      }
    });
    return { values: values, adjusted: adjusted };
  }

  /**
   * The rows of a parameter table, keyed by parameter id. A table may hold its rows
   * as an object keyed by id ({ parameters: { id: row } }) or as a list of rows that
   * each carry an id ({ parameters: [ { id, low, best, high } ] }).
   */
  function tableRows(table) {
    var src = table && table.parameters ? table.parameters : table;
    if (!Array.isArray(src)) return src;
    var rows = {};
    src.forEach(function (row) {
      if (!row || typeof row.id !== 'string') throw new Error('A row of the parameter table has no id');
      if (hasOwn.call(rows, row.id)) throw new Error('The parameter table has two rows for ' + row.id);
      rows[row.id] = row;
    });
    return rows;
  }

  /** Read one column (best, low or high) of a parameter table into a plain parameter set. */
  function paramsFromTable(table, which) {
    var col = which || 'best';
    var src = tableRows(table);
    var out = {};
    Object.keys(src).forEach(function (id) {
      var row = src[id];
      if (row && typeof row === 'object' && typeof row[col] === 'number') out[id] = row[col];
    });
    return out;
  }

  // ---------------------------------------------------------------- evaluation core

  function stockScope(cm, values, stocks) {
    var s = Object.assign({}, values);
    cm.stockIds.forEach(function (id) { s[id] = stocks && typeof stocks[id] === 'number' ? stocks[id] : 0; });
    cm.stockValues.forEach(function (v) { s[v.id] = v.fn(s); });
    return s;
  }

  function classScope(cm, base, policy, combo) {
    var s = Object.assign({}, base, policy.flags, combo.flags);
    for (var i = 0; i < cm.derived.length; i++) s[cm.derived[i].id] = cm.derived[i].fn(s);
    var chance = 1;
    for (var j = 0; j < combo.fns.length; j++) chance *= combo.fns[j](s);
    return { scope: s, chance: chance };
  }

  function branchValues(cm, scope) {
    var n = cm.branches.length;
    var c = new Float64Array(n), k = new Float64Array(n), q = new Float64Array(n);
    for (var i = 0; i < n; i++) {
      var b = cm.branches[i];
      c[i] = b.chance.fn(scope);
      k[i] = b.cost.fn(scope);
      q[i] = b.calls.fn(scope);
    }
    return { c: c, k: k, q: q };
  }

  // Push one unit of probability from the start state to the outcomes.
  function propagate(cm, start, bv) {
    var S = cm.states.length, T = cm.tiers.length;
    var mass = new Float64Array(S), through = new Float64Array(S);
    var bflow = new Float64Array(cm.branches.length);
    var costT = new Float64Array(T), callsT = new Float64Array(T);
    mass[start] = 1; through[start] = 1;
    var passes = 0;
    for (;;) {
      for (var oi = 0; oi < cm.order.length; oi++) {
        var s = cm.order[oi];
        var m = mass[s];
        if (m === 0 || cm.states[s].outcome) continue;
        mass[s] = 0;
        var outs = cm.out[s];
        for (var j = 0; j < outs.length; j++) {
          var b = outs[j];
          var f = m * bv.c[b];
          if (f === 0) continue;
          bflow[b] += f;
          var to = cm.branches[b].to;
          mass[to] += f; through[to] += f;
          var ti = cm.branches[b].tier;
          if (ti >= 0) { costT[ti] += f * bv.k[b]; callsT[ti] += f * bv.q[b]; }
        }
      }
      passes++;
      if (!cm.hasCycle) break;
      var rest = 0;
      for (var r = 0; r < S; r++) if (!cm.states[r].outcome) rest += Math.abs(mass[r]);
      if (rest < 1e-15 || passes > 100000) break;
    }
    return { mass: mass, through: through, bflow: bflow, costT: costT, callsT: callsT };
  }

  function emptyAcc(cm) {
    return {
      out: new Float64Array(cm.outcomes.length),
      costT: new Float64Array(cm.tiers.length),
      callsT: new Float64Array(cm.tiers.length),
      through: new Float64Array(cm.states.length),
      bflow: new Float64Array(cm.branches.length),
      chance: 0
    };
  }

  function addInto(acc, w, pr, cm) {
    var i;
    for (i = 0; i < cm.outcomes.length; i++) acc.out[i] += w * pr.mass[cm.outcomes[i].index];
    for (i = 0; i < acc.costT.length; i++) { acc.costT[i] += w * pr.costT[i]; acc.callsT[i] += w * pr.callsT[i]; }
    for (i = 0; i < acc.through.length; i++) acc.through[i] += w * pr.through[i];
    for (i = 0; i < acc.bflow.length; i++) acc.bflow[i] += w * pr.bflow[i];
    acc.chance += w;
  }

  function summarize(cm, acc) {
    var outcomes = {}, costByTier = {}, callsByTier = {};
    var wrong = 0, cost = 0, calls = 0;
    cm.outcomes.forEach(function (o, i) { outcomes[o.id] = acc.out[i]; if (!o.right) wrong += acc.out[i]; });
    cm.tiers.forEach(function (t, i) { costByTier[t] = acc.costT[i]; callsByTier[t] = acc.callsT[i]; cost += acc.costT[i]; calls += acc.callsT[i]; });
    var measures = {};
    cm.measures.forEach(function (m) {
      var v = 0;
      m.into.forEach(function (si) { v += acc.through[si]; });
      m.on.forEach(function (bi) { v += acc.bflow[bi]; });
      measures[m.id] = v;
    });
    return { outcomes: outcomes, wrong: wrong, cost: cost, costByTier: costByTier, calls: calls, callsByTier: callsByTier, measures: measures };
  }

  function flowsById(cm, acc) {
    var stateFlow = {}, branchFlow = {};
    cm.states.forEach(function (s, i) { stateFlow[s.id] = acc.through[i]; });
    cm.branches.forEach(function (b, i) { branchFlow[b.id] = acc.bflow[i]; });
    return { stateFlow: stateFlow, branchFlow: branchFlow };
  }

  function getPolicy(cm, policyId) {
    var i = cm.policyIndex[policyId];
    if (i === undefined) throw new Error('Unknown policy ' + policyId);
    return cm.policies[i];
  }

  // Evaluate a policy on prepared values. opts.classes: keep per-class results.
  function evalPolicy(cm, values, policy, stocks, opts) {
    var keepClasses = !!(opts && opts.classes);
    var keepZero = !!(opts && opts.zeroClasses);
    var base = stockScope(cm, values, stocks);
    var acc = emptyAcc(cm);
    var classes = keepClasses ? [] : null;
    var attrShares = {};
    cm.attributes.forEach(function (a) { attrShares[a.id] = {}; a.values.forEach(function (v) { attrShares[a.id][v.id] = 0; }); });
    var classTotal = 0;
    for (var ci = 0; ci < policy.combos.length; ci++) {
      var combo = policy.combos[ci];
      var cs = classScope(cm, base, policy, combo);
      classTotal += cs.chance;
      Object.keys(combo.values).forEach(function (aid) { attrShares[aid][combo.values[aid]] += cs.chance; });
      if (cs.chance === 0 && !keepZero) continue;
      var bv = branchValues(cm, cs.scope);
      var pr = propagate(cm, policy.start, bv);
      if (cs.chance !== 0) addInto(acc, cs.chance, pr, cm);
      if (keepClasses) {
        var one = emptyAcc(cm);
        addInto(one, 1, pr, cm);
        var sum = summarize(cm, one);
        sum.id = combo.id;
        sum.values = Object.assign({}, combo.values);
        sum.chance = cs.chance;
        classes.push(sum);
      }
    }
    // overall figures are averages over classes; class chances sum to 1
    var overall = summarize(cm, acc);
    return { overall: overall, acc: acc, classes: classes, attrShares: attrShares, classTotal: classTotal, base: base };
  }

  function ratio(a, b) {
    if (b === 0) return a === 0 ? 1 : Infinity;
    return a / b;
  }

  var RATIO_IDS = ['cost_vs_top', 'wrong_vs_top', 'cost_vs_ladder', 'wrong_vs_ladder'];

  /** Headline ratios of the library policy against the two others. Each argument is a summary. */
  function headline(lib, top, ladder) {
    return {
      cost_vs_top: ratio(lib.cost, top.cost),
      wrong_vs_top: ratio(lib.wrong, top.wrong),
      cost_vs_ladder: ratio(lib.cost, ladder.cost),
      wrong_vs_ladder: ratio(lib.wrong, ladder.wrong)
    };
  }

  // The time path on prepared values.
  function pathCore(cm, values, opts) {
    var full = !(opts && opts.lean);
    var periods = Math.max(1, Math.round(values.periods));
    var zero = {};
    cm.stockIds.forEach(function (id) { zero[id] = cm.map.stocks.initial[id]; });
    var top = evalPolicy(cm, values, getPolicy(cm, 'top_first'), zero).overall;
    var ladder = evalPolicy(cm, values, getPolicy(cm, 'cheap_ladder'), zero).overall;
    var libPol = getPolicy(cm, 'library');
    var stocks = Object.assign({}, zero);
    var rows = [];
    for (var t = 0; t < periods; t++) {
      var ev = evalPolicy(cm, values, libPol, stocks);
      var lib = ev.overall;
      var row = {
        period: t,
        stocks: Object.assign({}, stocks),
        library: lib,
        ratios: headline(lib, top, ladder)
      };
      var scope = Object.assign({}, ev.base, lib.measures);
      var next = {};
      cm.updates.forEach(function (u) { next[u.id] = u.fn(scope); });
      if (full) {
        var sv = {};
        cm.stockValues.forEach(function (v) { sv[v.id] = ev.base[v.id]; });
        row.stockValues = sv;
        row.shares = ev.attrShares;
        row.next = Object.assign({}, next);
        Object.assign(row, flowsById(cm, ev.acc));
      }
      rows.push(row);
      stocks = next;
    }
    return {
      periods: rows,
      top_first: top,
      cheap_ladder: ladder,
      first: rows[0].ratios,
      last: rows[rows.length - 1].ratios,
      finalStocks: stocks
    };
  }

  // ---------------------------------------------------------------- public: evaluation

  /**
   * Outcomes and costs for one policy at given stocks.
   * Returns { policy, overall, classes, stateFlow, branchFlow, shares, adjusted }.
   */
  function evaluatePolicy(model, params, policyId, stocks, opts) {
    var cm = compile(model);
    var prep = prepareParams(cm, params);
    var o = Object.assign({ classes: true }, opts || {});
    var ev = evalPolicy(cm, prep.values, getPolicy(cm, policyId), stocks || {}, o);
    var fl = flowsById(cm, ev.acc);
    return {
      policy: policyId,
      overall: ev.overall,
      classes: ev.classes,
      shares: ev.attrShares,
      classTotal: ev.classTotal,
      stateFlow: fl.stateFlow,
      branchFlow: fl.branchFlow,
      adjusted: prep.adjusted
    };
  }

  /**
   * One class on its own. values: { kind, need, held, distractor } by value id.
   * Returns the class summary plus its chance under the given stocks.
   */
  function evaluateClass(model, params, policyId, classValues, stocks) {
    var cm = compile(model);
    var prep = prepareParams(cm, params);
    var policy = getPolicy(cm, policyId);
    var hits = policy.combos.filter(function (c) {
      return Object.keys(classValues).every(function (aid) { return c.values[aid] === classValues[aid]; });
    });
    if (hits.length !== 1) {
      throw new Error((hits.length ? 'More than one class matches' : 'No such class') + ' under policy ' + policyId + ': ' + JSON.stringify(classValues));
    }
    var combo = hits[0];
    var base = stockScope(cm, prep.values, stocks || {});
    var cs = classScope(cm, base, policy, combo);
    var pr = propagate(cm, policy.start, branchValues(cm, cs.scope));
    var acc = emptyAcc(cm);
    addInto(acc, 1, pr, cm);
    var sum = summarize(cm, acc);
    var fl = flowsById(cm, acc);
    sum.id = combo.id;
    sum.values = Object.assign({}, combo.values);
    sum.chance = cs.chance;
    sum.stateFlow = fl.stateFlow;
    sum.branchFlow = fl.branchFlow;
    return sum;
  }

  /** The time path of section 8, with the two other policies alongside (constant in time). */
  function timePath(model, params, opts) {
    var cm = compile(model);
    var prep = prepareParams(cm, params);
    var res = pathCore(cm, prep.values, opts);
    res.adjusted = prep.adjusted;
    return res;
  }

  // ---------------------------------------------------------------- public: routes (the tree view)

  /**
   * Every route from the policy's start to an outcome, with its chance and cost.
   * opts: { stocks, classValues, maxVisits (loop bound, default 2), minChance (default 0) }.
   * Without classValues the routes of all classes are merged: chance is summed over
   * classes and cost is the chance-weighted average. carried = chance * cost.
   */
  function routes(model, params, policyId, opts) {
    var cm = compile(model);
    var o = opts || {};
    var maxVisits = o.maxVisits || 2;
    var minChance = o.minChance || 0;
    var prep = prepareParams(cm, params);
    var policy = getPolicy(cm, policyId);
    var base = stockScope(cm, prep.values, o.stocks || {});
    var merged = {};
    var truncated = 0;
    var T = cm.tiers.length;
    policy.combos.forEach(function (combo) {
      if (o.classValues) {
        var ok = Object.keys(o.classValues).every(function (aid) { return combo.values[aid] === o.classValues[aid]; });
        if (!ok) return;
      }
      var cs = classScope(cm, base, policy, combo);
      var w = o.classValues ? 1 : cs.chance;
      if (w === 0) return;
      var bv = branchValues(cm, cs.scope);
      var visits = new Int32Array(cm.states.length);
      var path = [];
      var tierCost = new Float64Array(T);
      function walk(s, chance, cost) {
        if (cm.states[s].outcome) {
          var key = path.join('>');
          var r = merged[key];
          if (!r) {
            r = merged[key] = { branches: path.map(function (b) { return cm.branches[b].id; }), outcome: cm.states[s].id, chance: 0, costW: 0, tierW: new Float64Array(T) };
          }

    var list = Object.keys(merged).map(function (key) {
      var r = merged[key];
      var cost = r.chance > 0 ? r.costW / r.chance : 0;
      var costByTier = {};
      cm.tiers.forEach(function (t, i) { costByTier[t] = r.chance > 0 ? r.tierW[i] / r.chance : 0; });
      var states = [cm.states[policy.start].id].concat(r.branches.map(function (bid) { return cm.states[cm.branches[cm.branchIndex[bid]].to].id; }));

  }

  /** Sort routes in place, largest first, by 'chance', 'cost' or 'carried'. */
  function sortRoutes(list, by) {
    var key = by || 'chance';
    if (['chance', 'cost', 'carried'].indexOf(key) < 0) throw new Error('Sort by chance, cost or carried');

  }

  // ---------------------------------------------------------------- public: ensemble

  /** Seeded random numbers in [0, 1): mulberry32. Every whole-number seed gives its own stream. */
  function rng(seed) {

  // it is held at its best value in the ensemble and left out of the swings.
  function isRunSetting(cm, id, row) {
    var p = cm.params[cm.paramIds.indexOf(id)];
    return !!((p && p.run_setting) || (row && row.run_setting));
  }

  /** One random draw of every parameter from its range in the table. Run settings stay at their best value. */
  function drawParams(model, table, random) {
    var cm = compile(model);
    var src = tableRows(table);
    var out = {};
    cm.paramIds.forEach(function (id) {
      var row = src[id];
      if (!row) throw new Error('The table has no row for ' + id);
      var lo = row.low, hi = row.high;
      var u = random(); // drawn even when unused, so the stream does not depend on which rows are fixed
      var v;

      else if (lo === hi) v = lo;
      else if (row.dist === 'log') v = Math.exp(Math.log(lo) + u * (Math.log(hi) - Math.log(lo)));

  }

  function percentile(sorted, pct) {

    idx.sort(function (i, j) { return xs[i] - xs[j]; });

      var j = i;

  /** Spearman rank correlation; null when either side does not vary. */
  function spearman(x, y) {

    return sxy / Math.sqrt(sxx * syy);

  /**
   * The ensemble of section 9.5.
   * opts: { n (default 1000), seed (default 1), percentiles (default 5,25,50,75,95), keepDraws }.
   */
  function ensemble(model, table, opts) {
    var cm = compile(model);
    var o = opts || {};
    var n = o.n || 1000;
    var seed = o.seed === undefined ? 1 : o.seed;
    var pcts = o.percentiles || [5, 25, 50, 75, 95];

      var raw = drawParams(cm, table, random);
      var prep = prepareParams(cm, raw);

      var path = pathCore(cm, prep.values, { lean: true });
      var rowsAt = { first: path.periods[0], last: path.periods[path.periods.length - 1] };
      at.forEach(function (w) {
        var row = rowsAt[w];
        RATIO_IDS.forEach(function (r) { series[w][r].push(row.ratios[r]); });
        series[w].library_cost.push(row.library.cost);
        series[w].library_wrong.push(row.library.wrong);
        series[w].top_cost.push(path.top_first.cost);
        series[w].top_wrong.push(path.top_first.wrong);
        series[w].ladder_cost.push(path.cheap_ladder.cost);
        series[w].ladder_wrong.push(path.cheap_ladder.wrong);
        if (row.library.cost < path.top_first.cost && row.library.wrong <= path.top_first.wrong) better[w]++;
        if (row.library.cost < path.cheap_ladder.cost && row.library.wrong <= path.cheap_ladder.wrong) betterLadder[w]++;
      });
      cm.paramIds.forEach(function (id) { drawn[id].push(prep.values[id]); });

    }
    var spread = { first: {}, last: {} };
    var rank = { first: {}, last: {} };
    at.forEach(function (w) {
      Object.keys(series[w]).forEach(function (r) {
        var sorted = series[w][r].slice().sort(function (a, b) { return a - b; });

        }).filter(function (e) { return e.rho !== null; });

    return {
      n: n,
      seed: seed,
      spread: spread,
      // share of draws where the library is cheaper with a wrong rate no higher
      shareBetter: { first: better.first / n, last: better.last / n },
      shareBetterVs: {
        top_first: { first: better.first / n, last: better.last / n },
        cheap_ladder: { first: betterLadder.first / n, last: betterLadder.last / n }

  }

  /**
   * One-at-a-time swings: each parameter at its low and at its high, the others at best.
   * Run settings are not swung.
   * Returns { base, rows: [{ id, low, high }], ranking: { first|last: { ratio: [{ id, swing }] } } }.

    var ranking = { first: {}, last: {} };

  // ---------------------------------------------------------------- public: checks

  /**
   * Conservation: for every policy and every class (zero-chance classes included),
   * the branch chances out of every state sum to 1 and none is outside [0, 1];
   * the outcome chances sum to 1; the class chances sum to 1.

  function conservation(model, params, opts) {
    var cm = compile(model);

        classSum += cs.chance;
        var bv = branchValues(cm, cs.scope);
        cm.states.forEach(function (s, si) {
          if (s.outcome) return;
          var sum = 0;
          cm.out[si].forEach(function (b) {
            var c = bv.c[b];
            sum += c;
            note(Math.max(0, -c, c - 1), policy.id + ' ' + combo.id + ' branch ' + cm.branches[b].id + ': chance outside 0 to 1');
          });
          note(Math.abs(sum - 1), policy.id + ' ' + combo.id + ' state ' + s.id + ': branch chances do not sum to 1');
        });

        cm.outcomes.forEach(function (oc) { os += pr.mass[oc.index]; });
        note(Math.abs(os - 1), policy.id + ' ' + combo.id + ': outcome chances do not sum to 1');
      });

    return { ok: problems.length === 0, maxError: maxError, checks: checks, problems: problems, adjusted: prep.adjusted };
  }

  function words(s) { return String(s).trim().split(/\s+/).filter(Boolean).length; }

  /**
   * Checks on the map itself: label lengths, plain meanings, every parameter used,
   * pure cost parameters never reaching a chance, every state reachable.
   * Returns { ok, problems }.
   */
  function checkMap(map) {
    var problems = [];
    var cm;
    try { cm = compile(map); } catch (e) { return { ok: false, problems: ['The map does not compile: ' + e.message] }; }
    map.states.forEach(function (s) { if (words(s.label) > 6) problems.push('State label over six words: ' + s.id); });
    map.branches.forEach(function (b) {
      if (words(b.label) > 8) problems.push('Branch label over eight words: ' + b.id);
      if (!Array.isArray(b.limitations)) problems.push('Branch has no limitation list: ' + b.id);

    map.parameters.forEach(function (p) {

      if (!p.group || !map.groups.some(function (g) { return g.id === p.group; })) problems.push('Parameter has no known group: ' + p.id);

    // which names each expression family uses
    var derivedIds = {};
    cm.derived.forEach(function (d) { derivedIds[d.id] = d.ids; });
    function expand(ids, seen) {
      ids.forEach(function (id) {
        if (seen[id]) return;
        seen[id] = true;
        if (derivedIds[id]) expand(derivedIds[id], seen);
      });
      return seen;
    }
    var chanceIds = {};
    cm.branches.forEach(function (b) { expand(b.chance.ids, chanceIds); });
    cm.attributes.forEach(function (a) { a.values.forEach(function (v) { expand(v.ids, chanceIds); }); });
    cm.stockValues.forEach(function (v) { expand(v.ids, chanceIds); });
    cm.updates.forEach(function (u) { expand(u.ids, chanceIds); });
    var allIds = Object.assign({}, chanceIds);
    cm.branches.forEach(function (b) { expand(b.cost.ids, allIds); expand(b.calls.ids, allIds); });
    cm.params.forEach(function (p) {
      if (!allIds[p.id] && !p.run_setting) problems.push('Parameter is never used: ' + p.id);
      if (p.pure_cost && chanceIds[p.id]) problems.push('Pure cost parameter reaches a chance: ' + p.id);
    });
