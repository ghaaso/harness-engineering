    var seen = new Array(cm.states.length).fill(false);
    cm.policies.forEach(function (pol) {
      var stack = [pol.start];
      while (stack.length) {
        var s = stack.pop();
        if (seen[s]) continue;
        seen[s] = true;
        cm.out[s].forEach(function (b) { stack.push(cm.branches[b].to); });
      }
    });
    cm.states.forEach(function (s, i) { if (!seen[i]) problems.push('State cannot be reached from any policy start: ' + s.id); });
    return { ok: problems.length === 0, problems: problems };
  }

  return {
    compileExpr: compileExpr,
    compile: compile,
    prepareParams: prepareParams,
    tableRows: tableRows,
    paramsFromTable: paramsFromTable,
    evaluatePolicy: evaluatePolicy,
    evaluateClass: evaluateClass,
    timePath: timePath,
    headline: headline,
    routes: routes,
    sortRoutes: sortRoutes,
    rng: rng,
    drawParams: drawParams,
    spearman: spearman,
    percentile: percentile,
    ensemble: ensemble,
    swings: swings,
    conservation: conservation,
    checkMap: checkMap,
    RATIO_IDS: RATIO_IDS.slice()
  };
});

<script>
/*

   * derived value or a stock value), whether it shapes the class chances, and whether it enters
   * the stock equations.

    cm.paramIds.forEach(function (id) { reach[id] = { branches: [], chance: [], cost: [], classes: false, stocks: false }; });
    cm.branches.forEach(function (b) {
      var ch = expand(b.chance.ids);

        if (ch[id] || co[id]) reach[id].branches.push(b.id);

        if (co[id]) reach[id].cost.push(b.id);

  /**

    if (p && p.run_setting) return 'time';

    if (id === 'm_fable') return 'L9';

  /** Chance, cost and calls of every branch for one class, exactly as the engine scopes them. */
  function branchValues(E, map, params, policyId, classValues, stocks) {
    var cm = E.compile(map);

  /**

    var cm = E.compile(map);

      series.library_wrong = draws.map(function (d) { return d[w].wrong; });
      series.top_cost = draws.map(function (d) { return d.top.cost; });

  function buildTrie(routes) {

      '<button class="btn" type="button" id="playBtn">' + (playTimer ? 'Stop' : 'Play the periods') + '</button>' +
      '<p class="note" style="flex-basis:100%">Stocks at the start of the period; flows during it, in entries per period. Every number here is computed ' + tagEl('G') + '. The same period sets the library on the map above.</p>';
  }
  $('#sfdControls').addEventListener('input', function (e) { if (e.target.id === 'perSfd') { ST.period = +e.target.value; ST.selAuto = true; renderStockFlow(); renderMap(); } });
  $('#sfdControls').addEventListener('click', function (e) {

  function renderEnsControls() {

      '<div class="ctl"><span>Seed</span><input type="number" id="ensSeed" value="20261112" style="width:9rem"></div>' +
      '<button class="btn primary" type="button" id="ensRun">Run the model many times</button>' +
      '<div class="ctl"><span>Progress</span><div class="row"><div class="progress"><i id="ensBar"></i></div><span class="small" id="ensTxt" data-label="1">not run yet</span></div></div>' +
      '<p class="note" style="flex-basis:100%">' + rich('{{c:guess}} of the {{c:drawn}} drawn unknowns are guesses (G). {{c:study}} come from outside studies (S) and {{c:measured}} were measured (M). The horizon and the Opus price ratio are not drawn. Each run uses the ranges, not the sliders above. The same seed always gives the same runs.') + '</p>';
  }
  document.addEventListener('click', function (e) {
    if (e.target.id === 'ensRun') runEnsemble();

  });
  function runEnsemble() {
    if (RUN) return;
    var n = +$('#ensN').value, seed = Math.round(+$('#ensSeed').value) || 0;
    RUN = C.ensembleRunner(E, MAP, TABLE, { n: n, seed: seed });
    $('#ensRun').disabled = true;
    // Yield through a message channel, not setTimeout: timers are clamped or throttled
    // in some panes and background tabs, which made the runs crawl. Each slice holds the
    // thread for at most about 40 ms, so the page keeps answering clicks and scrolls.
    var ch = typeof MessageChannel === 'function' ? new MessageChannel() : null;
    var later = ch ? function (f) { ch.port1.onmessage = function () { f(); }; ch.port2.postMessage(0); } : function (f) { setTimeout(f, 0); };
    (function tick() {
      var t0 = performance.now();
      while (!RUN.done() && performance.now() - t0 < 40) RUN.step(1);
      var k = RUN.count();
      $('#ensBar').style.width = (100 * k / n) + '%';
      $('#ensTxt').textContent = k + ' of ' + n + ' runs';
      if (!RUN.done()) { later(tick); return; }
      if (ch) { ch.port1.close(); ch.port2.close(); }
      ENS = RUN.result(); ENS.draws = RUN.draws(); RUN = null;
      $('#ensRun').disabled = false;
      renderEnsemble();
    })();
  }
  function spreadChart(title, ids, S) {
    var W = 520, H = 130, L = 118, Rm = 16, T = 28;
    var vals = []; ids.forEach(function (r) { vals.push(S[r].p5, S[r].p95); }); vals.push(1);
    vals = vals.filter(isFinite);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), pad = (hi - lo) * 0.08 || 0.05; lo -= pad; hi += pad;
    var X = function (v) { return L + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (W - L - Rm); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(title) + '"><text class="lbl-strong" x="4" y="14">' + esc(title) + '</text>' + svgTag(W - 22, 4, 'G');
    niceTicks(lo, hi, 5).forEach(function (t) { s += '<line x1="' + X(t) + '" x2="' + X(t) + '" y1="' + T + '" y2="' + (H - 22) + '" stroke="var(--line)"/><text class="lbl" x="' + X(t) + '" y="' + (H - 8) + '" text-anchor="middle">' + fmt(t, 'ratio') + '</text>'; });
    s += '<line x1="' + X(1) + '" x2="' + X(1) + '" y1="' + (T - 4) + '" y2="' + (H - 22) + '" stroke="currentColor" stroke-dasharray="1 3"/><text class="lbl" x="' + (X(1) + 3) + '" y="' + (T - 2) + '">equal</text>';
    ids.forEach(function (r, i) {
      var y = T + 18 + i * 38, q = S[r];
      s += '<text class="lbl" x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" style="fill:var(--ink)">' + esc(RLAB[r]) + '</text>' +
        '<line x1="' + X(q.p5) + '" x2="' + X(q.p95) + '" y1="' + y + '" y2="' + y + '" stroke="currentColor" stroke-width="1.3"/>' +
        '<line x1="' + X(q.p5) + '" x2="' + X(q.p5) + '" y1="' + (y - 6) + '" y2="' + (y + 6) + '" stroke="currentColor"/><line x1="' + X(q.p95) + '" x2="' + X(q.p95) + '" y1="' + (y - 6) + '" y2="' + (y + 6) + '" stroke="currentColor"/>' +
        '<rect x="' + X(q.p25) + '" y="' + (y - 9) + '" width="' + Math.max(1.5, X(q.p75) - X(q.p25)) + '" height="18" fill="var(--surface)" stroke="currentColor" stroke-width="1.6"' + (r.indexOf('wrong') === 0 ? ' stroke-dasharray="4 2.5"' : '') + '/>' +
        '<line x1="' + X(q.p50) + '" x2="' + X(q.p50) + '" y1="' + (y - 9) + '" y2="' + (y + 9) + '" stroke="currentColor" stroke-width="3"/>';
    });
    return '<div class="chartbox spread chart-scroll" data-tagged="G">' + s + '</svg></div>';
  }
  function scatter(title, kc, kw, w) {
    var W = 420, H = 300, L = 46, Rm = 12, T = 26, B = 40;
    var xs = ENS.draws.map(function (d) { return d[w].ratios[kc]; }), ys = ENS.draws.map(function (d) { return d[w].ratios[kw]; });
    var sx = xs.filter(isFinite).slice().sort(function (a, b) { return a - b; }), sy = ys.filter(isFinite).slice().sort(function (a, b) { return a - b; });
    var x0 = Math.min(E.percentile(sx, 0.5), 1), x1 = Math.max(E.percentile(sx, 99.5), 1), y0 = Math.min(E.percentile(sy, 0.5), 1), y1 = Math.max(E.percentile(sy, 99.5), 1);
    var px = (x1 - x0) * 0.06 || 0.02, py = (y1 - y0) * 0.06 || 0.02; x0 -= px; x1 += px; y0 -= py; y1 += py;
    var clipped = 0;
    var X = function (v) { return L + (v - x0) / (x1 - x0) * (W - L - Rm); }, Y = function (v) { return T + (y1 - v) / (y1 - y0) * (H - T - B); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(title) + '"><text class="lbl-strong" x="' + L + '" y="14">' + esc(title) + '</text>' + svgTag(W - 22, 4, 'G');
    niceTicks(x0, x1, 5).forEach(function (t) { s += '<line x1="' + X(t) + '" x2="' + X(t) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--line)"/><text class="lbl" x="' + X(t) + '" y="' + (H - B + 14) + '" text-anchor="middle">' + fmt(t, 'ratio') + '</text>'; });
    niceTicks(y0, y1, 5).forEach(function (t) { s += '<line x1="' + L + '" x2="' + (W - Rm) + '" y1="' + Y(t) + '" y2="' + Y(t) + '" stroke="var(--line)"/><text class="lbl" x="' + (L - 5) + '" y="' + (Y(t) + 3.5) + '" text-anchor="end">' + fmt(t, 'ratio') + '</text>'; });
    s += '<line x1="' + X(1) + '" x2="' + X(1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="currentColor" stroke-dasharray="1 3"/><line x1="' + L + '" x2="' + (W - Rm) + '" y1="' + Y(1) + '" y2="' + Y(1) + '" stroke="currentColor" stroke-dasharray="1 3"/>';
    var dots = '';
    for (var i = 0; i < xs.length; i++) {
      var a = xs[i], b = ys[i]; if (!isFinite(a) || !isFinite(b)) { clipped++; continue; }
      if (a < x0 || a > x1 || b < y0 || b > y1) clipped++;
      dots += '<circle cx="' + X(Math.max(x0, Math.min(x1, a))).toFixed(1) + '" cy="' + Y(Math.max(y0, Math.min(y1, b))).toFixed(1) + '" r="1.7"/>';
    }
    s += '<g fill="currentColor" opacity=".35">' + dots + '</g>';
    s += '<text class="lbl" x="' + ((L + W - Rm) / 2) + '" y="' + (H - 8) + '" text-anchor="middle">cost ratio (left of the dotted line: cheaper)</text>';
    s += '<text class="lbl" transform="translate(12 ' + ((T + H - B) / 2) + ') rotate(-90)" text-anchor="middle">wrong-rate ratio (below: fewer wrong)</text>';
    return '<div class="chartbox" data-tagged="G">' + s + '</svg>' + (clipped ? '<p class="small muted">' + clipped + ' runs lie beyond the edges and are drawn on the edge.</p>' : '') + '</div>';
  }
  function rankList(title, r, w) {
    var list = ENS.spearman[w][r].slice(0, 8);

    var out = $('#ensOut');

    var w = ST.ensWhen, S = ENS.spread[w], sh = ENS.shareBetterVs;

    var h = '<div class="row"><span class="small muted">Show the</span>' + seg('Period', [['first', 'first period'], ['last', 'last period']], w).replace('class="seg"', 'class="seg" id="ensWhen"') + '<span class="small muted" data-label="1">' + ENS.n + ' runs, seed ' + ENS.seed + (ENS.adjustedDraws ? ', ' + ENS.adjustedDraws + ' runs scaled to keep chances possible' : '') + '</span></div>';
    h += '<h3>The spread of both ratios</h3><p class="note" data-label="definition">The box holds the middle half of the runs; the thick tick is the middle run; the whiskers reach the 5th and 95th of every hundred. Solid box: cost ratio. Dashed box: wrong-rate ratio.</p>';
    h += '<div class="charts2 fit">' + spreadChart('Against the cheap model with the ladder', ['cost_vs_ladder', 'wrong_vs_ladder'], S) + spreadChart('Against the strong model directly', ['cost_vs_top', 'wrong_vs_top'], S) + '</div>';
    h += '<table class="ptable" data-tagged="G"><tr><th>Ratio ' + tagEl('G') + '</th><th>low (5 in 100)</th><th>middle</th><th>high (95 in 100)</th></tr>' + [['cost_vs_ladder', 'Cost, against the ladder'], ['wrong_vs_ladder', 'Wrong rate, against the ladder'], ['cost_vs_top', 'Cost, against strong directly'], ['wrong_vs_top', 'Wrong rate, against strong directly']].map(function (r) {
      return '<tr><td>' + esc(r[1]) + '</td><td>' + esc(fmt(S[r[0]].p5, 'ratio')) + '</td><td>' + esc(fmt(S[r[0]].p50, 'ratio')) + '</td><td>' + esc(fmt(S[r[0]].p95, 'ratio')) + '</td></tr>';
    }).join('') + '</table>';
    h += '<p>Share of runs in which the library costs less <i>and</i> its wrong rate is no higher: against the cheap model with the ladder ' + num(sh.cheap_ladder[w], 'G', 'pct') + '; against the strong model directly ' + num(sh.top_first[w], 'G', 'pct') + '.</p>';
    h += '<h3>Cost ratio against wrong-rate ratio, one dot per run</h3><div class="charts2">' + scatter('Against the cheap model with the ladder', 'cost_vs_ladder', 'wrong_vs_ladder', w) + scatter('Against the strong model directly', 'cost_vs_top', 'wrong_vs_top', w) + '</div>';
    h += '<h3>Which unknowns move each ratio most</h3><p class="note">' + esc(TX.sections.many.rank_read) + ' With this many runs, values closer than about ' + num(noise, 'G', 'ratio') + ' are not well separated. Each name carries its own tag. Solid bar: the ratio rises with it. Hatched: it falls.</p>';
    h += '<div class="ranks">' + rankList('Cost, against the ladder', 'cost_vs_ladder', w) + rankList('Wrong rate, against the ladder', 'wrong_vs_ladder', w) + rankList('Cost, against strong directly', 'cost_vs_top', w) + rankList('Wrong rate, against strong directly', 'wrong_vs_top', w) + '</div>';
    out.innerHTML = h;
  }

  // ------------------------------------------------------------ static text

  }

  renderStatic();
  renderGraphLegend();

})();
