*{box-sizing:border-box}

footer{padding-block:36px 60px; color:var(--ink-2); font-size:.86rem}

}

  body{font-size:15.5px}
  .top .wrap{flex-wrap:nowrap; gap:6px}
  .brand{display:none}
  .nav{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:6px 7px; font-size:.82rem}
  .iconbtn{white-space:nowrap; padding:5px 8px; font-size:.76rem}
  .bar{grid-template-columns:minmax(0,1fr) 4.6rem; row-gap:3px}
  .bar .nm{grid-column:1/-1}
  .ratios,.charts2,.ranks{grid-template-columns:minmax(0,1fr)}
  .cg-row{grid-template-columns:minmax(84px,1fr) repeat(10,21px); gap:1px}
  .cell{width:20px; height:20px}
  .panel{padding:12px}
  .rk{grid-template-columns:minmax(0,7rem) minmax(0,1fr) 3rem}
}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{transition:none!important; animation:none!important} }

<body>
<header class="top"><div class="wrap">
  <span class="brand">Library pathways</span>
  <nav class="nav" aria-label="Sections">
    <a href="#map">The map</a>
    <a href="#cases">Real cases</a>
    <a href="#lims">Limitations</a>

</div></header>

<main>
<section class="hero"><div class="wrap"><div class="stack" id="hero"></div></div></section>

<section class="band" id="map"><div class="wrap wide">
  <div class="band-head"><span class="eyebrow" data-label="1">1</span><h2 id="mapTitle"></h2><p class="lede" id="mapLede"></p></div>
  <div class="panel stack">
    <div class="controls" id="pickers"></div>
    <div class="graph chart-scroll" id="graph"></div>
    <div class="legend-row" id="graphLegend"></div>
    <p class="note" id="graphNote" data-label="1"></p>
  </div>
  <div class="mapgrid">
    <div class="piece" id="piece"></div>
    <div class="stack">
      <div class="stepbox" id="stepper"></div>
      <div class="row" id="treeTools"></div>
      <div class="tree" id="tree" data-tagged="G"></div>
    </div>
  </div>
</div></section>

<section class="band" id="cases"><div class="wrap">
  <div class="band-head"><span class="eyebrow" data-label="1">2</span><h2 id="casesTitle"></h2><p class="lede" id="casesLede"></p></div>
  <p class="callout" id="casesWarn"></p>
  <p class="note" id="casesJudged"></p>
  <div class="legend-row" id="cellLegend"></div>
  <div class="casewrap">
    <div class="cgrid" id="cgrid"></div>
    <div class="panel casebox" id="casebox"></div>
  </div>
</div></section>

<section class="band" id="lims"><div class="wrap wide">
  <div class="band-head"><span class="eyebrow" data-label="1">3</span><h2 id="limsTitle"></h2><p class="lede" id="limsLede"></p></div>
  <div class="limmap"><div class="panel stack" style="padding:10px">
    <div class="graph mini chart-scroll" id="minigraph"></div>
    <p class="note" id="limSel"></p>
  </div></div>
  <div class="limcols">
    <div><h3 style="margin-bottom:10px">Where it fell short</h3><div id="limlist"></div></div>
    <div><h3 style="margin-bottom:10px">Where it worked</h3><p class="note" id="worksLede" style="margin-bottom:10px"></p><div class="stack" id="workslist" style="gap:6px"></div></div>
  </div>
</div></section>

<section class="band" id="run"><div class="wrap wide">
  <div class="band-head"><span class="eyebrow" data-label="1">4</span><h2 id="runTitle"></h2><p class="lede" id="runLede"></p></div>
  <div class="rungrid">
    <div>
      <div class="row" style="margin-bottom:10px"><button class="btn" id="resetBtn" type="button">Back to best values</button><span class="note" id="changedNote"></span></div>
      <div class="liveline" id="liveLine" data-tagged="G"></div>
      <div id="sliders"></div>
    </div>
    <div class="outpanel" id="outpanel">
      <div class="panel stack" id="policyOut"></div>
      <div class="panel stack" id="ratioOut"></div>
      <div class="charts2" id="ratioCharts"></div>
    </div>
  </div>
  <div class="panel stack sfd">
    <h3>The stock of entries, period by period</h3>
    <div class="controls" id="sfdControls"></div>
    <div class="chart-scroll" id="sfd"></div>
    <div class="loops" id="loops"></div>
  </div>
</div></section>

<section class="band" id="many"><div class="wrap wide">
  <div class="band-head"><span class="eyebrow" data-label="1">5</span><h2 id="manyTitle"></h2><p class="lede" id="manyLede"></p></div>
  <p class="callout" id="manyFollows"></p>
  <div class="panel stack">
    <div class="controls" id="ensControls"></div>
    <div id="ensOut" class="stack"></div>
  </div>
</div></section>

<section class="band" id="leaves"><div class="wrap">
  <div class="band-head"><span class="eyebrow" data-label="1">6</span><h2 id="leavesTitle"></h2><p class="lede" id="leavesLede"></p></div>
  <div class="leaves" id="leavesList"></div>
</div></section>
</main>

on this PC in the owner's repositories or session records; S taken from an outside study; G a guess. A number that only loosely relates to a parameter is a hint: the tag is G and the note says how it differs. Each parameter has a low, a high and a best value. The map draws values uniformly between low and high.","tags":{"M":"Measured on this PC, in this owner's repositories or session records","S":"Taken from an outside study or the vendor's price list","G":"A guess. The note may cite a hint and say how it differs from the parameter"},"assumptions":["Cost unit: one call by the cheap model (Sonnet) is 1. Calls are treated as equal in size inside a tier.","One period is 30 days and one episode is a fix-sized piece of work of about ten cheap calls (brief section 12, R6).","Revision 2 (brief section 12): z_wrongstore removed; s_exact, s_similar, s_comp, s_part, ok_coverage_factor and fix_on_found added; c_carry, rho_retry, w_write, r_exact and h_harm re-tagged G (hints, not measurements); the k_fill source corrected.","m_opus is 2 and m_fable is 2 to 4 from the vendor price ratios supplied for this task (2026-11-12).","Where a refuter corrected a first-round number, the corrected number is used."],"source_key":{"F1":"scratchpad/lib/facts/F1-ks-mechanics.md","F2":"scratchpad/lib/facts/F2-ks-research-and-refutes.md","F3":"scratchpad/lib/facts/F3-v2-numbers.md","F4":"scratchpad/lib/facts/F4-lit-positive.md","F5":"scratchpad/lib/facts/F5-lit-negative.md","F6":"scratchpad/lib/facts/F6-lit-tiers-baselines.md","D1":"scratchpad/lib/dives/D1-token-arithmetic.md","D7":"scratchpad/lib/dives/D7-write-side.md","P-proponent":"scratchpad/lib/dives/P-proponent.md","R1":"scratchpad/lib/refute/R1-ceiling.md","R2":"scratchpad/lib/refute/R2-drain.md","R3":"scratchpad/lib/refute/R3-flat.md","R4":"scratchpad/lib/refute/R4-gap-coverage.md (table re-read from scratchpad/lib/refute/r4/clinic-gates-out.txt)","R5":"scratchpad/lib/refute/R5-price-time.md","R6":"scratchpad/lib/refute/R6-clock.md","R8":"scratchpad/lib/refute/R8-push-precision.md","R9":"scratchpad/lib/refute/R9-trust-cost.md (and R9-git.json, R9-econ.out.txt)","R10":"scratchpad/lib/refute/R10-critic.md","W":"docs/program/evidence/library-pathways/walkthroughs/ (the 59 real-case walkthroughs; case ids such as L01 C3a name the file and section)","V2":"docs/program/HARNESS-V2-DESIGN-2026-11.md","HB":"docs/program/HARNESS-BOTTLENECKS-2026-11.md","TB":"docs/program/TOKEN-BOTTLENECK-2026-11.md","scratchpad":"C:/Users/User/AppData/Local/Temp/claude/192654871f6b1294/0bf1c4f3-76dc-4144-995c-2af5a213db41/scratchpad/lib (prefix of the scratchpad paths above, minus the leading 'scratchpad/lib')"},"parameters":[{"id":"p_visible","group":"workload","low":0.1,"high":0.8,"best":0.4,"tag":"G","source":"No source. Hints: F3 s4 (tool errors are 2.2 % of calls); R10 s1.2 (windows with an edit or a failed check: 10.9 % of FixFlow tokens, 77.9 % of Clinic).","note":"Hint only. Errors are 2.2 % of calls, and 11 to 78 % of tokens sit in windows with an edit or a failed check. Neither counts episodes."},{"id":"need_visible","group":"workload","low":0.15,"high":0.6,"best":0.3,"tag":"G","source":"No source. Hints: F6 s(iii) and R4 s1 (vendor scores, Sonnet 5.5 vs Opus 5.5); F6 s(i) (AgentBrew student alone 45.3 on Terminal-Bench 2.0).","note":"Hint. On whole benchmarks Sonnet 5.5 fails about 29 % (Terminal-Bench 4.0) to 54 % (FrontierCode 1.1). Those are whole tasks, not one error or one failing check."},{"id":"need_latent","group":"workload","low":0.2,"high":0.7,"best":0.4,"tag":"G","source":"No source. Hint: R4 s1 (Clinic slice table, read again in this run).","note":"Hint. Round-one review found a serious defect in 9 of 14 Opus-built slices and in 2 of the 4 Sonnet slices that have counts. These are slices, found by review."},{"id":"u_exact","group":"workload","low":0.02,"high":0.22,"best":0.06,"tag":"M","source":"R3 s1 (3 to 5 same-cause repeats in 48 to 50 fix commits on main; 95 % interval on 5 of 50 reaches 22 %); F5 H2 (outside study: 2.1 to 3.2 % of fixes rebuildable from past fixes).","note":"3 to 5 of 48 to 50 fix commits repeated an earlier cause (6 to 10 %). Hard fixes only, one repository, 64 days; includes same cause in a different file."},{"id":"u_similar","group":"workload","low":0.03,"high":0.45,"best":0.15,"tag":"S","source":"F2 s1 (X-05 F01 to F03: 17 to 45 % of bug fixes follow recurring fix patterns, secondary reads); F5 H2 (2.1 to 3.2 % rebuildable from past fixes in one project, unconfirmed summary).","note":"Outside studies of many-contributor code put recurring fix patterns at 17 to 45 % of fixes. A one-project study found 2.1 to 3.2 %. Both were read second-hand."},{"id":"u_composite","group":"workload","low":0,"high":0.25,"best":0.05,"tag":"G","source":"No source. Hints: F4 (one retrieved item scored best in ReasoningBank and SWE-Exp); F5 H2 (2.1 and 3.2 % of fixes buildable from one or several past fixes).","note":"No study counts problems made of several stored parts. A one-project study found 2.1 % and 3.2 % of fixes buildable from one or several past fixes."},{"id":"latent_coverage_factor","group":"workload","low":0.05,"high":1,"best":0.3,"tag":"G","source":"No source. Hints: F1 s5 (the diff check is the only route to problems the agent does not notice); F3 s4 (0 of 200 sampled search steps judged likely saved by an index).","note":"No measurement. The design reaches silent problems only through a diff check, and a 200-step sample found no step an index would likely save. The range runs from almost nothing to no penalty."},{"id":"ok_coverage_factor","group":"workload","low":0.05,"high":1,"best":0.4,"tag":"G","source":"No source. Brief section 12, R2 (entries come from strong-tier solves, and under the library the strong tier works only on what the cheap model failed).","note":"No measurement. Entries exist for problems the cheap model failed, so an episode it gets right alone is less likely to have one. The top, 1, means no penalty."},{"id":"k_fill","group":"workload","low":10,"high":300,"best":40,"tag":"S","source":"F4 (APC: hit rate 2 % at 1 entry and 46 to 48 % at 100 entries; its 14.29 % is at the 20th percentile of queries, a cold-start curve over the query stream, not at 20 entries; AWM: most gain within about 40 examples; SWE-Exp: gains level off near 300). Corrected in revision 2 after verify-engine.md section 6.","note":"Fitting the plan-caching study's two cache-size points (2 % at 1 entry, 46 % at 100, ceiling near 55 %) gives about 27 to 55 entries. Another study levelled off near 300. Both templated."},{"id":"v_max","group":"workload","low":0.1,"high":0.9,"best":0.4,"tag":"G","source":"No source for a lookup. Hint: R8 s2 (forward replay over 154 changes, projected to 133 entries: some entry fired wrongly on 16 to 51 % of changes for the selective key types).","note":"Hint. Replaying diff-keyed warnings forward over 154 changes, projected to 133 entries, some entry fired falsely on 16 to 51 % of changes. That is a push channel, not a lookup."},{"id":"k_distract","group":"workload","low":15,"high":250,"best":60,"tag":"G","source":"No source. Hint: R8 s2 (projections from per-entry false-fire rates).","note":"Hint. Projected from replay fire rates, the false-fire chance reaches about 63 % of its top near 20 entries for loose keys and near 180 for selective keys."},{"id":"t_visible","group":"mechanism","low":0.2,"high":1,"best":0.5,"tag":"G","source":"No source. Hints: F1 s5 and s8 (pull-only design; compliance is self-reported and escalations without a lookup are undercounted).","note":"No measured lookup rate exists. The design relies on the agent choosing to look up, and compliance is self-reported. The top of the range means every visible problem triggers a lookup."},{"id":"t_latent","group":"mechanism","low":0.02,"high":0.6,"best":0.15,"tag":"G","source":"No source. Hint: F6 s(ii) (agents that succeed 22 % of the time predict 77 %).","note":"No measured rate. Some agents that succeeded 22 % of the time predicted 77 %, so asking only when in doubt is unreliable. Nothing signals these problems, so the rate is set low."},{"id":"c_lookup","group":"mechanism","low":0.1,"high":2,"best":1,"tag":"G","source":"No source. Hints: F3 s7 (no measured number for one lookup turn exists); R1 s2 (one extra call per exploration run costs 11 to 16 % of tokens).","note":"Hint. A pulled lookup is one extra model call, which is 1 by this map's unit. Low end: a script with no model turn. High end: a lookup plus a follow-up turn."},{"id":"r_exact","group":"mechanism","low":0.4,"high":0.95,"best":0.75,"tag":"G","source":"No source for a lookup's recall. Hints: F2 s1 (KS-O19 table: duplicate bug reports sharing no words, 33.6 % by title, 19.0 % by description, 5.1 % in both); F1 s1 (pilot target: recall at shown at least 60 %, a target not a result).","note":"Hint. 5 to 34 % of duplicate bug reports share no words with their twin, so word-matching misses them. That is bug-report text, not stored fixes. The design's pilot target is 60 %."},{"id":"r_similar","group":"mechanism","low":0.2,"high":0.8,"best":0.5,"tag":"G","source":"No source for a chance. Hint: F2 s1 (BM25 scored 10.2 to 18.45 points lower on dissimilar duplicate bug reports than on similar ones).","note":"Hint. Word-matching scored 10 to 18 points lower on dissimilar duplicate bug reports than on similar ones. That is a ranking score on bug reports, not a hit chance."},{"id":"r_comp_full","group":"mechanism","low":0.02,"high":0.4,"best":0.1,"tag":"G","source":"No source. Hints: F1 s3 (a lookup shows at most one lead and one candidate); F4 (one retrieved item beat several in ReasoningBank and SWE-Exp; Memento found more cases did not help).","note":"No measurement. One lookup shows at most one lead and one candidate, and three outside studies did best with one retrieved item. Returning every part at once is therefore unlikely."},{"id":"r_comp_part","group":"mechanism","low":0.1,"high":0.6,"best":0.35,"tag":"G","source":"No source. Hint: F1 s3 (display cap of one lead and one candidate).","note":"No measurement. One lookup shows at most two items, so returning some but not all parts is likelier than returning all. This and the previous value together stay at or under 1."},{"id":"f_false","group":"mechanism","low":0.1,"high":0.8,"best":0.35,"tag":"G","source":"No source for a chance. Hints: F2 s2 (KS-C7: one error template with 2 to 3 causes scores a full match on the wrong cause); F4 (MeanCache test: 12.7 to 33 % false hits on queries that should all miss, search summary only).","note":"Hint. Error templates here carry 2 to 3 causes, so a wrong-cause match scores full. Semantic caches gave 13 to 33 % false hits on queries that should miss (unconfirmed summary)."},{"id":"c_check_share","group":"mechanism","low":0.03,"high":0.4,"best":0.2,"tag":"M","source":"F1 s3, R9 s1.6 (3 of about 15 worked-example entries can return 'applies' without Docker, 6 of 15 with it; about 3 of 116 entry-bearing seed rows).","note":"Counted in the design's seed: 3 of 15 worked-example entries carry a check usable without Docker, 6 of 15 with it, and about 3 of 116 across the whole seed."},{"id":"c_screen","group":"mechanism","low":1,"high":3,"best":2,"tag":"G","source":"F1 s1 (design estimate, labelled inferred: a native verify adds 2 to 3 turns).","note":"Design estimate, not measured: a verify adds 2 to 3 extra turns. The check itself runs in 0.2 s with no tokens, so the low end is one call."},{"id":"a_right","group":"mechanism","low":0.5,"high":0.98,"best":0.85,"tag":"G","source":"No source. Hint: F5 A1 (Xiong: agents copy stored records whose inputs resemble the new one, correlation near 1).","note":"Hint. Agents tend to copy stored records that look like the current input (correlation near 1 in one study), so good entries are probably accepted. Not measured on coding work."},{"id":"a_wrong","group":"mechanism","low":0.35,"high":0.95,"best":0.65,"tag":"S","source":"F5 C1 (ClashEval, arXiv 2404.10198: six top models adopted wrong retrieved content over a correct prior more than 60 % of the time).","note":"Six top models took wrong retrieved content over their own correct answer more than 60 % of the time. Question answering with planted wrong values, not look-alike repair notes."},{"id":"d_deliver","group":"mechanism","low":0.5,"high":0.98,"best":0.85,"tag":"G","source":"No source. Hint: F3 s1 (48 compactions in Clinic main sessions; what a compaction drops was never measured).","note":"Hint. An entry stays in the window until a compaction or a handoff drops it. Clinic main sessions compacted 48 times. What compaction loses has not been measured here."},{"id":"c_carry","group":"mechanism","low":0.1,"high":1.5,"best":0.73,"tag":"G","source":"No measurement of carrying cost. Hint: D1 s2 (860 tokens x about 260 remaining calls / 306k tokens per call = 0.73, derived); answer size from KS-C9 (0.4 tokens per character on 2,904 results); 306k and 519 calls from F3 s1 and s7.","note":"Hint, derived not measured: an 860-token answer, 306k tokens per slice call, 519 calls per slice, and an assumed 260 remaining calls (half the session)."},{"id":"q_exact","group":"mechanism","low":0.35,"high":0.99,"best":0.75,"tag":"S","source":"F4 (Dynamic Cheatsheet: Game of 24 10 to 99, Equation Balancer 44.8 to 100, both one repeated template).","note":"On a repeated template a stored solution fixed 89 of 90 failures (Game of 24). Net gain over baseline failures, on same-template puzzles. The design stores a diagnosis, not the whole fix."},{"id":"q_similar","group":"mechanism","low":0.07,"high":0.5,"best":0.2,"tag":"S","source":"F4 and F5 (net gain divided by baseline failures, my arithmetic: SWE-Exp 6.8 %, ReasoningBank 7.0 to 7.4 %, AgentBrew 11.5 to 20.8 %, Agent KB 11.4 %, AWM 15.7 %, ExpeL 15 to 32 %).","note":"Net gain over baseline failures: 7 % (SWE-Exp, ReasoningBank), 12 to 21 % (AgentBrew, Agent KB), 16 to 32 % (AWM, ExpeL). These average over all retrievals, so a good fit should do better."},{"id":"q_comp","group":"mechanism","low":0.03,"high":0.5,"best":0.15,"tag":"G","source":"No source. Hint: F4 (ReasoningBank 49.7 at one item vs 44.4 at four; SWE-Exp 42.0 vs 39.0).","note":"No study measures all parts of a composite. Two studies scored lower with more retrieved items, so this is set at or under the similar-entry value."},{"id":"q_part","group":"mechanism","low":0,"high":0.3,"best":0.08,"tag":"G","source":"No source. Hint: same as q_comp.","note":"No measurement. With only some parts the cheap model must work out the rest, so this is set below the all-parts value."},{"id":"h_harm","group":"mechanism","low":0.2,"high":0.9,"best":0.55,"tag":"G","source":"No source for this step on its own. Hints: F5 C1 (ClashEval: wrong content beat a correct prior over 60 % of the time; the same figure a_wrong cites); F5 C3 (MemCollab raw memory: HumanEval 42.7 to 34.1, GSM8K 73.0 to 56.6, MATH500 27.4 to 18.8).","note":"Hint. The over-60 % figure is the one a_wrong cites, so one figure supports two steps. Raw stronger-model memory cut weaker models' scores by 4 to 31 %. Question answering, not repair."},{"id":"n_cheap","group":"mechanism","low":3,"high":30,"best":10,"tag":"G","source":"No source. Hints: F3 s1 (FixFlow agent windows average about 12 calls); R9 s1.2 (median agent window 7 calls, p25 4).","note":"Hint. FixFlow agent windows average about 12 calls (median 7). That is a whole agent run. The map sets one episode at about ten cheap calls (brief R6)."},{"id":"s_exact","group":"mechanism","low":0.1,"high":0.9,"best":0.5,"tag":"G","source":"No source. Hint: W L01 C3a and C3b (a stored route would have cut 2 to 8 calls per wave-2 agent; one wave-1 agent spent about 8; with the route in its brief an agent recovered in 2 calls).","note":"Hint. In one real case a stored route would have saved 2 to 8 calls per agent, of about 8 spent. On a ten-call episode that is 0.2 to 0.8. One case only."},{"id":"s_similar","group":"mechanism","low":0,"high":0.7,"best":0.25,"tag":"G","source":"No source. Hint: W L05-4 (a stored fix would have saved a detour of a commit, its revert, stopped full runs and one Opus review; the entry showed the cause, not the fix, so adapting was needed).","note":"Hint. In one case a stored fix would have saved a wrong commit, its revert and a review. It gave the cause, not the fix, so adapting still costs calls."},{"id":"s_comp","group":"mechanism","low":0,"high":0.6,"best":0.2,"tag":"G","source":"No source. Hint: same as s_similar; F4 (two outside studies scored lower with more retrieved items).","note":"No measurement. Several parts must be read and joined, so the saving is set at or below the similar-entry value."},{"id":"s_part","group":"mechanism","low":0,"high":0.4,"best":0.1,"tag":"G","source":"No source. Hint: same as s_comp.","note":"No measurement. With only some parts the cheap model must work out the rest, so the saving is set below the all-parts value."},{"id":"g_tests_visible","group":"gate","low":0.5,"high":0.95,"best":0.8,"tag":"G","source":"No source for a catch rate. Hints: R2 s1 (CI caught both mypy repeats; CI stayed green on both Expo pin failures); F2 s1 (SapFix: 131 of 165 patches passed tests, only 27 of 57 crashes fixed correctly).","note":"Hint. CI caught both mypy repeats but passed both Expo pin failures. In SapFix, passing tests alone let wrong patches through. No catch rate was counted."},{"id":"g_tests_latent","group":"gate","low":0.05,"high":0.5,"best":0.25,"tag":"G","source":"No source for a catch rate. Hint: R4 s1 (serious defect in 9 of 14 Opus-built slices at round-one review).","note":"Hint. Opus-built slices still had a serious defect found by round-one review in 9 of 14. The record does not split what tests had already passed from what review found."},{"id":"s_review","group":"gate","low":0.2,"high":1,"best":0.5,"tag":"G","source":"No source for the per-episode share. Hints: R4 s1 (every slice in the Clinic table had an Opus review); V2 (a reviewer on every PR).","note":"Measured per slice: every Clinic slice had an Opus review. A slice holds many episodes, so the share per gate pass is lower. Best value is a guess."},{"id":"g_review","group":"gate","low":0.3,"high":0.85,"best":0.65,"tag":"G","source":"No source for a catch rate. Hints: HB s3.3 (19 serious findings at round one; at least 5 more later, made by the fixes); R4 s1.","note":"Hint. Round one found 19 serious defects; at least 5 more appeared later, made by the fixes. What reviews missed was never counted, so no catch rate exists."},{"id":"c_review","group":"gate","low":2,"high":15,"best":5,"tag":"G","source":"No source for review length. Hints: R9 s1.2 (reviewer as a fresh agent of 3 to 7 calls); D7 s2 (reviewer 3 to 5 turns).","note":"Estimates only: a reviewer agent of 3 to 7 calls (R9) or 3 to 5 turns (D7). The length of an actual Opus review was not measured."},{"id":"rho_retry","group":"ladder","low":0.2,"high":0.6,"best":0.36,"tag":"G","source":"No source for one cheap retry. Hint: V2 table row R1 and HB s3.3 (Clinic: 64 % of reviews sent a slice back; 2.8 rounds per slice). R4 clinic-gates-out.txt read again in this run.","note":"Hint. 64 % of Clinic reviews sent a whole slice back, so a round passes 36 % of the time. Slices, not episodes; first and later rounds mixed; fixes mostly Opus-led."},{"id":"c_handoff","group":"ladder","low":1,"high":10,"best":3,"tag":"G","source":"No source for a price. Hints: R9 s1.2 (a fresh agent's first call is about 66k tokens); R1 s3.4 (opening exploration is 55 to 61 % of subagent tokens).","note":"Hint. A fresh agent starts at about 66k tokens, and 55 to 61 % of subagent tokens go on opening exploration. Neither prices one handoff in cheap calls."},{"id":"n_opus","group":"ladder","low":3,"high":35,"best":10,"tag":"G","source":"No source for calls per attempt. Hint: R5 s2 (Opus slice sessions: median 388 calls; Sonnet 283; different work).","note":"Hint. Calls per slice session: Opus median 388, Sonnet 283, on different work. No calls-per-attempt by tier exists. Set equal to the cheap attempt."},{"id":"n_fable","group":"ladder","low":3,"high":35,"best":10,"tag":"G","source":"No source. Hint: F3 s3 (Fable mostly ran long root sessions: 1,158 root calls in November).","note":"No measurement. Fable mostly ran long root sessions, not single attempts. Set equal to the cheap attempt, with the same wide range."},{"id":"m_opus","group":"ladder","low":2,"high":2,"best":2,"tag":"S","source":"Vendor price list supplied for this task (2026-11-12); F6 s(iv) (Opus 5.5 is 2 x Sonnet 5.5 per token, new and re-read).","note":"Vendor price ratio per token: Opus is 2 x Sonnet for new and re-read tokens. Assumes equal call size; slice sessions showed Sonnet calls twice as large."},{"id":"m_fable","group":"ladder","low":2,"high":4,"best":3,"tag":"S","source":"Vendor price list supplied for this task (2026-11-12); F6 s(iv) (Fable 5.2: 2 x Sonnet on re-read tokens, 4 x on new input and output).","note":"Vendor price ratio: 2 x Sonnet on re-read tokens, 4 x on new input and output. Best weights a typical call by its cost mix (my arithmetic: about 3.3)."},{"id":"o_opus","group":"ladder","low":0.15,"high":0.9,"best":0.55,"tag":"G","source":"No source for the conditional chance. Hint: F6 s(iii) and R4 s1 (vendor FrontierCode 1.1: Opus 54.4, Sonnet 46.2; Terminal-Bench 4.0: Sonnet ahead).","note":"Hint. From vendor scores: if Opus's failures sit inside Sonnet's, Opus fixes 15 % of Sonnet's failures; if independent, 54 %. The overlap is unknown."},{"id":"o_fable","group":"ladder","low":0.2,"high":0.9,"best":0.5,"tag":"G","source":"No source. Hint: R4 s1 (20 of 48 fix commits on main carry a Fable trailer; no failure rate by model exists).","note":"No measurement. Fable authored 20 of 48 fix commits on main, but no failure rate by model exists. After Opus fails what is left is harder, which pulls this down."},{"id":"w_write","group":"capture","low":0.2,"high":1,"best":0.45,"tag":"G","source":"No entry wa e high end allows a production incident."},{"id":"fix_on_found","group":"capture","low":0.05,"high":0.8,"best":0.3,"tag":"G","source":"No source for a chance. Hints: W L09-4 (a correction reached two files; verdicts.txt:30 still carries 742 s); W L10-2 (a refuted line was rewritten and still stands); W L08-2 (the record still says \"They can\").","note":"Hint. In three real cases a correction did not reach every stored copy: an old figure, a refuted line and a refuted claim all still stand. Three cases, no rate."},{"id":"delta_stale","group":"capture","low":0.01,"high":0.25,"best":0.05,"tag":"G","source":"No source for a rate. Hints: R3 s1 (the fix's own lines stay in main: 47 of 50 keep half or more); R10 s1.5 (fix footprint unchanged: 61 % at 1 day, 13 % at 30 days); R6 (value half-life 2 to 11 months, unmeasured).","note":"Hint. 3 of 50 fixes lost half their lines within about two months, yet 87 % of fix footprints changed within 30 days. One period is 30 days (brief R6)."},{"id":"episodes_per_period","group":"time","low":50,"high":1500,"best":300,"tag":"G","source":"No source for an episode count. Hints: R3 s1 and F3 s8 (FixFlow 233 non-merge commits in 64 days; Clinic 432 commits in 8 days); F2 s4 (20 hard encounters per 8 weeks).","note":"Hint. About 110 commits per 30 days in FixFlow, about 1,600 at the Clinic's pace, and 20 hard encounters per 8 weeks. An episode is not a commit; one period is 30 days."},{"id":"periods","group":"time","low":6,"high":36,"best":12,"tag":"G","source":"Run setting (map.json). Hints: R6 (mid-tier models arrive every 90 to 141 days; value half-life 2 to 11 months, unmeasured).","note":"A chosen horizon, not an unknown, and not drawn in the ensemble. 12 periods of 30 days is one year; mid-tier models arrive every 3 to 5 months.","run_setting":true,"integer":true}]},"lims":{"title":"Library limitations, merged and placed on the map","date":"2026-11-12","status":"Map evidence. No fixes, no verdicts. Built by docs/program/evidence/library-pathways/build-limitations.js.txt.","how_to_read":["Each item is one mechanism by which the library design falls short of its goal.","real.cases counts the walks (of 59) whose walker named this mechanism. real.families counts the ten pathway families those walks belong to.","The 59 real cases are a chosen sample of problem cases. A count shows that a route exists and where a step breaks. It never shows how often this happens.","Tag M: counted on this PC from the walk records. No number in this file is a rate.","contradicted lists families whose real cases showed the item did not happen or mattered less, with the cases on that side. The item stays in the list.","params are the map.json parameters through which the item acts in the model. An empty list means it acts through none.","merged_from counts the raw items absorbed: real-case breaks, plus titles from the two thought-experiment lists.","Items are sorted by main step, then by how many real cases showed them.","works lists places where the design worked or would have helped in a real case. Its figures (calls, days, messages) come from the walk records (tag M)."],"words":{"window":"what a model can see while it works: the conversation, files read, notes loaded.","entry":"one stored conclusion in the library.","tier":"a model level on the ladder: Sonnet (cheap), Opus, Fable (top).","helper window":"a short separate session (a subagent) started by a main session.","check":"whatever decides a result is right: tests, a review, a build, a rerun."},"counting":{"unit":"one walk = one real case (59 in all).","breaks_read":119,"rule":"A walk counts for an item when a break merged into the item names it in the *-walk.md Breaks section, or a quoted walk note shows it. Two items list an extra walk from a walk note.","per_break_differences":[{"break":2,"family":"L01","cases_hit":2,"walks_counted":3},{"break":7,"family":"L01","cases_hit":3,"walks_counted":4}],"per_break_differences_note":"L01 counts some breaks per case (C nges which entries are needed"]}},{"id":"LIM-67","key":"owner_corrections","main_step":10,"title":"The owner's corrections change and conflict over time","what":"The owner corrects direction, and later corrections can contradict earlier ones. Entries built on an older correction keep it after the owner has moved on.","steps":[10],"real":{"cases":0,"families":0,"tag":"M","family_ids":[],"case_ids":[],"examples":[]},"contradicted":[],"origin":"thought experiment only","params":["delta_stale","e_right"],"merged_from":1,"absorbed":{"breaks":[],"known_titles":[],"later_additions":["the owner's corrections change and conflict over time"]}},{"id":"LIM-68","key":"private_details","main_step":10,"title":"Private details travel with entries","what":"Entries carry paths, names, hosts and project details. When an entry is shared across projects or sessions, those details go with it.","steps":[10],"real":{"cases":0,"families":0,"tag":"M","family_ids":[],"case_ids":[],"examples":[]},"contradicted":[],"origin":"thought experiment only","params":[],"merged_from":1,"absorbed":{"breaks":[],"known_titles":[],"later_additions":["private details travel with entries"]}},{"id":"LIM-69","key":"untrusted_text","main_step":10,"title":"Untrusted text can become trusted memory","what":"Text read from a web page, a document or a tool result can end up inside a stored conclusion. Once stored, it is fetched with the authority of a checked entry.","steps":[9,10],"real":{"cases":0,"families":0,"tag":"M","family_ids":[],"case_ids":[],"examples":[]},"contradicted":[],"origin":"thought experiment only","params":["e_right","w_write"],"merged_from":1,"absorbed":{"breaks":[],"known_titles":[],"later_additions":["untrusted text becomes trusted memory"]}}],"works":[{"case":"L01:C3a","family":"L01","tag":"M","text":"A stored pdftoppm route served to the second wave would have saved 2 to 8 calls per agent across four Opus agents."},{"case":"L01:C4a","family":"L01","tag":"M","text":"One git flag with an exact at cost about 15M helper tokens."},{"case":"L07:L07-5","family":"L07","tag":"M","text":"A design 'no' stored with its reason held for five months and was never argued again."},{"case":"L10:L10-1a","family":"L10","tag":"M","text":"The design's scan for fixes not on the main branch fits June exactly: it removes one of build 15's two causes and 16 days of broken main."},{"case":"L10:L10-1b","family":"L10","tag":"M","text":"The empty-value check promoted into the shared test run blocks that mistake for every agent and human, with no lookup."}]},"cases":{"families":[{"id":"same-mistake","name":"Same mistake, new session","covers":"Errors on this PC that came back in later sessions, other projects and subagents."},{"id":"silent-defect","name":"Silent defect found later","covers":"Faults that passed every test and were found weeks later."},{"id":"build-new-from-old","name":"Building new beside old","covers":"New features built next to older ones that held the same hazard."},{"id":"vendor-build-deploy","name":"Outside vendor causes","covers":"Build and deploy failures caused by Expo, Railway, Docker and Windows."},{"id":"flaky-race-data","name":"Races and flaky failures","covers":"Failures that do not repeat on demand, or depend on timing and other processes."},{"id":"composite-merge","name":"Two correct pieces, one fault","covers":"Fixes that were right alone but wrong when merged."},{"id":"research-design","name":"Research and design cases","covers":"Research verdicts, plans and lessons that later proved wrong or ignored."},{"id":"cross-project","name":"Across projects","covers":"Facts learned in one project that another project needed."},{"id":"ladder-real-life","name":"The ladder in real life","covers":"Cases where top models made or endorsed the error."},{"id":"libraries-over-time","name":"Existing notes over time","covers":"How the owner's small libraries behaved as facts aged."}],"cases":[{"id":"f01-C1a","family":"same-mistake","title":"Python is missing on this PC","story":"A session found no usable python on this PC and wrote the fix down. Ten minutes after a compaction dropped the 'no Python' line, a top model typed a python heredoc again.","when":"First fix 2026-10-06; repeat 2026-11-01","source":"Clinic session 1f10835f; session e24f17dc line 2928","entry":"Python or python3 exits 49 (Microsoft Store stub). A real Python 3.12.14 sits in the Codex app folder. Call that full path, or use node or PowerShell for small JSON work. Check: the path with --version prints 3.12.14.","steps":[{"step":1,"status":"strains","note":"The window points toward Python, because CLAUDE.md names Python 3.12. A summary that said 'no Python' was replaced by one without it."},{"step":2,"status":"not_specified","note":"The design names no trigger. A shell tool error is not a listed trigger. Only the exit-49 result could start a lookup, after the call."},{"step":3,"status":"works","note":"The error text is word for word and easy to recognise."},{"step":4,"status":"works","note":"One entry matches exactly."},{"step":5,"status":"strains","note":"This is the main session. The entry is held until the next compaction, and this session already lost the fact once at a compaction."},{"step":6,"status":"works","note":"Swap python for the full path. A plain JSON script runs on 3.12."},{"step":7,"status":"works","note":"The rerun's exit code decides, at no cost."},{"step":8,"status":"not_reached","note":"The failing model is already the top rung. A stronger model would make the same call."},{"step":9,"status":"breaks","note":"Python was a side stumble. The design needs a fix commit and control pair, which a PC fact lacks. Memory got it 29 days later."},{"step":10,"status":"breaks","note":"The interpreter belongs to another app, which rewrote its folder on 2026-10-21. Newer Pythons arrived later. No repository event marks any of this."}],"worked":""},{"id":"f01-C1b","family":"same-mistake","title":"Python error, but this project uses uv","story":"A subagent typed bare python while its window held the project's 'uv run --locked python' route. It failed, then recovered with diff and grep on the next call.","when":"2026-11-09","source":"Clinic subagent agent-a87e4f07079fc62e5","entry":"Same as the python entry, or the memory line: python is not on PATH in Git Bash (Windows Store alias); use node for JSON.","steps":[{"step":1,"status":"strains","note":"The project's right route, uv run, was already in the window. The agent typed bare python anyway."},{"step":2,"status":"not_specified","note":"Same as before. No trigger fires before the call."},{"step":3,"status":"works","note":"The error text is the same word for word."},{"step":4,"status":"strains","note":"Same error, different right answer. The entry says node or Codex 3.12. This project uses uv with locked 3.13 packages."},{"step":5,"status":"works","note":"The subagent window holds it for its short life."},{"step":6,"status":"strains","note":"Fine for a JSON compare. For anything that imports project code it points to the wrong interpreter and away from uv run."},{"step":7,"status":"works","note":"The result is immediate."},{"step":8,"status":"not_reached","note":"The agent is already Opus."},{"step":9,"status":"not_specified","note":"No rule says whether the clinic variant is stored as a sibling, a revision, or not at all."},{"step":10,"status":"breaks","note":"Two project memories disagree about one PC. EMS says use node for JSON. The clinic says uv run python. The design has no project field."}],"worked":""},{"id":"f01-C1c","family":"same-mistake","title":"A stored 'no' about tools that exist","story":"A design note said no Python and no gh. Six minutes later gh was installed. Python had been in use since 10-06. Clinic memory later stored 'no uv', then uv was installed.","when":"2026-10-31 to 2026-11-02","source":"Commit 53f3a5c, ORCHESTRATION-DESIGN line 39; HARNESS-REVIEW line 276","entry":"No Python and no gh on this PC. Design around them. Run backend gates only in Docker.","steps":[{"step":1,"status":"works","note":"A session planning work here would look up which tools exist."},{"step":2,"status":"not_specified","note":"No error occurs when an agent avoids a tool it wrongly believes is missing."},{"step":3,"status":"strains","note":"'Is there Python?' is a plain-language question. Only plain-language handles could match it."},{"step":4,"status":"works","note":"The entry is returned. That is the problem."},{"step":5,"status":"works","note":"Any window can hold it."},{"step":6,"status":"breaks","note":"The cheap model designs around tools that exist, such as Docker-only gates. Nothing it does fails."},{"step":7,"status":"breaks","note":"A stored 'no' never fails loudly. The agent just does not try. Only a separate review caught it on 11-01."},{"step":8,"status":"not_reached","note":"There is no failure to hand up."},{"step":9,"status":"breaks","note":"The writer checked PATH only. It wrote 'no gh' six minutes before installing gh, and 'no Python' while Python had been in use since 10-06."},{"step":10,"status":"breaks","note":"gh arrived 10-31 and uv 11-02. Corrections landed separately in a doc, a memory note and the design. The clinic copy is stale."}],"worked":""},{"id":"f01-C2a","family":"same-mistake","title":"Bash cuts long heredoc commands","story":"Bash commands over about 8 KB fail with an unexpected-EOF error and write nothing. Four later moments repeated it, once by the note's own writer a day after writing it.","when":"First 2026-10-31; repeats to 2026-11-12","source":"Session e24f17dc; sessions 701c2346, agent-ac87b78","entry":"Bash cat heredoc fails 'unexpected EOF while looking for matching quote' at about 9,800 characters, and the file is not written. The tool cuts long commands. Write the file with the Write tool. Dead end: re-sending the heredoc.","steps":[{"step":1,"status":"strains","note":"The entry is in the window, pushed at start. So is the Bash tool's own advice to use a heredoc. They pull opposite ways ix seconds apart. No sibling could finish, record and serve another in time."},{"step":6,"status":"not_reached","note":"Nothing was delivered."},{"step":7,"status":"works","note":"The result is immediate."},{"step":8,"status":"not_reached","note":"All agents were Opus."},{"step":9,"status":"not_specified","note":"Four equal solvers of one stumble. The design does not say who writes, or how four near-duplicates merge."},{"step":10,"status":"not_reached","note":"No entry was written."}],"worked":""},{"id":"f01-C3a","family":"same-mistake","title":"Read cannot open PDF pages here","story":"Read on a PDF failed because pdftoppm is missing. The parent found a PowerShell route. Five hours later four new Opus agents hit the same error, because the briefs never mentioned PDFs.","when":"2026-10-16 to 2026-10-17","source":"Session e56a900a, parent and wave-2 agents","entry":"Read with pages on a PDF fails: pdftoppm is not installed. Python is the Store stub. Route: PowerShell reads the bytes, inflates FlateDecode streams and pulls the text. Works for the 41-page Google Docs PDF. Avoid the reserved variable $PID.","steps":[{"step":1,"status":"strains","note":"The brief, written by a parent that knew, has no word 'pdf'. Wave 1 hit the error four seconds before the parent did."},{"step":2,"status":"not_specified","note":"A Read tool error is not on the list of triggers."},{"step":3,"status":"works","note":"The error text is word for word."},{"step":4,"status":"works","note":"This works if the parent's route was stored by 14:16Z."},{"step":5,"status":"works","note":"The subagent window holds it."},{"step":6,"status":"strains","note":"Some agents found cheaper pre-extracted text. The entry may pull toward the costlier route."},{"step":7,"status":"works","note":"Text appears or it does not."},{"step":8,"status":"not_reached","note":"Parent and children were all Opus and all failed alike."},{"step":9,"status":"breaks","note":"It was solved as an aside, with no mid-session capture point. Wave 2 started 5.5 hours later with nothing written. No note ever recorded pdftoppm."},{"step":10,"status":"strains","note":"The route depends on how the PDF was made. Pre-extracted text exists for some files in one project only."}],"worked":""},{"id":"f01-C3b","family":"same-mistake","title":"PDF route, in another project, a month on","story":"Research subagents read saved PDFs. The brief named the Codex Python. A Sonnet agent extracted the text in two calls using pypdf. An Opus agent gave up on the PDF.","when":"2026-11-12","source":"Session e24f17dc, workflow wf_548351eb-ab1","entry":"The PDF entry from the previous case: PowerShell inflate, or the clinic's pre-extracted text folder.","steps":[{"step":1,"status":"works","note":"The brief carried a PC fact that was half of the answer."},{"step":2,"status":"not_specified","note":"Same as the previous case."},{"step":3,"status":"works","note":"The error text is word for word."},{"step":4,"status":"strains","note":"It returns the clinic route. Its text folder does not exist in this repository, and inflate fits some PDFs only."},{"step":5,"status":"works","note":"The subagent window holds it."},{"step":6,"status":"strains","note":"The best route needs the PDF entry joined with the Python fact. Sonnet made the join unaided. Opus gave up on the source."},{"step":7,"status":"works","note":"Pages of text appear or they do not."},{"step":8,"status":"not_reached","note":"Sonnet solved it. Opus did not."},{"step":9,"status":"not_specified","note":"Who records the pypdf route, as a sibling or a revision, is not said."},{"step":10,"status":"breaks","note":"pypdf lives in another app's private runtime, which that app rewrote on 10-21. A stored path to it can change with no event here."}],"worked":""},{"id":"f01-C4a","family":"same-mistake","title":"Git 'Filename too long' in the scratchpad","story":"Refuters cloning repos in the scratchpad hit Windows' 260-character path limit. Six refused alone on 11-03. Next day 15 of 15 ,"note":"The error words name a path. The cause is command length. The query carries the wrong cause."},{"step":4,"status":"breaks","note":"'name too long' is a piece of 'Filename too long'. The design matches template fragments, so the git entry is the hit."},{"step":5,"status":"works","note":"The match works mechanically."},{"step":6,"status":"breaks","note":"The git flag cannot shorten a 40k command. A shorter scratchpad path does not either."},{"step":7,"status":"works","note":"The rerun fails again, one wasted call before real diagnosis."},{"step":8,"status":"not_reached","note":"No escalation happens."},{"step":9,"status":"strains","note":"The agents' own fix, shorter commands and then Write, was never recorded."},{"step":10,"status":"strains","note":"After the path change the git entry is stale for its own symptom, yet still matches this one."}],"worked":""},{"id":"f01-C5","family":"same-mistake","title":"A constant-time compare copied to a webhook","story":"The ops token gate used hmac.compare_digest on text. Seven days later the same pattern guarded the WhatsApp webhook. A non-ASCII byte turns it into a server error. Review found it 20 days on.","when":"2026-07-01 stored; 2026-07-08 copied; found 2026-07-28","source":"Commits bfb5714, 834311f, 2fe77f5","entry":"Ops proxy-token gate. A FastAPI dependency reads X-Ops-Proxy-Token. 401 if unset. Constant-time compare with hmac.compare_digest(x or '', expected). 401 on mismatch. Router tests for right, wrong and missing token pass.","steps":[{"step":1,"status":"works","note":"The later author had the ops gate file in the repository either way."},{"step":2,"status":"breaks","note":"Nothing failed. Writing new code is not a trigger. The diff warning fires only on stored hazards, and none existed before 07-28."},{"step":3,"status":"strains","note":"If asked, 'constant-time compare of a webhook token' is a plain-language query."},{"step":4,"status":"breaks","note":"It returns the ops gate solution, which contains the defect, stored as solved by a top model."},{"step":5,"status":"works","note":"The match works mechanically."},{"step":6,"status":"breaks","note":"Copying the stored pattern spreads the defect to a public webhook. That is what happened without a library."},{"step":7,"status":"breaks","note":"Tests passed. Output equal to the strong model's was the defect."},{"step":8,"status":"breaks","note":"Both writers were the top rung of their day. The bug surfaced only through a later review."},{"step":9,"status":"works","note":"The 07-28 fix is a clean capture: a safe helper, tests and a CLAUDE.md rule. It can be stored as a do-not-apply entry."},{"step":10,"status":"strains","note":"compare_digest also fires on the safe PIN check. Stored tests cover three fixed sites, not a new one."}],"worked":""},{"id":"f01-C6","family":"same-mistake","title":"Subagents refused report files","story":"A clinic note said subagents cannot write report files. Eleven days later in EMS, eight subagents were refused for report.md, while 22 other .md files and 156 .js files were written fine.","when":"2026-11-01; repeated 2026-11-12","source":"Clinic memory note 11-01; session e24f17dc 11-12","entry":"Subagents cannot write report files; the harness refuses. Ask them to return the full result in their reply. Earlier Sonnet extractors did write files, so the refusal may depend on agent type or output size.","steps":[{"step":1,"status":"strains","note":"The brief, written by the main session, asks for report.md."},{"step":2,"status":"breaks","note":"The error fires in the subagent. Its cause is the brief in the main session, which sees no error and has no trigger."},{"step":3,"status":"works","note":"The error text is word for word."},{"step":4,"status":"strains","note":"The entry's condition, agent type or output size, is wrong. The record points to the file name."},{"step":5,"status":"breaks","note":"It is delivered to the one window that cannot change the brief."},{"step":6,"status":"works","note":"Return text. The error message already says so, so the library adds nothing."},{"step":7,"status":"works","note":"The result is immediate."},{"step":8,"status":"not_reached","note":"No escalation happens."},{"step":9,"status":"strains","note":"It was captured the same day but too broadly. The writer had two refusals and one counter-example and could not tell which detail mattered."},{"step":10,"status":"breaks","note":"Read as 'subagents cannot write files', it would push other file writes into replies too."}],"worked":""},{"id":"f02-C1","family":"silent-defect","title":"A queued 'ready' could reopen a billed job","story":"Job status changes never read the current status. A queued 'ready' replayed after a close reopened a settled, billed job. Tests were green. A technician noticed in production weeks later.","when":"Landed 2026-06-07; found 2026-07-27","source":"Commits 187ebb1, 383dea7, f440222 (PR #162)","entry":"Job lifecycle. Append-only job_event rows. POST /jobs/{id}/transition with action ready, close, abandon, reschedule or haul. Each action updates the job and appends an event. Check: 7 service tests, 4 router tests, 2 real-database tests.","steps":[{"step":1,"status":"strains","note":"A later session got 'wire the bill sheet', which is a task. Nothing in its window says a button can strand a job."},{"step":2,"status":"breaks","note":"Tests were green. Nothing failed, so nothing asks. The first signal was a technician in production weeks later."},{"step":3,"status":"breaks","note":"Any query names the task, not the hazard of a 'ready' replayed after 'close'."},{"step":4,"status":"breaks","note":"'transition' and 'ready' match the old entry, which is the defect. The correct pattern is filed under money words and does not match."},{"step":5,"status":"not_specified","note":"The design does not say whether the entry goes to the session or to a subagent writing one screen."},{"step":6,"status":"breaks","note":"Adapting the old entry reproduces 'dispatch on the action alone'. Nothing in it says to read the current status."},{"step":7,"status":"breaks","note":"The old checks test each transition from one state. The every-action-from-every-status matrix came only with the fix. The stored check passes the copy."},{"step":8,"status":"breaks","note":"No model failed. A technician noticed. The failing parts were written by top models."},{"step":9,"status":"strains","note":"Next day a red-team found its freeze parked landed writes as conflicts. Recording before the PR is ready stores the half-right version."},{"step":10,"status":"breaks","note":"The 07-08 dispatcher handler predates the freeze and never stamps the bill-sent time. A new entry does not look back at existing code."}],"worked":""},{"id":"f02-C2","family":"silent-defect","title":"Evidence gate passed with zero bytes","story":"A size check swallowed every error and returned 'unknown', so a technician could satisfy the evidence gate without uploading anything. Tests defaulted to 'unknown' and stayed green for 52 days.","when":"Landed 2026-06-06; found 2026-07-28","source":"Commits ca362c0, 2cf95b8, aa4f589 (PR #164)","entry":"Upload size ceiling for pre-signed uploads. At finalize, read the real size with HEAD. Reject anything over the ceiling. A missing object or a temporary error returns None so the caller can fall back to the client's reported size.","steps":[{"step":1,"status":"strains","note":"'Harden media uploads' is a task. The evidence gate's integrity is not named in it."},{"step":2,"status":"breaks","note":"The test fixture defaults to 'unknown' and the suite is green. Nothing fails, so nothing looks up."},{"step":3,"status":"works","note":"The task's own words, upload, size and R2, find the entry. Retrieval works and delivers the defect."},{"step":4,"status":"breaks","note":"Same problem, exact match, wrong answer. The stored text states the mix-up as the design."},{"step":5,"status":"not_specified","note":"The design does not say which window receives the entry."},{"step":6,"status":"breaks","note":"The cheap model copies 'fall back on None', which the entry calls safe."},{"step":7,"status":"breaks","note":"The handoff says the no-bytes case was the tested default and nothing asserted existence. The stored check certifies the copy."},{"step":8,"status":"breaks","note":"No visible failure for 52 days. An adversarial audit found it. Nothing climbs."},{"step":9,"status":"strains","note":"The fix rule, None means unknown, never zero, is good. Captured at the first commit, it omits the selfie caller found an hour later."},{"step":10,"status":"strains","note":"The handle head_size fires on later diffs to that symbol. The same shape in other words, the mobile bare catch, is a word-level miss."}],"worked":""},{"id":"f02-C3","family":"silent-defect","title":"Switching on WhatsApp sending","story":"The entry said the dispatcher is safe to switch on. Switching it on would send the whole job history: 36 real messages about months-old jobs. Suppressed rows are permanent.","when":"Built 2026-07-08; found 2026-08-01","source":"Commits d1f78cd, 834311f, c731e66","entry":"Customer messages through a transactional outbox. A cursor per consumer drains events in order. The WhatsApp consumer is consent-gated and log-only while settings are empty, so enable_dispatcher stays safe to flip.","steps":[{"step":1,"status":"strains","note":"'Turn on WhatsApp Cloud sending' is one settings edit, no code. The owner's design speaks of problems a model solves."},{"step":2,"status":"strains","note":"Nothing fails before the flip. The flip is the failure. The other design has a route for actions. The owner's design names none."},{"step":3,"status":"works","note":"'Enable dispatcher' is the entry's own phrase."},{"step":4,"status":"breaks","note":"It returns the stored conclusion 'stays safe to flip', at the one moment it can do harm."},{"step":5,"status":"not_specified","note":"The design does not say which window receives the entry."},{"step":6,"status":"breaks","note":"Acting on it sends the whole history, and suppressed rows are permanent."},{"step":7,"status":"breaks","note":"No check can say 'safe to flip'. Nothing tested the seed or the age guard. A review found a test that pinned the consent leak."},{"step":8,"status":"breaks","note":"The author was a top model. Nowhere higher to send it. Later audits found it."},{"step":9,"status":"strains","note":"The fix would be stored. But the 08-01 review found three defects inside the fix branch. 'Solved' was the reviewer's call."},{"step":10,"status":"works","note":"After the fix, the action handle is the stated only route to operator hazards. It reaches the next operator."}],"worked":"The correction, once stored, reaches the next operator before an env flip. That avoids a mass-message incident."},{"id":"f02-C4","family":"silent-defect","title":"Login lock that blocks a correct PIN","story":"A strong model built a self-healing lock. An audit prescribed a different fix. A third strong model said the audit's fix opens 4-digit PIN guessing. Only an owner decision settled it.","when":"Built 2026-07; settled with owner later","source":"Commits 0a40416, f3dfa6f; HANDOFF A2","entry":"Login lockout. Five failures lock 30 seconds, doubling to a 15-minute cap, always self-healing. A correct PIN during a lock returns 429. Counter survives the error. Per-IP window behind the database lock.","steps":[{"step":1,"status":"works","note":"'Fix HANDOFF A2' is a stated problem with file and line. Here the task is a problem."},{"step":2,"status":"works","note":"Applying a fix that a document prescribes is a trigger in the other design."},{"step":3,"status":"works","note":"The words line up: lock, correct PIN, 429."},{"step":4,"status":"breaks","note":"Before the settling commit both hits are wrong. Each came from a strong model and passed its own check."},{"step":5,"status":"not_specified","note":"The design does not say which window receives the entry."},{"step":6,"status":"breaks","note":"Applying A2 inverts two tests and opens 4-digit PIN brute force, finished in under an hour by a handful of IPs."},{"step":7,"status":"breaks","note":"Inverted tests pass. Three strong outputs, two positions. Only an owner decision settled it. 'Equal to the strong model' has no single target."},{"step":8,"status":"breaks","note":"The wrong fix is silent too. The audit was already a strong-model product. Climbing reaches the tier that wrote it."},{"step":9,"status":"works","note":"The settling commit is a model capture: reason, owner decision and comments on both tests. It can be stored as do-not-apply with owner confirmation."},{"step":10,"status":"works","note":"A document reference on A2 stops the next agent. CLAUDE.md already says so. The clinic's check held the same rule."}],"worked":""},{"id":"f02-C5","family":"silent-defect","title":"Opening cutoff rules for cash, pay and stock","story":"A rule passed its own tests and an Opus review. Three later root reviews found a double count, a hold that never released, and more. Two correct rules looked like either-or.","when":"2026-11-05","source":"Cutoff-guards session G10-20; transcript 97380a1e; GC-01, GD-01, GE-03","entry":"Opening cutoff guards. One registry of cutoffs, readers per subject. Cash: opening is the balance at the end of the cutoff day. Refuse postings on or before it. Stock: opening is the count when the batch posts. Check: cutoff tests green.","steps":[{"step":1,"status":"strains","note":"G10-20 is a stated gap. Whether stock follows cash on the cutoff day was not known to be a question until GC-01 asked it."},{"step":2,"status":"breaks","note":"Session tests and its own review passed. Nothing failed until a separate root review, three rounds running."},{"step":3,"status":"strains","note":"Good words exist. The deciding detail, an import posted on the count day, is in no query."},{"step":4,"status":"breaks","note":"It returns a refuted cutoff rule or the half-right stock rule. Two rules, right on different sides, look like either/or."},{"step":5,"status":"strains","note":"The finding arrived at 366,229 tokens. The next call read 87,658 after compaction. A fetched entry rides into a summary."},{"step":6,"status":"strains","note":"The round-1 fix added a hold. Round 2 found the hold never released. Adapting the rule to new state made a new P1 defect."},{"step":7,"status":"breaks","note":"Two Opus reviews read the same code and disagreed. The in-session test asserted the double count as correct."},{"step":8,"status":"breaks","note":"All work was Opus. The working ladder was a root review per round. Nothing failed visibly, so nothing escalated by itself."},{"step":9,"status":"breaks","note":"Which version is the entry: own review, round 1 or round 2? The first rule's reasoning was compacted before the finding arrived."},{"step":10,"status":"works","note":"The final rule, end of cutoff day for cash, pay and stock, carried unchanged into the real-data switch."}],"worked":"The final rule carried unchanged into the 2026-11-10 real-data switch, reused without re-derivation."},{"id":"f02-C6","family":"silent-defect","title":"Correction form opened blank over a real bill","story":"'Correct the completion' opened a blank form. The server rewrites the bill from the payload, so a blank submit destroyed the bill. A bare catch treated 'offline' and 'no completion' as the same answer.","when":"2026-07-27; found a day later","source":"Commit 37821f5; fix 8dafcec, da988e2","entry":"Completion correction form must not wipe a bill. Load the existing completion and prefill materials, time and remarks. If the fetch fails, return: offline, a blank first completion is still valid. Check: mobile tests green.","steps":[{"step":1,"status":"works","note":"A stated problem: a blank form wipes a bill."},{"step":2,"status":"breaks","note":"Tests were green. Nothing fails. The app has no screen-test harness."},{"step":3,"status":"strains","note":"A query would say prefill, offline. The sement' shares words with the ledger entry. No query asks whether two requests can stack."},{"step":4,"status":"strains","note":"Four partial matches come back. The other design shows at most one lead and one candidate, so pieces drop out."},{"step":5,"status":"works","note":"The main session pulls the cards into its own window. One session builds the slice."},{"step":6,"status":"breaks","note":"The working step, a pre-minted client id that becomes the ledger row's id, is in no entry."},{"step":7,"status":"breaks","note":"544 unit and 7 integration tests passed. The stacking race and auto-approve failure were invisible. An Opus audit added guards next day."},{"step":8,"status":"not_reached","note":"Nothing failed during the task, so nothing was handed up. The fixes came from a later audit outside any ladder."},{"step":9,"status":"breaks","note":"Stored at 'solved', the entry holds the half-right design. The other design's write rule would store nothing. The owner's rule stores the flawed version."},{"step":10,"status":"breaks","note":"Turning a pay setting on makes the %-of-accrued cap non-binding. The naming rule does not say which style a new key follows."}],"worked":""},{"id":"f03-C2","family":"build-new-from-old","title":"Latest-row-wins ordering by created_at","story":"Two writes in one transaction tie on created_at. A real-Postgres CI test caught it in 14 minutes. Four hours later the new rule pointed the next table, 0041, the wrong way.","when":"2026-07 (migrations 0027 and 0041, same evening)","source":"Commits 0027, 12c16f1; CI run 17:23 to 17:37","entry":"job_event.seq gives a total order: backfill with row_number, create a sequence, then NOT NULL and UNIQUE. Also: latest-row-wins tables must not order by created_at, because now() ties inside one transaction. Use a monotonic seq.","steps":[{"step":1,"status":"works","note":"The task, CLAUDE.md and tenancy code held the pattern. The seq pattern lived in 0027's code."},{"step":2,"status":"strains","note":"Nothing triggers while designing. The CI failure is a trigger, so a lookup runs only after one CI round."},{"step":3,"status":"breaks","note":"'Latest row wins per key' shares little with 0027's words. The CI error is a value assertion and names neither now() nor created_at."},{"step":4,"status":"breaks","note":"0027's entry is the right neighbour but gives no reason against created_at. At 0041 the fresh entry is a wrong match."},{"step":5,"status":"works","note":"The main session is where the design happens."},{"step":6,"status":"breaks","note":"At 0041 'use a DB sequence' breaks the chain: gaps on rollback, no hash link. 'Never created_at' flags 0041's backfill, which is correct."},{"step":7,"status":"works","note":"The real-Postgres CI test caught the tie in 14 minutes. The check reproduces the cause."},{"step":8,"status":"strains","note":"A cheap model facing a wrong-value assertion would escalate. The strong model fixed it in 14 minutes in one commit. Any rung costs more."},{"step":9,"status":"strains","note":"The other design stores nothing here. The owner's rule stores it, and its general form is too broad for 0041 four hours later."},{"step":10,"status":"breaks","note":"Within four hours the entry points the next table the wrong way on both its seq and its backfill order."}],"worked":"The real-database test caught the tie in 14 minutes, with a check that reproduced the cause."},{"id":"f03-C3","family":"build-new-from-old","title":"WhatsApp consumer on an old outbox cursor","story":"The new real sender used an old rule: a missing cursor starts at zero and drains all history. Nothing failed while the dispatcher was off. An audit found it 20 days later.","when":"2026-07-08 built; found 2026-07-28","source":"Migrations 0027 and 0034; commit da988e2; HANDOFF line 303","entry":"Transactional outbox. job_event.seq gives a gap-free global order. dispatch_cursor holds one row per consumer. run_dispatch_once reads past last_seq and advances only past accepted events. A scheduler runs it behind enable_dispatcher, default OFF. The WhatsApp consumer is log-only for now.","steps":[{"step":1,"status":"works","note":"0034 was built the same day as 0027, both by Fable. The dispatcher code was fresh."},{"step":2,"status":"breaks","note":"Nothing fails, because the dispatcher is off. No trigger exists for 'a new consumer on an old cursor'."},{"step":3,"status":"breaks","note":"The builder asked about double-send on replay. The hazard answers a different question: what does the first run do with history?"},{"step":4,"status":"strains","note":"It returns 0027's entry, the right neighbour, without the start-from-zero warning. That is harmless for a log-only consumer."},{"step":5,"status":"works","note":"The main session window holds it."},{"step":6,"status":"breaks","note":"The hazard exists only in the merge: an old default, a new real sender and a permanent first decision per job and kind."},{"step":7,"status":"breaks","note":"Nothing tested a first run against history. An audit found it 20 days later. The fix landed after 24 days."},{"step":8,"status":"not_reached","note":"No failure was visible, so nothing went up. The finder was a later audit."},{"step":9,"status":"breaks","note":"The stored conclusion would be 'enable_dispatcher stays safe to flip'. That is wrong, and fetched by anyone about to flip it."},{"step":10,"status":"strains","note":"After 0046 the other design has an action handle, and diff warnings that fired on 13 of 154 past commits."}],"worked":""},{"id":"f03-C4","family":"build-new-from-old","title":"Database locks that were too weak","story":"Slice sessions copied an item lock and a 32-bit hash lock. Deadlocks were retried silently. An Opus review and a staging drill found the faults. The kernel later went 64-bit but two copies stayed 32-bit.","when":"Built early November 2026; fixes up to 2026-11-06","source":"Slice sessions S01, S03, S04, S07; D04-06; F-S02-2","entry":"Kernel run_command: one transaction per command. Keys serialized with pg_advisory_xact_lock and hashtext. Retry only on 40001/40P01, at most three times. Open item: hashtext is 32-bit, so a collision serializes unrelated keys. Item lock is select_for_update.","steps":[{"step":1,"status":"strains","note":"Slice sessions open on large context. S07 read 392,125 characters in nine minutes before its lock. S04 averaged about 231k cached tokens per call."},{"step":2,"status":"breaks","note":"Writing a lock raises no error. The kernel retries deadlocks. select_for_update is too common to pass the selectivity gate."},{"step":3,"status":"strains","note":"'Lock the item before posting' finds a lock of the right shape and wrong strength."},{"step":4,"status":"breaks","note":"The best matches are the defect sources. The sibling is the problem."},{"step":5,"status":"works","note":"The row entered S07's main window nine minutes before the copy, with no compaction between."},{"step":6,"status":"breaks","note":"S07 wrote the 32-bit lock anyway. The row said 'P3' and named an owner elsewhere. S04 wrote the item lock row FOR UPDATE."},{"step":7,"status":"breaks","note":"Tests pass, and deadlocks are retried. An Opus review found S04's deadlock by tracing. A staging drill found the hash collision."},{"step":8,"status":"strains","note":"The higher tier caught it as a diff reviewer, not because the builder failed and handed up. The builder never knew."},{"step":9,"status":"works","note":"S04 wrote a decision record and a conventions line the same day, naming the sites still wrong. The conventions file did the capture."},{"step":10,"status":"breaks","note":"S03 merged before S04 learned the rule, and was fixed five days later. The kernel went 64-bit on 11-06. Two copies are still 32-bit."}],"worked":"The slice's own conventions file captured the rule the same day."},{"id":"f03-C5","family":"build-new-from-old","title":"Mobile offline queues after the jobs outbox","story":"The first outbox deleted any write answered with a non-network error. Later queues copied the lesson. The presence queue lacked a 4xx test for three days. Shared code then fixed it.","when":"2026-06-30 to 2026-07-12","source":"Commits 60c026d, e48c3b4, 436e180, c27bb39","entry":"Mobile outbox v2. A definitive 4xx goes to a visible failed list with Retry or Discard, never auto-deleted. 5xx, 429 and timeouts retry. 401 pauses the queue until re-login. Tag each item with the signed-in tech.","steps":[{"step":1,"status":"works","note":"The presence task and attendance code were in the window. The outbox lesson lived in the outbox code and the commit body."},{"step":2,"status":"breaks","note":"Nothing fails. A 403 or 422 leaves a 'pending' badge forever with no error to look up."},{"step":3,"status":"works","note":"The builder's words, 'offline presence outbox', share 'offline' and 'outbox' with the entry."},{"step":4,"status":"strains","note":"Presence and punches have the same contract. Pings are similar but not the same, because they are droppable by design."},{"step":5,"status":"works","note":"The main session holds it."},{"step":6,"status":"strains","note":"Pings must drop it while 401 still stops the drain. The ping author broke the rule on purpose, not the classification."},{"step":7,"status":"breaks","note":"Jest tests with a mocked network passed, but none sent a 4xx. The ping gap was found five hours later."},{"step":8,"status":"not_reached","note":"No failure was visible, so nothing went up."},{"step":9,"status":"works","note":"c27bb39 turned the lesson into shared code. CLAUDE.md states the contract and its two droppable exceptions."},{"step":10,"status":"works","note":"Later queues imported the shared check from their first commit and chose park or drop correctly."}],"worked":"Later queues reused the shared classification from their first commit and chose park or drop correctly."},{"id":"f04-C1","family":"vendor-build-deploy","title":"Sentry plugin breaks the EAS Android build","story":"Adding the Sentry plugin to app.json broke the cloud Gradle build. CI only runs a JavaScript export, so it stayed green. The fix came from comparing with an earlier working build on a side branch.","when":"2026-06-26","source":"Commits 6928828, b7a5b98, a6f9048","entry":"Trap. EAS Android build errors in 'Run gradlew' after the Sentry package was added to app.json plugins. The plugin adds a Gradle upload step that needs an auth token. Remove it from plugins. The SDK still autolinks. CI cannot see this.","steps":[{"step":1,"status":"strains","note":"Opus 4.8 held the failure and the repo. The decisive fact, that build 14 came from a side branch, was in no window."},{"step":2,"status":"works","note":"'Before retrying a failed build or deploy' fires."},{"step":3,"status":"strains","note":"The query is the build log, which reaches a session only when the owner pastes it. The commit quotes only an error code."},{"step":4,"status":"strains","note":"An earlier entry comes back as a candidate or as a lead. Nothing exists for the later version bumps."},{"step":5,"status":"works","note":"One card in the calling window, at most 2,000 characters."},{"step":6,"status":"works","note":"Remove one string from app.json plugins. Nothing to adapt."},{"step":7,"status":"breaks","note":"The real check is the next EAS build, which fails again on three version bumps."},{"step":8,"status":"strains","note":"The second failure escalates with only a lookup id. Opus needs a new pasted log and the build-14 comparison. Neither travels in the brief."},{"step":9,"status":"works","note":"The fix meets the write rule, because a build was burned. The version-bump cause is stored as a separate pin."},{"step":10,"status":"works","note":"A phase-close scan labels a stranded fix 'fix not on main'. The auth-token precondition is an EAS-side secret and can never be probed."}],"worked":""},{"id":"f04-C2","family":"vendor-build-deploy","title":"Empty env value rejected by eas.json","story":"A build profile carried an empty Sentry DSN meant as
