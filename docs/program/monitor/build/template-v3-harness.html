.pc.lit{background:var(--work);border-color:var(--work);color:#fff;font-weight:600}.pc.faint{opacity:.5}.pc.ringr{box-shadow:0 0 0 2px var(--bad)}.pc.ringa{box-shadow:0 0 0 2px #e0a92e}.pc.psel{outline:2px solid var(--ink);outline-offset:1px}

.rk-hook{background:#1f8a4c}.rk-script{background:#2563a8}.rk-both{background:linear-gradient(135deg,#1f8a4c 50%,#2563a8 50%)}.pc.noton{background:#fdf2d8;border:1px dashed #d49a1c;color:#8a5a00}.sc.rl-noton{border-color:#d49a1c;background:#fdf2d8}.pc.norec{border-style:dotted}.orl{max-height:300px;overflow:auto;font-size:12.5px}.orl div{padding:2px 0;border-bottom:1px solid #eef0f3;word-break:break-all}.orl span{color:#5d6878}.lnk{color:var(--work);cursor:pointer;text-decoration:underline}.rk-none{background:#fff;border-color:#8a93a1!important}.rq.pm i:not(.on){opacity:.3}.rq i.on{outline:2px solid var(--ink);outline-offset:1px}

<div id="app">
 <div class="pane" id="top"><span id="pill"></span><span id="sum"></span><span class="sp"></span>
  <span class="grp">View <span class="vg"><button class="b" data-view="time">Over time</button><button class="b" data-view="harness">Harness</button></span></span>
  <span class="grp">Show <button class="b" data-win="12">Last 12 h</button><button class="b" data-win="48" title="In the live page this opens at the moment you last looked">Since I last looked</button><button class="b" data-win="all">Everything</button></span>
  <span class="grp lensg">Colour by <button class="b" data-lens="state">State</button><button class="b" data-lens="harness">Method in use</button><button class="b" data-lens="tokens">Tokens</button><button class="b" data-lens="time">Time</button><button class="b" data-lens="window">Window size</button></span></div>
 <div class="pane" id="over"></div>
 <div class="pane" id="mapp"><div id="mapw"><div id="map"></div></div><div id="leg"></div><div id="hv"><div id="hm"></div></div><div id="selchip"></div></div>
 <div id="side"><div class="pane" id="need"></div><div class="pane" id="head"></div><div class="pane" id="feed"></div><div class="pane" id="hsum"></div><div class="pane" id="partp"></div></div>
 <div class="pane" id="har"><h4>Is the method in use <span style="text-transform:none;letter-spacing:0;font-weight:400">· each step of a session's life, across the sessions shown · point at a step to see which sessions skipped it</span></h4><div id="stg"></div></div>
 <div class="pane" id="sess"></div>
</div>
<div id="drawer"><button class="x" onclick="closeD()">×</button><div id="dbody"></div></div>
<script>
const D = /*DATA*/null;
const S = D.sessions.filter(s => s.nCalls || s.wraps.length), byId = Object.fromEntries(S.map(s => [s.id, s])), NOW = D.made, LIVE = 4 * 60000, HR = 3600000;
const qs = new URLSearchParams(location.search), T0 = Math.min(...S.map(s => s.t0));
let lens = qs.get('lens') || 'state', to = NOW, from = qs.get('win') === 'all' ? T0 - HR : NOW - (+qs.get('win') || 48) * HR, sel = qs.get('sel'), hl = null, hlKey = null, part = qs.get('part') || null, view = qs.get('view') || (() => { try { return localStorage.getItem('mon.view'); } catch (e) { return null; } })() || 'time', winKey = qs.get('win') || '48';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND = /^(orchestrate-deep|orchestrate|analyse|build-invariant|build|refute|read|collect|run|extract|locate|test):\s*/;
const name = s => { const n = (s.title || 'Untitled session').replace(/\s*\([a-z]\w*-\d{4}\)/g, '').replace(KIND, ''); return n.charAt(0).toUpperCase() + n.slice(1); };
const first = t => { const m = /^(.*?[.!?])(\s|$)/.exec(t || ''); return m ? m[1] : (t || ''); };
const tok = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + ' M' : n >= 1e3 ? Math.round(n / 1e3) + ' K' : String(n);
const dur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : m < 2880 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' m' : Math.round(m / 1440) + ' days'; };
const tm = t => new Date(t).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}), dy = t => new Date(t).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const HOOKN = {'library-start':'Board at start','tier-hook':'Model routes','record-guard':'Record guard','plan-gate':'Build plan','window-ceiling':'Window limit','count-gate':'Helpers at once','fanout-gate':'Usage first','owner-report':'Owner report','journal-watch':'Journal watch'};
const SHIELD = '<svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1l6 2v4.5c0 3.6-2.5 6.3-6 7.5C4.5 13.8 2 11.1 2 7.5V3z" fill="currentColor"/></svg>';

// ---- what a session was at a moment T
const working = (s, T) => s.segs.some(x => x[0] <= T && T <= x[1] + LIVE);
const lastWrap = (s, T) => { for (let i = s.wraps.length - 1; i >= 0; i--) if (s.wraps[i][0] <= T) return s.wraps[i]; };
const waiting = (s, T) => { const w = lastWrap(s, T); return !!w && !!w[2] && !working(s, T) && !s.humans.some(h => h > w[0] && h <= T) && !s.segs.some(x => x[0] > w[0] + 60000 && x[0] <= T); };
const silent = (s, T) => T >= NOW - 60000 && s.turnOpen && !working(s, T);
