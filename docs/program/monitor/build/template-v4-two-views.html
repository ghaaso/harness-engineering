<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session monitor</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--ink:#111827;--ink2:#374151;--mute:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--line2:#d1d5db;--work:#1d64d8;--workbg:#eef4ff;--wait:#b45309;--waitbg:#fff6e5;--waitln:#eaa53a;--bad:#c62828;--badbg:#fdeeee;--used:#4b5563;--idle:#d5d9df}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100vh;padding:12px 16px 16px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:50px 70px minmax(0,1fr) 112px;grid-template-areas:"top top" "over over" "map side" "bot side"}
.pane{background:var(--card);border:1px solid var(--line);border-radius:12px;position:relative;min-width:0;min-height:0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 2px}
#verdict{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:650;white-space:nowrap;padding:6px 16px 6px 13px;border-radius:24px}
#verdict i{width:13px;height:13px;border-radius:50%}
#verdict.bad{background:var(--bad);color:#fff}#verdict.bad i{background:#fff}
#verdict.amb{background:var(--waitbg);color:var(--wait);border:1px solid #f0cf94}#verdict.amb i{background:var(--waitln)}
#verdict.ok{background:#e9f5ee;color:#166534}#verdict.ok i{background:#22a35a}
.cnt{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:var(--ink2);white-space:nowrap;margin-right:10px}.cnt b{font-size:19px;color:var(--ink);font-weight:650}
.cnt i{width:10px;height:10px;border-radius:50%;background:#c4c9d1}.cnt.w i{background:var(--work)}.cnt.a i{background:var(--waitln)}
.cnt.w.on i{animation:pu 1.6s infinite}
#range{font-size:14px;color:var(--mute);white-space:nowrap}
#top .sp{flex:1}
.ctl{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);white-space:nowrap}
.seg{display:inline-flex;background:#e4e6ea;border-radius:9px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink2);padding:4px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink);background:rgba(255,255,255,.5)}.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg.big button{font-size:15px;padding:5px 16px}
select#lens{font:inherit;font-size:14px;padding:4px 8px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink)}
body.vh .lensg{display:none}
/* overview strip */
#over{grid-area:over;padding:6px 14px 4px;cursor:crosshair;user-select:none}#over svg{display:block;width:100%;height:100%}
/* time view */
#mapp{grid-area:map}#mapw{position:absolute;inset:0;overflow:auto}#map{position:relative}#map>svg{position:absolute;left:0;top:0;pointer-events:none}
.tlab{position:absolute;top:10px;font-size:12.5px;line-height:1.35;color:var(--mute);white-space:nowrap}.tlab b{color:var(--ink2);font-weight:600}
.node{position:absolute;background:#fff;border:1px solid var(--line2);border-left:5px solid #c4c9d1;border-radius:10px;padding:9px 11px 8px 11px;cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:opacity .2s,box-shadow .2s;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.node:hover{box-shadow:0 4px 16px rgba(16,24,40,.14)}.node.sel{box-shadow:0 0 0 3px rgba(29,100,216,.4)}
.node.dim{opacity:.25}.node.mark{box-shadow:0 0 0 3px var(--bad)}
.nh{display:flex;align-items:flex-start;gap:8px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:#c4c9d1;flex:none;margin-top:6px}
.nm{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;min-width:0}
.do{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.node.mid .do{-webkit-line-clamp:1}
.nf{display:flex;align-items:center;gap:10px;min-width:0;margin-top:auto;font-size:12.5px;color:var(--mute);white-space:nowrap}
.nf .tag{color:var(--wait);font-weight:600}.nf .hc b{color:var(--work);font-weight:600}
.prog{display:flex;gap:2px;flex:none}.prog i{width:10px;height:5px;border-radius:2px;background:#e0e3e8}.prog i.d{background:#8b939f}.prog i.n{background:var(--work)}
.fig{flex:none;font-weight:650;font-size:14px;margin-top:2px}
.flag{position:absolute;right:-9px;top:-10px;min-width:22px;height:22px;border-radius:11px;box-shadow:0 0 0 2px #fff;font-size:12px;font-weight:700;color:#fff;background:var(--bad);display:flex;align-items:center;justify-content:center;padding:0 6px}
.st-working{border-left-color:var(--work)}.st-working .dot{background:var(--work);animation:pu 1.6s infinite}
.st-silent{border-left-color:#8fb1ea}.st-silent .dot{background:#fff;border:2px solid var(--work)}
.st-waiting{border-left-color:var(--waitln);background:var(--waitbg)}.st-waiting .dot{background:var(--waitln)}
.st-quiet{background:#fafafb}.st-quiet .nm{color:var(--ink2);font-weight:600}.st-quiet .do{color:var(--mute)}
.hz-ok{border-left-color:#c4c9d1}.hz-amb{border-left-color:var(--waitln);background:var(--waitbg)}.hz-bad{border-left-color:var(--bad);background:var(--badbg)}.hz-na{background:#f6f7f8}
.node.cmp{padding:6px 9px;gap:2px}.node.cmp .do,.node.cmp .nf{display:none}.node.cmp .nm{font-size:13.5px;-webkit-line-clamp:3}.node.cmp .fig{font-size:13px}
@keyframes pu{50%{opacity:.25}}
#leg{position:absolute;left:16px;bottom:10px;font-size:12.5px;color:var(--mute);display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.92);padding:3px 8px;border-radius:6px}
#leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid var(--line2)}
/* right column */
#side{grid-area:side;display:flex;flex-direction:column;overflow:hidden}
.sx{padding:14px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.sx:last-child{border-bottom:0}
.sx h3{margin:0 0 8px;font-size:15.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.sx h3 .n{font-size:12.5px;font-weight:700;color:#fff;border-radius:10px;padding:0 7px;line-height:19px}.n.b{background:var(--bad)}.n.a{background:var(--waitln)}
.sx h3 .mt{font-weight:400}
.mt{color:var(--mute);font-size:13px}
.none{color:var(--mute);font-size:14px}
.nd{padding:7px 10px;border-radius:8px;background:var(--waitbg);border:1px solid #f3d7a6;margin-bottom:6px;cursor:pointer;font-size:14px}.nd:hover{border-color:var(--waitln)}
.nd .q{color:var(--ink2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#probs{overflow:auto;max-height:42%}
.pg{margin:0 0 11px}.pg:last-child{margin:0}
.pg .gt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.pg .gt i{width:9px;height:9px;border-radius:50%;flex:none}.pg.bad .gt i{background:var(--bad)}.pg.amb .gt i{background:var(--waitln)}.pg.amb .gt{color:var(--ink2);font-weight:600}
.pg .gs{padding:1px 0 1px 17px;font-size:13.5px;line-height:1.4}
.sn{cursor:pointer;color:var(--ink)}.sn:hover{text-decoration:underline}
.pg.amb .gs{color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pg.amb .sn{color:var(--ink2)}
.hd{padding:6px 0 8px;font-size:14px;cursor:pointer}.hd+.hd{border-top:1px solid #f0f1f3}
.hd .r{display:flex;align-items:center;gap:10px}.hd .r b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .s{color:var(--ink2);font-size:13.5px;line-height:1.35}.hd .s span{color:var(--mute)}
.hd .prog i{width:13px;height:6px}
.brd{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}.brd span{color:var(--mute)}
#feed{flex:1;overflow:auto;min-height:0}
.ev{display:grid;grid-template-columns:42px 22px 1fr;gap:4px;padding:3px 0;font-size:13.5px;line-height:1.35;cursor:pointer}.ev:hover{background:#f6f7f9}
.ev .t{color:var(--mute);font-variant-numeric:tabular-nums}.ev .x{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink2)}.ev .x b{color:var(--ink);font-weight:600}
.ev .ic{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;margin-top:1px;background:#9ca3af}
.ev .ic.st{background:var(--work)}.ev .ic.as{background:var(--waitln)}.ev .ic.rf{background:#fff;border:1.5px solid var(--bad);color:var(--bad)}.ev .ic.rp{background:#6b7280}.ev .ic.hp{background:#fff;border:1.5px solid #9ca3af;color:#6b7280}
.day{font-size:12.5px;color:var(--mute);margin:8px 0 2px;font-weight:600}
/* method strip */
#bot{grid-area:bot;padding:10px 14px 10px;display:flex;flex-direction:column;gap:6px}
#bot .bt{font-size:14.5px;font-weight:650;display:flex;gap:12px;align-items:baseline}#bot .bt span{font-weight:400;font-size:13px;color:var(--mute)}
#stg{display:flex;align-items:stretch;flex:1;min-height:0}
.sg{flex:1;padding:5px 10px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;border:1px solid transparent}
.sg:hover,.sg.on{background:#f4f5f7;border-color:var(--line2)}
.sg .nm2{font-size:13.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .fr{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sg .fr b{font-size:17px;color:var(--ink);font-weight:650}.sg .fr em{font-style:normal;font-weight:650}.sg .fr em.x{color:var(--bad)}.sg .fr em.n{color:var(--wait)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#eceef1;gap:1px}.bar i{display:block}.bar .u{background:#8b939f}.bar .n{background:var(--waitln)}.bar .x{background:var(--bad)}
.ar{flex:none;width:18px;display:flex;align-items:center;justify-content:center;color:#c4c9d1;font-size:16px}
/* harness view */
#hv{display:none;position:absolute;inset:0;overflow:hidden}body.vh #hv{display:block}body.vh #mapw,body.vh #leg{display:none}
body.vh #app{grid-template-rows:50px 70px minmax(0,1fr) 86px}
#hm{position:absolute;inset:0;padding:42px 18px 30px 22px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:30px;row-gap:24px;grid-template-rows:auto auto auto;align-content:space-between;align-items:start}
.hrow{display:flex;align-items:center;gap:8px;min-width:0}.hrow .hbar{flex:1;min-width:20px}.hrow .hst{flex:none}.hrow .hst:only-child{flex:1}
#ha{position:absolute;left:0;top:0;pointer-events:none}
.c1{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:12px;align-self:start}
.hb{background:#fff;border:1px solid var(--line2);border-radius:11px;padding:9px 11px 9px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;cursor:pointer;transition:opacity .2s,box-shadow .2s,border-color .2s;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.hb:hover{border-color:#9ca3af;box-shadow:0 4px 16px rgba(16,24,40,.12)}
.hb .ht{display:flex;align-items:center;gap:7px;font-weight:650;font-size:15px;line-height:1.25;min-width:0}
.hb .ht span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd{font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--fc) 13%,#fff);color:var(--fc);flex:none}
.hst{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hst b.x{color:var(--bad)}.hst b.o{color:var(--wait)}
.hbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#eceef1;gap:1px}.hbar i{display:block}
.hbar .u,.pk-used{background:var(--used)}.hbar .i,.pk-idle{background:var(--idle)}.hbar .x,.pk-bypassed{background:var(--bad)}.hbar .o,.pk-noton{background:var(--waitln)}
.hs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hs li{display:flex;align-items:center;gap:7px;font-size:13.5px;line-height:18.5px;color:var(--ink2);min-width:0;border-radius:4px}
.hs li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs li i{width:8px;height:8px;border-radius:50%;flex:none}
.hs li em{font-style:normal;font-size:12px;color:var(--faint);flex:none}
.k-used i{background:var(--used)}.k-idle i{background:var(--idle)}.k-bypassed i{background:var(--bad)}.k-noton i{background:var(--waitln)}.k-built i{background:#fff;border:1.5px solid #8b939f}.k-designed i{border:1.5px dashed #c4c9d1}
.k-designed span{color:var(--faint)}.k-bypassed span{color:var(--bad);font-weight:600}
.hs li.lit span{color:var(--work);font-weight:600}.hs li.lit i{background:var(--work);border:0}.hs li.ring i{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--bad)}.hs li.psel{background:#eef4ff}
.hr{font-size:12.5px;color:var(--mute);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb.nb{background:#f7f8f9;border-style:dashed;box-shadow:none}.hb.nb .ht{color:#7b8390}.hb.nb .cd{opacity:.6}
.hb.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}.hb.nbr{border-color:#6b7280}
.hb.dim{opacity:.3}
.hb .live{position:absolute;right:10px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--work);animation:pu 1.6s infinite}
.pn{position:absolute;right:-9px;top:-10px;min-width:22px;height:22px;border-radius:11px;background:var(--work);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;z-index:2}
.alab{position:absolute;transform:translate(-50%,-50%);font-size:12.5px;color:var(--mute);background:#fff;border-radius:6px;padding:0 6px;line-height:17px;white-space:nowrap;transition:opacity .2s}
.alab.dim{opacity:.25}
.hleg{grid-column:6;grid-row:3;align-self:end;font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:3px;padding:0 0 4px}
.hleg b{color:var(--ink2);font-weight:600;font-size:13px}.hleg div{display:flex;align-items:center;gap:7px}.hleg i{width:9px;height:9px;border-radius:50%;flex:none}
#sess{grid-area:bot;display:none;padding:10px 14px;overflow:hidden;flex-direction:column;gap:8px}body.vh #sess{display:flex}body.vh #bot{display:none}
#scs{display:flex;flex-wrap:wrap;gap:6px;overflow:auto}
.sc{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;line-height:20px;padding:2px 11px 2px 9px;border-radius:13px;border:1px solid var(--line2);border-left:4px solid #c4c9d1;background:#fafafb;color:var(--ink2);cursor:pointer}
.sc:hover{border-color:#9ca3af}.sc.s-working{border-left-color:var(--work);background:#fff;color:var(--ink);font-weight:600}.sc.s-silent{border-left-color:#8fb1ea;background:#fff}.sc.s-waiting{border-left-color:var(--waitln);background:var(--waitbg);color:var(--ink)}
.sc.sel{box-shadow:0 0 0 2.5px rgba(29,100,216,.5)}
.sc.rl-wrote,.node.rl-wrote{border-left-color:var(--work);background:#e3edfc}.sc.rl-read,.node.rl-read{border-left-color:var(--used);background:#f0f1f3}.sc.rl-skip,.node.rl-skip{border-left-color:var(--bad);background:var(--badbg)}.sc.rl-miss,.node.rl-miss{border-left-color:var(--waitln);background:var(--waitbg)}.sc.rl-noton,.node.rl-noton{border-left-color:var(--waitln);border-style:dashed}.sc.rl-none{opacity:.45}.node.rl-none{opacity:.28}
.node .rt{font-weight:650;margin-left:auto}.rt.rl-wrote{color:var(--work)}.rt.rl-read{color:var(--ink2)}.rt.rl-skip{color:var(--bad)}.rt.rl-miss,.rt.rl-noton{color:var(--wait)}
/* harness numbers in the side */
.hn{display:flex;gap:18px;margin:2px 0 10px}.hn div{display:flex;flex-direction:column}.hn b{font-size:24px;font-weight:650;line-height:1.1}.hn span{font-size:12.5px;color:var(--mute)}.hn .x b{color:var(--bad)}.hn .o b{color:var(--wait)}
.rlb .hbar{height:9px;margin:5px 0 6px}.r-hook{background:#374151}.r-both{background:#374151}.r-script{background:#8b939f}.r-none{background:#fff;box-shadow:inset 0 0 0 1px #b8bec7}
.rll{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:13px;color:var(--ink2)}.rll i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hl2{font-size:13.5px;color:var(--ink2);margin-top:8px}.hl2 b{font-weight:650}
.lnk{color:var(--work);cursor:pointer}.lnk:hover{text-decoration:underline}
/* detail layer over the right column */
#det{position:absolute;inset:0;background:#fff;border-radius:12px;z-index:4;display:none;flex-direction:column}#det.open{display:flex}
#det .dt{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
#det .dt button{font:inherit;font-size:14px;border:0;background:none;cursor:pointer;color:var(--ink2);padding:4px 10px;border-radius:7px}#det .dt button:hover{background:#f0f1f3}
#det .dt .sp{flex:1}#det .dt .x{font-size:20px;line-height:1;padding:2px 9px}
#det .db{flex:1;overflow:auto;padding:14px 18px 18px}
#det h2{font-size:19px;margin:0 0 3px;line-height:1.3;font-weight:650}
#det h4{font-size:14px;font-weight:650;color:var(--ink);margin:16px 0 6px}
#det p,#det .tx{font-size:14px;color:var(--ink2);margin:0}
.sub{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}.sub i{width:10px;height:10px;border-radius:50%;background:#c4c9d1}.sub i.working{background:var(--work)}.sub i.waiting{background:var(--waitln)}.sub i.silent{border:2px solid var(--work);background:#fff}
.it{display:flex;gap:8px;padding:3px 0;font-size:14px;line-height:1.35}.it .d{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}.it .d.bad{background:var(--bad)}.it .d.amb{background:var(--waitln)}
ol.pl{margin:2px 0;padding-left:22px;font-size:14px;color:var(--ink2)}ol.pl li{padding:1px 0}li.done{color:var(--faint)}li.now{font-weight:650;color:var(--work)}
.kv{display:grid;grid-template-columns:128px 1fr;gap:3px 12px;font-size:14px}.kv div:nth-child(odd){color:var(--mute)}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:12px;margin:2px 5px 3px 0;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
.chip.used{background:#f0f1f3;border-color:#b8bec7;color:var(--ink)}.chip.unused{background:var(--waitbg);border-color:#efc77f;color:var(--wait)}.chip.bypassed{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}.chip.na{color:var(--faint)}
.chip[data-part],.chip[data-p],.chip[data-id]{cursor:pointer}.chip[data-part]:hover,.chip[data-p]:hover,.chip[data-id]:hover{border-color:var(--ink2)}
.chain{margin-top:4px}
.cs{position:relative;padding:0 0 12px 22px}.cs:before{content:'';position:absolute;left:4px;top:15px;bottom:-1px;width:2px;background:#e5e7eb}.cs:last-child:before{display:none}
.cs>i{position:absolute;left:0;top:6px;width:10px;height:10px;border-radius:50%}
.cs .ct{font-size:14.5px;font-weight:600;color:var(--ink)}.cs .ct span{font-size:12.5px;color:var(--mute);font-weight:400;margin-left:6px}
.cs.k-designed .ct{color:var(--faint)}
.cs .cc{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.pc{font-size:13px;padding:2px 10px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;white-space:nowrap}.pc:hover{border-color:var(--ink2)}

<script>

const PK = { noton: 'Hooks not switched on in its folder', unchecked: 'A hook checked fewer calls than it should', hookfail: 'A hook failed and let calls through', window: 'Window went past its limit', silent: 'Turn open, nothing heard', stopped: 'Helpers stopped without handing back', refused: 'Calls refused by hooks' };

let OV = null;
function ovScale(W) {

function layout(V, W, Hh) {

function drawMap(V) {

const KN = { s: 'session', pipe: 'pipeline', part: 'part', docs: 'list' };
function drawDet(V) {
  const t = stack[stack.length - 1], el = $('det'); if (!t) { el.classList.remove('open'); return; }
  const prev = stack[stack.length - 2];
  el.querySelector('.dt').innerHTML = (prev ? `<button data-back="1">‹ Back to the ${KN[prev.k]}</button>` : '') + '<span class="sp"></span><button class="x" data-close="1" title="Close (Esc)">×</button>';
  el.querySelector('.db').innerHTML = t.k === 's' ? detSession(byId[t.id]) : t.k === 'pipe' ? detPipe(PIPE[t.id], V) : t.k === 'part' ? detPart(PART[t.id], V) : detDocs();
  el.classList.add('open');
}
function detSession(s) {
  if (!s) return ''; const p = s.parent && byId[s.parent], kids = S.filter(x => x.parent === s.id), hs = helpersAt(s, to), pr = problems(s, to), kinds = {}, a = stateAt(s, to);
  for (const h of hs) kinds[h.kind || 'other'] = (kinds[h.kind || 'other'] || 0) + 1;
  const plan = (s.plan || []).map(x => `<li class="${x.s === 'completed' ? 'done' : x.s === 'in_progress' ? 'now' : ''}">${esc(x.c)}</li>`).join('');
  const pa = pathOf(s), miss = Object.keys(PART).filter(id => ['skip', 'miss'].includes(rel(s, id)));
  return `<h2>${esc(name(s))}</h2><div class="sub"><i class="${a}"></i>${{ working: 'Working now', waiting: 'Asked you something, not answered', silent: 'Turn open, nothing heard for ' + dur(to - lastAct(s, to)), quiet: 'Quiet since ' + dy(lastAct(s, to)) + ' ' + tm(lastAct(s, to)) }[a]}</div>
   ${pr.length ? '<h4>To look at</h4>' + pr.map(x => `<div class="it"><span class="d ${x[0]}"></span><span>${esc(x[1].charAt(0).toUpperCase() + x[1].slice(1))}</span></div>`).join('') : ''}
   <h4>What it last reported</h4><div class="tx">${esc((lastWrap(s, to) || [0, 'Nothing yet.'])[1])}</div>
   <h4>Its steps</h4>${plan ? '<ol class="pl">' + plan + '</ol>' : '<div class="tx" style="color:#6b7280">It kept no task list.</div>'}
   <h4>Method in use</h4><div>${STAGES.map(g => { const k = g[3](s); return `<span class="chip ${k}" title="${esc(g[2])}">${esc(g[1])}${{ used: '', unused: ': skipped', bypassed: ': bypassed', na: '' }[k]}</span>`; }).join('')}</div>
   <h4>Path through the harness</h4><div>${pa.pipes.length ? pa.pipes.map((pl, i) => `<span class="chip used" data-p="${pl}">${i + 1}. ${esc(PIPE[pl].title)}</span>`).join('') : '<span class="tx" style="color:#6b7280">No part recorded.</span>'}</div>
   ${pa.ids.length ? '<h4>Parts it touched</h4><div>' + pa.ids.slice(0, 40).map(id => `<span class="chip used" data-part="${esc(id)}">${esc(PART[id].name)}</span>`).join('') + (pa.ids.length > 40 ? ' + ' + (pa.ids.length - 40) + ' more' : '') + '</div>' : ''}
   ${miss.length ? '<h4>Expected and missing</h4><div>' + miss.map(id => `<span class="chip ${rel(s, id) === 'skip' ? 'bypassed' : 'unused'}" data-part="${esc(id)}">${esc(PART[id].name)}</span>`).join('') + '</div>' : ''}
   <h4>Facts</h4><div class="kv"><div>Started</div><div>${dy(s.t0)} ${tm(s.t0)}${p ? ' by <span class="sn" data-id="' + p.id + '">' + esc(name(p)) + '</span>' : ''}</div><div>Sessions it started</div><div>${kids.length ? kids.map(k => `<span class="sn" data-id="${k.id}">${esc(name(k))}</span>`).join('; ') : 'none'}</div>
   <div>Time working</div><div>${dur(worked(s))}</div><div>Tokens</div><div>${tok(total(s))} (${Math.round(100 * s.tokens / Math.max(1, total(s)))} % its own, the rest its helpers)</div><div>Largest window</div><div>${tok(s.peak)}${s.ceil ? ' (limit ' + tok(s.ceil.line) + ')' : ''}</div>
   <div>Helpers</div><div>${hs.length ? hs.length + ': ' + esc(Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, v]) => v + ' ' + k).join(', ')) : 'none'}</div><div>You spoke to it</div><div>${s.owner} time${s.owner === 1 ? '' : 's'}</div><div>Model</div><div>${esc(s.model || 'unknown')}</div></div>`;
}
function detPipe(pl, V) {
  if (!pl) return ''; const ps = HP.parts.filter(p => p.pipeline === pl.id), ST = {}; ps.forEach(p => ST[p.id] = partState(p.id, V));
  const chain = pl.steps.map((st, i) => { const ch = byStep[pl.id + '.' + i] || [], k = stepState(ch.map(p => ST[p.id]), st), cnt = [st.built ? st.built + ' built' : '', st.designed + st.idea ? (st.designed + st.idea) + ' designed' : ''].filter(Boolean).join(', ');
    return `<div class="cs k-${k}"><i class="pk-${k === 'built' ? 'idle' : k === 'designed' ? 'x' : k}" style="${k === 'designed' ? 'border:1.5px dashed #c4c9d1;background:#fff' : k === 'built' ? 'border:1.5px solid #8b939f;background:#fff' : ''}"></i><div class="ct">${esc(st.t)}<span>${cnt}</span></div>${ch.length ? `<div class="cc">${ch.map(p => `<span class="pc ${ST[p.id]}${part === p.id ? ' psel' : ''}" data-part="${esc(p.id)}" title="${esc(p.note)}">${esc(p.name)}</span>`).join('')}</div>` : ''}</div>`; }).join('');
  const rs = RULES.filter(r => r.pipeline === pl.id), ins = HP.links.filter(l => l.to === pl.id), outs = HP.links.filter(l => l.from === pl.id);
  const used = V.filter(s => ps.some(p => ['wrote', 'read'].includes(rel(s, p.id)))), skip = V.filter(s => ps.some(p => ['skip', 'miss', 'noton'].includes(rel(s, p.id))));
  const lk = (l, id) => `<span class="chip" data-p="${id}">${esc(PIPE[id].code + ' ' + PIPE[id].title)}${l.label ? ' <span style="color:#6b7280">(' + esc(l.label) + ')</span>' : ''}</span>`;
  return `<h2><span class="cd" style="--fc:${pcol(pl.id)};font-size:14px;vertical-align:2px">${esc(pl.code)}</span> ${esc(pl.title)}</h2><p>${esc(pl.line || '')}</p>
   <h4>Steps and their parts</h4><div class="chain">${chain}</div>
   ${ins.length ? '<h4>Fed by</h4><div>' + ins.map(l => lk(l, l.from)).join('') + '</div>' : ''}${outs.length ? '<h4>Feeds</h4><div>' + outs.map(l => lk(l, l.to)).join('') + '</div>' : ''}
   <h4>Sessions that used it</h4><div>${used.length ? used.map(s => `<span class="chip" data-id="${s.id}">${esc(name(s))}</span>`).join('') : '<span class="tx" style="color:#6b7280">none in this stretch</span>'}</div>
   ${skip.length ? '<h4>Sessions that skipped a part of it</h4><div>' + skip.map(s => `<span class="chip unused" data-id="${s.id}">${esc(name(s))}</span>`).join('') + '</div>' : ''}
   <h4>Rules here (${rs.length})</h4>${rs.length ? rs.map(r => `<div class="rli"><i class="r-${rkind(r)}"></i><span>${esc(r.text)} <span>· ${RKW[rkind(r)]}</span></span></div>`).join('') : '<div class="tx" style="color:#6b7280">No rule is placed here.</div>'}`;
}
function detPart(p, V) {
  if (!p) return ''; const pl = PIPE[p.pipeline], stp = pl && pl.steps[+p.step.split('.').pop()], by = {}, k = partState(p.id, V);
  for (const s of V) (by[rel(s, p.id)] = by[rel(s, p.id)] || []).push(s);
  const list = (arr, cls) => arr && arr.length ? arr.map(s => `<span class="chip ${cls}" data-id="${s.id}">${esc(name(s))}</span>`).join('') : '<span class="tx" style="color:#6b7280">none</span>';
  const rs = RULES.filter(r => (r.carriedBy || []).includes(p.id) || (r.enforcers || []).includes(p.id));
  const nm = e => PART[e] ? PART[e].name : e, isRef = e => { const a = (ENF[e] || {}).acts; return a === 'refuses' || a === 'refuses at commit' || a === 'settings' || e.startsWith('setting:'); }, en = r => { const E = r.enforcers || [], a = E.filter(isRef).map(nm).join(', '), b = E.filter(e => !isRef(e)).map(nm).join(', '); return (a ? 'refuses: ' + a : 'nothing refuses') + (b ? '; only reminds or reports: ' + b : ''); };
  return `<h2>${esc(p.name)}</h2><div class="sub"><i class="pk-${k === 'norec' ? 'idle' : k}"></i>${esc(PSW[k].charAt(0).toUpperCase() + PSW[k].slice(1))} in the stretch shown</div><div class="mono">${esc(p.path)}</div><p>${esc(p.note)}</p>
   <h4>Where it sits</h4><div><span class="chip" data-p="${p.pipeline}">${esc(pl ? pl.code + ' ' + pl.title : p.pipeline)}${stp ? ', step: ' + esc(stp.t) : ''}</span></div>
   ${by.wrote ? '<h4>Wrote it</h4>' + list(by.wrote, 'used') : ''}<h4>${p.kind === 'hook' && ENF[p.id] ? (ENF[p.id].logsEveryCheck === false ? 'Refused calls of' : 'Checked calls of') : 'Used it'}</h4>${list(by.read, 'used')}${by.noton ? '<h4>Not switched on in the folder of</h4>' + list(by.noton, 'unused') : ''}
   ${(by.skip || by.miss) ? `<h4>Skipped${p.kind === 'hook' ? ' (a hook should have checked)' : ''}</h4>` + list((by.skip || []).concat(by.miss || []), 'bypassed') : ''}
   <h4>Rules</h4>${RULES.length ? (rs.length ? rs.map(r => `<div class="rli"><i class="r-${rkind(r)}"></i><span>${esc(r.text)} <span>· ${RKW[rkind(r)]}; ${(r.carriedBy || []).includes(p.id) ? 'carried here; ' + esc(en(r)) : (isRef(p.id) ? 'refused here' : 'reminds or reports here') + '; ' + esc(en(r))}</span></span></div>`).join('') : '<div class="tx" style="color:#6b7280">No rule names this part.</div>') : '<div class="tx" style="color:#6b7280">The rule list is not loaded.</div>'}`;

function detDocs() {

// ---- one render for everything; clicks are read from data attributes
function render() {
  document.body.classList.toggle('vh', view === 'harness');
  drawOver(); const V = vis();
  if (view === 'harness') drawHarness(V); else { drawMap(V); drawStages(V); }
  drawTop(V); drawSide(V); drawDet(V);
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.querySelectorAll('[data-win]').forEach(b => b.classList.toggle('on', b.dataset.win === winKey)); $('lens').value = lens;

}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-view],[data-win],[data-back],[data-close],[data-docs],[data-part],[data-id],[data-p]'); if (!b) return; const d = b.dataset;
  if (d.view) { view = d.view; try { localStorage.setItem('mon.view', view); } catch (x) {} render(); if (view === 'time') $('mapw').scrollLeft = 1e6; }
  else if (d.win) { winKey = d.win; to = NOW; from = d.win === 'all' ? T0 - HR : NOW - (+d.win) * HR; render(); $('mapw').scrollLeft = 1e6; }
  else if (d.back) pop(); else if (d.close) clearDet(); else if (d.docs) push('docs', 'all');
  else if (d.part) push('part', d.part); else if (d.id) push('s', d.id); else if (d.p) push('pipe', d.p);

$('lens').onchange = e => { lens = e.target.value; render(); };
addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) pop(); });
try { new ResizeObserver(() => { if (view === 'harness') drawArrows(); }).observe($('hv')); } catch (e) {}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
for (const [k, q] of [['pipe', 'pipe'], ['s', 'sel'], ['part', 'part']]) if (qs.get(q)) stack.push({ k, id: qs.get(q) });
sync(); render(); $('mapw').scrollLeft = 1e6;
</script></body></html>
