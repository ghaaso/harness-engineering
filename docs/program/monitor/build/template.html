<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session monitor</title>
<style>
:root{--bg:#f1f2f5;--card:#fff;--ink:#0f172a;--ink2:#334155;--mute:#64748b;--faint:#94a3b8;--line:#e6e9ee;--bad:#c62828;--wait:#b45309;--waitln:#e8a033;--work:#1d64d8}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
#app{height:100vh;display:grid;grid-template-rows:50px minmax(0,1fr) 82px;gap:8px;padding:10px 12px 10px}
/* top */
#top{display:flex;align-items:center;gap:14px;min-width:0}
#verdict{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:650;white-space:nowrap;padding:5px 15px 5px 12px;border-radius:22px;cursor:pointer;border:0;font-family:inherit}
#verdict i{width:12px;height:12px;border-radius:50%}
#verdict.bad{background:var(--bad);color:#fff}#verdict.bad i{background:#fff}
#verdict.ok{background:#e7f4ec;color:#166534}#verdict.ok i{background:#22a35a}
.cnt{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;color:var(--ink2);white-space:nowrap}.cnt b{font-size:18px;color:var(--ink);font-weight:650}
.cnt i{width:10px;height:10px;border-radius:50%;background:#c4c9d1}.cnt.w i{background:var(--work)}.cnt.a i{background:var(--waitln)}
#needs{display:flex;gap:8px;min-width:0;overflow:hidden}
.need{background:#fff6e5;border:1px solid #f0cf94;color:#7c3d06;border-radius:16px;padding:3px 12px;font-size:13.5px;white-space:nowrap;cursor:pointer;max-width:330px;overflow:hidden;text-overflow:ellipsis}
#range{font-size:13.5px;color:var(--mute);white-space:nowrap}
#top .sp{flex:1}
.seg{display:inline-flex;background:#e2e5ea;border-radius:9px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13.5px;border:0;background:none;color:var(--ink2);padding:4px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.zb{display:inline-flex;gap:4px}.zb button{font:inherit;font-size:16px;width:30px;height:30px;border-radius:8px;border:1px solid #d5d9e0;background:#fff;color:var(--ink2);cursor:pointer;line-height:1}
/* stage */
#stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
#heads{position:absolute;left:0;top:0;bottom:0;width:236px;border-right:1px solid var(--line);background:#fff;z-index:3;overflow:hidden}
#cvw{position:absolute;left:236px;top:0;bottom:30px;right:320px;overflow:hidden;cursor:grab}#cvw.drag{cursor:grabbing}
#cv{display:block;width:100%;height:100%}
#gut{position:absolute;right:0;top:0;bottom:0;width:320px;border-left:1px solid var(--line);background:#fff;z-index:3;overflow:hidden}
.gh{position:absolute;left:0;right:0;top:0;height:26px;padding:5px 12px 0;font-size:12.5px;color:var(--mute);border-bottom:1px solid var(--line);background:#fff}
.gh b{color:var(--ink);font-weight:650}
.gc{position:absolute;left:8px;right:8px;padding:5px 9px 6px 26px;border-radius:9px;cursor:pointer;background:#fff;border:1px solid var(--line)}
.gc:hover{box-shadow:0 2px 10px rgba(15,23,42,.12)}
.gc i{position:absolute;left:9px;top:11px;width:10px;height:10px;border-radius:50%}
.gc.working i{animation:pu 1.6s infinite}
.gc.waiting{background:#fff6e5;border-color:#f0cf94}.gc.waiting i{background:#fff!important;border:3px solid var(--waitln)}
.gc.silent i{background:#fff!important;border:3px solid currentColor}
.gc.done{border-color:transparent;padding-top:3px;padding-bottom:3px}.gc.done:hover{border-color:var(--line)}.gc b{display:block;font-size:13.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc em{font-style:normal;font-size:12px;color:var(--mute)}
.gnote{position:absolute;left:14px;right:14px;font-size:13px;color:var(--mute)}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(29,100,216,.45)}70%{box-shadow:0 0 0 8px rgba(29,100,216,0)}100%{box-shadow:0 0 0 0 rgba(29,100,216,0)}}
/* lane heads */
.lh{position:absolute;left:0;right:0;padding:0 10px 0 26px;display:flex;align-items:center;gap:7px;cursor:pointer;border-top:1px solid var(--line);overflow:hidden}
.lh:hover{background:#f6f8fb}
.lh .cv{position:absolute;left:9px;font-size:10px;color:var(--faint)}
.lh .cd{flex:none;min-width:21px;height:21px;padding:0 5px;border-radius:6px;background:#eef1f5;color:var(--ink2);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.lh b{font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink2);flex:none}
.lh.path b{font-size:15.5px;font-weight:700;color:var(--ink)}.lh.path .cd{background:#1e293b;color:#fff}
.lh .tb{flex:1;height:7px;border-radius:4px;background:#f0f2f5;overflow:hidden;min-width:20px}.lh .tb u{display:block;height:100%;background:#64748b;border-radius:4px}
.lh .tv{flex:none;font-size:12px;color:var(--mute);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.lh.sub{padding-left:40px}.lh.sub b{font-size:12.5px;font-weight:500;color:var(--ink2)}
.lh.fold{cursor:default;color:var(--faint);font-size:11.5px;line-height:1.3;padding:4px 8px 0 12px;white-space:normal;align-items:flex-start}.lh.fold:hover{background:none}
.lh.land b{color:#166534}.lh .ld{flex:none;font-size:12.5px;font-weight:700;color:#166534}.lh .ld.none{color:var(--bad)}
.grp{position:absolute;left:0;width:236px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-left:10px;pointer-events:none}
/* tip, legend, detail */
#tip{position:absolute;z-index:8;pointer-events:none;background:#0f172a;color:#fff;font-size:12.5px;line-height:1.35;padding:6px 10px;border-radius:8px;max-width:340px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{font-weight:650}#tip span{color:#cbd5e1}
#legend{position:absolute;left:236px;right:320px;bottom:0;height:30px;z-index:4;display:flex;gap:18px;align-items:center;font-size:12px;color:var(--mute);background:#fff;padding:0 12px;border-top:1px solid var(--line);overflow:hidden}
#legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#det{position:absolute;right:0;top:0;bottom:0;width:320px;background:#fff;border-left:1px solid var(--line);z-index:6;padding:14px 16px 16px;overflow:auto;display:none;user-select:text}
#det h2{font-size:17px;margin:0 30px 4px 0;line-height:1.25}#det h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px;font-weight:650}
#det p{margin:4px 0;font-size:13.5px;color:var(--ink2)}#det .x{position:absolute;right:10px;top:10px;border:0;background:#eef1f5;border-radius:8px;width:28px;height:28px;font-size:15px;cursor:pointer}
.bar{display:grid;grid-template-columns:96px 1fr 48px;gap:8px;align-items:center;font-size:13px;margin:3px 0}.bar u{display:block;height:8px;border-radius:4px;background:#64748b}.bar em{font-style:normal;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.pth{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px}.pth span{background:#eef1f5;border-radius:6px;padding:1px 7px}.pth span.l{background:#dcf3e3;color:#166534;font-weight:650}.pth span.c{background:#e6e9f7}
.pr{font-size:13.5px;margin:5px 0;padding-left:16px;position:relative;cursor:pointer}.pr:before{content:"";position:absolute;left:0;top:6px;width:9px;height:9px;border-radius:50%;background:var(--bad)}.pr.n:before{background:#c4c9d1}
.pr small{display:block;color:var(--mute);font-size:12.5px}
.pl{font-size:13px;margin:2px 0;color:var(--mute)}.pl.d{color:var(--ink2)}.pl.c{color:var(--work);font-weight:650}
/* strip */
#strip{display:flex;gap:10px;align-items:stretch;min-height:0}
#play{flex:none;width:64px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#play b{font-size:22px;line-height:1;color:var(--work)}
#over{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 14px 3px;cursor:crosshair;min-width:0}#over svg{display:block;width:100%;height:100%}
svg text{font-family:"Segoe UI",system-ui,sans-serif}
#cv.hl g.ss{opacity:.13}#cv.hl g.ss.on{opacity:1}
</style></head><body>
<div id="app">
 <div id="top">
  <button id="verdict"></button><span id="cnts"></span><span id="needs"></span><span class="sp"></span><span id="range"></span>
  <span class="seg" id="win"><button data-w="12">Last 12 h</button><button data-w="48">Since I last looked</button><button data-w="all">Everything</button></span>
  <span class="zb"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button></span>
 </div>
 <div id="stage">
  <div id="heads"></div>
  <div id="cvw"><svg id="cv"></svg></div>
  <div id="gut"></div>
  <div id="legend"></div>
  <div id="det"></div>
  <div id="tip"></div>
 </div>
 <div id="strip"><button id="play"><b>&#9654;</b>Replay</button><div id="over"></div></div>
</div>
<script>

const name = s => { const n = (s.title || 'Untitled session').replace(/\s*\([a-z]\w*-\d{4}\)/g, '').replace(KIND, ''); return n.charAt(0).toUpperCase() + n.slice(1); };
const cut = (t, n) => t.length > n ? t.slice(0, n - 1).trimEnd() + '…' : t;

const tok = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + ' M' : n >= 1e3 ? Math.round(n / 1e3) + ' K' : String(Math.round(n));
const dur = ms => { const m = Math.round(ms / MIN); return m < 60 ? m + ' min' : m < 2880 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' m' : Math.round(m / 1440) + ' days'; };
const tm = t => new Date(t).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}), dy = t => new Date(t).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});

  s.act = { s, h: null }; s.act.vis = mk(s.ev || [], s.act); ACT.push(s.act);

  s.mk = (s.marks || []).map(m => ({ t: T(m[0]), p: m[1], k: m[2], d: m[3], s })); s.mk.forEach(m => ACTIVE.add(pipeOf(m.p)));

// ---- what a session was at a moment
const working = (s, t) => s.segs.some(x => x[0] <= t && t <= x[1] + LIVE);
const lastWrap = (s, t) => { for (let i = s.wraps.length - 1; i >= 0; i--) if (s.wraps[i][0] <= t) return s.wraps[i]; };

const silent = (s, t) => t >= NOW - MIN && s.turnOpen && !working(s, t);
const stateAt = (s, t) => t < s.t0 ? 'none' : working(s, t) ? 'working' : silent(s, t) ? 'silent' : waiting(s, t) ? 'waiting' : 'quiet';
const stepAt = (s, t) => { for (let i = s.steps.length - 1; i >= 0; i--) if (s.steps[i][0] <= t) return s.steps[i][1]; return ''; };
const helpersRun = (s, t) => s.helpers.filter(h => h.t0 && h.t0 <= t && (t < h.t1 || (!h.finished && t <= h.t1 + LIVE))).length;
// ---- one colour per session; sessions open at the same time never share one. Red and amber are kept for trouble.
const HUES = ['#2563eb', '#0d9488', '#7c3aed', '#4d7c0f', '#c026d3', '#0369a1', '#57534e', '#4338ca', '#0e7490', '#9d5a0a'];
S.forEach((s, i) => { const used = new Set(S.slice(0, i).filter(o => o.end + HR > s.t0 && o.t0 < s.end + HR).map(o => o.hue)); if (byId[s.parent]) used.add(byId[s.parent].hue); s.hue = HUES.find(h => !used.has(h)) || HUES[i % HUES.length]; });
const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16), f = c => Math.round(c + (255 - c) * a); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; };

// ---- time: working stretches kept, quiet hours cut to a short break
const SC = (() => { let iv = []; for (const A of ACT) for (const v of A.vis) iv.push([v.a - 8 * MIN, v.b + 8 * MIN]); iv.sort((a, b) => a[0] - b[0]);
  const M = []; for (const x of iv) { const l = M[M.length - 1]; if (l && x[0] - l[1] < 75 * MIN) l[1] = Math.max(l[1], x[1]); else M.push([x[0], x[1]]); }
  M[M.length - 1][1] = Math.max(M[M.length - 1][1], NOW + MIN); const GAP = 22; let acc = 0; for (const x of M) { x.x0 = acc; acc += (x[1] - x[0]) / MIN + GAP; }
  const X = t => { for (const x of M) { if (t < x[0]) return x.x0 - GAP / 2; if (t <= x[1]) return x.x0 + (t - x[0]) / MIN; } return acc - GAP; };
  const inv = u => { for (const x of M) { const x1 = x.x0 + (x[1] - x[0]) / MIN; if (u < x.x0) return x[0]; if (u <= x1) return x[0] + (u - x.x0) * MIN; } return NOW; };
  return { M, X, inv, total: acc - GAP, GAP }; })();
const qs = new URLSearchParams(location.search);
let v0 = 0, v1 = SC.total, winKey = qs.get('win') || '48', sel = null, hov = null, open = new Set((qs.get('open') || '').split(',').filter(Boolean)), det = null, oy = 0, playT = null;
function setWin(k) { winKey = k; v1 = SC.X(NOW) + 1; v0 = k === 'all' ? -2 : SC.X(NOW - (+k) * HR); if (v1 - v0 < 30) v0 = v1 - 30; v1 += (v1 - v0) * 0.012; oy = 0; }

const GROUPS = [['Knowledge', ['B5', 'B3', 'B2', 'B4', 'A3', 'A2', 'A1', 'B1']], ['The path of a task', ['S1', 'S2', 'S3', 'S4', 'S5', 'S6']], ['Controls', ['C', 'D', 'E', 'F']], ['Measurement and research', ['G']]];
const laneKey = p => { const id = pipeOf(p); return open.has(id) ? PL[p] : id; };
const GAPJ = 50 * MIN;
function pack() { const all = [];
  for (const s of S) { const by = {}; for (const A of [s.act, ...s.hact]) for (const v of A.vis) { v.lk = laneKey(v.p); (by[v.lk] || (by[v.lk] = [])).push(v); }
    s.iv = {}; for (const k in by) { const I = []; for (const v of by[k].sort((x, y) => x.a - y.a)) { const l = I[I.length - 1]; if (l && v.a - l.b < GAPJ) l.b = Math.max(l.b, v.b); else I.push({ a: v.a, b: v.b, s, k }); } s.iv[k] = I; all.push(...I); } }

pack();
let TH = 20, LN = [], LBY = {}, rowH = 10, W = 1000, H = 600; const AX = 26;
function layout() {

      if (open.has(id)) { LN.push({ key: id + ':t', pid: id, title: true, g, gfirst: firstOf, min: 24 }); P.steps.forEach((st, i) => LN.push({ key: id + '.' + i, pid: id, step: i, g, min: 22 })); }
      else LN.push({ key: id, pid: id, g, gfirst: firstOf, min: g === 'The path of a task' ? 36 : 26 }); firstOf = false; }

}
const px = t => (SC.X(t) - v0) / (v1 - v0) * W;
const trOf = (s, k, t) => { const I = s.iv[k]; if (!I) return 0; let r = I[0]; for (const x of I) { if (x.a <= t) r = x; else break; } return r.tr; };

const vy = v => yOf(v.act.s, v.lk, v.a);

    for (const x of s.segs) { const a = X(x[0]), b = Math.max(X(x[1]), a + 2.5); o += `<rect x="${a}" y="${y}" width="${b - a}" height="${Math.max(2, rh - 2.5)}" rx="2" fill="${s.hue}" opacity="${sel && sel !== s.id ? .25 : .85}"/>`; }
    for (const m of s.mk) if (m.k !== 'refused') o += `<circle cx="${X(m.t)}" cy="${y + rh / 2 - 1}" r="3" fill="#c62828"/>`; }
  const a = v0 / SC.total * Wd, b = v1 / SC.total * Wd; o += `<rect x="${a}" y="14" width="${Math.max(b - a, 6)}" height="${Hh - 14}" fill="rgba(29,100,216,.07)" stroke="#1d64d8" stroke-width="1.5" rx="4"/><rect x="${a - 3}" y="${Hh / 2 - 4}" width="6" height="20" rx="3" fill="#1d64d8"/><rect x="${b - 3}" y="${Hh / 2 - 4}" width="6" height="20" rx="3" fill="#1d64d8"/>`;
  if (playT != null) o += `<line x1="${X(playT)}" y1="12" x2="${X(playT)}" y2="${Hh}" stroke="#0f172a" stroke-width="1.5"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${Wd} ${Hh}" preserveAspectRatio="none">${o}</svg>`; }
(function brush() { const el = $('over'); let mode = null, x0 = 0, a0 = 0, b0 = 0; const u = e => (e.clientX - el.getBoundingClientRect().left - 14) / OVW * SC.total;
  el.addEventListener('mousedown', e => { const x = u(e), tol = 8 / OVW * SC.total; mode = Math.abs(x - v0) < tol ? 'l' : Math.abs(x - v1) < tol ? 'r' : x > v0 && x < v1 ? 'm' : 'n'; x0 = x; a0 = v0; b0 = v1; if (mode === 'n') { v0 = x; v1 = x + 10; mode = 'r'; } e.preventDefault(); });
  addEventListener('mousemove', e => { if (!mode) return; const x = u(e), d = x - x0; if (mode === 'l') v0 = Math.min(x, v1 - 10); else if (mode === 'r') v1 = Math.max(x, v0 + 10); else { v0 = a0 + d; v1 = b0 + d; } winKey = ''; req(); });
  addEventListener('mouseup', () => { mode = null; }); })();

// ---- the canvas: wheel zooms time about the pointer, drag moves it, a click opens the detail
let raf = 0; const req = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
function zoom(f, cx) { const u = v0 + cx / W * (v1 - v0), n = Math.max(8, Math.min(SC.total * 1.1, (v1 - v0) * f)); v0 = u - cx / W * n; v1 = v0 + n; winKey = ''; req(); }
(function canvas() { const el = $('cvw'); let d = null, moved = false;
  el.addEventListener('wheel', e => { e.preventDefault(); if (e.shiftKey) { const sh = e.deltaY / W * (v1 - v0); v0 += sh; v1 += sh; winKey = ''; req(); } else zoom(Math.pow(1.0018, e.deltaY), e.clientX - el.getBoundingClientRect().left); }, { passive: false });
  el.addEventListener('mousedown', e => { d = { x: e.clientX, y: e.clientY, a: v0, b: v1, oy }; moved = false; el.classList.add('drag'); });
  addEventListener('mousemove', e => { if (d) { const dx = (e.clientX - d.x) / W * (d.b - d.a); if (Math.abs(e.clientX - d.x) + Math.abs(e.clientY - d.y) > 4) moved = true; if (moved) { v0 = d.a - dx; v1 = d.b - dx; oy = d.oy - (e.clientY - d.y); winKey = ''; req(); } return; }
    const r = el.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, tip = $('tip'); if (mx < 0 || my < 0 || mx > r.width || my > r.height) { tip.style.display = 'none'; if (hov) { hov = null; req(); } return; }
    const m = e.target.closest && e.target.closest('[data-m]'); let html = '', h = null;
    if (m) { const c = MARKS[+m.dataset.m]; html = `<b>${esc(MK[c.ms[0].k])}</b>${c.ms.length > 1 ? ' × ' + c.ms.length : ''}<br><span>${esc(HOOKN[c.ms[0].d] || '')} · ${esc(name(c.ms[0].s))} · ${tm(c.ms[0].t)}</span>`; h = c.ms[0].s.id; }
    else { const hit = hitAt(mx, my); if (hit) { const P = PIPE[hit.l.pid], hr = helpersRun(hit.s, hit.t); h = hit.s.id; html = `<b>${esc(name(hit.s))}</b><br><span>${esc(P.title)}${hit.l.step != null ? ': ' + esc(P.steps[hit.l.step].t) : ''} · ${dy(hit.t)} ${tm(hit.t)}${hit.tk ? ' · ' + tok(hit.tk / ((v1 - v0) / W * 6)) + ' tokens a minute here' : ''}${hr ? ' · ' + hr + ' helpers running' : ''}</span>`; } }
    if (html) { tip.innerHTML = html; tip.style.display = 'block'; const sr = $('stage').getBoundingClientRect(); tip.style.left = Math.min(e.clientX - sr.left + 14, sr.width - 350) + 'px'; tip.style.top = (e.clientY - sr.top + 16) + 'px'; } else tip.style.display = 'none';
    if (h !== hov) { hov = h; document.querySelectorAll('#cv g.ss').forEach(g => g.classList.toggle('on', g.dataset.s === sel || g.dataset.s === hov)); $('cv').classList.toggle('hl', !!(sel || hov)); } });
  addEventListener('mouseup', e => { if (!d) return; el.classList.remove('drag'); const was = d; d = null; if (moved) return; const r = el.getBoundingClientRect(), mx = was.x - r.left, my = was.y - r.top;
    const m = e.target.closest && e.target.closest('[data-m]'), t = e.target.closest && e.target.closest('text[data-s]');
    if (m) { det = { k: 'mark', c: MARKS[+m.dataset.m] }; sel = det.c.ms[0].s.id; } else if (t) { sel = t.dataset.s; det = { k: 's', id: sel }; } else { const hit = hitAt(mx, my); if (hit) { sel = hit.s.id; det = { k: 's', id: sel }; } else { sel = null; det = null; } } drawDet(); req(); });
  el.addEventListener('dblclick', e => zoom(.5, e.clientX - el.getBoundingClientRect().left)); })();
function hitAt(mx, my) { const l = LN.find(l => !l.title && !l.fold && my + oy >= l.y && my + oy < l.y + l.h); if (!l || !l.n) return null; const tr = Math.floor((my + oy - l.r0) / l.th), b = Math.floor(mx / 6), pad = 5 / W * (v1 - v0) * MIN, t = SC.inv(v0 + mx / W * (v1 - v0));
  for (const s of visS()) { const I = (s.iv[l.key] || []).find(I => I.tr === tr && I.a - pad <= t && t <= I.b + pad); if (I && s.bins && s.bins[l.key]) return { s, l, tk: s.bins[l.key][b] || 0, t }; } return null; }
$('heads').addEventListener('click', e => { const l = e.target.closest('[data-l]'); if (!l) return; const id = l.dataset.l; if (open.has(id)) open.delete(id); else open.add(id); pack(); req(); });
function fit(s) { const a = SC.X(s.t0), b = SC.X(Math.min(s.end, NOW)), m = Math.max(6, (b - a) * .12); v0 = a - m; v1 = b + m; winKey = ''; }
$('gut').addEventListener('mouseover', e => { const c = e.target.closest('[data-s]'), h = c ? c.dataset.s : null; if (h !== hov) { hov = h; req(); } });
$('gut').addEventListener('mouseleave', () => { if (hov) { hov = null; req(); } });
$('gut').addEventListener('dblclick', e => { const c = e.target.closest('[data-s]'); if (c) { fit(byId[c.dataset.s]); req(); } });
$('gut').addEventListener('click', e => { const c = e.target.closest('[data-s]'); if (c) { sel = c.dataset.s; det = { k: 's', id: sel }; drawDet(); req(); } });
$('top').addEventListener('click', e => { const b = e.target.closest('#win button'), n = e.target.closest('.need'); if (b) { setWin(b.dataset.w); req(); } else if (n) { sel = n.dataset.s; det = { k: 's', id: sel }; drawDet(); req(); } else if (e.target.closest('#verdict')) { det = { k: 'probs' }; drawDet(); } else if (e.target.id === 'zin') zoom(.6, W / 2); else if (e.target.id === 'zout') zoom(1.6, W / 2); });
addEventListener('keydown', e => { if (e.key === 'Escape') { det = null; sel = null; drawDet(); req(); } });
addEventListener('resize', req);

// ---- replay: the stretch shown is drawn again from left to right
let playing = 0;
$('play').addEventListener('click', () => { if (playing) { cancelAnimationFrame(playing); playing = 0; playT = null; $('play').innerHTML = '<b>&#9654;</b>Replay'; render(); return; }
  const a = v0, b = SC.X(Math.min(SC.inv(v1), NOW)), t0 = performance.now(), LEN = 14000; $('play').innerHTML = '<b>&#9632;</b>Stop';
  const step = now => { const f = Math.min(1, (now - t0) / LEN); playT = SC.inv(a + (b - a) * f); render(); if (f < 1) playing = requestAnimationFrame(step); else { playing = 0; playT = null; $('play').innerHTML = '<b>&#9654;</b>Replay'; render(); } };
  playing = requestAnimationFrame(step); });

// ---- detail, one click down
function drawDet() { const el = $('det'); if (!det) { el.style.display = 'none'; return; } let o = '<button class="x" id="detx">&#10005;</button>';
  const bars = (rows, mx) => rows.map(([n, v]) => `<div class="bar"><span>${esc(n)}</span><span><u style="width:${Math.max(1, v / mx * 100)}%"></u></span><em>${tok(v)}</em></div>`).join('');
  if (det.k === 's') { const s = byId[det.id], st = stateAt(s, NOW), tk = {}, all = [s.act, ...s.hact]; for (const A of all) for (const v of A.vis) { const p = pipeOf(v.p); tk[p] = (tk[p] || 0) + v.tk; }
    const rows = Object.entries(tk).sort((a, b) => b[1] - a[1]).map(([p, v]) => [PIPE[p].title, v]), seq = s.act.vis.map(v => pipeOf(v.p)).filter((p, i, a) => p !== a[i - 1]), w = lastWrap(s, NOW), kinds = {}; for (const h of s.helpers) kinds[h.kind || 'other'] = (kinds[h.kind || 'other'] || 0) + 1;
    const landed = all.reduce((a, A) => a + A.vis.filter(v => pipeOf(v.p) === 'S5').length, 0), P = byId[s.parent];
    o += `<h2 style="color:${s.hue}">${esc(name(s))}</h2><p><a href="#" id="fitb" style="color:#1d64d8">Fit the picture to this session</a></p><p>${st === 'working' ? 'Working now' : st === 'waiting' ? 'Waiting for you' : st === 'silent' ? 'Turn open, nothing heard' : 'Ended ' + dy(s.end) + ' ' + tm(s.end)} · started ${dy(s.t0)} ${tm(s.t0)}${P ? ' by ' + esc(name(P)) : ''} · ${esc(s.model || '')}</p><p><b>${tok(s.total)}</b> tokens · ${s.helpers.length} helpers · ${landed ? landed + ' landed' : '<b style="color:#c62828">nothing landed</b>'}</p>`;
    if (w) o += `<h3>Its last report</h3><p>${esc(w[1])}</p>`;
    o += `<h3>Where its tokens went</h3>${bars(rows, rows.length ? rows[0][1] : 1)}<h3>Its own path through the harness</h3><div class="pth">${seq.slice(0, 60).map(p => `<span class="${p === 'S5' ? 'l' : p === 'S4' ? 'c' : ''}">${esc(PIPE[p].title)}</span>`).join('')}${seq.length > 60 ? '<span>…</span>' : ''}</div>`;
    if (s.helpers.length) o += `<h3>Helpers</h3><p>${Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => n + ' ' + esc(k)).join(' · ')}</p>`;
    if (s.mk.length) { const g = {}; for (const m of s.mk) (g[m.k + m.d] || (g[m.k + m.d] = [])).push(m); o += '<h3>Problems and notes</h3>' + Object.values(g).sort((a, b) => (a[0].k === 'refused') - (b[0].k === 'refused')).map(a => `<div class="pr${a[0].k === 'refused' ? ' n' : ''}" data-t="${a[0].t}">${esc(MK[a[0].k])}${a.length > 1 ? ' × ' + a.length : ''}<small>${esc(HOOKN[a[0].d] || a[0].d)} · ${dy(a[0].t)} ${tm(a[0].t)}</small></div>`).join(''); }
    if (s.plan && s.plan.length) o += '<h3>Its plan</h3>' + s.plan.map(x => `<div class="pl ${x.s === 'completed' ? 'd' : x.s === 'in_progress' ? 'c' : ''}">${x.s === 'completed' ? '&#10003;' : x.s === 'in_progress' ? '&#9656;' : '&#9675;'} ${esc(x.c)}</div>`).join(''); }
  else if (det.k === 'mark') { const c = det.c, m = c.ms[0]; o += `<h2>${esc(MK[m.k])}${c.ms.length > 1 ? ' × ' + c.ms.length : ''}</h2><p>${esc(PIPE[pipeOf(m.p)].title)}: ${esc(PIPE[pipeOf(m.p)].steps[stepOf(m.p)].t)}</p>` + c.ms.map(x => `<div class="pr${x.k === 'refused' ? ' n' : ''}" data-s="${x.s.id}">${esc(HOOKN[x.d] || x.d)}<small>${esc(name(x.s))} · ${dy(x.t)} ${tm(x.t)}${x.k === 'window' ? ' · ' + x.d.split('/').map(n => tok(+n)).join(' against a limit of ') : ''}</small></div>`).join(''); }
  else if (det.k === 'probs') { const P = probs(), g = {}; for (const m of P) (g[m.k] || (g[m.k] = [])).push(m); o += `<h2>${P.length ? P.length + ' problems in the stretch shown' : 'No problems in the stretch shown'}</h2>` + Object.entries(g).map(([k, a]) => `<h3>${esc(MK[k])} (${a.length})</h3>` + a.slice(0, 12).map(x => `<div class="pr" data-s="${x.s.id}" data-t="${x.t}">${esc(name(x.s))}<small>${esc(HOOKN[x.d] || (k === 'window' ? x.d.split('/').map(n => tok(+n)).join(' against a limit of ') : x.d))} · ${dy(x.t)} ${tm(x.t)}</small></div>`).join('')).join(''); }
  el.innerHTML = o; el.style.display = 'block'; }
$('det').addEventListener('click', e => { if (e.target.id === 'fitb') { e.preventDefault(); fit(byId[det.id]); req(); return; } if (e.target.id === 'detx') { det = null; sel = null; drawDet(); req(); return; } const r = e.target.closest('.pr'); if (!r) return; if (r.dataset.t) { const u = SC.X(+r.dataset.t), n = v1 - v0; if (u < v0 || u > v1) { v0 = u - n / 2; v1 = u + n / 2; winKey = ''; } } if (r.dataset.s) { sel = r.dataset.s; } req(); });

setWin(winKey === 'all' || +winKey ? winKey : '48'); if (qs.get('sel') && byId[qs.get('sel')]) { sel = qs.get('sel'); det = { k: 's', id: sel }; if (qs.get('fit')) fit(byId[sel]); }
render(); drawDet(); if (qs.get('play')) { playT = SC.inv(v0 + (v1 - v0) * +qs.get('play')); render(); }
</script></body></html>
