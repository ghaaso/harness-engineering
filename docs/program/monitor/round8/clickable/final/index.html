<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-tri" viewBox="0 0 24 24"><path d="M12 3.2 22 20.5H2z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 9.5v5.2M12 17.4v.2" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/></symbol>
    <symbol id="i-dia" viewBox="0 0 24 24"><path d="M12 2.2 21.8 12 12 21.8 2.2 12z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 12h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-off" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3.4 3"/></symbol>
    <symbol id="i-from" viewBox="0 0 24 24"><path d="M6 4v9a3 3 0 0 0 3 3h9M14 11l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wait" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5.4l3.4 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-helper" viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.2" fill="currentColor"/><circle cx="16.5" cy="9" r="3.2" fill="currentColor" opacity=".6"/><path d="M3 19c.6-3.2 2.7-4.7 5-4.7s4.4 1.5 5 4.7zM12.6 19c.5-2.6 2.2-3.9 4-3.9s3.3 1.3 3.9 3.9z" fill="currentColor"/></symbol>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="oklch(97% .008 250)"/><line x1="0" y1="0" x2="0" y2="7" stroke="oklch(84% .02 250)" stroke-width="2.2"/></pattern>
  </defs>
</svg>

<header id="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span>Sessions</div>
  <nav class="tabs" role="tablist" aria-label="Pages">
    <button role="tab" id="tabNow" data-page="now" aria-selected="true">Now</button>
    <button role="tab" id="tabHist" data-page="history" aria-selected="false">History</button>
  </nav>
  <button id="waitPill" class="wpill" hidden></button>
  <div class="jump"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input id="jumpIn" type="text" autocomplete="off" spellcheck="false" placeholder="Jump to a session or part" aria-label="Jump to a session or part"><kbd>/</kbd><div id="jumpList" hidden></div></div>
  <div class="grow"></div>
  <div class="replay" role="group" aria-label="Replay">
    <button id="rpPlay" class="ibtn" aria-label="Pause replay"><svg class="ic"><use href="#i-pause"/></svg></button>
    <button id="rpSpeed" class="ibtn" style="width:auto;padding:0 12px;font-weight:600;font-size:13px" aria-label="Replay speed">4×</button>
    <select id="rpJump" aria-label="Jump in the replay">
      <option value="">Jump to…</option>
      <option value="00:05">00:05 start of day</option>
      <option value="03:29">03:29 crowded, UX asks</option>
      <option value="11:40">11:40 quiet stretch</option>
      <option value="13:03">13:03 after the gap</option>
      <option value="14:30">14:30 latest</option>
    </select>
    <time id="clock" class="clock"></time>
  </div>
  <div class="openin" role="group" aria-label="Parts open in">
    <span>Parts open in</span>
    <div class="seg dark" id="openIn"><button data-v="vscode">VS Code</button><button data-v="file" class="on">File pane</button></div>
  </div>
</header>

<aside id="rail" aria-label="Sessions">
  <div id="railHead"></div>
  <div id="since" class="since"></div>
  <div id="cards"></div>
</aside>

<main id="main">
  <section id="pageNow" class="page">
    <div id="ribbon">
      <svg id="rbsvg" height="280" aria-label="The day so far: sessions, you, and each hook on one clock"></svg>
      <div id="rbHover" class="rbhover" hidden></div>
    </div>
    <div id="canvas" class="canvas" data-z="mid" aria-label="The working parts">
      <div id="world" class="world"></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button id="zIn" class="ibtn" aria-label="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="zOut" class="ibtn" aria-label="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="zFit" class="ibtn" aria-label="Fit to screen"><svg class="ic"><use href="#i-fit"/></svg></button>
      </div>
      <aside id="pane" class="pane" aria-label="File pane"></aside>
    </div>
  </section>
  <section id="pageHist" class="page" hidden></section>
  <footer id="dock">
    <button id="dTarget" class="dtarget" aria-label="Who the message goes to"></button>
    <input id="dIn" type="text" autocomplete="off" spellcheck="false" aria-label="Prompt">
    <button id="dSend" class="btn p"></button>
    <button id="dStop" class="btn s d" hidden><svg class="ic"><use href="#i-stop"/></svg>Stop</button>
  </footer>
</main>

<div id="tip" role="tooltip" hidden></div>
<div id="pop" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="../shared/data.js"></script>
<script src="app.js"></script>
<script src="history.js"></script>
<script>APP.start();</script>
</body>
</html>
