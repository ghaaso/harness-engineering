<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session tool</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="now">
<a class="skip" href="#stage">Skip to the canvas</a>

<header class="top">
  <div class="brand">Session tool</div>
  <nav class="nav" aria-label="Pages">
    <button data-go="now" aria-current="page">Now<span class="badge" id="needBadge" hidden>0</span></button>
    <button data-go="history">History</button>
  </nav>
  <div class="search">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 10l4.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="jump" type="search" autocomplete="off" placeholder="Jump to a session or part" aria-label="Jump to a session or part" aria-controls="jumpList" aria-expanded="false" role="combobox">
    <kbd>/</kbd>
    <div id="jumpList" role="listbox" hidden></div>
  </div>
  <div id="needBanner" hidden></div>
  <div id="quietChip" hidden></div>
  <div class="spacer"></div>
  <div class="clock" aria-label="Replay clock">
    <span class="live" id="liveDot" title="Replaying Tuesday 24 November"></span>
    <span class="clock-t" id="clockT">03:10</span>
    <span class="clock-d" id="clockD">Tue 24 Nov</span>
    <button class="icon-btn" id="playBtn" aria-label="Pause the replay" title="Pause / play (Space)"></button>
    <div class="seg" id="speed" role="group" aria-label="Replay speed">
      <button data-s="1" aria-pressed="false">1×</button><button data-s="4" aria-pressed="true">4×</button><button data-s="16" aria-pressed="false">16×</button>
    </div>
  </div>
  <div class="openin">
    <span>Open parts in</span>
    <div class="seg" id="openIn" role="group" aria-label="Open parts in">
      <button data-v="vscode" aria-pressed="false">VS Code</button><button data-v="pane" aria-pressed="true">File pane</button>
    </div>
  </div>
</header>

<main id="pageNow">
  <div id="stage" tabindex="0" aria-label="Canvas of sessions, helpers and parts. Arrow keys move between items, plus and minus zoom, F fits all.">
    <div id="world">
      <svg id="links" width="1948" height="912" aria-hidden="true"></svg>
    </div>
    <div id="zoomCtl" role="group" aria-label="Zoom">
      <button id="zOut" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <output id="zVal">100%</output>
      <button id="zIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button id="zFit" class="wide" title="Fit everything (F)">Fit</button>
    </div>
    <div id="minimap" hidden aria-hidden="true"><div id="mmView"></div></div>
  </div>
  <section id="strip" aria-label="Time, Tuesday 24 November"></section>
</main>

<main id="pageHist" hidden>
  <div class="h-bar">
    <h1 id="hTitle">Tue 24 Nov</h1>
    <div class="seg" id="hFilter" role="group" aria-label="Show">
      <button data-f="all" aria-pressed="true">All</button><button data-f="trouble" aria-pressed="false">Trouble</button><button data-f="waiting" aria-pressed="false">Waited for me</button>
    </div>
    <button class="btn" id="hReset" hidden>Whole day</button>
    <span class="spacer"></span>
    <span class="h-hint" id="hWin"></span>
  </div>
  <div id="hWeek" aria-label="The week, one strip per day"></div>
  <div id="hDay">
    <div id="hAxis"></div>
    <div id="hLanes"></div>
    <div id="hHooks"></div>
    <div id="xhair" hidden><span></span></div>
  </div>
</main>

<aside id="drawer" aria-label="Session or file" hidden></aside>
<div id="pop" role="dialog" hidden></div>
<div id="tip" role="tooltip" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="sr" class="sr" aria-live="polite"></div>

<footer class="dock">
  <div class="dock-in">
    <button class="target" id="target" title="Who the message goes to. Click a session to change it.">New session</button>
    <textarea id="prompt" rows="1" placeholder="Prompt a new session" aria-label="Message"></textarea>
    <button class="btn primary" id="send" disabled title="Write a message first">Send</button>
  </div>
</footer>

<script src="../shared/data.js"></script>
<script src="app.js"></script>
<script src="now.js"></script>
<script src="history.js"></script>
<script>App.start();</script>
<script>if (/selftest/.test(location.search)) document.write('<script src="shots/selftest.js"><\/script>');</script>
</body>
</html>
