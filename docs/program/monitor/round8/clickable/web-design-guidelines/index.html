<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f3ee">
<title>Session Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to Main Content</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-hook" viewBox="0 0 16 16"><path d="M9.5 2v7a3 3 0 1 1-3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-kind" viewBox="0 0 16 16"><circle cx="8" cy="5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 13.5c0-3 2.2-4.6 5-4.6s5 1.600 5 4.600" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-cmd" viewBox="0 0 16 16"><path d="M3 4l4 4-4 4M9 12.500h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-script" viewBox="0 0 16 16"><path d="M6 3c-2 0-2 1-2 2v1.500c0 1-1 1.500-1 1.500s1 .5 1 1.500V11c0 1 0 2 2 2M10 3c2 0 2 1 2 2v1.500c0 1 1 1.500 1 1.500s-1 .5-1 1.500V11c0 1 0 2-2 2" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linecap="round"/></symbol>
    <symbol id="i-doc" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round"/></symbol>
    <symbol id="i-store" viewBox="0 0 16 16"><ellipse cx="8" cy="4" rx="4.500" ry="1.800" fill="none" stroke="currentColor" stroke-width="1.500"/><path d="M3.500 4v8c0 1 2 1.800 4.500 1.800s4.500-.8 4.500-1.800V4" fill="none" stroke="currentColor" stroke-width="1.500"/></symbol>
    <symbol id="i-skill" viewBox="0 0 16 16"><path d="M8 2l1.600 4.400L14 8l-4.400 1.600L8 14l-1.600-4.400L2 8l4.400-1.600z" fill="none" stroke="currentColor" stroke-width="1.400" stroke-linejoin="round"/></symbol>
    <symbol id="i-git" viewBox="0 0 16 16"><circle cx="4.500" cy="3.800" r="1.600" fill="none" stroke="currentColor" stroke-width="1.400"/><circle cx="4.500" cy="12.200" r="1.600" fill="none" stroke="currentColor" stroke-width="1.400"/><circle cx="11.500" cy="8" r="1.600" fill="none" stroke="currentColor" stroke-width="1.400"/><path d="M4.500 5.400v5.200M6 8h4" fill="none" stroke="currentColor" stroke-width="1.400"/></symbol>
    <symbol id="i-test" viewBox="0 0 16 16"><path d="M3 8.500l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-ext" viewBox="0 0 16 16"><path d="M6 3H3v10h10v-3M9 3h4v4M13 3L7.500 8.500" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.500 2.800l8 5.200-8 5.200z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><rect x="3.500" y="2.800" width="3" height="10.400" rx=".7" fill="currentColor"/><rect x="9.500" y="2.800" width="3" height="10.400" rx=".7" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 16 16"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round"/></symbol>
    <symbol id="i-fit" viewBox="0 0 16 16"><path d="M2.500 6V2.500H6M10 2.500h3.500V6M13.500 10v3.500H10M6 13.500H2.500V10" fill="none" stroke="currentColor" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="m-fail" viewBox="0 0 12 12"><path d="M6 1l5.300 9.600H.7z" fill="currentColor"/></symbol>
    <symbol id="m-refuse" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.200" fill="currentColor"/><rect x="3" y="5.100" width="6" height="1.800" rx=".5" fill="#fff"/></symbol>
    <symbol id="m-noton" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.600" fill="none" stroke="currentColor" stroke-width="1.500" stroke-dasharray="2.200 1.500"/></symbol>
    <symbol id="m-wait" viewBox="0 0 12 12"><rect x="2.200" y="1.500" width="2.800" height="9" rx=".7" fill="currentColor"/><rect x="7" y="1.500" width="2.800" height="9" rx=".7" fill="currentColor"/></symbol>
    <symbol id="m-work" viewBox="0 0 12 12"><path d="M2.500 1.500l8 4.500-8 4.500z" fill="currentColor"/></symbol>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#f1efe7"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cfccc0" stroke-width="2"/></pattern>
  </defs>
</svg>

<header class="top" id="top">
  <h1 class="brand"><span translate="no">Session Tool</span></h1>
  <nav class="tabs" aria-label="Pages">
    <a href="?page=now" id="tab-now" data-page="now">Now</a>
    <a href="?page=history" id="tab-history" data-page="history">History</a>
  </nav>
  <div class="glance" id="glance" role="group" aria-label="Status at a glance">
    <span class="g g-work"><b id="g-work">0</b> Working</span>
    <span class="g g-wait"><b id="g-wait">0</b> Waiting for You</span>
    <span class="g g-help"><b id="g-help">0</b> Helpers</span>
    <span class="g g-bad"><b id="g-bad">0</b> Trouble</span>
    <span class="g g-tok"><b id="g-tok">0</b> Tokens</span>
  </div>
  <div class="replay" role="group" aria-label="Replay of Tue 24 Nov">
    <button type="button" id="play" class="btn icon" aria-label="Pause Replay"><svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg></button>
    <output id="clock" class="clock" aria-label="Replay time"><span id="clock-d">Tue 24 Nov</span> <b id="clock-t">03:20</b></output>
    <label class="sr-only" for="scrub">Replay Time</label>
    <input type="range" id="scrub" name="replay-time" class="scrub" min="8640" max="9525" step="1" autocomplete="off">
    <label class="sr-only" for="speed">Replay Speed</label>
    <select id="speed" name="replay-speed" class="sel" autocomplete="off">
      <option value="3">Slow</option>
      <option value="10" selected>Normal</option>
      <option value="60">Fast</option>
    </select>
  </div>
</header>

<main id="main" tabindex="-1">
  <!-- NOW -->
  <section id="page-now" class="page" aria-label="Now">
    <aside class="rail" aria-labelledby="h-sessions">
      <div class="rail-head">
        <h2 id="h-sessions">Sessions</h2>
        <div class="since" id="since" role="group" aria-label="Since you left"></div>
      </div>
      <ul class="cards" id="cards"></ul>
    </aside>
    <div class="center">
      <section class="river" aria-labelledby="h-river">
        <h2 id="h-river" class="lbl">Last 3 Hours</h2>
        <div class="rv-wrap" id="rv-wrap">
          <div class="rv-gutter" id="rv-gutter"></div>
          <div class="rv-view" id="rv-view"><div class="rv-layer" id="rv-layer"></div><div class="rv-now" aria-hidden="true"><span>Now</span></div></div>
        </div>
      </section>
      <section class="canvas" aria-labelledby="h-parts">
        <h2 id="h-parts" class="lbl">Parts</h2>
        <div class="vp" id="vp" tabindex="0" role="group" aria-label="Parts canvas. Arrow keys pan, plus and minus zoom, 0 fits.">
          <div class="board" id="board"></div>
        </div>
        <div class="zoom" role="group" aria-label="Canvas zoom">
          <button type="button" class="btn icon" id="z-out" aria-label="Zoom Out"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg></button>
          <output id="z-val" class="zval">100%</output>
          <button type="button" class="btn icon" id="z-in" aria-label="Zoom In"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
          <button type="button" class="btn icon" id="z-fit" aria-label="Fit to Screen"><svg class="ic" aria-hidden="true"><use href="#i-fit"/></svg></button>
        </div>
      </section>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="page-history" class="page hist" aria-label="History" hidden>
    <div class="hw-head">
      <h2 id="h-week" class="lbl">The Week</h2>
      <div class="hctl" role="group" aria-label="History window">
        <button type="button" class="btn icon" id="h-left" aria-label="Earlier"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button>
        <button type="button" class="btn icon" id="h-right" aria-label="Later"><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button>
        <button type="button" class="btn icon" id="h-out" aria-label="Zoom Out"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg></button>
        <output id="h-span" class="zval">15 h</output>
        <button type="button" class="btn icon" id="h-in" aria-label="Zoom In"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" class="btn" id="h-prev">Previous Trouble</button>
        <button type="button" class="btn" id="h-next">Next Trouble</button>
      </div>
    </div>
    <div class="hweek" id="hweek"></div>
    <h2 id="h-lanes" class="lbl lanes-lbl">Sessions and Hooks</h2>
    <div class="hblock" id="hblock" tabindex="0" role="group" aria-label="Sessions and hooks over time. Arrow keys move the window, plus and minus zoom.">
      <div class="hlabels" id="hlabels"></div>
      <div class="hplot" id="hplot"></div>
    </div>
  </section>
</main>

<form class="dock" id="dock" action="#" novalidate>
  <div class="dock-to">
    <span class="to-lbl">To</span>
    <button type="button" class="to-chip" id="to-chip" aria-label="Prompt target: New Session. Choose a session on the left to answer it."><span id="to-name">New Session</span></button>
  </div>
  <div class="dock-field">
    <label class="sr-only" for="prompt">Prompt</label>
    <textarea id="prompt" name="prompt" rows="1" autocomplete="off" enterkeyhint="send" placeholder="Describe the job… e.g. “Check why Tier Hook refused 3 helpers”"></textarea>
    <p class="err" id="prompt-err" role="alert" hidden></p>
  </div>
  <button type="submit" class="btn primary" id="send"><span id="send-lbl">Start Session</span></button>
  <fieldset class="seg" id="opener" aria-label="Parts open in">
    <legend>Parts Open In</legend>
    <label><input type="radio" name="opener" value="vscode"><span>VS Code</span></label>
    <label><input type="radio" name="opener" value="pane"><span>File Pane</span></label>
  </fieldset>
</form>

<aside class="drawer" id="drawer" aria-labelledby="dr-title" aria-hidden="true" inert>
  <div class="dr-head" id="dr-head"></div>
  <div class="dr-body" id="dr-body"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<p class="sr-only" id="live" aria-live="polite"></p>

<script src="../shared/data.js"></script>
<script src="app.js"></script>
<script src="now.js"></script>
<script src="history.js"></script>
<script>App.start();</script>
</body>
</html>
