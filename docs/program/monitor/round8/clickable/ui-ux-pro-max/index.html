<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session tool</title>
<meta name="description" content="Front-end prototype of the session tool: Now and History, on dummy data.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>

<header class="topbar" id="topbar">
  <div class="brand"><span id="brand-ic"></span>Session tool</div>
  <nav class="nav" aria-label="Pages">
    <a href="#now" id="nav-now" data-page="now"><span class="live-dot" aria-hidden="true"></span>Now</a>
    <a href="#history" id="nav-history" data-page="history">History</a>
  </nav>
  <div class="glance" id="glance" role="group" aria-label="Right now"></div>
  <div class="spacer"></div>
  <div class="replay" id="replay" role="group" aria-label="Replay of Tuesday 24 November"></div>
  <button class="iconbtn" id="btn-settings" aria-haspopup="dialog" aria-expanded="false" aria-label="Settings" title="Settings"></button>
</header>

<main id="main" tabindex="-1">
  <section class="page" id="page-now" aria-label="Now">
    <aside class="rail" id="rail" aria-label="Sessions, those that need you first">
      <div class="rail-h"><span class="eyebrow">Sessions</span><span class="eyebrow num" id="rail-count"></span></div>
      <div class="rail-list" id="rail-list"></div>
    </aside>
    <div class="canvas-wrap">
      <div class="canvas" id="canvas" tabindex="-1" aria-label="Working parts of the harness, with the sessions that use them">
        <div class="board" id="board"></div>
      </div>
      <div class="tools" role="group" aria-label="Canvas zoom">
        <button class="iconbtn" id="z-out" aria-label="Zoom out" title="Zoom out (−)"></button>
        <button class="iconbtn zl" id="z-reset" aria-label="Reset zoom to 100 percent" title="Reset zoom">100%</button>
        <button class="iconbtn" id="z-in" aria-label="Zoom in" title="Zoom in (+)"></button>
      </div>
    </div>
  </section>
  <section class="page" id="page-history" aria-label="History" hidden></section>
</main>

<form class="promptbar" id="promptbar" autocomplete="off">
  <label for="p-target">Send to</label>
  <select id="p-target" aria-label="Send the prompt to"></select>
  <input class="field" id="p-input" type="text" placeholder="Prompt for a new session…" aria-label="Prompt">
  <span class="hint">Enter sends</span>
  <button class="btn" id="p-send" type="submit"><span id="p-send-ic"></span>Send</button>
</form>

<div id="overlays"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="sr-only" id="sr-live" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="tip" id="tip" hidden></div>

<script src="../shared/data.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<script src="now.js"></script>
<script src="history.js"></script>
<script>APP.start();</script>
</body>
</html>
