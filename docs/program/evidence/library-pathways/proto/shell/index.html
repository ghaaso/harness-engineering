part_right","from":"L5_part","to":"L6_right","label":"The cheap output is right","chance":"ok + (1 - ok) * q_part","cost":"n_cheap * (1 - s_part)","tier":"cheap","calls":"n_cheap * (1 - s_part)","limitations":[]},{"id":"l5_part_wrong","from":"L5_part","to":"L6_wrong","label":"The cheap output is wrong","chance":"(1 - ok) * (1 - q_part)","cost":"n_cheap * (1 - s_part)","tier":"cheap","calls":"n_cheap * (1 - s_part)","limitations":[]},{"id":"l5_wrong_right","from":"L5_wrong","to":"L6_right","label":"The cheap output is still right","chance":"ok * (1 - h_harm)","cost":"n_cheap","tier":"cheap","calls":"n_cheap","limitations":[]},{"id":"l5_wrong_wrong","from":"L5_wrong","to":"L6_wrong","label":"The cheap output is wrong","chance":"1 - ok * (1 - h_harm)","cost":"n_cheap","tier":"cheap","calls":"n_cheap","limitations":[]},{"id":"l6_pass","from":"L6_right","to":"EQUAL","label":"The right output passes the gate","chance":"1","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l6_caught","from":"L6_wrong","to":"L7_retry","label":"The gate catches the wrong output","chance":"g_lib","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l6_escaped","from":"L6_wrong","to":"L11_escaped","label":"The wrong output slips past the gate","chance":"1 - g_lib","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l7_right","from":"L7_retry","to":"L7_right","label":"The retry is right","chance":"rho_retry","cost":"n_cheap","tier":"cheap","calls":"n_cheap","limitations":[]},{"id":"l7_wrong","from":"L7_retry","to":"L7_wrong","label":"The retry is wrong","chance":"1 - rho_retry","cost":"n_cheap","tier":"cheap","calls":"n_cheap","limitations":[]},{"id":"l7_pass","from":"L7_right","to":"EQUAL","label":"The right retry passes the gate","chance":"1","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l7_caught","from":"L7_wrong","to":"L8_handoff","label":"The gate catches the wrong retry","chance":"g_lib","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l7_escaped","from":"L7_wrong","to":"L11_escaped","label":"The wrong retry slips past the gate","chance":"1 - g_lib","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l8_handoff","from":"L8_handoff","to":"L8_opus","label":"The work is handed to Opus","chance":"1","cost":"c_handoff","tier":"cheap","calls":"0","limitations":[]},{"id":"l8_right","from":"L8_opus","to":"L8_right","label":"The Opus output is right","chance":"ok + (1 - ok) * o_opus","cost":"n_opus * m_opus","tier":"opus","calls":"n_opus","limitations":[]},{"id":"l8_wrong","from":"L8_opus","to":"L8_wrong","label":"The Opus output is wrong","chance":"(1 - ok) * (1 - o_opus)","cost":"n_opus * m_opus","tier":"opus","calls":"n_opus","limitations":[]},{"id":"l8_pass","from":"L8_right","to":"L10_opus","label":"The right Opus output passes the gate","chance":"1","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l8_caught","from":"L8_wrong","to":"L9_fable","label":"The gate catches the wrong Opus output","chance":"g_lib","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l8_escaped","from":"L8_wrong","to":"L10_opus_escape","label":"The wrong Opus output slips past","chance":"1 - g_lib","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l9_right","from":"L9_fable","to":"L9_right","label":"The Fable output is right","chance":"o_fable","cost":"n_fable * m_fable","tier":"fable","calls":"n_fable","limitations":[]},{"id":"l9_wrong","from":"L9_fable","to":"L9_wrong","label":"The Fable output is wrong","chance":"1 - o_fable","cost":"n_fable * m_fable","tier":"fable","calls":"n_fable","limitations":[]},{"id":"l9_pass","from":"L9_right","to":"L10_fable","label":"The right Fable output passes the gate","chance":"1","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l9_caught","from":"L9_wrong","to":"UNRESOLVED","label":"Caught, and no stronger tier is left","chance":"g_lib","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l9_escaped","from":"L9_wrong","to":"L10_fable_escape","label":"The wrong Fable output slips past","chance":"1 - g_lib","cost":"review","tier":"opus","calls":"review_calls","limitations":[]},{"id":"l10_opus_good","from":"L10_opus","to":"EQUAL","label":"A good entry is written","chance":"capture * w_write * e_right","cost":"c_write * m_opus","tier":"opus","calls":"c_write","limitations":[]},{"id":"l10_opus_bad","from":"L10_opus","to":"EQUAL","label":"A bad entry is written","chance":"capture * w_write * (1 - e_right)","cost":"c_write * m_opus","tier":"opus","calls":"c_write","limitations":[]},{"id":"l10_opus_none","from":"L10_opus","to":"EQUAL","label":"No entry is written","chance":"1 - capture * w_write","cost":"0","tier":null,"calls":"0","limitations":[]},{"id":"l10_fable_good","from":"L10_fable","to":"EQUAL","label":"A good entry is written","chance":"capture * w_write * e_right","cost":"c_write * m_fable","tier":"fable","calls":"c_write","limitations":[]},{"id":"l10_fable_bad","from":"L10_fable","to":"EQUAL","label":"A bad entry is written","chance":"capture * w_write * (1 - e_right)","cost":"c_write * m_fable","tier":"fable","calls":"c_write","limitations":[]},{"id":"l10_fable_none","from":"L10_fable","to":"EQUAL","label":"No entry is written","chance":"1 - capture * w_write","cost":"0","tier":null,"calls":"0","limitations":[]},{"id":"l10_opus_escape_bad","from":"L10_opus_escape","to":"L11_stored","label":"The escape is written as a bad entry","chance":"capture * w_write","cost":"c_write * m_opus","tier":"opus","calls":"c_write","limitations":[]},{"id":"l10_opus_escape_none","from":"L10_opus_escape","to":"L11_escaped","label":"No entry is written","chance":"1 - capture * w_write","cost":"0","tier":null,"calls":"0","limitations":[]},{"id":"l10_fable_escape_bad","from":"L10_fable_escape","to":"L11_stored","label":"The escape is written as a bad entry","chance":"capture * w_write","cost":"c_write * m_fable","tier":"fable","calls":"c_write","limitations":[]},{"id":"l10_fable_escape_none","from":"L10_fable_escape","to":"L11_escaped","label":"No entry is written","chance":"1 - capture * w_write","cost":"0","tier":null,"calls":"0","limitations":[]},{"id":"l11_found","from":"L11_escaped","to":"ESCAPED_FOUND","label":"Found later and reworked","chance":"l_found","cost":"R_rework * m_opus","tier":"opus","calls":"R_rework","limitations":[]},{"id":"l11_silent","from":"L11_escaped","to":"ESCAPED_SILENT","label":"Never found","chance":"1 - l_found","cost":"0","tier":null,"calls":"0","limitations":[]},{"id":"l11_stored_fixed","from":"L11_stored","to":"ESCAPED_FOUND","label":"Found, reworked, stored entry corrected","chance":"l_found * fix_on_found","cost":"R_rework * m_opus","tier":"opus","calls":"R_rework","limitations":[]},{"id":"l11_stored_kept","from":"L11_stored","to":"ESCAPED_FOUND","label":"Found, reworked, stored entry left bad","chance":"l_found * (1 - fix_on_found)","cost":"R_rework * m_opus","tier":"opus","calls":"R_rework","limitations":[]},{"id":"l11_stored_silent","from":"L11_stored","to":"ESCAPED_SILENT","label":"Never found; the bad entry stays","chance":"1 - l_found","cost":"0","tier":null,"calls":"0","limitations":[]}],"links":[{"id":"promoted_checks","label":"Checks promoted into the shared tests","policy":"library","from_stock":"E_good","via":"promo","to_step":"L6","to_branches":["l6_caught","l6_escaped","l7_caught","l7_escaped","l8_caught","l8_escaped","l9_caught","l9_escaped"],"unknowns":["p_promote","k_promo_exact","k_promo_similar","c_check_share"],"measure":"fw_promo_caught","lookup":false,"loops":[{"id":"promo_climb","polarity":"R","label":"More caught at the gate, more climbs, more right strong solves written, more good entries","path":["E_good","promoted_checks","l6_caught","P_climbs","W_good","E_good"]},{"id":"promo_escape","polarity":"R","label":"Fewer strong-tier escapes pass, fewer bad entries written, a smaller bad share","path":["E_good","promoted_checks","l8_caught","W_bad_escape","E_bad","wrong_share"]}]}],"links_note":"A link is an influence on branch chances that is not a step of a piece of work. promoted_checks: in the library way of working, an entry's mechanical check can also run in the shared tests. It needs no lookup, so it does not pass through the funnel. It can only raise the gate's catch chance, at every gate pass: g_lib = g + (1 - g) * promo. That equals 1 - (1 - g) * (1 - promo). It acts on exact and similar entries, weighed by the share of good entries. Left out: a bad entry's promoted check can pin a defect in place. Leaving it out leans toward the library.","limitations":[],"limitations_note":"Filled in after the real-case walkthroughs. Each entry will name a limitation and the parameters it acts through; each branch carries the ids of the limitations that act on it."},"params":{"title":"Parameter table for the pathway map of the reasoning library","version":4,"map":"map.json","note":"Facts only. Tags: M measured on this PC in the owner's repositories or session records; S taken from an outside study; G a guess. A number that only loosely relates to a parameter is a hint: the tag is G and the note says how it differs. Each parameter has a low, a high and a best value. The best value is the middle value the map starts from. The map draws values evenly between low and high. Each row has a side: library (exists only because of the library) or other. A library-side row also has a good_end: the end at which the mechanism works as intended. It also has a lib_group, one of the four groups map.json declares (brief section 14, R18). With tied draws, library-side values share one level per group per run (R18b).","tags":{"M":"Measured on this PC, in this owner's repositories or session records","S":"Taken from an outside study or the vendor's price list","G":"A guess. The note may cite a hint and say how it differs from the parameter"},"assumptions":["Cost unit: one call by the cheap model (Sonnet) is 1. Calls are treated as equal in size inside a tier.","One period is 30 days and one piece of work is a fix-sized task of about ten cheap calls (brief section 12, R6).","Revision 2 (brief section 12): z_wrongstore removed; s_exact, s_similar, s_comp, s_part, ok_coverage_factor and fix_on_found added; c_carry, rho_retry, w_write, r_exact and h_harm re-tagged G (hints, not measurements); the k_fill source corrected.","m_opus runs from 1 to 2 and m_fable from 2 to 4. The tops come from the vendor price ratios supplied for this task (2026-11-12), which are per token; the settings are per call.","Map refuter pass (2026-11-12, refute-map.md): m_opus re-tagged G (a per-token price standing in for a per-call setting); e_right re-tagged S (one of its three sources is an outside study); the notes of m_fable and u_similar now say where their best values sit.","Where a refuter corrected a first-round number, the corrected number is used.","Revision 3 (brief section 13): m_opus is an unknown from 1 to 2, best 2, tag G (R10); retire_bad added, 0 to 0.3, best 0.05, tag G (R12); every row has a side, and library-side rows a good_end (R13); k_fill now counts every stored entry, good or bad (R11).","Revision 4 (brief section 14): every library-side row has a lib_group: recurrence, reach, quality or running_cost (R18). Three unknowns were added (R21): p_promote, k_promo_exact and k_promo_similar. All are library side, group quality, good end high, tag G. Their ranges are 0 / 0.5 / 1, 0.3 / 0.7 / 0.95 and 0 / 0.05 / 0.3. The three are drawn from a stream of their own, so every earlier draw stays the same.","Check of the third build (2026-11-13, check-third-build.md): the visible notes of u_similar, s_review, m_fable and retire_bad say 'the middle value' instead of 'best'. No number changed.","Today's notes are CLAUDE.md, the memory notes and the checks in the shared test run. They are present in every way of working, so they cancel out. need_visible and need_latent describe the cheap model as it works today, with those notes. The ceilings u_exact, u_similar and u_composite mean what the library could hold beyond today's notes."],"source_key":{"F1":"scratchpad/lib/facts/F1-ks-mechanics.md","F2":"scratchpad/lib/facts/F2-ks-research-and-refutes.md","F3":"scratchpad/lib/facts/F3-v2-numbers.md","F4":"scratchpad/lib/facts/F4-lit-positive.md","F5":"scratchpad/lib/facts/F5-lit-negative.md","F6":"scratchpad/lib/facts/F6-lit-tiers-baselines.md","D1":"scratchpad/lib/dives/D1-token-arithmetic.md","D7":"scratchpad/lib/dives/D7-write-side.md","P-proponent":"scratchpad/lib/dives/P-proponent.md","R1":"scratchpad/lib/refute/R1-ceiling.md","R2":"scratchpad/lib/refute/R2-drain.md","R3":"scratchpad/lib/refute/R3-flat.md","R4":"scratchpad/lib/refute/R4-gap-coverage.md (table re-read from scratchpad/lib/refute/r4/clinic-gates-out.txt)","R5":"scratchpad/lib/refute/R5-price-time.md","R6":"scratchpad/lib/refute/R6-clock.md","R8":"scratchpad/lib/refute/R8-push-precision.md","R9":"scratchpad/lib/refute/R9-trust-cost.md (and R9-git.json, R9-econ.out.txt)","R10":"scratchpad/lib/refute/R10-critic.md","W":"docs/program/evidence/library-pathways/walkthroughs/ (the 59 real-case walkthroughs; case ids such as L01 C3a name the file and section)","V2":"docs/program/HARNESS-V2-DESIGN-2026-11.md","HB":"docs/program/HARNESS-BOTTLENECKS-2026-11.md","TB":"docs/program/TOKEN-BOTTLENECK-2026-11.md","scratchpad":"C:/Users/User/AppData/Local/Temp/claude/192654871f6b1294/0bf1c4f3-76dc-4144-995c-2af5a213db41/scratchpad/lib (prefix of the scratchpad paths above, minus the leading 'scratchpad/lib')"},"parameters":[{"id":"p_visible","group":"workload","low":0.1,"high":0.8,"best":0.4,"tag":"G","side":"other","source":"No source. Hints: F3 s4 (tool errors are 2.2 % of calls); R10 s1.2 (windows with an edit or a failed check: 10.9 % of FixFlow tokens, 77.9 % of Clinic).","note":"Hint only. Errors are 2.2 % of calls. And 11 to 78 % of tokens sit in windows with an edit or a failed check. Neither counts pieces of work."},{"id":"need_visible","group":"workload","low":0.15,"high":0.6,"best":0.3,"tag":"G","side":"other","source":"No source. Hints: F6 s(iii) and R4 s1 (vendor scores, Sonnet 5.5 vs Opus 5.5); F6 s(i) (AgentBrew student alone 45.3 on Terminal-Bench 2.0).","note":"Hint. On whole benchmarks Sonnet 5.5 fails about 29 % (Terminal-Bench 4.0) to 54 % (FrontierCode 1.1). Those are whole tasks, not one error or one failing check."},{"id":"need_latent","group":"workload","low":0.2,"high":0.7,"best":0.4,"tag":"G","side":"other","source":"No source. Hint: R4 s1 (Clinic slice table, read again in this run).","note":"Hint. Round-one review found a serious defect in 9 of 14 Opus-built slices. It found one in 2 of the 4 Sonnet slices that have counts. These are slices, found by review."},{"id":"u_exact","group":"workload","low":0.02,"high":0.22,"best":0.06,"tag":"M","side":"library","good_end":"high","lib_group":"recurrence","source":"R3 s1 (3 to 5 same-cause repeats in 48 to 50 fix commits on main; 95 % interval on 5 of 50 reaches 22 %); F5 H2 (outside study: 2.1 to 3.2 % of fixes rebuildable from past fixes).","note":"3 to 5 of 48 to 50 fix commits repeated an earlier cause (6 to 10 %). One repository, 64 days. The ceiling now means beyond today's notes; this count does not separate them."},{"id":"u_similar","group":"workload","low":0.03,"high":0.45,"best":0.15,"tag":"S","side":"library","good_end":"high","lib_group":"recurrence","source":"F2 s1 (X-05 F01 to F03: 17 to 45 % of bug fixes follow recurring fix patterns, secondary reads); F5 H2 (2.1 to 3.2 % rebuildable from past fixes in one project, unconfirmed summary).","note":"Outside studies: 17 to 45 % of fixes follow recurring patterns; one project: 2.1 to 3.2 %. The middle, 0.15, sits between. They had nothing like today's notes: a lean toward the library, unsized."},{"id":"u_composite","group":"workload","low":0,"high":0.25,"best":0.05,"tag":"G","side":"library","good_end":"high","lib_group":"recurrence","source":"No source. Hints: F4 (one retrieved item scored best in ReasoningBank and SWE-Exp); F5 H2 (2.1 and 3.2 % of fixes buildable from one or several past fixes).","note":"No study counts problems made of several stored parts. One project found 2.1 % and 3.2 % of fixes buildable from past fixes. The range predates reading ceilings as beyond today's notes."},{"id":"latent_coverage_factor","group":"workload","low":0.05,"high":1,"best":0.3,"tag":"G","side":"library","good_end":"high","lib_group":"recurrence","source":"No source. Hints: F1 s5 (the diff check is the only route to problems the agent does not notice); F3 s4 (0 of 200 sampled search steps judged likely saved by an index).","note":"No measurement. The design reaches silent problems only through a diff check. A 200-step sample found no step an index would likely save. The range runs from almost nothing to no penalty."},{"id":"ok_coverage_factor","group":"workload","low":0.05,"high":1,"best":0.4,"tag":"G","side":"library","good_end":"high","lib_group":"recurrence","source":"No source. Brief section 12, R2 (entries come from strong-tier solves, and under the library the strong tier works only on what the cheap model failed).","note":"No measurement. Entries exist for problems the cheap model failed. So a piece of work it gets right alone is less likely to have one. The top, 1, means no penalty."},{"id":"k_fill","group":"workload","low":10,"high":300,"best":40,"tag":"S","side":"library","good_end":"low","lib_group":"recurrence","source":"F4 (APC: hit rate 2 % at 1 entry and 46 to 48 % at 100 entries; its 14.29 % is at the 20th percentile of queries, a cold-start curve over the query stream, not at 20 entries; AWM: most gain within about 40 examples; SWE-Exp: gains level off near 300). Corrected in revision 2 after verify-engine.md section 6.","note":"A plan-caching study: 2 % at 1 entry, 46 % at 100, ceiling near 55 %. A fit gives 27 to 55 entries. Another study levelled off near 300. Both templated."},{"id":"v_max","group":"workload","low":0.1,"high":0.9,"best":0.4,"tag":"G","side":"library","good_end":"low","lib_group":"quality","source":"No source for a lookup. Hint: R8 s2 (forward replay over 154 changes, projected to 133 entries: some entry fired wrongly on 16 to 51 % of changes for the selective key types).","note":"Hint. Diff-keyed warnings were replayed forward over 154 changes, projected to 133 entries. Some entry fired falsely on 16 to 51 % of changes. That is a push channel, not a lookup."},{"id":"k_distract","group":"workload","low":15,"high":250,"best":60,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: R8 s2 (projections from per-entry false-fire rates).","note":"Hint. Projected from replay fire rates, the false-fire chance reaches about 63 % of its top. That happens near 20 entries for loose keys and near 180 for selective keys."},{"id":"t_visible","group":"mechanism","low":0.2,"high":1,"best":0.5,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hints: F1 s5 and s8 (pull-only design; compliance is self-reported and escalations without a lookup are undercounted).","note":"No measured lookup rate exists. The design relies on the agent choosing to look up, and compliance is self-reported. The top of the range means every visible problem triggers a lookup."},{"id":"t_latent","group":"mechanism","low":0.02,"high":0.6,"best":0.15,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hint: F6 s(ii) (agents that succeed 22 % of the time predict 77 %).","note":"No measured rate. Some agents that succeeded 22 % of the time predicted 77 %, so asking only when in doubt is unreliable. Nothing signals these problems, so the rate is set low."},{"id":"c_lookup","group":"mechanism","low":0.1,"high":2,"best":1,"tag":"G","side":"library","good_end":"low","lib_group":"running_cost","source":"No source. Hints: F3 s7 (no measured number for one lookup turn exists); R1 s2 (one extra call per exploration run costs 11 to 16 % of tokens).","note":"Hint. A pulled lookup is one extra model call, which is 1 by this map's unit. Low end: a script with no model turn. High end: a lookup plus a follow-up turn."},{"id":"r_exact","group":"mechanism","low":0.4,"high":0.95,"best":0.75,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source for a lookup's recall. Hints: F2 s1 (KS-O19 table: duplicate bug reports sharing no words, 33.6 % by title, 19.0 % by description, 5.1 % in both); F1 s1 (pilot target: recall at shown at least 60 %, a target not a result).","note":"Hint. 5 to 34 % of duplicate bug reports share no words with their twin, so word-matching misses them. That is bug-report text, not stored fixes. The design's pilot target is 60 %."},{"id":"r_similar","group":"mechanism","low":0.2,"high":0.8,"best":0.5,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source for a chance. Hint: F2 s1 (BM25 scored 10.2 to 18.45 points lower on dissimilar duplicate bug reports than on similar ones).","note":"Hint. Word-matching scored 10 to 18 points lower on dissimilar duplicate bug reports than on similar ones. That is a ranking score on bug reports, not a hit chance."},{"id":"r_comp_full","group":"mechanism","low":0.02,"high":0.4,"best":0.1,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hints: F1 s3 (a lookup shows at most one lead and one candidate); F4 (one retrieved item beat several in ReasoningBank and SWE-Exp; Memento found more cases did not help).","note":"No measurement. One lookup shows at most one lead and one candidate, and three outside studies did best with one retrieved item. Returning every part at once is therefore unlikely."},{"id":"r_comp_part","group":"mechanism","low":0.1,"high":0.6,"best":0.35,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hint: F1 s3 (display cap of one lead and one candidate).","note":"No measurement. One lookup shows at most two items, so some parts is likelier than all. Its good end is high: some parts beat none. With the previous value, at most 1."},{"id":"f_false","group":"mechanism","low":0.1,"high":0.8,"best":0.35,"tag":"G","side":"library","good_end":"low","lib_group":"quality","source":"No source for a chance. Hints: F2 s2 (KS-C7: one error template with 2 to 3 causes scores a full match on the wrong cause); F4 (MeanCache test: 12.7 to 33 % false hits on queries that should all miss, search summary only).","note":"Hint. Error templates here carry 2 to 3 causes, so a wrong-cause match scores full. Semantic caches gave 13 to 33 % false hits on queries that should miss (unconfirmed summary)."},{"id":"c_check_share","group":"mechanism","low":0.03,"high":0.4,"best":0.2,"tag":"M","side":"library","good_end":"high","lib_group":"quality","source":"F1 s3, R9 s1.6 (3 of about 15 worked-example entries can return 'applies' without Docker, 6 of 15 with it; about 3 of 116 entry-bearing seed rows).","note":"Counted in the design's seed. 3 of 15 worked-example entries carry a check usable without Docker, and 6 of 15 with it. Across the whole seed it is about 3 of 116."},{"id":"c_screen","group":"mechanism","low":1,"high":3,"best":2,"tag":"G","side":"library","good_end":"low","lib_group":"running_cost","source":"F1 s1 (design estimate, labelled inferred: a native verify adds 2 to 3 turns).","note":"Design estimate, not measured: a verify adds 2 to 3 extra turns. The check itself runs in 0.2 s with no tokens, so the low end is one call."},{"id":"a_right","group":"mechanism","low":0.5,"high":0.98,"best":0.85,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: F5 A1 (Xiong: agents copy stored records whose inputs resemble the new one, correlation near 1).","note":"Hint. Agents tend to copy stored records that look like the current input. One study found a correlation near 1. So good entries are probably accepted. Not measured on coding work."},{"id":"a_wrong","group":"mechanism","low":0.35,"high":0.95,"best":0.65,"tag":"S","side":"library","good_end":"low","lib_group":"quality","source":"F5 C1 (ClashEval, arXiv 2404.10198: six top models adopted wrong retrieved content over a correct prior more than 60 % of the time).","note":"Six top models took wrong retrieved content over their own correct answer more than 60 % of the time. Question answering with planted wrong values, not look-alike repair notes."},{"id":"d_deliver","group":"mechanism","low":0.5,"high":0.98,"best":0.85,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hint: F3 s1 (48 compactions in Clinic main sessions; what a compaction drops was never measured).","note":"Hint. An entry stays in the window until a compaction or a handoff drops it. Clinic main sessions compacted 48 times. What compaction loses has not been measured here."},{"id":"c_carry","group":"mechanism","low":0.1,"high":1.5,"best":0.73,"tag":"G","side":"library","good_end":"low","lib_group":"running_cost","source":"No measurement of carrying cost. Hint: D1 s2 (860 tokens x about 260 remaining calls / 306k tokens per call = 0.73, derived); answer size from KS-C9 (0.4 tokens per character on 2,904 results); 306k and 519 calls from F3 s1 and s7.","note":"Hint, derived not measured. It assumes an 860-token answer, 306k tokens per slice call and 519 calls per slice. It also assumes 260 remaining calls (half the session)."},{"id":"q_exact","group":"mechanism","low":0.35,"high":0.99,"best":0.75,"tag":"S","side":"library","good_end":"high","lib_group":"quality","source":"F4 (Dynamic Cheatsheet: Game of 24 10 to 99, Equation Balancer 44.8 to 100, both one repeated template).","note":"On a repeated template a stored solution fixed 89 of 90 failures (Game of 24). Net gain over baseline failures, on same-template puzzles. The design stores a diagnosis, not the whole fix."},{"id":"q_similar","group":"mechanism","low":0.07,"high":0.5,"best":0.2,"tag":"S","side":"library","good_end":"high","lib_group":"quality","source":"F4 and F5 (net gain divided by baseline failures, my arithmetic: SWE-Exp 6.8 %, ReasoningBank 7.0 to 7.4 %, AgentBrew 11.5 to 20.8 %, Agent KB 11.4 %, AWM 15.7 %, ExpeL 15 to 32 %).","note":"Net gain over baseline failures: 7 % (SWE-Exp, ReasoningBank), 12 to 21 % (AgentBrew, Agent KB), 16 to 32 % (AWM, ExpeL). These average over all retrievals, so a good fit should do better."},{"id":"q_comp","group":"mechanism","low":0.03,"high":0.5,"best":0.15,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: F4 (ReasoningBank 49.7 at one item vs 44.4 at four; SWE-Exp 42.0 vs 39.0).","note":"No study measures all parts of a composite. Two studies scored lower with more retrieved items, so this is set at or under the similar-entry value."},{"id":"q_part","group":"mechanism","low":0,"high":0.3,"best":0.08,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: same as q_comp.","note":"No measurement. With only some parts the cheap model must work out the rest, so this is set below the all-parts value."},{"id":"h_harm","group":"mechanism","low":0.2,"high":0.9,"best":0.55,"tag":"G","side":"library","good_end":"low","lib_group":"quality","source":"No source for this step on its own. Hints: F5 C1 (ClashEval: wrong content beat a correct prior over 60 % of the time; the same figure a_wrong cites); F5 C3 (MemCollab raw memory: HumanEval 42.7 to 34.1, GSM8K 73.0 to 56.6, MATH500 27.4 to 18.8).","note":"Hint. The over-60 % figure is the one a_wrong cites, so one figure supports two steps. Raw stronger-model memory cut weaker models' scores by 4 to 31 %. Question answering, not repair."},{"id":"n_cheap","group":"mechanism","low":3,"high":30,"best":10,"tag":"G","side":"other","source":"No source. Hints: F3 s1 (FixFlow agent windows average about 12 calls); R9 s1.2 (median agent window 7 calls, p25 4).","note":"Hint. FixFlow agent windows average about 12 calls (median 7). That is a whole agent run. The map sets one piece of work at about ten cheap calls (brief R6)."},{"id":"s_exact","group":"mechanism","low":0.1,"high":0.9,"best":0.5,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: W L01 C3a and C3b (a stored route would have cut 2 to 8 calls per wave-2 agent; one wave-1 agent spent about 8; with the route in its brief an agent recovered in 2 calls).","note":"Hint. In one real case a stored route would have saved 2 to 8 calls per agent, of about 8 spent. On a ten-call task that is 0.2 to 0.8. One case only."},{"id":"s_similar","group":"mechanism","low":0,"high":0.7,"best":0.25,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: W L05-4 (a stored fix would have saved a detour of a commit, its revert, stopped full runs and one Opus review; the entry showed the cause, not the fix, so adapting was needed).","note":"Hint. In one case a stored fix would have saved a wrong commit, its revert and a review. It gave the cause, not the fix, so adapting still costs calls."},{"id":"s_comp","group":"mechanism","low":0,"high":0.6,"best":0.2,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: same as s_similar; F4 (two outside studies scored lower with more retrieved items).","note":"No measurement. Several parts must be read and joined, so the saving is set at or below the similar-entry value."},{"id":"s_part","group":"mechanism","low":0,"high":0.4,"best":0.1,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: same as s_comp.","note":"No measurement. With only some parts, the cheap model must work out the rest. So the saving is set below the all-parts value."},{"id":"g_tests_visible","group":"gate","low":0.5,"high":0.95,"best":0.8,"tag":"G","side":"other","source":"No source for a catch rate. Hints: R2 s1 (CI caught both mypy repeats; CI stayed green on both Expo pin failures); F2 s1 (SapFix: 131 of 165 patches passed tests, only 27 of 57 crashes fixed correctly).","note":"Hint. CI caught both mypy repeats but passed both Expo pin failures. In SapFix, passing tests alone let wrong patches through. No catch rate was counted."},{"id":"g_tests_latent","group":"gate","low":0.05,"high":0.5,"best":0.25,"tag":"G","side":"other","source":"No source for a catch rate. Hint: R4 s1 (serious defect in 9 of 14 Opus-built slices at round-one review).","note":"Hint. Opus-built slices still had a serious defect found by round-one review in 9 of 14. The record does not split what tests had already passed from what review found."},{"id":"s_review","group":"gate","low":0.2,"high":1,"best":0.5,"tag":"G","side":"other","source":"No source for the share per piece of work. Hints: R4 s1 (every slice in the Clinic table had an Opus review); V2 (a reviewer on every PR).","note":"Measured per slice: every Clinic slice had an Opus review. A slice holds many pieces of work, so the share per gate pass is lower. The middle value is a guess."},{"id":"g_review","group":"gate","low":0.3,"high":0.85,"best":0.65,"tag":"G","side":"other","source":"No source for a catch rate. Hints: HB s3.3 (19 serious findings at round one; at least 5 more later, made by the fixes); R4 s1.","note":"Hint. Round one found 19 serious defects; at least 5 more appeared later, made by the fixes. What reviews missed was never counted, so no catch rate exists."},{"id":"c_review","group":"gate","low":2,"high":15,"best":5,"tag":"G","side":"other","source":"No source for review length. Hints: R9 s1.2 (reviewer as a fresh agent of 3 to 7 calls); D7 s2 (reviewer 3 to 5 turns).","note":"Estimates only: a reviewer agent of 3 to 7 calls (R9) or 3 to 5 turns (D7). The length of an actual Opus review was not measured."},{"id":"p_promote","group":"gate","low":0,"high":1,"best":0.5,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Brief section 14, R21 (the orchestrator's ruling on the range).","note":"No measurement. It counts only checks that exist because an entry was written. Regression tests a team writes anyway are in every way of working. At 0 nothing is promoted."},{"id":"k_promo_exact","group":"gate","low":0.3,"high":0.95,"best":0.7,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Brief section 14, R21 (the orchestrator's ruling on the range). Hint: W, LIM-35 (tests written with the work asserted the wrong behaviour).","note":"No measurement. A check aimed at the very problem catches much of what goes wrong on it. The walks also saw tests that asserted the wrong behaviour."},{"id":"k_promo_similar","group":"gate","low":0,"high":0.3,"best":0.05,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Brief section 14, R21 (the orchestrator's ruling on the range). Hint: W L04 C4 (a stored check tested the old defect while the same cause returned in a new form).","note":"No measurement. A check written for one problem rarely tests a different one. One walk saw a stored check miss the same cause in a new form."},{"id":"rho_retry","group":"ladder","low":0.2,"high":0.6,"best":0.36,"tag":"G","side":"other","source":"No source for one cheap retry. Hint: V2 table row R1 and HB s3.3 (Clinic: 64 % of reviews sent a slice back; 2.8 rounds per slice). R4 clinic-gates-out.txt read again in this run.","note":"Hint. 64 % of Clinic reviews sent a whole slice back, so a round passes 36 % of the time. Slices, not pieces of work; first and later rounds mixed; fixes mostly Opus-led."},{"id":"c_handoff","group":"ladder","low":1,"high":10,"best":3,"tag":"G","side":"other","source":"No source for a price. Hints: R9 s1.2 (a fresh agent's first call is about 66k tokens); R1 s3.4 (opening exploration is 55 to 61 % of subagent tokens).","note":"Hint. A fresh agent starts at about 66k tokens, and 55 to 61 % of subagent tokens go on opening exploration. Neither prices one handoff in cheap calls."},{"id":"n_opus","group":"ladder","low":3,"high":35,"best":10,"tag":"G","side":"other","source":"No source for calls per attempt. Hint: R5 s2 (Opus slice sessions: median 388 calls; Sonnet 283; different work).","note":"Hint. Calls per slice session: Opus median 388, Sonnet 283, on different work. No calls-per-attempt by tier exists. Set equal to the cheap attempt."},{"id":"n_fable","group":"ladder","low":3,"high":35,"best":10,"tag":"G","side":"other","source":"No source. Hint: F3 s3 (Fable mostly ran long root sessions: 1,158 root calls in November).","note":"No measurement. Fable mostly ran long root sessions, not single attempts. Set equal to the cheap attempt, with the same wide range."},{"id":"m_opus","group":"ladder","low":1,"high":2,"best":2,"tag":"G","side":"other","source":"Brief section 13, R10, after refute-map.md MF1. Vendor price list supplied for this task (2026-11-12); F6 s(iv) (Opus 5.5 is 2 x Sonnet 5.5 per token, new and re-read); F3 line 49 (call sizes).","note":"Per token, Opus costs 2 x Sonnet (price list, S). The setting is per call. Calls here averaged about 222,000 cache-read tokens for Opus and 440,000 for Sonnet, nearer 1 per call."},{"id":"m_fable","group":"ladder","low":2,"high":4,"best":3,"tag":"S","side":"other","source":"Vendor price list supplied for this task (2026-11-12); F6 s(iv) (Fable 5.2: 2 x Sonnet on re-read tokens, 4 x on new input and output).","note":"Vendor price ratio: 2 x Sonnet on re-read tokens, 4 x on new input and output. The middle value, 3, weights a typical call by its cost mix; that arithmetic gives 3 to 3.3."},{"id":"o_opus","group":"ladder","low":0.15,"high":0.9,"best":0.55,"tag":"G","side":"other","source":"No source for the conditional chance. Hint: F6 s(iii) and R4 s1 (vendor FrontierCode 1.1: Opus 54.4, Sonnet 46.2; Terminal-Bench 4.0: Sonnet ahead).","note":"Hint. From vendor scores: if Opus's failures sit inside Sonnet's, Opus fixes 15 % of Sonnet's failures; if independent, 54 %. The overlap is unknown."},{"id":"o_fable","group":"ladder","low":0.2,"high":0.9,"best":0.5,"tag":"G","side":"other","source":"No source. Hint: R4 s1 (20 of 48 fix commits on main carry a Fable trailer; no failure rate by model exists).","note":"No measurement. Fable authored 20 of 48 fix commits on main, but no failure rate by model exists. After Opus fails what is left is harder, which pulls this down."},{"id":"w_write","group":"capture","low":0.2,"high":1,"best":0.45,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No entry was ever written, so no write rate exists. Hint: R9 s1.1 and R9-git.json (a keyword reading flags 22 of 50 fix commits as meeting the design's write rule; 3 of the 5 first fixes in repeat pairs did).","note":"Hint. A crude keyword reading found 22 of 50 fix commits eligible under the write rule. So were 3 of 5 first fixes in repeat pairs. The top, 1.0, stores every strong solve."},{"id":"c_write","group":"capture","low":2,"high":15,"best":5,"tag":"G","side":"library","good_end":"low","lib_group":"running_cost","source":"No source for a call count. Hint: R9 s1.2 (0.4 to 3.8 M tokens per strict entry, from measured contexts and guessed turn counts); F1 s1 (design says 7 to 14k tokens).","note":"Hint. R9 priced one strict entry at 0.4 to 3.8 million tokens, about 2 to 15 calls at 250k. It used measured contexts and guessed turns. The design says 7 to 14 thousand."},{"id":"e_right","group":"capture","low":0.35,"high":0.95,"best":0.75,"tag":"S","side":"library","good_end":"high","lib_group":"quality","source":"R2 s1 (first lesson wrong in 1 of 5 repeat pairs); D7 s3 W2 (5 of 8 seed examples had a check or history error); P-proponent line 27 (AgentBrew curator rejected 24 to 38 % of drafts).","note":"First lessons were wrong in 1 of 5 repeat pairs. But 5 of 8 seed examples had an error before refuters found it. An outside study rejected 24 to 38 % of drafted notes."},{"id":"l_found","group":"capture","low":0.2,"high":0.95,"best":0.6,"tag":"G","side":"other","source":"No source for a chance. Hints: R9 s1.1 (50 of 233 non-merge commits on main are fixes); F1 s3 (about 128 open defects stay in the register); F3 s8 (183 minor findings with no status).","note":"Hint. 50 of 233 commits on main were fixes. About 128 known defects sit open in the register, and 183 findings have no status. None counts escapes found against escapes never found."},{"id":"R_rework","group":"capture","low":5,"high":60,"best":15,"tag":"G","side":"other","source":"R9 s1.4 (a fix in a main session at 430 to 544k per call, 10 to 30 calls; R9 marks it an estimate).","note":"Estimate: a fix in a main session takes 10 to 30 calls (R9, itself a guess). The high end allows a production incident."},{"id":"fix_on_found","group":"capture","low":0.05,"high":0.8,"best":0.3,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source for a chance. Hints: W L09-4 (a correction reached two files; verdicts.txt:30 still carries 742 s); W L10-2 (a refuted line was rewritten and still stands); W L08-2 (the record still says \"They can\").","note":"Hint. In three real cases a correction did not reach every stored copy. An old figure, a refuted line and a refuted claim all still stand. Three cases, no rate."},{"id":"delta_stale","group":"capture","low":0.01,"high":0.25,"best":0.05,"tag":"G","side":"library","good_end":"low","lib_group":"quality","source":"No source for a rate. Hints: R3 s1 (the fix's own lines stay in main: 47 of 50 keep half or more); R10 s1.5 (fix footprint unchanged: 61 % at 1 day, 13 % at 30 days); R6 (value half-life 2 to 11 months, unmeasured).","note":"Hint. 3 of 50 fixes lost half their lines within about two months. Yet 87 % of fix footprints changed within 30 days. One period is 30 days (brief R6)."},{"id":"retire_bad","group":"capture","low":0,"high":0.3,"best":0.05,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source for a rate. Brief section 13, R12 (both designs have a step that withdraws, replaces or invalidates entries); refute-map.md C3 and C8b (bad entries fading at the stale rate).","note":"No measurement. Both designs can withdraw, replace or invalidate an entry, but no entry was ever retired. The middle value equals the staleness rate; the low end, 0, means bad entries never leave."},{"id":"episodes_per_period","group":"time","low":50,"high":1500,"best":300,"tag":"G","side":"other","source":"No source for a count of pieces of work. Hints: R3 s1 and F3 s8 (FixFlow 233 non-merge commits in 64 days; Clinic 432 commits in 8 days); F2 s4 (20 hard encounters per 8 weeks).","note":"Hint. About 110 commits per 30 days in FixFlow, and about 1,600 at the Clinic's pace. Also 20 hard encounters per 8 weeks. A piece of work is not a commit."},{"id":"periods","group":"time","low":6,"high":36,"best":12,"tag":"G","side":"other","source":"Run setting (map.json). Hints: R6 (mid-tier models arrive every 90 to 141 days; value half-life 2 to 11 months, unmeasured).","note":"A chosen horizon, not an unknown, and not drawn in the ensemble. 12 periods of 30 days is one year; mid-tier models arrive every 3 to 5 months.","run_setting":true,"integer":true}]},"lims":{"title":"Library limitations, merged and placed on the map","date":"2026-11-12","status":"Map evidence. No fixes, no verdicts. Built by docs/program/evidence/library-pathways/build-limitations.js.txt.","counting":{"unit":"one walk = one real case (59 in all).","breaks_read":119,"rule":"A walk counts for an item when a break merged into the item names it in the *-walk.md Breaks section, or a quoted walk note shows it. Two items list an extra walk from a walk note.","per_break_differences":[{"break":2,"family":"L01","cases_hit":2,"walks_counted":3},{"break":7,"family":"L01","cases_hit":3,"walks_counted":4}],"per_break_differences_n id":"LIM-16","key":"partial_matches_disagree","main_step":4,"title":"Partial matches disagree, and nothing says which governs","what":"Two or more entries partly match and disagree, or sit in different states: withdrawn, narrowed, pending. They can look like they add up when only one can hold. Nothing tells the cheap model which.","steps":[4,6],"real":{"cases":3,"families":2,"tag":"M","family_ids":["L06","L07"],"case_ids":["L06:C3","L06:C4","L07:L07-2"],"examples":[{"case":"L06:C4","family":"L06","evidence":"1c546a3: 'traded a DoS for a much worse brute-force hole'."},{"case":"L07:L07-2","family":"L07","evidence":"HB:247 withdrawn, HB:263 narrowed, HV2:371 refuted but unchanged"}]},"contradicted":[{"family":"L10","family_name":"existing libraries over time","cases":["L10:L10-3"],"reason":"The two Python notes were complementary, and the orchestrator's brief merged them correctly."}],"params":["r_comp_part","q_comp","f_false"],"shown":"yes"},{"id":"LIM-17","key":"half_right_anchor","main_step":4,"title":"Half-right entries make an open problem look closed","what":"An entry returned as solved was half right; the defect sat inside the stored fix. A cheap model reading it would conclude the problem was closed and stop looking.","steps":[4,6],"real":{"cases":3,"families":1,"tag":"M","family_ids":["L06"],"case_ids":["L06:C1b","L06:C2","L06:C4"],"examples":[{"case":"L06:C4","family":"L06","evidence":"0a40416: 'always self-healing'."},{"case":"L06:C2","family":"L06","evidence":"834311f: 'never a duplicate' vs handoff B3: 'The claim row is flush-only'."}]},"contradicted":[{"family":"L04","family_name":"vendor build deploy","cases":["L04:C4"],"reason":"The half-right '172.16.0.0/12' was in Sonnet's window and did not anchor it. A concrete wrong value was easy to refute against the machine's own output."},{"family":"L08","family_name":"cross project","cases":["L08:L08-2"],"reason":"Helper windows followed the live tool message over the wrong brief. Harm stayed at wasted output hed note","text":"The pushed Python note worked at no extra cost. Three agents carried its remedy in the same command as the probe, on 11-09 and 11-12."},{"case":"L08:L08-1","family":"L08","tag":"M","basis":"seen","channel":"the memory index","text":"The memory index put the long-paths fix into a sibling session before its first clone; that clone never failed."},{"case":"L05:L05-4","family":"L05","tag":"G","basis":"estimate","text":"A lookup by the failing test's name would have hit the root's entry. It would have saved a wrong fixture commit, its revert, stopped runs and one Opus review."},{"case":"L05:L05-3","family":"L05","tag":"G","basis":"estimate","caveat":"The check that held belongs to the earlier knowledge-store design, not to the owner's library design. The same walk rates the check step as broken: the only verdict on the failure was a rerun.","text":"The check held. An exact match to an old, fixed cause was tested and came back 'does not apply'. No wrong fix was applied."},{"case":"L06:C4","family":"L06","tag":"G","basis":"estimate","channel":"CLAUDE.md","text":"After the first solve, a do-not-apply entry would block the handoff's wrong advice. That advice would let a 4-digit PIN be guessed without limit. CLAUDE.md already warns of it."},{"case":"L06:C2","family":"L06","tag":"G","basis":"estimate","text":"The action words 'enable dispatcher' reach the stored hazard. That prevents the measured replay: 36 messages about months-old jobs, plus permanent suppressed rows."},{"case":"L03:C5","family":"L03","tag":"G","basis":"estimate","text":"The builder's own words 'offline presence outbox' reach the right entry. Had a lookup fired, it would have saved three days of stuck badges and a rework commit."},{"case":"L09:L09-2","family":"L09","tag":"M","basis":"seen","channel":"the project's own conventions file","caveat":"The same walk says a lookup would have saved nothing at the time. No entry could exist before the first failure, and the fix took about a minute.", und weeks later."},{"id":"build-new-from-old","name":"Building new beside old","covers":"New features built next to older ones that held the same hazard."},{"id":"vendor-build-deploy","name":"Outside vendor causes","covers":"Build and deploy failures caused by Expo, Railway, Docker and Windows."},{"id":"flaky-race-data","name":"Races and flaky failures","covers":"Failures that do not repeat on demand, or depend on timing and other processes."},{"id":"composite-merge","name":"Two correct pieces, one fault","covers":"Fixes that were right alone but wrong when merged."},{"id":"research-design","name":"Research and design cases","covers":"Research verdicts, plans and lessons that later proved wrong or ignored."},{"id":"cross-project","name":"Across projects","covers":"Facts learned in one project that another project needed."},{"id":"ladder-real-life","name":"The ladder in real life","covers":"Cases where top models made or endorsed the error."},{"id":"libraries-over-time","name":"Existing notes over time","covers":"How the owner's small libraries behaved as facts aged."}],"cases":[{"id":"f01-C1a","family":"same-mistake","title":"Python is missing on this PC","story":"A session found no usable python on this PC and wrote the fix down. Ten minutes after a compaction dropped the 'no Python' line, a top model typed a python heredoc again.","when":"First fix 2026-10-06; repeat 2026-11-01","source":"Clinic session 1f10835f; session e24f17dc line 2928","entry":"Python or python3 exits 49 (Microsoft Store stub). A real Python 3.12.14 sits in the Codex app folder. Call that full path, or use node or PowerShell for small JSON work. Check: the path with --version prints 3.12.14.","steps":[{"step":1,"status":"strains","note":"The window points toward Python, because CLAUDE.md names Python 3.12. A summary that said 'no Python' was replaced by one without it."},{"step":2,"status":"not_specified","note":"The owner's design names no trigger. A shell tool error is not a trigger in the earlier knowledge-store design. Only the exit-49 result could start a lookup, after the call.","ks":true},{"step":3,"status":"works","note":"The error text is word for word and easy to recognise."},{"step":4,"status":"works","note":"One entry matches exactly."},{"step":5,"status":"strains","note":"This is the main session. The entry is held until the next compaction, and this session already lost the fact once at a compaction."},{"step":6,"status":"works","note":"Swap python for the full path. A plain JSON script runs on 3.12."},{"step":7,"status":"works","note":"The rerun's exit code decides, at no cost."},{"step":8,"status":"not_reached","note":"The failing model is already the top rung. A stronger model would make the same call."},{"step":9,"status":"breaks","note":"Python was a side stumble. The earlier knowledge-store design needs a fix commit and a control pair, which a PC fact lacks. Memory got it 29 days later.","ks":true},{"step":10,"status":"breaks","note":"The interpreter belongs to another app, which rewrote its folder on 2026-10-21. Newer Pythons arrived later. No repository event marks any of this.","ks":true}],"worked":""},{"id":"f01-C1b","family":"same-mistake","title":"Python error, but this project uses uv","story":"A subagent typed bare python while its window held the project's 'uv run --locked python' route. It failed, then recovered with diff and grep on the next call.","when":"2026-11-09","source":"Clinic subagent agent-a87e4f07079fc62e5","entry":"Same as the python entry, or the memory line. Python is not on PATH in Git Bash (a Windows Store alias); use node for JSON.","steps":[{"step":1,"status":"strains","note":"The project's right route, uv run, was already in the window. The agent typed bare python anyway."},{"step":2,"status":"not_specified","note":"Same as before. No trigger fires before the call."},{"step":3,"status":"works","note":"The error text is the same word for word."},{"step":4,"status":"strains","note":"Same error, different right answer. The entry says node or Codex 3.12. This project uses uv with locked 3.13 packages."},{"step":5,"status":"works","note":"The subagent window holds it for its short life."},{"step":6,"status":"strains","note":"Fine for a JSON compare. For anything that imports project code it points to the wrong interpreter and away from uv run."},{"step":7,"status":"works","note":"The result is immediate."},{"step":8,"status":"not_reached","note":"The agent is already Opus."},{"step":9,"status":"not_specified","note":"No rule says whether the clinic variant is stored as a sibling, a revision, or not at all."},{"step":10,"status":"breaks","note":"Two project memories disagree about one PC. EMS says use node for JSON. The clinic says uv run python. The design has no project field.","ks":true}],"worked":""},{"id":"f01-C1c","family":"same-mistake","title":"A stored 'no' about tools that exist","story":"A design note said no Python and no gh. Six minutes later gh was installed. Python had been in use since 10-06. Clinic memory later stored 'no uv', then uv was installed.","when":"2026-10-31 to 2026-11-02","source":"Commit 53f3a5c, ORCHESTRATION-DESIGN line 39; HARNESS-REVIEW line 276","entry":"No Python and no gh on this PC. Design around them. Run backend gates only in Docker.","steps":[{"step":1,"status":"works","note":"A session planning work here would look up which tools exist."},{"step":2,"status":"not_specified","note":"No error occurs when an agent avoids a tool it wrongly believes is missing."},{"step":3,"status":"strains","note":"'Is there Python?' is a plain-language question. Only plain-language handles could match it.","ks":true},{"step":4,"status":"works","note":"The entry is returned. That is the problem."},{"step":5,"status":"works","note":"Any window can hold it."},{"step":6,"status":"breaks","note":"The cheap model designs around tools that exist, such as Docker-only gates. Nothing it does fails."},{"step":7,"status":"breaks","note":"A stored 'no' never fails loudly. The agent just does not try. Only a separate review caught it on 11-01."},{"step":8,"status":"not_reached","note":"There is no failure to hand up."},{"step":9,"status":"breaks","note":"The writer checked PATH only. It wrote 'no gh' six minutes before installing gh, and 'no Python' while Python had been in use since 10-06."},{"step":10,"status":"breaks","note":"gh arrived 10-31 and uv 11-02. Corrections landed separately in a doc, a memory note and the design. The clinic copy is stale.","ks":true}],"worked":""},{"id":"f01-C2a","family":"same-mistake","title":"Bash cuts long heredoc commands","story":"Bash commands over about 8 KB fail with an unexpected-EOF error and write nothing. Four later moments repeated it, once by the note's own writer a day after writing it.","when":"First 2026-10-31; repeats to 2026-11-12","source":"Session e24f17dc; sessions 701c2346, agent-ac87b78","entry":"A Bash cat heredoc fails at about 9,800 characters with 'unexpected EOF while looking for matching quote'. The file is not written. The tool cuts long commands. Write the file with the Write tool. Dead end: re-sending the heredoc.","steps":[{"step":1,"status":"strains","note":"The entry is in the window, pushed at start. So is the Bash tool's own advice to use a heredoc. They pull opposite ways."},{"step":2,"status":"breaks","note":"The cost is the failed call itself, 8.6k to 18.6k characters sent twice. A lookup can only follow the error. Nothing fires before the call."},{"step":3,"status":"works","note":"'unexpected EOF while looking for matching' is word for word."},{"step":4,"status":"works","note":"One entry matches exactly."},{"step":5,"status":"works","note":"It was delivered by push into main and subagent windows. The pull-only route in the earlier knowledge-store design would deliver less.","ks":true},{"step":6,"status":"breaks","note":"The condition is the length of the agent's next output, which it does not measure."},{"step":7,"status":"works","note":"Exit code 2 comes at once."},{"step":8,"status":"not_reached","note":"Sonnet, Opus and Fable all fail the same way."},{"step":9,"status":"strains","note":"First failure was 10-31. The note came on 11-11 after the 40-error peak day, in a batch memory edit, not at a solve.","ks":true},{"step":10,"status":"strains","note":"The limit belongs to the tool version, not a repository. No footprint item sees a tool upgrade."}],"worked":""},{"id":"f01-C2b","family":"same-mistake","title":"Four agents, same long command, same day","story":"Four Opus agents each wrote four slide files in one cat command of 10 to 11k characters. All failed within six seconds. One recovered with four Reads and four Writes.","when":"2026-11-10","source":"Codex slides project, workflow wf_b4e7b31a-874","entry":"The Bash heredoc entry from the previous case. That project's memory has no Bash note.","steps":[{"step":1,"status":"strains","note":"This is a different project's memory. It has nothing about Bash limits."},{"step":2,"status":"breaks","note":"As before, the cost comes before any trigger."},{"step":3,"status":"works","note":"The error text is word for word."},{"step":4,"status":"strains","note":"It hits only if the library is shared across projects. The owner says it is. The earlier knowledge-store design is silent.","ks":true},{"step":5,"status":"breaks","note":"Four windows opened six seconds apart. No sibling could finish, record and serve another in time."},{"step":6,"status":"not_reached","note":"Nothing was delivered."},{"step":7,"status":"works","note":"The result is immediate."},{"step":8,"status":"not_reached","note":"All agents were Opus."},{"step":9,"status":"not_specified","note":"Four equal solvers of one stumble. The design does not say who writes, or how four near-duplicates merge."},{"step":10,"status":"not_reached","note":"No entry was written."}],"worked":""},{"id":"f01-C3a","family":"same-mistake","title":"Read cannot open PDF pages here","story":"Read on a PDF failed because pdftoppm is missing. The parent found a PowerShell route. Five hours later four new Opus agents hit the same error, because the briefs never mentioned PDFs.","when":"2026-10-16 to 2026-10-17","source":"Session e56a900a, parent and wave-2 agents","entry":"Read with pages on a PDF fails: pdftoppm is not installed. Python is the Store stub. Route: PowerShell reads the bytes, inflates FlateDecode streams and pulls the text. Works for the 41-page Google Docs PDF. Avoid the reserved variable $PID.","steps":[{"step":1,"status":"strains","note":"The brief, written by a parent that knew, has no word 'pdf'. Wave 1 hit the error four seconds before the parent did."},{"step":2,"status":"not_specified","note":"A Read tool error is not on the list of triggers.","ks":true},{"step":3,"status":"works","note":"The error text is word for word."},{"step":4,"status":"works","note":"This works if the parent's route was stored by 14:16Z."},{"step":5,"status":"works","note":"The subagent window holds it."},{"step":6,"status":"strains","note":"Some agents found cheaper pre-extracted text. The entry may pull toward the costlier route."},{"step":7,"status":"works","note":"Text appears or it does not."},{"step":8,"status":"not_reached","note":"Parent and children were all Opus and all failed alike."},{"step":9,"status":"breaks","note":"It was solved as an aside, with no mid-session capture point. Wave 2 started 5.5 hours later with nothing written. No note ever recorded pdftoppm.","ks":true},{"step":10,"status":"strains","note":"The route depends on how the PDF was made. Pre-extracted text exists for some files in one project only."}],"worked":""},{"id":"f01-C3b","family":"same-mistake","title":"PDF route, in another project, a month on","story":"Research subagents read saved PDFs. The brief named the Codex Python. A Sonnet agent extracted the text in two calls using pypdf. An Opus agent gave up on the PDF.","when":"2026-11-12","source":"Session e24f17dc, workflow wf_548351eb-ab1","entry":"The PDF entry owledge-store design.","ks":true},{"step":3,"status":"works","note":"'Filename too long' is word for word."},{"step":4,"status":"works","note":"One entry matches exactly."},{"step":5,"status":"strains","note":"Siblings run in parallel. A mid-workflow entry reaches only agents started after it, and only by pull."},{"step":6,"status":"works","note":"One flag fixes it."},{"step":7,"status":"works","note":"git add succeeds or it does not."},{"step":8,"status":"not_reached","note":"All agents were Opus."},{"step":9,"status":"strains","note":"None of the six had capture duty. Each got out alone. The note came next day from another session after 15 more failures."},{"step":10,"status":"breaks","note":"A tool update removed the cause about three hours after the note. The note still says the path is about 170 characters."}],"worked":""},{"id":"f01-C4b","family":"same-mistake","title":"'Name too long' with a different cause","story":"'ENAMETOOLONG' came from commands over Windows' 32,767-character line limit, not from paths. Two of these contain no git at all.","when":"2026-11-01 to 2026-11-10","source":"Clinic Opus 11-01; two Sonnet agents 11-04; Codex Sonnet 11-10","entry":"The git longpaths entry and the Bash heredoc entry.","steps":[{"step":1,"status":"strains","note":"Agents pasted very large scripts into one Bash call."},{"step":2,"status":"not_specified","note":"Same as before."},{"step":3,"status":"strains","note":"The error words name a path. The cause is command length. The query carries the wrong cause."},{"step":4,"status":"breaks","note":"'name too long' is a piece of 'Filename too long'. The design matches template fragments, so the git entry is the hit.","ks":true},{"step":5,"status":"works","note":"The match works mechanically."},{"step":6,"status":"breaks","note":"The git flag cannot shorten a 40k command. A shorter scratchpad path does not either."},{"step":7,"status":"works","note":"The rerun fails again, one wasted call before real diagnosis."},{"step":8,"status":"not_reached","note":"No escalation happens."},{"step":9,"status":"strains","note":"The agents' own fix, shorter commands and then Write, was never recorded."},{"step":10,"status":"strains","note":"After the path change the git entry is stale for its own symptom, yet still matches this one."}],"worked":""},{"id":"f01-C5","family":"same-mistake","title":"A constant-time compare copied to a webhook","story":"The ops token gate used hmac.compare_digest on text. Seven days later the same pattern guarded the WhatsApp webhook. A non-ASCII byte turns it into a server error. Review found it 20 days on.","when":"2026-07-01 stored; 2026-07-08 copied; found 2026-07-28","source":"Commits bfb5714, 834311f, 2fe77f5","entry":"Ops proxy-token gate. A FastAPI dependency reads X-Ops-Proxy-Token. 401 if unset. Constant-time compare with hmac.compare_digest(x or '', expected). 401 on mismatch. Router tests for right, wrong and missing token pass.","steps":[{"step":1,"status":"works","note":"The later author had the ops gate file in the repository either way."},{"step":2,"status":"breaks","note":"Nothing failed. Writing new code is not a trigger. The diff warning fires only on stored hazards, and none existed before 07-28.","ks":true},{"step":3,"status":"strains","note":"If asked, 'constant-time compare of a webhook token' is a plain-language query."},{"step":4,"status":"breaks","note":"It returns the ops gate solution, which contains the defect, stored as solved by a top model."},{"step":5,"status":"works","note":"The match works mechanically."},{"step":6,"status":"breaks","note":"Copying the stored pattern spreads the defect to a public webhook. That is what happened without a library."},{"step":7,"status":"breaks","note":"Tests passed. Output equal to the strong model's was the defect."},{"step":8,"status":"breaks","note":"Both writers were the top rung of their day. The bug surfaced only through a later review."},{"step":9,"status":"works","note":"The 07-28 fix is a clean ca C1","family":"silent-defect","title":"A queued 'ready' could reopen a billed job","story":"Job status changes never read the current status. A queued 'ready' replayed after a close reopened a settled, billed job. Tests were green. A technician noticed in production weeks later.","when":"Landed 2026-06-07; found 2026-07-27","source":"Commits 187ebb1, 383dea7, f440222 (PR #162)","entry":"Job lifecycle. Append-only job_event rows. POST /jobs/{id}/transition with action ready, close, abandon, reschedule or haul. Each action updates the job and appends an event. Check: 7 service tests, 4 router tests, 2 real-database tests.","steps":[{"step":1,"status":"strains","note":"A later session got 'wire the bill sheet', which is a task. Nothing in its window says a button can strand a job."},{"step":2,"status":"breaks","note":"Tests were green. Nothing failed, so nothing asks. The first signal was a technician in production weeks later."},{"step":3,"status":"breaks","note":"Any query names the task, not the hazard of a 'ready' replayed after 'close'."},{"step":4,"status":"breaks","note":"'transition' and 'ready' match the old entry, which is the defect. The correct pattern is filed under money words and does not match."},{"step":5,"status":"not_specified","note":"The design does not say whether the entry goes to the session or to a subagent writing one screen."},{"step":6,"status":"breaks","note":"Adapting the old entry reproduces 'dispatch on the action alone'. Nothing in it says to read the current status."},{"step":7,"status":"breaks","note":"The old checks test each transition from one state. The every-action-from-every-status matrix came only with the fix. The stored check passes the copy."},{"step":8,"status":"breaks","note":"No model failed. A technician noticed. The failing parts were written by top models."},{"step":9,"status":"strains","note":"Next day a red-team found its freeze parked landed writes as conflicts. Recording before the PR is ready stores the half-right ee times. Open item: hashtext is 32-bit, so a collision serializes unrelated keys. Item lock is select_for_update.","steps":[{"step":1,"status":"strains","note":"Slice sessions open on large context. S07 read 392,125 characters in nine minutes before its lock. S04 averaged about 231k cached tokens per call."},{"step":2,"status":"breaks","note":"Writing a lock raises no error. The kernel retries deadlocks. select_for_update is too common to pass the selectivity gate.","ks":true},{"step":3,"status":"strains","note":"'Lock the item before posting' finds a lock of the right shape and wrong strength."},{"step":4,"status":"breaks","note":"The best matches are the defect sources. The sibling is the problem."},{"step":5,"status":"works","note":"The row entered S07's main window nine minutes before the copy, with no compaction between."},{"step":6,"status":"breaks","note":"S07 wrote the 32-bit lock anyway. The row said 'P3' and named an owner elsewhere. S04 wrote the item lock row FOR UPDATE."},{"step":7,"status":"breaks","note":"Tests pass, and deadlocks are retried. An Opus review found S04's deadlock by tracing. A staging drill found the hash collision."},{"step":8,"status":"strains","note":"The higher tier caught it as a diff reviewer, not because the builder failed and handed up. The builder never knew."},{"step":9,"status":"works","note":"S04 wrote a decision record and a conventions line the same day, naming the sites still wrong. The conventions file did the capture."},{"step":10,"status":"breaks","note":"S03 merged before S04 learned the rule, and was fixed five days later. The kernel went 64-bit on 11-06. Two copies are still 32-bit."}],"worked":"The slice's own conventions file captured the rule the same day."},{"id":"f03-C5","family":"build-new-from-old","title":"Mobile offline queues after the jobs outbox","story":"The first outbox deleted any write answered with a non-network error. Later queues copied the lesson. The presence queue lacked a 4xx test for three ayed green. The fix came from comparing with an earlier working build on a side branch.","when":"2026-06-26","source":"Commits 6928828, b7a5b98, a6f9048","entry":"Trap. EAS Android build errors in 'Run gradlew' after the Sentry package was added to app.json plugins. The plugin adds a Gradle upload step that needs an auth token. Remove it from plugins. The SDK still autolinks. CI cannot see this.","steps":[{"step":1,"status":"strains","note":"Opus 4.8 held the failure and the repo. The decisive fact, that build 14 came from a side branch, was in no window."},{"step":2,"status":"works","note":"'Before retrying a failed build or deploy' fires.","ks":true},{"step":3,"status":"strains","note":"The query is the build log, which reaches a session only when the owner pastes it. The commit quotes only an error code.","ks":true},{"step":4,"status":"strains","note":"An earlier entry comes back as a candidate or as a lead. Nothing exists for the later version bumps."},{"step":5,"status":"works","note":"One card in the calling window, at most 2,000 characters."},{"step":6,"status":"works","note":"Remove one string from app.json plugins. Nothing to adapt."},{"step":7,"status":"breaks","note":"The real check is the next EAS build, which fails again on three version bumps.","ks":true},{"step":8,"status":"strains","note":"The second failure escalates with only a lookup id. Opus needs a new pasted log and the build-14 comparison. Neither travels in the brief."},{"step":9,"status":"works","note":"The fix meets the write rule, because a build was burned. The version-bump cause is stored as a separate pin.","ks":true},{"step":10,"status":"works","note":"A phase-close scan labels a stranded fix 'fix not on main'. The auth-token precondition is an EAS-side secret and can never be probed.","ks":true}],"worked":""},{"id":"f04-C2","family":"vendor-build-deploy","title":"Empty env value rejected by eas.json","story":"A build profile carried an empty Sentry DSN meant as 'off'. EAS rejects empty env values. Every build failed before starting. CI's JavaScript export never reads eas.json.","when":"2026-07-18 written; 2026-07-20 and 08-03 repeats","source":"PR #143; commits 140428c, 79a8dd4, a31924a","entry":"Trap. Every eas build fails schema validation: an env value is 'not allowed to be empty'. The file eas.json carries EXPO_PUBLIC_SENTRY_DSN, the crash-report address, as an empty string. Remove the keys; unset already means off. To enable Sentry, add the key with a real DSN.","steps":[{"step":1,"status":"strains","note":"The task was a feature, 'wire the DSN, empty means off', run by Fable. A cheap model shares the blind spot."},{"step":2,"status":"works","note":"At 07-20 the failed build triggers. At 08-03 the diff check runs at the first commit. At 07-18 nothing could fire, because no entry existed.","ks":true},{"step":3,"status":"works","note":"The EAS message names the key and the rule and is short to paste. At 08-03 the query is the diff itself."},{"step":4,"status":"works","note":"At 07-20 an out-of-vocabulary rule turns a Sentry-word tie into a miss. At 08-03 the entry matches on the eas.json env key.","ks":true},{"step":5,"status":"works","note":"One warning line and one card in the session's window."},{"step":6,"status":"works","note":"Trivial: the value must be non-empty."},{"step":7,"status":"strains","note":"At 07-18 the gate cannot see eas.json validity, and the strong model wrote the defect. A cheap output equal to Fable's is equally broken."},{"step":8,"status":"not_reached","note":"The error explains itself. No escalation is in the record."},{"step":9,"status":"works","note":"This is the design's model entry: the data value is the cause, with a control pair present and absent.","ks":true},{"step":10,"status":"works","note":"At 08-03 the warning fires and is right. It adds nothing measurable over CLAUDE.md, which already carried the rule."}],"worked":"At 08-03 the diff warning fired at the first commit and was right."},{"id":"f04-C3","family":"vendor-build-deploy","title":"Floating base image breaks the Railway build","story":"A Dockerfile hardcoded the bookworm package line, but the floating python:3.12-slim image moved to trixie. The image build failed and production stayed on the old version.","when":"2026-06-16","source":"Commits afb7065, 9c561b0; deploy workflow first run","entry":"Trap. Railway image build fails: postgresql-client-17 cannot be installed. The Dockerfile hardcodes the bookworm-pgdg apt line, but python:3.12-slim now follows trixie. Build the line from the image's VERSION_CODENAME. CI does not build this Dockerfile.","steps":[{"step":1,"status":"strains","note":"The first deploy run failed. The writer believed 'bookworm ships 15', the same picture a cheap model brings from training."},{"step":2,"status":"works","note":"'Before retrying a failed deploy' fires.","ks":true},{"step":3,"status":"strains","note":"The apt error sits in the Railway build log. The session may reach the Actions log through gh. The Railway log needs a paste.","ks":true},{"step":4,"status":"works","note":"First time: the store is empty for this. A miss is the right answer."},{"step":5,"status":"not_reached","note":"Nothing is delivered on a miss."},{"step":6,"status":"not_reached","note":"Nothing to adapt."},{"step":7,"status":"breaks","note":"The authoritative check is a re-triggered Railway deploy. The strong model's own output was the defect, so 'equal to the strong model' is not success."},{"step":8,"status":"strains","note":"Miss, claim, then escalate with the lookup id only. The receiving Opus must fetch the build log again."},{"step":9,"status":"strains","note":"It meets the write rule, because a deploy was burned. 'Won't break on the next base-image change' predicts a vendor.","ks":true},{"step":10,"status":"strains","note":"A floating tag moves with no local trace, so the store cannot re-check the entry. The Dockerfile comment carried the lesson at no cost.","ks":true}],"worked":""},{"id":"f04-C4","family":"vendor-build-deploy","title":"Staging VM unreachable after a PC reboot","story":"After a reboot the Hyper-V switch gets a new address range. The firewall rule allowed ssh only from the old one. The 11-04 entry was half right and spread through three later documents.","when":"2026-11-04 entry; 2026-11-09 recurrence","source":"Staging rig scripts; commit db6c8fa; session S11 lead","entry":"Trap (staging rig). After a PC reboot rig.sh start brings the VM up at a new address, then 'ssh did not come up'. The Default Switch gets a new /20 inside 172.16.0.0/12 each boot. The rule must name 172.16.0.0/12.","steps":[{"step":1,"status":"works","note":"Sonnet 5.5 held the drills task, the rig scripts and the provision script with its comment in a resumed window."},{"step":2,"status":"works","note":"rig.sh start failed after 5 min 23 s, so 'before retrying a failed deploy' fires."},{"step":3,"status":"works","note":"The command output is local. No paste is needed."},{"step":4,"status":"breaks","note":"It returns the 11-04 entry, which is half right. The error line is a generic ssh wait failure and fits any reason ssh is down."},{"step":5,"status":"works","note":"The card lands in the main window. The compaction summary kept the subnet fact."},{"step":6,"status":"not_reached","note":"The entry's fix was already applied. Nothing to adapt."},{"step":7,"status":"breaks","note":"The store then learns 'not this entry' for a recurrence of the entry's own cause.","ks":true},{"step":8,"status":"not_reached","note":"Sonnet solved it in two turns without escalating."},{"step":9,"status":"breaks","note":"Nothing can test the generalisation from two samples, yet it is stored as fact."},{"step":10,"status":"breaks","note":"Repair needs two Opus calls for a two-turn Sonnet fix. Cross-project use is not specified. On a real host 'both private blocks' is wrong."}],"worked":""},{"id":"f04-C5","family":"vendor-build-deploy","title":"Queued writes deleted on a non-network error","story":"A event, so the entry stayed validated. Reuse spread its premise to queues where a 4xx means drop.","ks":true}],"worked":""},{"id":"f05-1","family":"flaky-race-data","title":"Old queued completion replays over a newer one","story":"An offline completion is replayed over a newer live one. The fix drops the queued copy after a live send. Later it deleted a real queued completion when the live send was a blank form.","when":"Fixed 2026-07-03; door found 27 days later","source":"Commit 76061e0; later 8dafcec; completionPrefill.ts lines 26-30","entry":"Mobile outbox defect. A completion queued offline is replayed over a newer live send under the same stable id. Fix: after a successful live send, remove the queued item. Payments and notes use unique ids, so they never collide.","steps":[{"step":1,"status":"strains","note":"Later tasks are features. The race is not a problem the model has. Only CLAUDE.md's always-loaded known-defect note names it."},{"step":2,"status":"works","note":"No error, so no lookup after failure. The diff check matches named handles on changed lines, and an outbox edit warns.","ks":true},{"step":3,"status":"works","note":"The diff check is mechanical. The model does not choose the words."},{"step":4,"status":"strains","note":"Two entries look like one problem: 'stale write over newer send: fixed' and 'same id, concurrent flush: open'."},{"step":5,"status":"works","note":"One warning line per entry in the main session and the decisions journal. The Opus reviewer rules.","ks":true},{"step":6,"status":"breaks","note":"The only stored fix is a rule: on live success, drop the queued copy. Adapting it to a new kind copies the door."},{"step":7,"status":"breaks","note":"A race's footprint is identical in a good and a bad run. The old Jest case passes even where its rule destroys a bill.","ks":true},{"step":8,"status":"breaks","note":"Nothing fails in a session. In the field the winner is whichever request the server finishes last. Nothing climbs. The finder
