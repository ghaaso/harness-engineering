strains","note":"Nothing to adapt. The entry only rules out one cause. The model then does what it did without a library: rerun once more."},{"step":7,"status":"breaks","note":"But the only verdict on the failure is the rerun. It passed with no fix, so 'resolved' is recorded for nothing.","ks":true},{"step":8,"status":"breaks","note":"Escalating hands up the same silence: dots, one watchdog line, no test id, no stack, machine state gone. A higher model gets no more evidence."},{"step":9,"status":"breaks","note":"Nothing is solved, so nothing is written. The next stall starts from zero.","ks":true},{"step":10,"status":"strains","note":"The 11-05 entry stays validated and matches every stall's exact line. Each non-crash stall pays a lookup and a 'not applies'."}],"worked":""},{"id":"f05-4","family":"flaky-race-data","title":"Flaky clinic tests read random tags as figures","story":"Attack tests fail by chance. A number helper reads ids, a CSRF token (a random form value) and random hex tags as money figures. Three writers made three fixes in about 7 hours.","when":"2026-11-05, about 7 hours, three fixes","source":"Commits 44d115b, 6ac4577, 8259fa3; transcripts df1db0b9 line 1369","entry":"Flaky test, clinic withholding tests. Attack tests S09 and S07 fail by chance when two numbers on a page differ by a hidden amount. The helper numbers() reads ids, the CSRF token and random hex tags as figures. Fix: strip those; a unit test pins what is read and ignored.","steps":[{"step":1,"status":"works","note":"Sonnet was in a faster-check session. The task is speed. The failing assertion is in the run log."},{"step":2,"status":"works","note":"An unexpected gate error is looked up before retry.","ks":true},{"step":3,"status":"strains","note":"The canonicaliser masks hex runs, ids and free numbers. A figure coinciding with a hex tag is the only clue, and masking removes it.","ks":true},{"step":4,"status":"works","note":"At 23:49 UTC the test frame hits the root's entry. At 23:00, in a file outside its footprint, a miss is likely."},{"step":5,"status":"works","note":"The main Sonnet session gets a candidate card with a summary and unverified negatives, no fix. The branch lacks the fix commit."},{"step":6,"status":"strains","note":"The summary gives the cause, not the fix. The root's fix is half right: a review found its mask 'would hide SYN Till 654321 moved'."},{"step":7,"status":"strains","note":"A planted-tag unit test makes the chance repeatable, so a control pair can flip. The session's own check was 'tests passing'."},{"step":8,"status":"strains","note":"A second Opus review caught the wrong sequence guess. The same review approved a retry delay that was still over the race window."},{"step":9,"status":"strains","note":"Three writers made three fixes for one cause in about 7 hours. The write trigger likely skips the root's routine fix.","ks":true},{"step":10,"status":"strains","note":"In-project, a later test fails at merge naming random_tag, so the entry becomes redundant. Cross-project, FixFlow's backend has no Hypothesis and no uuid4().hex labels."}],"worked":""},{"id":"f05-5","family":"flaky-race-data","title":"Two pytest runs deadlock on one test database","story":"22 integration tests failed together with no code change. A lone rerun passed. Two pytest processes, from different sessions, shared one test database and deadlocked on its schema setup.","when":"Recorded in commit 65c2c3b","source":"Commit 65c2c3b; HANDOFF lines 133-134","entry":"Trap, FixFlow backend tests. Many integration tests fail together (22 in one run) with no code change; a rerun alone passes. Two pytest processes ran against one test database. Never run two pytest processes against that database at once.","steps":[{"step":1,"status":"works","note":"In FixFlow, a test run with 22 red tests puts the failure in the window."},{"step":2,"status":"works","note":"An unexpected gate error is looked up before retry.","ks":true},{"step":3,"status":"breaks","note":"The deciding fact, a second pytest process from another session, is in no log the failing session holds."},{"step":4,"status":"strains","note":"At best a candidate. In the clinic, a word match returns a rule with a different mechanism.","ks":true},{"step":5,"status":"strains","note":"In FixFlow the runner can be a subagent in a worktree. Its window starts empty and cannot see the sibling agent holding the lock."},{"step":6,"status":"strains","note":"The fix is a rule about other sessions. The failing agent cannot stop the other process. It can only rerun alone."},{"step":7,"status":"breaks","note":"Process state at the moment of failure is gone once the other process exits. No check, no control pair."},{"step":8,"status":"strains","note":"It was traced once. The cost of that trace is recorded nowhere and the session is gone."},{"step":9,"status":"works","note":"HANDOFF traps are seeded as trap entries. A one-line rule is cheap and true in FixFlow.","ks":true},{"step":10,"status":"breaks","note":"In the clinic, 'never two at once' contradicts the designed two slots and misses its mechanism, a database drop.","ks":true}],"worked":""},{"id":"f05-6","family":"flaky-race-data","title":"Clinic socket refusal retry and its timing","story":"A race test failed 2 of 22 runs with 'No buffer space available' on loopback. A 0.05 s retry was added. Reviews found its total delay could make a call look blocked.","when":"Commits dd74a3d and 030c6cb; reviews over several hours","source":"Commits dd74a3d, 030c6cb; round2.md line 8; task.md lines 105, 344","entry":"Gate flake, clinic check on Windows. The serial race pass fails on loopback connect with 'No buffer space available (10055)'. The helper connect_retry retries psycopg.connect up to 6 times, for that message only. Delay is 0.05 s per attempt, under the race window's 0.6 s.","steps":[{"step":1,"status":"works","note":"A full-check log with a refused connect in a race test is in the window."},{"step":2,"status":"works","note":"An unexpected gate error is looked up before retry."},{"step":3,"status":"works","note":"The error line is exact and distinctive."},{"step":4,"status":"works","note":"Exact template, one recorded cause: a clean hit."},{"step":5,"status":"works","note":"The main session holds it."},{"step":6,"status":"strains","note":"Copying the retry copies a hidden coupling: its total delay against another test's timing window. The entry's words and footprint do not name that coupling."},{"step":7,"status":"breaks","note":"The retry's unit tests pass. The safety claim had no test until later. The race tests it protects passed under load with a broken lock."},{"step":8,"status":"breaks","note":"An Opus review approved 0.05 s per attempt. The Fable root caught it at the gate. The middle rung endorsed a wrong fix."},{"step":9,"status":"breaks","note":"Written at solve time, the entry stores the record's false sentence that a retry cannot make a call look blocked."},{"step":10,"status":"strains","note":"It was fixed in place within hours. An entry from 030c6cb must be superseded, which needs an Opus actor and a second Opus approver.","ks":true}],"worked":""},{"id":"f06-C1a","family":"composite-merge","title":"Carry-in job loop: five faults composing","story":"A technician reported a job that never left 'ongoing' and photos re-demanded. Five faults composed into one loop. A cheap fix of the visible fault would have stopped there.","when":"Found 2026-07-27","source":"PR #162, commit 4a40423; stored fix from 67218b1 (2026-06-10)","entry":"Two technicians can both claim one job. Fix: one atomic conditional UPDATE, unassigned-or-mine and not closed. The loser gets 409 naming the holder. Re-claiming your own job is an idempotent 200 with no second event. Check: two concurrent claims.","steps":[{"step":1,"status":"strains","note":"A field complaint with no error text. Nothing hints that five faults compose."},{"step":2,"status":"breaks","note":"No error, no failed gate. A cheap model fixes the visible fault and stops. The real signal was the technician hitting it again."},{"step":3,"status":"breaks","note":"The query is in symptom words. The useful entries are in mechanism words from other slices."},{"step":4,"status":"breaks","note":"A miss. The design is word-based. The four patterns become relevant only after the loop is split into five faults.","ks":true},{"step":5,"status":"not_reached","note":"Nothing to deliver. Had all four matched, only one lead and one candidate show.","ks":true},{"step":6,"status":"not_reached","note":"Had it arrived, the claim guard had to become a transition table and a migration, not a copy. It is also an Opus-reserved area.","ks":true},{"step":7,"status":"breaks","note":"594 unit and 131 integration tests were green. A red team found freeze gaps next morning."},{"step":8,"status":"strains","note":"The failure signal came from the field, twice. Nothing inside a cheap run would have climbed the ladder."},{"step":9,"status":"breaks","note":"The captured fix was half right. The later prefill held the next hole. The freeze missed the negotiated-bill field.","ks":true},{"step":10,"status":"breaks","note":"The bill-freeze rule it created made the July-08 dispatcher wrong in files the entry never touched."}],"worked":""},{"id":"f06-C1b","family":"composite-merge","title":"Completion correction wipes a bill; replay conflicts","story":"A blank correction form deleted a bill. A replayed completion came back 409 and parked a landed write. A handoff prescribed a guard that closed one route of four.","when":"Late July 2026","source":"Commits 37821f5, 370e83a, 8dafcec, da988e2 (PR #170)","entry":"Correcting a completion wiped the bill, because the server re-prices from the payload. Fix: prefill from the existing completion. Also: a replayed completion came back 409; a byte-identical resubmit is now idempotent. Freeze: bill sent, negotiated, or a payment.","steps":[{"step":1,"status":"works","note":"The handoff gave file and line and said whi t not inherit the top tier.","steps":[{"step":1,"status":"strains","note":"The FixFlow rule was in the window at line 3. The actor is the top-tier orchestrator."},{"step":2,"status":"breaks","note":"start_session with no model raises no error. No trigger fires on a session start. Three starts had no model. Only the owner's message surfaced it."},{"step":3,"status":"breaks","note":"The stored action is a subagent type for search. The act is a session start. No shared verb or object."},{"step":4,"status":"breaks","note":"A meaning-level match returns a fix, pin an agent file to Haiku, that does not apply to start_session."},{"step":5,"status":"works","note":"It was already in the main window."},{"step":6,"status":"breaks","note":"The rule was present and not carried to the neighbouring tool, three times."},{"step":7,"status":"breaks","note":"No check decides 'right tier'. The output would be correct, only dearer. The owner's eye was the check."},{"step":8,"status":"not_specified","note":"The actor is the top rung and the failure is overspend. The ladder climbs on failure and does not see it."},{"step":9,"status":"strains","note":"Write-through worked: memory edited within 30 seconds, a commit seven minutes later. The note bundles five facts of different scope.","ks":true},{"step":10,"status":"breaks","note":"It never reached FixFlow, where 7 of 7 start_session calls pass no model. No objection was recorded. A crossed rule cannot tell intended from mistaken."}],"worked":""},{"id":"f08-4","family":"cross-project","title":"Clinic checks: Linux container allowed here","story":"The clinic measured its full check as latency-bound and moved tests to a Linux container. In FixFlow a Fable session chose a workaround and wrote a limit instead. The owner was the escalation.","when":"2026-11-12","source":"Session e24f17dc; HARNESS-BOTTLENECKS line 65; owner decision USER-23","entry":"Clinic full check on Windows is latency-bound, not CPU-bound. Pytest in a Linux container beside Postgres: 230.1 s vs 367.2 s native. Owner decision USER-23: tests go to a Linux container next to the database. Measure before serialising.","steps":[{"step":1,"status":"works","note":"A Fable 5.2 session held about 380k cached tokens. They included the library import list and its own 230 s Linux line."},{"step":2,"status":"breaks","note":"The model did not fail. It chose a workaround and a written limit. No trigger fires on 'about to record a handicap'."},{"step":3,"status":"breaks","note":"'function page_rank is not defined' and the arrow and networkit DLL names share no word with the clinic entry."},{"step":4,"status":"breaks","note":"The clinic entry is about speed. This is a missing native library. What carries is a permission, 'Linux is approved here', not a solution."},{"step":5,"status":"works","note":"The main session holds it."},{"step":6,"status":"strains","note":"The real work was new: libssl3, libgomp1, Arrow 26 and icebug 13.5. Nothing in the clinic entry carries it."},{"step":7,"status":"works","note":"'Extension: all libraries resolved' and a PageRank result are mechanical checks, though outside any check kind.","ks":true},{"step":8,"status":"not_specified","note":"The owner was the escalation. Accepting a handicap is not a failure any check sees."},{"step":9,"status":"strains","note":"The correction was stored as a memory preference and the recipe as a Dockerfile in evidence. Neither passes the write gate.","ks":true},{"step":10,"status":"strains","note":"Two stored rules now collide: no installs without an owner decision, and Docker/Linux already approved.","ks":true}],"worked":""},{"id":"f08-5","family":"cross-project","title":"Long Bash heredoc from a subagent","story":"A long Bash command failed with ENAMETOOLONG in one agent and 'unexpected EOF' in another. The clinic stored it only inside a subagent-write note. The rule's author sent an 8,720-character call 25 hours later.","when":"2026-11-11 to 2026-11-12","source":"Session 11-12 Fable 5.2, lines 7367 and 7799","entry":"A long Bash heredoc from a subagent failed with ENAMETOOLONG, name too long. In another agent it failed with 'unexpected EOF while looking for matching'. Split long writes into parts. (The clinic stored only 'one also failed a long Bash heredoc' inside the subagent-write note.)","steps":[{"step":1,"status":"strains","note":"A Fable 5.2 main session had the 8 KB rule in its index. It was also in its compaction summary and its own subagent briefs."},{"step":2,"status":"breaks","note":"Writing a long command is not an error until it fails. Then the cost is one failed call."},{"step":3,"status":"strains","note":"The EOF line is a clean template, identical to the clinic's. Nothing stored carries it."},{"step":4,"status":"breaks","note":"In the clinic the symptom is bundled in the subagent-write note, so a hit returns the wrong fact."},{"step":5,"status":"works","note":"It was already delivered inside FixFlow."},{"step":6,"status":"breaks","note":"The rule's own author sent an 8,720-character Bash call 25 hours after writing it."},{"step":7,"status":"strains","note":"A rerun is the check. No check kind covers the shell.","ks":true},{"step":8,"status":"not_reached","note":"No climb happens."},{"step":9,"status":"breaks","note":"The clinic bundled two facts in one note without the error strings. FixFlow re-derived the second fact on 11-11."},{"step":10,"status":"strains","note":"Only in-project push reached later windows. Nothing crossed projects."}],"worked":""},{"id":"f09-1","family":"ladder-real-life","title":"Race tests that pass without their lock","story":"Race tests named a lock but passed with that lock removed, because a counter row serialized the work. The lesson was in every brief and followed in form. Nine of 11 gates took three rounds.","when":"Clinic gates G02-02 to G10-23, early November 2026","source":"Clinic slice S04 session a9b52f2e; check-summary.md line 75; task.md line 303","entry":"A race test names a lock but passes with that lock removed. Both postings call open_document, which updates a per-type counter before any lock, so the counter serializes them. Rule: a race test proves a lock only if it fails with that lock removed. Method: remove one lock at a time.","steps":[{"step":1,"status":"strains","note":"The slice held the root's brief, which said to record a lock-removal experiment per race. The task is tests to write, not a problem."},{"step":2,"status":"breaks","note":"Nothing fails. A cheap model gets no signal and the ladder never starts. The root pushed the lesson into briefs outside the fetch path."},{"step":3,"status":"strains","note":"Task words reach the S02 entry. For S08 the words share only 'race' and 'lock' with it."},{"step":4,"status":"breaks","note":"Later failures share the claim, not the cause. Their causes differ: a counter row, a helper after deferred checks, a trigger lock. Others were an earlier variant and no single lock."},{"step":5,"status":"not_specified","note":"The design does not say which window gets the entry. The error was made by read-only Opus reviewers and the Fable root."},{"step":6,"status":"breaks","note":"The lesson was in every brief and followed in form. They held after deferred checks, ran on an earlier variant, or removed the wrong layer."},{"step":7,"status":"strains","note":"What decided was a reviewer reading, then model-run experiments, at least four later shown misleading.","ks":true},{"step":8,"status":"breaks","note":"Opus reviewers noticed and handed up finding tables. The Fable root's round-1 premise was wrong. Removing locks one at a time settled it."},{"step":9,"status":"breaks","note":"Round 1 said scope lock, round 2 counter, round 3 proved counter. A capture at the strong model's verdict stores the wrong lock.","ks":true},{"step":10,"status":"breaks","note":"Any added guard changes the answer without touching the test. Race footprints are identical in good and bad runs.","ks":true}],"worked":""},{"id":"f09-2","family":"ladder-real-life","title":"A reversal test leaves the database short","story":"A migration reversal test migrated forward only to the old step. On the merged tree, 2 of 2570 tests failed in the same worker. The session had copied the template into two new tests.","when":"2026-11-11, merged tree check","source":"Commit 6a2fd45; f6b5c6c; test_followup_guards.py","entry":"Clinic, Django, pytest-xdist. Full check on merged main fails 2 of 2570 with CheckViolation. A test migrates back to 0013 and forward only to 0014; once 0015 exists the worker's database stays at 0014. Fix: in the finally, migrate to the leaf nodes of the app.","steps":[{"step":1,"status":"strains","note":"The Opus session held its design, code and the earlier test it copied. A stored 'how to test a reversal' would be that same test."},{"step":2,"status":"breaks","note":"The session's full check passed 2570 and two Opus reviews found no P1. The failure appeared only on the merged tree, in another test order."},{"step":3,"status":"breaks","note":"A query in those words finds the real-data guard, not a migration test in another file."},{"step":4,"status":"breaks","note":"The nearest stored items are the earlier test, a latent defect, and a rows-left-behind fix. That fix does not cover schema state."},{"step":5,"status":"works","note":"The failure arrived in the Fable root's main window as test output and stayed through the fix."},{"step":6,"status":"breaks","note":"Reuse multiplied the defect. The session copied the template's finally into two new tests."},{"step":7,"status":"breaks","note":"2570 passed on the branch; 2 of 2570 failed on the merged tree. The check that judges equality certified a wrong solution."},{"step":8,"status":"works","note":"A red deterministic check, not a model, noticed it. The handoff was tool output. Fable fixed it in about a minute."},{"step":9,"status":"strains","note":"The root wrote the rule into conventions within two minutes. Under the design's write rule, this one-attempt top-tier fix is routine and not recorded.","ks":true},{"step":10,"status":"strains","note":"The entry covers one reversal helper. A reversal written another way, or failing on another constraint, shares no words. The 12-worker prediction is untested."}],"worked":""},{"id":"f09-3","family":"ladder-real-life","title":"Subagent writes: the probe overruled two Opus","story":"A note said subagents cannot write report files. A Haiku probe wrote a one-line .txt and the root sided with it. Each rewrite widened or flipped the entry. Eight subagents were then refused on report.md.","when":"Note 2026-11-01; probe 2026-11-11; refusals 2026-11-12","source":"Memory note 11-01; map-full.txt line 588; orchestration.md line 14; HARNESS-BOTTLENECKS line 23","entry":"Subagents launched with the Agent tool could not write their reports. Both Opus analysts said the harness blocks subagents from writing report files and returned the text. Sonnet extractors wrote files earlier, so it may depend on agent type or output size. Brief subagents to return the result.","steps":[{"step":1,"status":"works","note":"On 11 Nov the Fable root had 'subagents cannot write files' as an explicit question. It had also read the memory note."},{"step":2,"status":"works","note":"The task was the question itself, so a lookup had a clear trigger."},{"step":3,"status":"works","note":"'Subagent write file refused' matches the entry's words."},{"step":4,"status":"strains","note":"The entry carried a paraphrase, not the tool error, and its hedge pointed at the wrong variables."},{"step":5,"status":"works","note":"The entry sat in the root's main window and stayed there through the compile."},{"step":6,"status":"breaks","note":"It called the rule an unchecked self-report. The probe tested another condition."},{"step":7,"status":"breaks","note":"The refusal text that decides it sat in 1 Nov transcripts, never read."},{"step":8,"status":"breaks","note":"The ladder ran downward. A Haiku probe overruled two Opus observations and the Fable root sided with the probe. The original observers were right."},{"step":9,"status":"breaks","note":"Each write widened or flipped the entry: 'report files', then 'file writes are refused', then 'They can'. Two contradictory entries, neither naming the condition."},{"step":10,"status":"breaks","note":"They adapted silently and the root never saw it. The saved compile keeps 'They can' and a remedy the refusal blocks.","ks":true}],"worked":""},{"id":"f09-4","family":"ladder-real-life","title":"A 'not found' that was a search gap","story":"A critic searched task.md files, found no 34-minute wait, and called the owner's figure unsupported. The wait was printed in a root transcript never searched. A wider refuter corrected it.","when":"2026-11-11","source":"Critic check-wait-max; task.md files; root transcript 7f348b2c; verdicts.txt line 30","entry":"Check-wait-max. The owner says check waits reach 34 minutes. Searched docs/tasks/*/task.md for 'waited' and '34 min'. Largest recorded waits: 742 s and 726 s. '34 minutes' not found. The owner's figure is not supported by the records.","steps":[{"step":1,"status":"works","note":"Each Opus map lane held the sweep cards and the critic's output. Its task was to classify the claim."},{"step":2,"status":"not_specified","note":"The lanes did not decide to look anything up. The design does not say whether a negative is pushed or fetched."},{"step":3,"status":"works","note":"'34 minutes' and 'slot wait' hit the critic's entry exactly."},{"step":4,"status":"breaks","note":"Exact match, wrong answer. The entry is a 'not found' whose scope excluded the root transcript where the check printed 'waited 2030 s'."},{"step":5,"status":"strains","note":"One entry reached four parallel map lanes and the verdict writers at once, before anything checked it."},{"step":6,"status":"breaks","note":"'Not in task.md' became 'in no file', then 'the owner's figure is wrong', then a stop rule."},{"step":7,"status":"breaks","note":"Nothing checks a negative. Its footprint, the task.md files, stayed valid. Footprint validity cannot show that the search missed where the evidence lived.","ks":true},{"step":8,"status":"strains","note":"Caught by a same-tier Opus-high refuter with a refute-by-default brief and a wider search, not by a higher tier."},{"step":9,"status":"breaks","note":"One verdicts file still says 742 s. The 9 Nov observation was a measurement, not a solved problem, so no capture rule would store it."},{"step":10,"status":"strains","note":"The 742 s copy survives in the evidence file a trial would run from."}],"worked":""},{"id":"f10-1a","family":"libraries-over-time","title":"Sentry plugin trap, first moment","story":"Build 15 failed in Gradle after the Sentry plugin was added. Two causes shared one symptom. The fix commit never reached main. The real session found both causes in one pass.","when":"2026-06-26","source":"Commits 6928828, a6f9048; KS limit 1","entry":"EAS Android build errors in 'Run gradlew'. Cause: expo install added the Sentry config plugin to app.json. That wired in a Gradle step needing an auth token, org and project. Fix: drop the plugin. Holds while no Sentry project or token exists. CI cannot see this.","steps":[{"step":1,"status":"strains","note":"Opus 4.8 has a task and a generic error code. The cause-specific line is on the EAS web log, so the owner must paste it.","ks":true},{"step":2,"status":"works","note":"'Before retrying a failed build' is a named trigger.","ks":true},{"step":3,"status":"strains","note":"The generic error code is flagged ambiguous. Without the pasted Sentry line, the query reaches a candidate at most.","ks":true},{"step":4,"status":"strains","note":"Two causes, one symptom. One entry matches the stranded plugin. The Dependabot SDK pins have no entry, and nothing says a second cause exists."},{"step":5,"status":"works","note":"Pulled into the main session that owns the build. On a miss only the lookup id goes into the brief."},{"step":6,"status":"strains","note":"The fix is withheld until verify says it applies. The precondition 'no auth token' is an EAS-side secret, so the verdict is capped at inconclusive."},{"step":7,"status":"strains","note":"After removal the plugin probe reads absent while the build still fails on the Dependabot pins. The only full check is another EAS build."},{"step":8,"status":"works","note":"A second failing build is visible, and the miss on the second cause escalates as it does today."},{"step":9,"status":"strains","note":"The commit says the plugin re-entered main via #59, but the fix commit never reached main. The fix-reached-main check catches the anchor, not the prose.","ks":true},{"step":10,"status":"strains","note":"A phase close would print 'fix not on main' as one of four counts. The design does not say who must act on that line.","ks":true}],"worked":""},{"id":"f10-1b","family":"libraries-over-time","title":"Sentry trap: copied rule loses its condition","story":"The June note said re-add the plugin once a Sentry project and token exist. A July writer copied it into CLAUDE.md as 'must never be added'. August wired a real DSN without the plugin.","when":"2026-07-18 and 2026-08-03","source":"Commits 6928828, 140428c, a31924a; CLAUDE.md line 84; PR #176","entry":"The first Sentry entry, plus the 06-26 text: re-add the plugin only once a Sentry project and auth token exist. Dependabot was told to ignore the Expo and RN native family.","steps":[{"step":1,"status":"works","note":"Task windows have CLAUDE.md always loaded. On 08-03 it holds both traps and the PR cites them."},{"step":2,"status":"breaks","note":"07-18 is a wiring task, not a failure, so no lookup is triggered. Nothing fires before the commit that breaks every build."},{"step":3,"status":"works","note":"On 08-03 the changed line, the env key in eas.json, is a usable diff query."},{"step":4,"status":"strains","note":"07-18: a miss, because it is the first time. 08-03: a correct but idle warning. Nothing surfaces the plugin entry's now-relevant condition."},{"step":5,"status":"works","note":"Warning lines go to the PR's decisions journal and to the Opus reviewer."},{"step":6,"status":"strains","note":"On 08-03 the agent had already obeyed CLAUDE.md. The store adds a warning, a verify run and a reviewer ruling, and saves nothing."},{"step":7,"status":"works","note":"The empty-value entry is a probe on parsed eas.json, and 'absent' is right. A test capture to the real project proved the DSN."},{"step":8,"status":"not_reached","note":"Nothing failed on 08-03."},{"step":9,"status":"breaks","note":"The 07-18 writer copied the condition into the always-loaded file as 'must never be added'. The store's entry keeps the precondition. Two versions exist."},{"step":10,"status":"breaks","note":"The Sentry project was created outside git, so no event fires. If asked, the entry says inconclusive both before and after. CLAUDE.md still says never."}],"worked":"On 08-03 the diff warning fired and was right, though the agent had already obeyed CLAUDE.md, so it saved nothing."},{"id":"f10-2","family":"libraries-over-time","title":"A false 'each job is idempotent' sentence","story":"A truth pass wrote that every scheduler job is idempotent. It was false when written: the orphan sweep mints a fresh client id each run. An audit found it 20 days later. It still stands.","when":"Written 2026-07-08; kept to 2026-11-12","source":"Commits 85c88c0, 8ce9530, da988e2; HANDOFF A7; CLAUDE.md line 312","entry":"Scheduler jobs: weekly payroll export, nightly backup, daily auto-link scan and daily media-orphan sweep. Also a 300 s metric rollup, and the dispatcher (default OFF). Each is idempotent, so a duplicate run is harmless.","steps":[{"step":1,"status":"works","note":"On 08-02 both documents were in the window: CLAUDE.md always, and the HANDOFF because the PR edits it."},{"step":2,"status":"breaks","note":"The diff check joins code and config files only, so no lookup happens."},{"step":3,"status":"not_reached","note":"No lookup happens, so no query exists."},{"step":4,"status":"not_reached","note":"If one had run, the store would miss. The register item is unsolved, and entries are written only when solved.","ks":true},{"step":5,"status":"not_reached","note":"No lookup happens, so nothing is delivered."},{"step":6,"status":"not_reached","note":"The correction was in the window as prose and did not reach the edit."},{"step":7,"status":"breaks","note":"The line stood 20 days, until an audit whose default verdict was REFUTED found it. That audit is the expensive-model judge."},{"step":8,"status":"not_reached","note":"No failure is ever raised. The sweep re-alarms silently, and nothing reads the alarms."},{"step":9,"status":"breaks","note":"The strong model's summary was written from reading, not checked, 86 minutes after the contradicting code landed."},{"step":10,"status":"breaks","note":"The refuted line was rewritten five days after the refutation and still stands on 11-12. Contradictions are corrected only at seeding.","ks":true}],"worked":""},{"id":"f10-3","family":"libraries-over-time","title":"Stored 'no Python' read as a hypothesis","story":"The memory index says no python on PATH. Later subagents treated it as a hypothesis and probed with a fallback in one command. The error line appeared, but the library had worked.","when":"Notes 2026-11-01 and 2026-11-04; use 2026-11-09 to 2026-11-12","source":"Subagent transcripts agent-a7d5404af4b1e0cff, agent-a1e89191a0c75a205","entry":"One note: a Python 3 exists in the Codex runtime folder; the earlier 'no Python' note was wrong. Another: python is not on PATH in Git Bash (Store alias); use node for JSON. The index line ends 'no python on PATH'.","steps":[{"step":1,"status":"works","note":"MEMORY.md with the python line sits near the top of all three later subagent windows."},{"step":2,"status":"strains","note":"A trigger keyed on the error would fire after the call had already succeeded through its fallback."},{"step":3,"status":"works","note":"'Python was not found' is an exact, stable string."},{"step":4,"status":"works","note":"Two notes partly match. Both are true. The critic's brief merged them correctly."},{"step":5,"status":"works","note":"The index line reaches every window. The note body with the path reached the critic through the orchestrator's brief."},{"step":6,"status":"works","note":"The agents treated the stored 'no' as a hypothesis. They probed python3 with a node fallback in one command, with no extra call."},{"step":7,"status":"works","note":"The fallback's output came back in the same tool result."},{"step":8,"status":"breaks","note":"The error line looks like a failure but comes from a hedged probe. A detector keyed on error text would score these successes as misses."},{"step":9,"status":"strains","note":"The 11-04 note said 'not on PATH' three days after the 11-01 note called an earlier 'no Python' wrong. Neither knew uv arrived 11-02."},{"step":10,"status":"strains","note":"python is still a Store stub. uv is on PATH, and newer Pythons appeared later. No note changed, and no event exists for machine changes."}],"worked":"Agents probed and fell back in one command with no extra call, so the stored 'no' saved calls."},{"id":"f10-4","family":"libraries-over-time","title":"Production is down and phones lose writes","story":"Both Railway hostnames return the edge's own 404. The phone treats that 404 as a definitive rejection, so punches, presence and jobs park and pings drop. Nothing in git changed.","when":"Down about 2026-08; probed 2026-10-31 and 11-01","source":"syncClassification.ts line 18; Critique-3 line 196; commit 093b793; CLAUDE.md","entry":"Production is down. Both Railway hostnames return the edge's own 404 'Application not found'. The phone cannot tell it from FastAPI's 404. 404 is in the definitive-4xx list, so punches, presence and jobs park, and pings and travel drop. Techs must not open the app.","steps":[{"step":1,"status":"works","note":"The memory index ('prod dead') and the orchestrators' briefs put the state into later windows. CLAUDE.md's stale three-service row sits beside it."},{"step":2,"status":"strains","note":"The hazard is an operator action such as a deploy or clock-in, reachable only through the action handle."},{"step":3,"status":"strains","note":"It works only if the plan's wording overlaps the entry's action handles. Zero overlap is a miss."},{"step":4,"status":"works","note":"The 404 body string and the definitive-4xx name are exact handles."},{"step":5,"status":"works","note":"In the record, push delivery already worked. The 11-04 briefs carried 'prod dead'."},{"step":6,"status":"works","note":"After 10-31 no session live-probed the dead hosts. A critique cites the earlier result rather than re-deriving."},{"step":7,"status":"breaks","note":"The code half is capped at candidate. The world half has no probe at all, because production state is not in git."},{"step":8,"status":"not_reached","note":"No escalation in the record."},{"step":9,"status":"strains","note":"One says 'v4' but never touched the plan file, which stayed at v3. An entry built from the message would anchor the wrong version."},{"step":10,"status":"breaks","note":"Production went dark around 2026-08 and nothing in git changed. When production is restored, the entry will go stale just as silently."}],"worked":""},{"id":"f10-5","family":"libraries-over-time","title":"Clinic memory says 'no uv'; uv arrives that night","story":"A probe recorded no uv and no Python 3.13. uv and 3.13 were installed that same evening. Three projects wrote three scoped notes. 86 windows started within 22 minutes.","when":"Probed 2026-11-02; 86 windows 2026-11-03","source":"Clinic note clinic-s00-readiness-2026-11.md line 13; workflow wf_1cc608d4; house-expenses note line 16","entry":"Machine facts probed 2026-11-02: no Python 3.13, no uv, no pipx, no py launcher. The only Python is the Codex runtime 3.12.14 at its folder path. The EMS note of 11-01 had the same path.","steps":[{"step":1,"status":"strains","note":"House-expenses workflow briefs and a MEMORY.md have no Python line. The task does not say 'you need Python'. The agent assumes it."},{"step":2,"status":"strains","note":"There is no signal before the error. Under pull, each of the 86 windows pays one failed python call before any lookup."},{"step":3,"status":"works","note":"'Python was not found' is exact."},{"step":4,"status":"strains","note":"On 11-03 the EMS and clinic entries agree on the codex path. The clinic's uv run python works only in its venv."},{"step":5,"status":"not_specified","note":"The design is FixFlow-only and silent on other projects. The existing memory is per project, so nothing crossed.","ks":true},{"step":6,"status":"strains","note":"The entry answers 'is there a Python?', but the task needs Pillow. Whether the Codex Python imported PIL on 11-03 is not recorded."},{"step":7,"status":"works","note":"The cropped image is its own check."},{"step":8,"status":"works","note":"No ladder was needed. The agents switched tools in one call. 17 retried python and failed again."},{"step":9,"status":"breaks","note":"Three projects, three writers, three scopes. They wrote 'no uv' before uv arrived, 'not on PATH, use node', and 'no Python on the machine'. The last was false when written."},{"step":10,"status":"breaks","note":"86 windows started within 22 minutes, so an entry written after the first failure reaches none of them."}],"worked":""}]},"text":{"title":"Library pathways","date":"2026-11-13","note":"Page copy for docs/program/library-pathways/index.html and docs/program/LIBRARY-PATHWAYS-2026-11.md (third build, page-brief.md). Tokens: {{c:key}} is a count computed from the data files (tag M); {{g:key}} is a middle-value figure computed by the model (tag G, PathwayCore.bestFacts); {{n:value|TAG}} is a literal number with its tag. Rules: one idea per sentence, no sentence over 20 words, no fixes, no verdicts. Edit here and rebuild with build-page.js.txt.","policy_names":{"top_first":"Strong model directly","cheap_ladder":"Cheap model with the ladder","library":"Cheap model with the library"},"policy_short":{"top_first":"Strong directly","cheap_ladder":"Cheap + ladder","library":"Cheap + library"},"policy_says":{"top_first":"Opus does the work. If the gate catches a wrong answer, Fable tries. No library.","cheap_ladder":"The cheap model tries first. A caught failure gets one cheap retry, then Opus, then Fable. No library.","library":"The same ladder, plus the library. A lookup comes before the cheap attempt. Opus and Fable solves are written back as entries."},"hero":["A working model of the library design, computed from its own data files.","It shows where a piece of work can go, and how much each limitation holds the result down."],"tags":{"M":"measured on this PC","S":"outside study or price list","G":"guess"},"computed_tag":"A computed number takes the weakest tag of its inputs. Almost every computed number here is a guess (G). In a table, the tag in the heading covers its column.","todays_notes":"Today's notes are in every way of working: CLAUDE.md, the memory notes, checks in the shared test run. So they cancel out.","opus_line":"The cost against the strong model rests on the Opus price ratio. It is {{n:2|S}} per token and may be nearer {{n:1|G}} per call.","words":[["Tags","M: measured on this PC, in the owner's repositories or session records. S: an outside study or the price list. G: a guess. A computed number takes the weakest tag of its inputs."],["Piece of work","One fix-sized task of about ten cheap calls. A result is made and checked."],["Cheap model, Opus and Fable","The cheap model is Sonnet. Opus is the next model up, at a higher price. Fable is the top one."],["Visible or latent","Visible: something signals a problem, such as an error or a failing check. Latent: nothing signals that a choice matters."],["Entry","One stored conclusion in the library."],["Lookup","A search of the library for entries that fit the work in hand."],["Look-alike","A stored entry that looks like a match but has a different cause."],["Several parts","Work that needs two or more entries. A lookup may find all the parts, or only some parts."],["Screen","The test of whether a found entry applies, before the cheap model uses it."],["Mechanical check","A check an entry carries that decides by itself whether the entry applies. No model judges it."],["Window","The text a model has in front of it while it works."],["Stale","A good entry goes stale when what it rests on changes. It then counts as a bad entry."],["Capture","Writing a strong model's solve back into the library as an entry."],["Ceiling","The most of the work that entries could cover in the long run, beyond today's notes."],["Gate","Whatever decides a result is right: tests, and sometimes a review by Opus."],["Escape","A wrong result that passes the gate. It may be found later, or never."],["Ladder","What happens after a caught failure: one cheap retry, then Opus, then Fable."],["Handoff","Handing a piece of work up to Opus. It has a small cost of its own."],["Promoted check","An entry's mechanical check that also runs in the shared tests. It acts at the gate with no lookup."],["Cost","Counted in cheap-call equivalents. One cheap-model call costs one. An Opus call costs the Opus price ratio."],["Wrong rate","The share of pieces of work that do not end accepted and right."],["Ratio","The library's figure divided by the other way's figure. Below one, the library's figure is lower."],["Middle value","The value an unknown starts at, inside its range."],["Library unknown","An unknown that exists only because of the library. Each has a poor end and a good end."],["Good end","The end of a range where the design works as intended. The poor end is the other one."],["Comes back","How much of the work comes back, so an entry could exist for it. A property of the work."],["Reach","Whether an entry gets to the cheap model: written, looked up, found and in the window."],["Entry quality","Whether the entry is right and is used rightly."],["Running cost","What lookups, screens, carrying and writing cost."],["Corner","Comes back, reach and entry quality, each at its poor or its good end. Everything else stays at its middle value."],["All-good setting","Every library unknown at its good end, running cost included. Every other unknown at its middle value."],["Full fall","How far the library's cost and wrong rate fall from the middle values to the all-good setting, averaged."],["Alone","What moving only this gives. Its library unknowns go to their good ends. A share of the full fall."],["Last","What is lost if only this stays. All else is at its good end. A share of the full fall."],["Middle run","The run in the middle when all runs are sorted. Half the runs fall on each side."],["Tie","How far the library unknowns of one group move together across the runs."],["Rank correlation","How steadily a result rises (+) or falls (−) as one unknown rises across the runs. One means always; zero means no steady link."],["Stock and flow","A stock piles up over time and is drawn as a box. A flow fills or drains it, drawn as an arrow with a valve."],["Loop R or B","A chain of causes that returns to its start. R feeds itself. B holds itself back."],["Seed","A whole number that fixes the random draws. The same seed always gives the same runs."],["Knowledge-store design","The owner's earlier design for a store of solved defects in FixFlow. It is not the library mapped here."],["Case family","A group of real cases of one kind, such as races and flaky failures."],["Other way","Real cases where a limitation did not hold. Each limitation lists its own."],["Thought experiment","A limitation no real case showed. It was reasoned out, not seen."],["CI","The shared test run on GitHub that checks every change."],["PR","A pull request: a proposed change, reviewed before it joins the main branch."],["Technical names in the cases","Case notes keep some names from the records. These are the common ones."],["Subagent","A helper session the main session starts for one task. It has its own window."],["Compaction","When a session's window fills, its earlier text is cut down to a summary."],["pdftoppm","A small tool that turns PDF pages into images."],["Heredoc","A way to hand a long block of text to a shell command in one go."],["ENAMETOOLONG","An error that says a command or a name is too long for the system."],["CSRF token","A random value a web form carries, to block forged requests."],["job_event.seq","The running number on each job event in FixFlow's database. It puts all events in one order."],["EXPO_PUBLIC_SENTRY_DSN","The setting that tells the phone app where to send crash reports."],["Migration","A numbered change to the layout of FixFlow's database. Case notes name one by its number."]],"sections":{"map":{"title":"The map","lede":"Pick a piece of work and a way of working. Tap a route in the tree to light it up, then step through it.","graph_note":"Boxes are states and lines are branches. A thicker line carries more of this piece. A dashed hairline carries none.","scroll_note":"The map scrolls sideways.","promo_label":"promoted checks, no lookup","promo_legend":"Dashed arrow: checks promoted into the shared tests reach every gate from the stock, with no lookup."},"funnel":{"title":"The funnel","lede":"Start with a hundred pieces of work the cheap model would get wrong alone. Each bar is how many are left after one step.","marks":"Faint mark: the all-good setting, with every library unknown at its good end.","under":"Under each bar: limitations placed at that step, and real cases that broke there. Tap a bar to open its limitations.","match_note":"The match of bars to design steps was set by hand. No step sits at the first bar. Bad entries come from writing (step 9) and from going stale (step 10). So both steps sit at the good-entry bar. Step 6 covers the screen and the cheap attempt, so it sits under the last bar only.","stage_notes":{"0":{"under":"no step","tip":"No design step sits here. This bar is capped by how often a problem recurs and by the cut for latent work. Capture only fills it toward that cap."},"4":{"under":"step 6 sits under the last bar","tip":"Step 6 covers the screen and the cheap attempt. Its limitations sit under the last bar.","opens":[6]}},"after_label":"After the cheap attempt","which_cheap":"Work the cheap model gets wrong alone","which_all":"All work","outside_bar":"Not a share, so not drawn as a bar","promo":"Checks promoted into the shared tests do not pass through this funnel. They reach the gate with no lookup.","promo_at":"Of the same hundred, they catch more at the first gate:"},"conditions":{"title":"Three conditions","lede":"The library side of the model holds three conditions. Each is a group of unknowns with a poor end and a good end.","items":[["recurrence","Much of the work comes back, so an entry could exist for it."],["reach","An entry reaches the cheap model, when one could exist."],["quality","The entry is right, and the cheap model uses it rightly."]],"running_cost":"One more group is what the library costs to run. In the corners it stays at its middle value.","table_title":"The eight corners","table_note":"Each condition at its poor or its good end. Every other unknown stays at its middle value. Last period. Below one, the library's figure is lower.","near_band":0.02,"near_note":"Marks against the ladder: solid is below one, a ring is near one, hatched is above one. Near means within {{n:0.02|G}} of one, a band chosen for reading.","promo_note":"Promoted checks need no lookup, so entry quality acts even at poor reach.","more_title":"Running cost moved as well","square_title":"The square: reach against entry quality","square_lede":"Reach runs across and entry quality runs up, from the poor end to the good end. Running cost stays at its middle value.","square_tap":"Tap a cell for its four ratios.","square_line":"The thick line is where the ratio crosses one. Solid cells are below one and hatched cells above. Darker is further from one.","square_level":"A level is a share of each unknown's range, counted from its poor end."},"cases":{"title":"Where real cases broke","lede":"{{c:cases}} real cases were walked through the design's ten steps. Each cell is one step of one case.","warning":"These are chosen problem cases. They show where steps break, never how often.","ks_note":"Some steps were judged with the owner's earlier knowledge-store design, not the library. {{c:ks_steps}} of the {{c:steps_total}} step judgments name it.","pick":"Tap a row to read the case.","numbers_tag":"Numbers in a case note come from the records (M). A saving is the walker's estimate (G) unless the walk saw it."},"lims":{"title":"The limitations, by step","lede":"Tap a step to list its limitations. Tap a limitation for its description, examples and unknowns.","two_title":"Two weights","alone_def":"Alone: what moving only this gives. Its library unknowns go to their good ends; all else stays at middle values.","last_def":"Last: what is lost if only this stays. All else sits at its good end; this goes back to middle values.","add_def":"Both are shares of the full fall. They do not add up, because the steps multiply.","sign_def":"Alone can be below zero, and last can pass the whole fall.","full_def":"The full fall runs from the middle values to the all-good setting.","bars":"Solid bar: last. Hatched bar: alone.","rank_groups":"The four groups, ranked by last","rank_steps":"The ten steps, ranked by last","seq_title":"Steps moved one after another","seq_note":"Each round adds the step that gives the most. The bar shows the share of the full fall so far.","seq_zero":"add nothing: earlier steps already moved all their library unknowns.","unnamed":"Unknowns no limitation names","shares":"A number after ↔ counts the other limitations with the same library unknowns. Their weights match.","nm_no_setting":"not in the model","nm_gate_or_ladder":"gate or ladder","nm_other_side_only":"shared unknowns","nm_why_no_setting":"Not in the model. It has no setting for this limitation.","nm_why_gate_or_ladder":"It acts only through unknowns all three ways of working share. The weights never move them. The gate and ladder table shows them.","nm_why_other_side_only":"It acts only through unknowns all three ways of working share. The weights never move them.","gate_title":"The gate and the ladder","gate_lede":"These unknowns are shared by all three ways of working. So the weights give them none. Each group moves one way only, to the ends under What moves.","gate_moved":"What moves","works_title":"Savings the walks saw or estimated","works_show":"Each saving, one per line","works_lede":"Savings the walks saw happen (M) or estimated (G). The library has never existed. {{c:works_seen_channel}} of the {{c:works_seen}} savings seen came through notes that exist today.","channel":"existing notes","shown_no":"The model cannot show this.","shown_partly":"The model shows this only in part.","map_note":"Shaded stages: the steps it touches. Heavy lines: branches that use its unknowns.","parts_title":"Each of its library unknowns, alone and last"},"run":{"title":"Run it","lede":"Every unknown has a slider, and the whole page follows it. The corners and the weights stay fixed.","outputs_note":"Cost per piece of work, in cheap-call equivalents. The library is shown at its last period.","ladder_sub":"What the library adds to the ladder.","top_sub":"The owner's goal. It also rests on the ladder and the gate.","usage_title":"How much the library is used, last period"},"many":{"title":"Many runs","lede":"Most unknowns are guesses, so the model runs many times with random draws. The result is a spread, not one answer.","tie":"Tie: how far the library unknowns of one group move together. Each run draws one shared level per group, four in all. No group is tied to another.","follows":"This spread follows from the ranges and the way they are drawn. It is not a measurement of the library.","rank_read":"Rank correlation: how steadily each ratio rises (+) or falls (−) as one unknown rises across the runs.","rank_tied":"At the highest tie, a group's unknowns all move with its shared level. So each group shows one rank correlation, toward its good end.","rank_half":"At the middle tie, half of each library unknown's draw is its group's shared level. So one group's unknowns show correlations of similar size."},"leaves":{"title":"What the map leaves out","lede":"The model's own limits. Tap one to read it."}},"loops":[{"id":"R1","kind":"R","name":"Bad entries bring more bad entries","text":"More bad entries raise the bad share a lookup returns. More wrong entries reach the cheap attempt and spoil work. More work climbs to Opus or Fable. More solves and escapes get written, some of them bad."},{"id":"R2","kind":"R","name":"More entries, more look-alikes","text":"Every entry, good or bad, raises the chance a look-alike is found. Accepted look-alikes spoil work. More work climbs the ladder, and more entries get written."},{"id":"B1","kind":"B","name":"Good entries thin their own supply","text":"More good entries fill the library. The cheap model is right more often with one in hand. Less work climbs to Opus or Fable, so fewer entries are written."},{"id":"B2","kind":"B","name":"Good entries go stale","text":"Each period a share of good entries goes stale and moves to the bad stock. The more good entries, the more go stale."}],"funnel_steps":{"note":"Hand-set match of the funnel's stages (by position) to the design's ten steps. Each step is matched once. 'after' holds the steps past the funnel.","stages":[[],[1,2],[3,4],[9,10],[],[5],[6]],"after":[7,8]},"design_steps":{"1":["L1"],"2":["L1"],"3":["L2"],"4":["L2"],"5":["L4"],"6":["L3","L5"],"7":["L6"],"8":["L7","L8","L9"],"9":["L10"],"10":["L11"]},"design_steps_note":"The walks used the design's ten steps; the model has eleven stages. The match was set by hand. Step 1 sits with the trigger. Step 6 covers the screen and the cheap attempt.","leaves_out":[{"t":"A model of the mechanism, not a forecast","x":"Its numbers follow from its settings. {{c:guess}} of the {{c:drawn}} drawn unknowns are guesses. The number of periods is a chosen horizon, never drawn in the runs."},{"t":"Weights are shares of a guessed fall","x":"Both weights are shares of the full fall. That fall comes from the ranges, which are mostly guesses. A weight measures the model at those ranges."},{"t":"The match of limitations to unknowns is a judgment","x":"Each limitation was matched by hand to the unknowns it acts through. Another reader could match some differently. Its weights move with that match."},{"t":"The groups are a judgment","x":"Each library unknown was placed in one group by hand. Promoted checks sit with entry quality, though they need no lookup. The calls an entry saves sit with entry quality too. Look-alikes and staleness could count as properties of the work, beside what comes back. Moving any of these changes some corners. Some move toward the library and some away from it. The all-good setting does not change."},{"t":"Only the library's checks join the tests","x":"Promoted checks grow with the library's stock and act at every gate. The other two ways keep a fixed set of tests. Their strong solves may leave checks behind as well. The model does not count those. On the wrong rate, this leans toward the library. The map does not size it."},{"t":"A promoted check can pin a defect","x":"A bad entry's promoted check can hold a defect in place. The real cases show this. The map leaves it out, which leans toward the library."},{"t":"The Opus price ratio is unsure","x":"The price list gives {{n:2|S}} per token. On this PC an Opus call read about {{n:222,000|M}} cached tokens. A Sonnet call read about {{n:440,000|M}}. So per call the ratio may be nearer one. The runs draw it between {{n:1|G}} and {{n:2|G}}. At one, the cost ratio against the strong model is {{g:ct_last_m1}} instead of {{g:ct_last}}."},{"t":"The coverage ceilings lean toward the library","x":"The ceilings now mean what the library could hold beyond today's notes. Their values and sources did not change with that reading. The outside studies behind them had nothing like today's notes. This leans toward the library, by an amount the map cannot size."},{"t":"Chosen cases, not a sample of work","x":"The {{c:cases}} cases were chosen because something went wrong. They show which routes exist and where steps break. They never show how often."},{"t":"Case statuses are judgments","x":"Works, strains and breaks were set by the agents that walked the cases. Another reader could set some differently. {{c:ks_steps}} of the {{c:steps_total}} step judgments name the earlier knowledge-store design. That includes {{c:ks_works}} of the {{c:works_cells}} 'works' cells. This touches the case grid, not the model's numbers."},{"t":"One size of work, and no time","x":"Every piece of work is about ten cheap calls. Real work varies far more in size. Tests at the gate cost nothing. Waiting and the owner's attention are left out."},{"t":"Pieces of work are independent","x":"A piece's kind, its need, what the library holds and any look-alike are combined by multiplying chances. Real work clusters. A hard problem may also be the one the library lacks."},{"t":"Averages, not one library","x":"The stocks change by their expected amounts each period. A real library has one history, with luck in it. Nothing written during a period helps that same period."},{"t":"Entries are all-or-nothing","x":"A good entry is good wherever it applies, and a bad one bad. Partly right shows up only as the 'some parts' result."},{"t":"One pool of entries","x":"Projects are not separated. Facts that differ between projects act only through the look-alike and wrong-entry chances."},{"t":"An entry in hand acts only at the cheap attempt","x":"A  matches the design's ten steps to the model's stages. Another matches them to the funnel's bars. A limitation is placed through these tables and its unknowns."}],"layout":{"note":"Positions of the states on the map: [column, row]. Branches between neighbouring columns are drawn as curves; longer ones run along a lane row (given here, else the target's row). The graph is drawn at px_scale screen pixels per unit and scrolls sideways; no text in it may come out under min_text_px. promo_box: [column, row, width in columns] of the stock box the promoted checks start from.","col_w":106,"row_h":56,"x0":60,"y0":134,"node_w":90,"node_h":46,"px_scale":1,"min_text_px":11,"promo_box":[2.6,7.7,1.6],"states":{"L1_trigger":[0,3],"L2_lookup":[1,3],"L3_exact":[2,1],"L3_similar":[2,2],"L3_full":[2,3],"L3_part":[2,4],"L3_wrong":[2,5.2],"L4_exact":[3,1],"L4_similar":[3,2],"L4_full":[3,3],"L4_part":[3,4],"L4_wrong":[3,5.2],"L5_none":[4,0],"L5_exact":[4,1],"L5_similar":[4,2],"L5_full":[4,3],"L5_part":[4,4],"L5_wrong":[4,5.2],"L6_right":[5,1.6],"L6_wrong":[5,4.6],"L7_retry":[6,4.6],"L7_right":[7,3.6],"L7_wrong":[7,5.6],"L8_handoff":[8,5.6],"L8_opus":[9,5.6],"L8_right":[10,4.6],"L8_wrong":[10,6.6],"L9_fable":[11,6.4],"L9_right":[12,5.4],"L9_wrong":[12,7.6],"L10_opus":[13,2.2],"L10_fable":[13,3.4],"L10_opus_escape":[13,7],"L10_fable_escape":[13,8.2],"L11_escaped":[14,7.2],"L11_stored":[14,8.5],"EQUAL":[15,1],"ESCAPED_FOUND":[15,6.6],"ESCAPED_SILENT":[15,8],"UNRESOLVED":[15,9.4]},"lanes":{"l1_no_lookup":-0.95,"l2_nothing":-0.78,"l3_exact_set_aside":-0.6,"l3_similar_set_aside":-0.6,"l3_full_set_aside":-0.6,"l3_part_set_aside":-0.6,"l3_wrong_check":-0.6,"l3_wrong_set_aside":-0.6,"l6_escaped":10.2,"l7_escaped":10.35}}},"build":{"date":"2026-11-12"}}</script>
<script>
/*
 * Pathway engine for the reasoning-library map.
 *
 * Reads the declarative description in map.json and computes, for a parameter
 * set and a policy: outcome chances, expected cost (total and by tier), calls,
 * every route with its chance and cost, the time path of the two stocks of
 * entries, the headline ratios, the ensemble (with tied draws, one shared
 * level per group), the one-at-a-time swings, the declared reference
 * settings, the square, the funnel, the two weights of each limitation and
 * the shared table of the gate and the ladder (map revision 4,
 * model-brief.md section 14).
 *
 * Pure functions, no dependencies. In node: require('./engine.js').
 * Inlined in a page: a global named PathwayEngine.
 *
 * Parameter kinds: chance and fraction lie in [0, 1]; scale is above zero; the
 * rest must not be negative. A measure is the flow into listed states
 * (flow_into) or along listed branches (flow_on). Each listed item may carry a
 * "times" expression that multiplies its flow. A measure may count only the
 * classes that match "where", may be divided by the chance of the classes that
 * match "per", and may be multiplied by "scale". Stock updates may use measures.
 *
 * The parameter table gives each unknown a side: "library" when it exists only
 * because of the library, else "other". A library-side unknown also has a
 * good_end, "high" or "low": the end of its range at which the mechanism works
 * as intended. The other end is its poor end. A library-side unknown also has a
 * lib_group, one of the groups the map declares (lib_groups). Tied draws, the
 * reference settings, the square and the weights read these.
 *
 * A level of a group is "poor" (every unknown at its poor end), "good" (at its
 * good end), "middle" (at its best value, the middle value) or a number from 0
 * to 1: the quantile of each unknown's range counted from its poor end.
 *
 * The map may mark a parameter draw_stream "added". Such parameters are drawn
 * from a stream of their own, after the others, so adding them leaves every
 * earlier draw as it was.
 *
 * Expressions in map.json are parsed by a small parser in this file. They may
 * use numbers, + - * / and brackets, the functions exp, min, max and safediv,
 * and only the names the map declares. Nothing is passed to eval.
 */
/* global module */
(function (root, factory) {
  'use strict';
  var api = factory();
  if (typeof module === 'object' && module && module.exports) module.exports = api;
  else if (root) root.PathwayEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  // ---------------------------------------------------------------- expressions

  var FUNCS = {
    exp: { min: 1, max: 1, f: Math.exp },
    min: { min: 2, max: 8, f: Math.min },
    max: { min: 2, max: 8, f: Math.max },
    safediv: { min: 2, max: 2, f: function (a, b) { return b === 0 ? 0 : a / b; } }
  };
  var hasOwn = Object.prototype.hasOwnProperty;

  function tokenize(src) {
    var toks = [];
    var i = 0;
    while (i < src.length) {
      var c = src[i];
      if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }
      var rest = src.slice(i);
      var m;
      if ((m = /^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/.exec(rest))) {
        toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) {
        toks.push({ t: 'id', v: m[0] }); i += m[0].length; continue;
      }
      if ('+-*/(),'.indexOf(c) >= 0) { toks.push({ t: c }); i++; continue; }
      throw new Error('Unexpected character "' + c + '" in expression: ' + src);
    }
    toks.push({ t: 'end' });
    return toks;
  }

  /**
   * Compile an expression string against a whitelist of names.
   * Returns { src, fn(scope) -> number, ids: array of names used }.
   */
  function compileExpr(src, allowed) {
    if (typeof src === 'number') src = String(src);
    if (typeof src !== 'string' || src.trim() === '') throw new Error('Expression must be a non-empty string');
    var toks = tokenize(src);
    var p = 0;
    var ids = {};

        id: a.id,
        label: a.label,

      return { id: o.id, label: o.label, right: !!o.right, index: stateIndex[o.id] };

    states.forEach(function (s) {

    var branches = map.branches.map(function (b, i) {

      if (!hasOwn.call(stateIndex, b.from)) throw new Error('Branch ' + b.id + ' starts at unknown state ' + b.from);

      var ca = compileExpr(b.calls, classAllowed);
      if (tier === -1 && (b.cost !== '0' || b.calls !== '0')) throw new Error('Branch ' + b.id + ' has a cost but no tier');
      out[stateIndex[b.from]].push(i);
      return {
        id: b.id, from: stateIndex[b.from], to: stateIndex[b.to], label: b.label, tier: tier,

    // class filters ("where" and "per" of a measure): { attribute id: [value ids] }
    var attrIds = {};
    map.attributes.forEach(function (a) { attrIds[a.id] = a.values.map(function (v) { return v.id; }); });
    function compileFilter(f, mid) {

        var vals = Array.isArray(f[aid]) ? f[aid] : [f[aid]];
        vals.forEach(function (v) {
          if (attrIds[aid].indexOf(v) < 0) throw new Error('Measure ' + mid + ' filters on unknown value ' + aid + '=' + v);

    var measures = map.measures.map(function (m) {

    });

      f.stages.forEach(function (sid) { if (!hasOwn.call(measureIndex, sid)) throw new Error('Funnel ' + f.id + ' names unknown measure ' + sid); });

    var updates = map.stocks.update.map(function (u) {

    var promoMeasure = map.promo_measure || null;
    if (promoMeasure && !hasOwn.call(measureIndex, promoMeasure)) throw new Error('promo_measure names unknown measure ' + promoMeasure);
    var derivedUses = {};
    derived.forEach(function (d) { derivedUses[d.id] = d.ids; });

      (l.to_branches || []).forEach(function (bid) {

        if (!usesName(derivedUses[l.via], id, {})) throw new Error('Link ' + l.id + ': ' + l.via + ' does not use ' + id);
      });
      if (l.measure && !hasOwn.call(measureIndex, l.measure)) throw new Error('Link ' + l.id + ' names unknown measure ' + l.measure);
      return { id: l.id, label: l.label, from_stock: l.from_stock, via: l.via, to_branches: (l.to_branches || []).slice(), unknowns: (l.unknowns || []).slice(), measure: l.measure || null };
    });

    var pathNames = setOf(S, new Set(svIds), linkIds, new Set(Object.keys(branchIndex)), new Set(Object.keys(measureIndex)));
    (map.links || []).forEach(function (l) {
      (l.loops || []).forEach(function (lp) {

        (lp.path || []).forEach(function (n) { if (!pathNames.has(n)) throw new Error('Loop ' + lp.id + ' names unknown item ' + n); });

    return {
      __compiled: true,
      map: map,
      params: params,
      paramIds: paramIds,
      stockIds: stockIds,
      stockValues: stockValues,
      derived: derived,
      attributes: attributes,
      tiers: tiers,
      states: states,
      stateIndex: stateIndex,
      outcomes: outcomes,
      branches: branches,
      branchIndex: branchIndex,
      out: out,
      order: order,
      hasCycle: hasCycle,

      funnelEnd: funnelEnd,

  }

  // ---------------------------------------------------------------- parameters

  /**
   * Check and tidy a parameter set. Chances and fractions must lie in [0, 1]; costs, calls and
   * multipliers must not be negative; scales must be positive. Groups bound by a
   * sum_at_most constraint are scaled down in proportion when they break it.
   * Returns { values, adjusted: [notes] }.

    var missing = [];

      if (p.integer) v = Math.round(v);

      if (p.kind === 'scale' && !(v > 0)) throw new Error(p.id + ' must be above zero (got ' + v + ')');
      if (v < 0) throw new Error(p.id + ' must not be negative (got ' + v + ')');

      c.ids.forEach(function (id) { sum += values[id]; });
      if (sum > c.limit) {

  /**
   * The rows of a parameter table, keyed by parameter id. A table may hold its rows
   * as an object keyed by id ({ parameters: { id: row } }) or as a list of rows that
