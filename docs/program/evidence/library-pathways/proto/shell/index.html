<!-- PROTOTYPE OF THE PAGE SHELL. Built by proto/shell/build-shell.js.txt from docs/program/library-pathways/ and proto/shell/src/. Not the live page. -->
<style>
/* Library pathways, page shell. Tokens first; every section uses only these. See spec.md part 1. */
:root{
  /* type scale (px so the floors in the brief are exact) */
  --fs-h1:40px; --fs-h2:30px; --fs-h3:21px; --fs-h4:17px;
  --fs-body:17px; --fs-note:15px; --fs-label:14px; --fs-small:14px; --fs-tag:12px;
  --fs-num:17px; --fs-num-lg:28px; --fs-mono:14px;
  --lh-body:1.55; --lh-tight:1.25; --measure:68ch;
  --font-head:"Bahnschrift","DIN Alternate","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --font-body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  /* space: one 4px scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --gutter:48px; --gap:24px; --bar-h:56px; --content:1760px; --drawer:460px;
  /* ink, light */
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4; --surface-3:#e2e7ec;
  --ink:#13202b; --ink-2:#3a4855; --ink-3:#5c6a76; --line:#d5dce3; --line-2:#a7b2bc;
  --q:#4b5f72; --q-soft:#cfd8e0;                       /* quantities: bars, counts, weights */
  --ok:#0e6b8c; --ok-soft:#d9ecf3;                     /* right / works            : ring   */
  --held:#8a5f00; --held-soft:#f4e7c4;                 /* caught / strains         : hatch  */
  --bad:#c0390f; --bad-soft:#f9dfd5;                   /* wrong / breaks           : solid  */
  --focus:#13202b; --focus-halo:#ffffff;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 10px 28px rgba(19,32,43,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1317; --surface:#161e25; --surface-2:#1d2730; --surface-3:#26323d;
    --ink:#eef2f5; --ink-2:#c6cfd7; --ink-3:#9aa6b1; --line:#2b3742; --line-2:#4a5966;
    --q:#a9bccd; --q-soft:#34434f;
    --ok:#62c3e4; --ok-soft:#163a48; --held:#e6b84e; --held-soft:#3e3216; --bad:#ff8d63; --bad-soft:#4a2318;
    --focus:#eef2f5; --focus-halo:#0e1317;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1317; --surface:#161e25; --surface-2:#1d2730; --surface-3:#26323d;
  --ink:#eef2f5; --ink-2:#c6cfd7; --ink-3:#9aa6b1; --line:#2b3742; --line-2:#4a5966;
  --q:#a9bccd; --q-soft:#34434f;
  --ok:#62c3e4; --ok-soft:#163a48; --held:#e6b84e; --held-soft:#3e3216; --bad:#ff8d63; --bad-soft:#4a2318;
  --focus:#eef2f5; --focus-halo:#0e1317;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
/* widths: xl >= 1600, l 1200-1599, m 640-1199, s < 640 */
@media (max-width:1599px){ :root{ --gutter:32px; --drawer:420px } }
@media (max-width:1199px){ :root{ --gutter:24px; --gap:20px; --fs-h1:34px; --fs-h2:26px; --fs-h3:20px; --fs-body:16px; --fs-label:13px; --bar-h:52px } }
@media (max-width:639px){ :root{ --gutter:16px; --gap:16px; --fs-h1:30px; --fs-h2:24px; --fs-h3:19px; --fs-note:14px; --fs-label:12px; --fs-num-lg:24px; --fs-mono:13px; --drawer:100vw } }

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar-h) + 16px)}
body{margin:0; background:var(--bg); color:var(--ink); font:var(--fs-body)/var(--lh-body) var(--font-body); -webkit-text-size-adjust:100%; overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--font-head); font-weight:600; line-height:var(--lh-tight); margin:0; text-wrap:balance}
h1{font-size:var(--fs-h1)} h2{font-size:var(--fs-h2)} h3{font-size:var(--fs-h3)} h4{font-size:var(--fs-h4); font-family:var(--font-body); font-weight:650}
p{margin:0} a{color:inherit} button,input,select{font:inherit; color:inherit}
code,.mono{font-family:var(--font-mono); font-size:var(--fs-mono)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; box-shadow:0 0 0 5px var(--focus-halo); border-radius:6px}
.skip{position:absolute; left:8px; top:-60px; z-index:99; background:var(--ink); color:var(--surface); padding:8px 14px; border-radius:8px; text-decoration:none; font-weight:650}
.skip:focus{top:8px}
.wrap{max-width:var(--content); margin-inline:auto; padding-inline:var(--gutter)}
.note{font-size:var(--fs-note); color:var(--ink-2)}
.small{font-size:var(--fs-small)}
.meta{font-size:var(--fs-small); color:var(--ink-3)}
.prose{max-width:var(--measure)}
.stack{display:flex; flex-direction:column; gap:var(--s3)}
.row{display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-2); background:var(--surface); border-radius:8px; padding:6px 12px; font-size:var(--fs-small); font-weight:600; cursor:pointer; min-height:36px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.linkbtn{border:0; background:none; padding:0; font:inherit; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line-2); cursor:pointer; color:inherit; text-align:left}
.linkbtn:hover{text-decoration-color:var(--ink)}

/* ---------------------------------------------------------------- number tags: once per picture, column or text */
.n{font-variant-numeric:tabular-nums; font-weight:650; white-space:nowrap}
.t{display:inline-block; font:700 var(--fs-tag)/1 var(--font-body); min-width:17px; padding:2px 3px; border-radius:4px; text-align:center; vertical-align:2px; margin-left:3px; font-style:normal}
.t-M{background:var(--ink-2); color:var(--surface); border:1.5px solid var(--ink-2)}
.t-S{border:1.5px solid var(--ink-2); color:var(--ink-2)}
.t-G{border:1.5px dashed var(--ink-3); color:var(--ink-2)}
sup.tl{font:700 11px/1 var(--font-body); color:var(--ink-3); margin-left:1px; vertical-align:5px}
.stamp{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-small); color:var(--ink-2); white-space:nowrap}

/* ---------------------------------------------------------------- outcome marks: the one visual language */
.g{display:inline-block; flex:none; vertical-align:middle; position:relative}
.g-works,.g-right{width:15px; height:15px; border:2.4px solid var(--ok); border-radius:50%}
.g-strains,.g-caught{width:16px; height:16px; border:1.5px solid var(--held); background:repeating-linear-gradient(45deg,var(--held) 0 2px,transparent 2px 5px)}
.g-breaks,.g-wrong{width:16px; height:16px; background:var(--bad); border-radius:2px}
.g-not_specified{width:16px; height:16px; border:1.5px dashed var(--ink-3); border-radius:2px}
.g-not_specified::after{content:"?"; position:absolute; inset:0; font:700 10px/13px var(--font-body); text-align:center; color:var(--ink-3)}
.g-not_reached{width:6px; height:6px; border-radius:50%; background:var(--ink-3); margin:5px}
.key{display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; font-size:var(--fs-small); color:var(--ink-2)}
.key span{display:inline-flex; gap:8px; align-items:center}
.qbar{display:inline-block; height:10px; background:var(--q); border-radius:2px; vertical-align:middle}
.qbar.o{background:transparent; border:1.5px solid var(--q)}

/* ---------------------------------------------------------------- top bar: sticky, where am I */
.bar{position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.bar-in{max-width:var(--content); margin-inline:auto; padding-inline:var(--gutter); height:var(--bar-h); display:flex; align-items:center; gap:var(--s3)}
.brand{font:600 18px/1 var(--font-head); text-decoration:none; white-space:nowrap; margin-right:var(--s2)}
.nav{display:flex; gap:2px; flex:1 1 auto; min-width:0; overflow:hidden}
.nav a{display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:8px; text-decoration:none; font-weight:600; font-size:var(--fs-label); color:var(--ink-2); white-space:nowrap}
.nav a .nn{font:700 12px/1 var(--font-body); color:var(--ink-3); width:18px; height:18px; display:inline-grid; place-items:center; border:1.5px solid var(--line-2); border-radius:50%}
.nav a:hover{background:var(--surface-2); color:var(--ink)}
.nav a[aria-current="location"]{background:var(--ink); color:var(--surface)}
.nav a[aria-current="location"] .nn{color:var(--surface); border-color:var(--surface)}
.secbtn{display:none; align-items:center; gap:8px; border:1px solid var(--line-2); background:var(--surface); border-radius:8px; padding:6px 10px; font-weight:650; font-size:var(--fs-label); cursor:pointer; min-width:0; flex:1 1 auto; text-align:left}
.secbtn .wn{color:var(--ink-3); font-weight:700; white-space:nowrap}
.secbtn .wt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.unkbtn,.themebtn{white-space:nowrap}
.bar-in>.btn{flex:none}
.unkbtn .badge{font:700 12px/1 var(--font-body); padding:3px 6px; border-radius:10px; background:var(--surface-3); color:var(--ink-2)}
.unkbtn.moved .badge{background:var(--ink); color:var(--surface)}
.themebtn{white-space:nowrap}
.progress{height:3px; background:transparent}
.progress i{display:block; height:3px; width:0; background:var(--ink)}
.secmenu{position:fixed; z-index:60; top:calc(var(--bar-h) + 4px); left:var(--gutter); right:var(--gutter); max-width:560px; background:var(--surface); border:1px solid var(--line-2); border-radius:12px; box-shadow:var(--shadow); padding:var(--s2); max-height:calc(100vh - var(--bar-h) - 24px); overflow:auto}
.secmenu a{display:grid; grid-template-columns:28px 1fr; gap:2px 10px; padding:10px; border-radius:8px; text-decoration:none}
.secmenu a:hover,.secmenu a[aria-current="location"]{background:var(--surface-2)}
.secmenu .nn{grid-row:span 2; font-weight:700; color:var(--ink-3)}
.secmenu b{font-weight:650}
.secmenu span.p{font-size:var(--fs-small); color:var(--ink-2)}
@media (max-width:1599px){ .brand{display:none} }
@media (max-width:1199px){ .nav{display:none} .secbtn{display:inline-flex} }
@media (max-width:639px){ .themebtn{display:none} .unkbtn .lbl{display:none} }

/* ---------------------------------------------------------------- hero and the reading path */
.hero{padding-block:var(--s7) var(--s5)}
.hero-grid{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:var(--s7); align-items:start}
.hero h1{margin-bottom:var(--s3)}
.hero .lede{font-size:20px; color:var(--ink-2); max-width:var(--measure)}
.hero .facts{margin-top:var(--s4)}
.path{list-style:none; margin:0; padding:0; counter-reset:p; border-left:2px solid var(--line-2)}
.path li{position:relative; padding:0 0 var(--s4) var(--s5)}
.path li::before{counter-increment:p; content:counter(p); position:absolute; left:-15px; top:0; width:28px; height:28px; border-radius:50%; background:var(--bg); border:2px solid var(--ink); display:grid; place-items:center; font:700 14px/1 var(--font-body)}
.path a{font-weight:650; text-decoration:none}
.path a:hover{text-decoration:underline}
.path p{color:var(--ink-2); font-size:var(--fs-note)}
.path-h{font:650 var(--fs-label)/1.2 var(--font-body); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s3)}
.keys{margin-top:var(--s5); padding-top:var(--s4); border-top:1px solid var(--line); display:grid; gap:var(--s3)}
.keys .kh{font-weight:650; font-size:var(--fs-small); margin-right:6px}
@media (max-width:1199px){ .hero-grid{grid-template-columns:1fr; gap:var(--s5)} }

/* ---------------------------------------------------------------- section frame */
.sec{padding-block:var(--s7) var(--s4); border-top:1px solid var(--line)}
.sec-head{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:var(--s3) var(--s7); align-items:end; margin-bottom:var(--s5)}
.sec-n{font:650 var(--fs-label)/1.2 var(--font-body); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s2)}
.sec-head h2{margin-bottom:var(--s3)}
.purpose{font-size:19px; color:var(--ink); max-width:var(--measure)}
.dothis{margin-top:var(--s3); display:flex; gap:var(--s2); align-items:baseline; font-size:var(--fs-note); color:var(--ink-2); max-width:var(--measure)}
.dothis b{white-space:nowrap; color:var(--ink); font-size:var(--fs-label); letter-spacing:.04em; text-transform:uppercase}
.sec-aside{display:flex; flex-direction:column; gap:var(--s3); align-items:flex-start; padding-bottom:4px}
.sec-aside .key{justify-content:flex-start}
.callout{border-left:4px solid var(--ink); background:var(--surface-2); padding:10px 14px; border-radius:0 10px 10px 0; font-weight:650; font-size:var(--fs-note)}
@media (max-width:1199px){ .sec-head{grid-template-columns:1fr; align-items:start} .purpose{font-size:18px} }
@media (max-width:639px){ .purpose{font-size:17px} .dothis{flex-direction:column; gap:2px} }
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:var(--s4); min-width:0}
.ph{border:2px dashed var(--line-2); border-radius:14px; padding:var(--s5); color:var(--ink-2); background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--surface-2) 60%,transparent) 14px 28px); display:flex; flex-direction:column; gap:var(--s2); justify-content:center}
.ph b{color:var(--ink); font-size:var(--fs-h4)}
.sub-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--s2) var(--s4); margin:var(--s6) 0 var(--s3)}
.sub-h h3{margin:0}

/* ---------------------------------------------------------------- master and detail (cases and limitations share it) */
.md{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:var(--gap); align-items:start}
.detail{position:sticky; top:calc(var(--bar-h) + 12px); max-height:calc(100vh - var(--bar-h) - 24px); overflow:auto; background:var(--surface); border:1px solid var(--line-2); border-radius:14px; box-shadow:var(--shadow); padding:var(--s4) var(--s5) var(--s5); overscroll-behavior:contain}
.detail .empty{color:var(--ink-2); display:grid; gap:var(--s2)}
.dnav{display:flex; gap:var(--s2); align-items:center; justify-content:space-between; margin-bottom:var(--s3); position:sticky; top:calc(-1 * var(--s4)); background:var(--surface); padding-block:var(--s2); z-index:1; border-bottom:1px solid var(--line)}
.dnav .where{font-size:var(--fs-small); color:var(--ink-3); font-weight:600}
.dsec{margin-top:var(--s4)}
.dsec>h4{margin-bottom:var(--s2)}
.inline-detail{border:1px solid var(--line-2); border-radius:12px; background:var(--surface); box-shadow:var(--shadow); padding:var(--s3) var(--s4) var(--s4); margin:var(--s2) 0 var(--s3)}
@media (max-width:1199px){ .md{grid-template-columns:1fr} .md>.detail{display:none} }

/* ---------------------------------------------------------------- cases grid */
.cg{--cg-cols:84px minmax(200px,1fr) repeat(10,48px) 56px; background:var(--surface); border:1px solid var(--line); border-radius:14px}
.cg-r{display:grid; grid-template-columns:var(--cg-cols); align-items:center; column-gap:0}
.cg-head{position:sticky; top:var(--bar-h); z-index:5; background:var(--surface); border-bottom:2px solid var(--ink); border-radius:14px 14px 0 0; align-items:stretch; padding-top:var(--s2)}
.cg-head .hl,.cg-head .bk{align-self:end}
.cg-head .hl{grid-column:1 / span 2; padding:0 var(--s3) var(--s2); font-size:var(--fs-small); color:var(--ink-2); font-weight:600; align-self:end}
.stepbtn{border:0; background:none; cursor:pointer; padding:6px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:13px; line-height:1.15; color:var(--ink-2); text-align:center; border-radius:6px; height:100%; justify-content:flex-start}
.stepbtn .sn{font:700 15px/1 var(--font-body); color:var(--ink)}
.stepbtn:hover{background:var(--surface-2)}
.stepbtn[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.stepbtn[aria-pressed="true"] .sn{color:var(--surface)}
.cg-head .bk{font-size:13px; color:var(--ink-2); text-align:center; padding-bottom:8px; font-weight:600}
.cg-over{padding:var(--s3) 0 var(--s2); border-bottom:1px solid var(--line)}
.cg-over .ol{grid-column:1 / span 2; padding:0 var(--s3); font-size:var(--fs-small); color:var(--ink-2)}
.cg-over .ol b{color:var(--ink); display:block; font-size:var(--fs-label)}
.stk{display:flex; flex-direction:column-reverse; width:24px; height:88px; margin:0 auto; border:1px solid var(--line-2); background:var(--surface)}
.stk i{display:block; width:100%}
.stk .breaks{background:var(--bad)} .stk .strains{background:repeating-linear-gradient(45deg,var(--held) 0 2px,var(--held-soft) 2px 5px)} .stk .works{background:var(--ok-soft); box-shadow:inset 0 0 0 1.5px var(--ok)}
.stk .not_specified{background:repeating-linear-gradient(0deg,transparent 0 3px,var(--line-2) 3px 4px)} .stk .not_reached{background:var(--surface-2)}
.cg-over .on{text-align:center; font:700 14px/1.2 var(--font-body); color:var(--bad); padding-top:4px; font-variant-numeric:tabular-nums}
.cg-cnt{font-size:13px; color:var(--ink-2); text-align:center; font-variant-numeric:tabular-nums; padding:2px 0}
.cg-cnt-l{grid-column:1 / span 2; padding:0 var(--s3); display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2)}
.cg-cnt-r.cnt-breaks .cg-cnt{color:var(--bad); font-weight:700}
.cg-fam{border-top:1px solid var(--line); background:var(--surface-2)}
.cg-fam .fb{grid-column:1 / span 2; border:0; background:none; text-align:left; padding:10px var(--s3); cursor:pointer; display:flex; gap:8px; align-items:baseline; min-width:0}
.cg-fam .fb .chev{display:inline-block; width:12px; transition:transform .15s; color:var(--ink-3)}
.cg-fam .fb[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.cg-fam .fname{font-weight:700; font-size:var(--fs-label)}
.cg-fam .fcnt{font-size:13px; color:var(--ink-3); white-space:nowrap}
.cg-fam .fcov{grid-column:1 / -1; padding:0 var(--s3) 10px 32px; font-size:var(--fs-small); color:var(--ink-2); margin-top:-6px}
.cg-fam .fx{text-align:center; font:700 13px/1 var(--font-body); color:var(--bad); font-variant-numeric:tabular-nums}
.cg-fam .fx.z{color:var(--ink-3); font-weight:400}
.case{cursor:pointer; min-height:34px; border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent); position:relative}
.case:hover{background:var(--surface-2)}
.case[aria-selected="true"]{background:var(--surface-3); box-shadow:inset 4px 0 0 var(--ink)}
.case .cid{font:13px/1.2 var(--font-mono); color:var(--ink-3); padding-left:var(--s3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.case .ctl{font-size:15px; padding:6px var(--s3) 6px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.case .cbk{text-align:center; font:700 14px/1 var(--font-body); color:var(--bad); font-variant-numeric:tabular-nums}
.case .cbk.z{color:var(--ink-3); font-weight:400}
.cc{display:grid; place-items:center; height:30px; margin:2px 3px; border-radius:4px; position:relative}
.cc.s-breaks{background:var(--bad-soft)}
.cc.s-strains{background:color-mix(in srgb,var(--held-soft) 70%,transparent)}
.cc.ks::after{content:""; position:absolute; top:0; left:0; border-top:8px solid var(--ink-3); border-right:8px solid transparent; border-top-left-radius:4px}
.cg[data-col] .cc{opacity:.32}
.cg[data-col] .case.hit .cc{opacity:.55}
.cg[data-col] .cc.on{opacity:1; outline:2px solid var(--ink); outline-offset:-1px}
.cg[data-col] .case.hit .ctl{font-weight:650}
.cg[data-col] .case:not(.hit) .ctl,.cg[data-col] .case:not(.hit) .cid{opacity:.55}
.colnote{font-size:var(--fs-small); color:var(--ink-2); padding:var(--s2) var(--s3); border-bottom:1px solid var(--line); background:var(--surface-2)}
.cg-tools{display:flex; flex-wrap:wrap; gap:var(--s2) var(--s4); align-items:center; margin-bottom:var(--s3)}
.case-detail .strip{display:flex; gap:4px; margin:var(--s2) 0 var(--s3)}
.case-detail .strip .cc{width:30px; height:30px; margin:0}
.case-detail h3{margin:var(--s1) 0 var(--s3)}
.case-detail .story{font-size:var(--fs-body)}

<script type="application/json" id="lp-data">{"map":{"title":"Pathway map of the reasoning library","version":4,"source":"docs/program/evidence/library-pathways/model-brief.md (sections 12, 13 and 14, revisions 2 to 4, override the earlier sections)","note":"One description of the model. The engine computes from it and the page draws from it. It maps and measures; it proposes no fixes.","unit":"One piece of work: a fix-sized task of about ten cheap calls, where a result is produced and checked.","period":"One period is 30 days. The number of periods is a run setting: it is chosen, never drawn and never swung.","cost_unit":"Cheap-call equivalents. One call by the cheap model (Sonnet) costs 1. Lookup, screen, carry and handoff are paid at the cheap tier.","revision_note":"Revision 2: a good entry shortens the cheap attempt (s_exact, s_similar, s_comp, s_part); coverage of work the cheap model gets right alone is scaled by ok_coverage_factor; only strong-tier solves that pass the gate are stored, and a strong-tier escape that passes writes a bad entry; a found escape's bad entry is corrected with fix_on_found; the cheap retry goes through the same gate.","revision_3_note":"Revision 3 follows brief section 13. The Opus price ratio is an unknown from 1 to 2. Coverage counts every stored entry, good or bad. Each period a share of bad entries leaves the stock (retire_bad). Every unknown has a side; a library-side unknown also has a good end. The ensemble can tie the library-side draws together. There are three reference settings. The funnel is declared below as measures. The weight of a limitation measures how much it holds the result down.","revision_4_note":"Revision 4 follows brief section 14. Library-side unknowns fall into four groups: comes back, reach, entry quality and running cost. The reference settings are the middle values, the eight corners of three groups, the all-good setting and the worst corner. Tied draws use four shared levels, one per group. Two weights, alone and last, are shares of the full fall. The gate and the ladder are shared groups, shown in their own table. Checks promoted into the shared test run are a new pathway: they act at the gate with no lookup.","todays_notes":"Today's notes are CLAUDE.md, the memory notes and the checks in the shared test run. They are present in every way of working, so they cancel out. The chance that the cheap model alone is wrong describes it as it works today, with those notes. The coverage ceilings mean what the library could hold beyond today's notes.","groups":[{"id":"workload","label":"Workload: what the world hands us"},{"id":"mechanism","label":"Mechanism: lookup, screen, delivery, cheap attempt"},{"id":"gate","label":"Gate: tests and review"},{"id":"ladder","label":"Ladder: retry, Opus, Fable"},{"id":"capture","label":"Capture and what happens to escapes"},{"id":"time","label":"Time"}],"parameters":[{"id":"p_visible","name":"Share of work that is visible","group":"workload","kind":"chance","meaning":"Share of pieces of work where a problem shows itself. Examples: an error, a failing check or a stated bug."},{"id":"need_visible","name":"Cheap model wrong, visible work","group":"workload","kind":"chance","meaning":"Among visible pieces of work, the share the cheap model alone would get wrong, working as today with today's notes."},{"id":"need_latent","name":"Cheap model wrong, latent work","group":"workload","kind":"chance","meaning":"Among latent pieces of work, the share the cheap model alone would get wrong, working as today with today's notes."},{"id":"u_exact","name":"Ceiling: the same problem held","group":"workload","kind":"chance","meaning":"Long-run ceiling on the chance the library holds the very same problem, beyond what today's notes hold."},{"id":"u_similar","name":"Ceiling: a similar entry held","group":"workload","kind":"chance","meaning":"Long-run ceiling on the chance one stored entry fits after adapting, beyond what today's notes hold."},{"id":"u_composite","name":"Ceiling: parts held","group":"workload","kind":"chance","meaning":"Long-run ceiling on the chance two or more entries each cover part of the problem, beyond today's notes."},{"id":"latent_coverage_factor","name":"Holding cut for latent work","group":"workload","kind":"chance","meaning":"Multiplier on the three ceilings for latent pieces of work. There the strong model's edge is mostly mistakes it never makes or records."},{"id":"ok_coverage_factor","name":"Holding cut for work the cheap model gets right","group":"workload","kind":"chance","meaning":"Multiplier on the three ceilings for pieces of work the cheap model gets right alone. Entries come from problems it failed."},{"id":"k_fill","name":"Entries needed to fill the library","group":"workload","kind":"scale","meaning":"Number of stored entries, good or bad, at which coverage reaches about 63 percent of its ceiling."},{"id":"v_max","name":"Look-alike ceiling","group":"workload","kind":"chance","meaning":"Highest chance a misleading look-alike entry can be retrieved, once the library is large."},{"id":"k_distract","name":"Entries needed to reach the look-alike ceiling","group":"workload","kind":"scale","meaning":"Number of stored entries at which the look-alike chance reaches about 63 percent of its highest value."},{"id":"t_visible","name":"Lookup starts, visible work","group":"mechanism","kind":"chance","meaning":"Chance a lookup happens when the problem is visible."},{"id":"t_latent","name":"Lookup starts, latent work","group":"mechanism","kind":"chance","meaning":"Chance a lookup happens when nothing signals that a choice matters."},{"id":"c_lookup","name":"Cost of a lookup","group":"mechanism","kind":"cost","pure_cost":true,"meaning":"Cost of one lookup, in cheap-call equivalents."},{"id":"r_exact","name":"Lookup finds the same problem","group":"mechanism","kind":"chance","meaning":"Chance the lookup returns the stored entry when the very same problem is held."},{"id":"r_similar","name":"Lookup finds the similar entry","group":"mechanism","kind":"chance","meaning":"Chance the lookup returns the fitting entry when a similar one is held."},{"id":"r_comp_full","name":"Lookup finds all parts","group":"mechanism","kind":"chance","meaning":"When parts are held, chance the lookup returns all of them."},{"id":"r_comp_part","name":"Lookup finds some parts","group":"mechanism","kind":"chance","meaning":"When parts are held, chance the lookup returns only some of them."},{"id":"f_false","name":"Look-alike comes back on top","group":"mechanism","kind":"chance","meaning":"Chance a misleading look-alike comes back on top when one can be retrieved."},{"id":"c_check_share","name":"Entries with a mechanical check","group":"mechanism","kind":"chance","meaning":"Share of entries that carry a mechanical check that decides whether they apply."},{"id":"c_screen","name":"Cost of a mechanical check","group":"mechanism","kind":"cost","pure_cost":true,"meaning":"Cost of running a mechanical check at the screen, in cheap-call equivalents."},{"id":"a_right","name":"Cheap model accepts a good entry","group":"mechanism","kind":"chance","meaning":"Chance the cheap model accepts a good entry when it judges without a check."},{"id":"a_wrong","name":"Cheap model accepts a wrong entry","group":"mechanism","kind":"chance","meaning":"Chance the cheap model accepts a wrong entry when it judges without a check."},{"id":"d_deliver","name":"Entry in the window when needed","group":"mechanism","kind":"chance","meaning":"Chance an accepted entry is in the working window at the moment it is needed."},{"id":"c_carry","name":"Cost of carrying an entry","group":"mechanism","kind":"cost","pure_cost":true,"meaning":"Cost of carrying a delivered entry in the working window, in cheap-call equivalents."},{"id":"q_exact","name":"Right with a same-problem entry","group":"mechanism","kind":"chance","meaning":"Chance the cheap model gets it right with a good exact entry, on a problem it would otherwise get wrong."},{"id":"q_similar","name":"Right with a similar entry","group":"mechanism","kind":"chance","meaning":"The same chance with a good similar entry that needs adapting."},{"id":"q_comp","name":"Right with all parts","group":"mechanism","kind":"chance","meaning":"The same chance with all parts of a composite entry."},{"id":"q_part","name":"Right with some parts","group":"mechanism","kind":"chance","meaning":"The same chance with only some parts of a composite entry."},{"id":"h_harm","name":"Wrong entry spoils right work","group":"mechanism","kind":"chance","meaning":"Chance a wrong accepted entry spoils work the cheap model would otherwise get right."},{"id":"n_cheap","name":"Cheap calls per attempt","group":"mechanism","kind":"calls","pure_cost":true,"meaning":"Cheap calls in one cheap attempt or one cheap retry with no entry in hand."},{"id":"s_exact","name":"Calls saved, same-problem entry","group":"mechanism","kind":"fraction","pure_cost":true,"meaning":"Share of the cheap attempt's calls saved when a good exact entry is in hand."},{"id":"s_similar","name":"Calls saved, similar entry","group":"mechanism","kind":"fraction","pure_cost":true,"meaning":"Share of the cheap attempt's calls saved when a good similar entry is in hand."},{"id":"s_comp","name":"Calls saved, all parts","group":"mechanism","kind":"fraction","pure_cost":true,"meaning":"Share of the cheap attempt's calls saved when all good parts of a composite are in hand."},{"id":"s_part","name":"Calls saved, some parts","group":"mechanism","kind":"fraction","pure_cost":true,"meaning":"Share of the cheap attempt's calls saved when only some good parts of a composite are in hand."},{"id":"g_tests_visible","name":"Tests catch it, visible work","group":"gate","kind":"chance","meaning":"Chance the tests catch a wrong output when the problem is visible."},{"id":"g_tests_latent","name":"Tests catch it, latent work","group":"gate","kind":"chance","meaning":"Chance the tests catch a wrong output when the problem is latent."},{"id":"s_review","name":"Share of gate passes with a review","group":"gate","kind":"chance","meaning":"Share of gate passes that include a review by Opus."},{"id":"g_review","name":"Review catches it","group":"gate","kind":"chance","meaning":"Chance a review catches a wrong output that the tests missed."},{"id":"c_review","name":"Opus calls per review","group":"gate","kind":"calls","pure_cost":true,"meaning":"Opus calls in one review."},{"id":"rho_retry","name":"Cheap retry is right","group":"ladder","kind":"chance","meaning":"Chance the one cheap retry is right after the gate's feedback."},{"id":"c_handoff","name":"Cost of the handoff to Opus","group":"ladder","kind":"cost","pure_cost":true,"meaning":"Cost of handing the work to Opus, in cheap-call equivalents."},{"id":"n_opus","name":"Opus calls per attempt","group":"ladder","kind":"calls","pure_cost":true,"meaning":"Opus calls in one Opus attempt."},{"id":"n_fable","name":"Fable calls per attempt","group":"ladder","kind":"calls","pure_cost":true,"meaning":"Fable calls in one Fable attempt."},{"id":"m_opus","name":"Opus price ratio","group":"ladder","kind":"multiplier","pure_cost":true,"meaning":"Price of one Opus call over one cheap call. An unknown: 2 per token, nearer 1 per call here."},{"id":"m_fable","name":"Fable price ratio","group":"ladder","kind":"multiplier","pure_cost":true,"meaning":"Price of one Fable call over one cheap call."},{"id":"o_opus","name":"Opus is right","group":"ladder","kind":"chance","meaning":"Chance Opus is right on a problem the cheap model alone would get wrong."},{"id":"o_fable","name":"Fable is right","group":"ladder","kind":"chance","meaning":"Chance Fable is right after Opus was wrong and was caught."},{"id":"w_write","name":"Entry written after a strong solve","group":"capture","kind":"chance","meaning":"Chance an entry is written after an Opus or Fable output passes the gate, right or wrong."},{"id":"c_write","name":"Calls to write an entry","group":"capture","kind":"calls","pure_cost":true,"meaning":"Calls at the solving tier needed to write one entry."},{"id":"e_right","name":"Written entry is good","group":"capture","kind":"chance","meaning":"Chance an entry written after a right solve is good rather than wrong."},{"id":"l_found","name":"Escape found later","group":"capture","kind":"chance","meaning":"Chance an escaped wrong output is found later."},{"id":"fix_on_found","name":"Bad entry corrected when found","group":"capture","kind":"chance","meaning":"Chance the bad entry stored from a strong-tier escape is corrected when that escape is found later."},{"id":"R_rework","name":"Opus calls to rework an escape","group":"capture","kind":"calls","pure_cost":true,"meaning":"Opus calls needed to rework an escaped output that is found later."},{"id":"delta_stale","name":"Good entries going stale","group":"capture","kind":"chance","meaning":"Share of good entries that go stale in each 30-day period."},{"id":"episodes_per_period","name":"Pieces of work per period","group":"time","kind":"size","meaning":"Number of pieces of work in one 30-day period."},{"id":"periods","name":"Number of periods","group":"time","kind":"size","integer":true,"run_setting":true,"meaning":"Number of 30-day periods in the time path, from an empty library. Chosen, never drawn."},{"id":"retire_bad","name":"Bad entries leaving the stock","group":"capture","kind":"chance","meaning":"Share of bad entries withdrawn, replaced or invalidated in each 30-day period.","note":"Listed last. The earlier unknowns keep their place in the random stream, so their draws stay the same."},{"id":"p_promote","name":"Promoted checks run in the shared tests","group":"gate","kind":"chance","meaning":"Share of entries with a mechanical check whose check also runs in the shared tests. Only checks that exist because of an entry.","draw_stream":"added","note":"Drawn from the added stream, apart from the earlier unknowns. So every revision-3 draw stays the same."},{"id":"k_promo_exact","name":"Promoted check catches: same problem","group":"gate","kind":"chance","meaning":"Chance a promoted check catches a wrong output on the same problem it was written for.","draw_stream":"added","note":"Drawn from the added stream, apart from the earlier unknowns. So every revision-3 draw stays the same."},{"id":"k_promo_similar","name":"Promoted check catches: similar problem","group":"gate","kind":"chance","meaning":"Chance a promoted check catches a wrong output on a similar problem, one an entry fits after adapting.","draw_stream":"added","note":"Drawn from the added stream, apart from the earlier unknowns. So every revision-3 draw stays the same."}],"constraints":[{"id":"composite_split","kind":"sum_at_most","ids":["r_comp_full","r_comp_part"],"limit":1,"note":"All parts and some parts cannot together exceed certainty. If a draw breaks this, both are scaled down in proportion."},{"id":"ceilings_split","kind":"sum_at_most","ids":["u_exact","u_similar","u_composite"],"limit":1,"note":"The three ceilings cannot together exceed certainty. If a draw breaks this, all three are scaled down in proportion."}],"tiers":[{"id":"cheap","label":"Cheap model (Sonnet)","price":"1"},{"id":"opus","label":"Opus","price":"m_opus"},{"id":"fable","label":"Fable","price":"m_fable"}],"stocks":{"note":"Two stocks of entries. Both start at zero. Only the library policy changes them.","initial":{"E_good":0,"E_bad":0},"labels":{"E_good":"Good entries","E_bad":"Bad entries (wrong or stale)"},"values":[{"id":"wrong_share","label":"Share of stored entries that are bad","expr":"safediv(E_bad, E_good + E_bad)"},{"id":"fill","label":"How full the library is toward its ceilings, counting every stored entry","expr":"1 - exp(-(E_good + E_bad) / k_fill)"},{"id":"distract","label":"Chance a look-alike can be retrieved","expr":"v_max * (1 - exp(-(E_good + E_bad) / k_distract))"}],"update_note":"Each period is evaluated on the stocks at its start; then both stocks are updated together from those starting values. New entries are the flows through the drawn write branches; a repair moves one entry from bad to good. Only Opus and Fable outputs that pass the gate are written; cheap-tier outputs never are. A share retire_bad of the bad entries at the start of the period leaves the stock (revision 3).","update":[{"id":"E_good","expr":"E_good - delta_stale * E_good + episodes_per_period * (W_good + W_repair)","same_as":"E_good - delta_stale * E_good + episodes_per_period * (P_strong_right * w_write * e_right + P_strong_escaped * l_found * w_write * fix_on_found)"},{"id":"E_bad","expr":"E_bad - retire_bad * E_bad + delta_stale * E_good + episodes_per_period * (W_bad_right + W_bad_escape - W_repair)","same_as":"E_bad - retire_bad * E_bad + delta_stale * E_good + episodes_per_period * (P_strong_right * w_write * (1 - e_right) + P_strong_escaped * w_write - P_strong_escaped * l_found * w_write * fix_on_found)"}]},"measures":[{"id":"P_strong_right","label":"Chance of a right Opus or Fable solve","flow_into":["L10_opus","L10_fable"]},{"id":"P_strong_escaped","label":"Chance a wrong Opus or Fable output passes the gate","flow_into":["L10_opus_escape","L10_fable_escape"]},{"id":"P_escaped","label":"Chance a wrong output escapes the gate, at any tier","flow_into":["L11_escaped","L11_stored"]},{"id":"W_good","label":"Good entries written per piece of work","flow_on":["l10_opus_good","l10_fable_good"]},{"id":"W_bad_right","label":"Bad entries written after a right solve, per piece of work","flow_on":["l10_opus_bad","l10_fable_bad"]},{"id":"W_bad_escape","label":"Bad entries written after a strong-tier escape, per piece of work","flow_on":["l10_opus_escape_bad","l10_fable_escape_bad"]},{"id":"W_repair","label":"Bad entries corrected when their escape is found, per piece of work","flow_on":["l11_stored_fixed"]},{"id":"fw_held","label":"An entry is held for it","unit":"of 100 pieces the cheap model would get wrong alone","scale":100,"per":{"need":["cheap_wrong"]},"where":{"need":["cheap_wrong"],"held":["exact","similar","composite"]},"flow_into":["L1_trigger"]},{"id":"fw_looked_up","label":"It is looked up","unit":"of 100 pieces the cheap model would get wrong alone","scale":100,"per":{"need":["cheap_wrong"]},"where":{"need":["cheap_wrong"],"held":["exact","similar","composite"]},"flow_on":["l1_lookup"]},{"id":"fw_right_back","label":"The right entry comes back","unit":"of 100 pieces the cheap model would get wrong alone","scale":100,"per":{"need":["cheap_wrong"]},"where":{"need":["cheap_wrong"]},"flow_on":["l2_exact_good","l2_exact_bad","l2_similar_good","l2_similar_bad","l2_full_good","l2_full_bad","l2_part_good","l2_part_bad"]},{"id":"fw_good","label":"It is a good entry, not a bad one","unit":"of 100 pieces the cheap model would get wrong alone","scale":100,"per":{"need":["cheap_wrong"]},"where":{"need":["cheap_wrong"]},"flow_on":["l2_exact_good","l2_similar_good","l2_full_good","l2_part_good"]},{"id":"fw_screened","label":"It passes the screen","unit":"of 100 pieces the cheap model would get wrong alone","scale":100,"per":{"need":["cheap_wrong"]},"where":{"need":["cheap_wrong"]},"flow_into":["L4_exact","L4_similar","L4_full","L4_part"]},{"id":"fw_in_window","label":"It is in the window when needed","unit":"of 100 pieces the cheap model would get wrong alone","scale":100,"per":{"need":["cheap_wrong"]},"where":{"need":["cheap_wrong"]},"flow_into":["L5_exact","L5_similar","L5_full","L5_part"]},{"id":"fw_right","label":"The cheap attempt comes out right","unit":"of 100 pieces the cheap model would get wrong alone","scale":100,"per":{"need":["cheap_wrong"]},"where":{"need":["cheap_wrong"]},"flow_on":["l5_exact_right","l5_similar_right","l5_full_right","l5_part_right"]},{"id":"fa_held","label":"An entry is held for it","unit":"of 100 pieces of work of every kind","scale":100,"where":{"held":["exact","similar","composite"]},"flow_into":["L1_trigger"]},{"id":"fa_looked_up","label":"It is looked up","unit":"of 100 pieces of work of every kind", [{"branch":"l10_opus_good","times":"c_write * m_opus"},{"branch":"l10_opus_bad","times":"c_write * m_opus"},{"branch":"l10_opus_escape_bad","times":"c_write * m_opus"},{"branch":"l10_fable_good","times":"c_write * m_fable"},{"branch":"l10_fable_bad","times":"c_write * m_fable"},{"branch":"l10_fable_escape_bad","times":"c_write * m_fable"}]},{"id":"P_climbs","label":"Share of work that climbs to Opus or Fable","flow_into":["L8_handoff"]},{"id":"fw_promo_caught","label":"More caught at the first gate through promoted checks","unit":"of 100 pieces the cheap model would get wrong alone","scale":100,"per":{"need":["cheap_wrong"]},"where":{"need":["cheap_wrong"]},"flow_into":[{"state":"L6_wrong","times":"(1 - g) * promo"}]},{"id":"use_promo_caught_first","label":"Caught at the first gate through promoted checks","unit":"of 100 pieces of work of every kind","scale":100,"flow_into":[{"state":"L6_wrong","times":"(1 - g) * promo"}]},{"id":"use_promo_caught_all","label":"Caught at any gate through promoted checks","unit":"of 100 pieces of work of every kind","scale":100,"flow_into":[{"state":"L6_wrong","times":"(1 - g) * promo"},{"state":"L7_wrong","times":"(1 - g) * promo"},{"state":"L8_wrong","times":"(1 - g) * promo"},{"state":"L9_wrong","times":"(1 - g) * promo"}]},{"id":"use_promo_strength","label":"Catch chance added by promoted checks, averaged over all work","unit":"percentage points of catch chance, averaged over all pieces of work","scale":100,"flow_into":[{"state":"L1_trigger","times":"promo"}]}],"usage_measures":["use_looked_up","use_good_in_hand","use_wrong_in_hand","use_lookup_cost","use_write_cost","use_promo_caught_first","use_promo_caught_all","use_promo_strength"],"usage_note":"How much the library is used, for the library policy at one period. Each is a flow through this graph. The two costs copy the cost of the lookup branch and of the write branches. Three measures count catches through promoted checks and the catch chance they add (revision 4, R21).","fun rams.json is generated by build-params.js.txt. A group's poor end is the end where the mechanism works least as intended. Its good end is where it works as intended. The order here is the order of the four shared levels in the ensemble.","reference_settings":[{"id":"middle","label":"Every unknown at its middle value","levels":{}},{"id":"corner_000","label":"Little comes back, low reach, poor entries","levels":{"recurrence":"poor","reach":"poor","quality":"poor"}},{"id":"corner_001","label":"Little comes back, low reach, good entries","levels":{"recurrence":"poor","reach":"poor","quality":"good"}},{"id":"corner_010","label":"Little comes back, high reach, poor entries","levels":{"recurrence":"poor","reach":"good","quality":"poor"}},{"id":"corner_011","label":"Little comes back, high reach, good entries","levels":{"recurrence":"poor","reach":"good","quality":"good"}},{"id":"corner_100","label":"Much comes back, low reach, poor entries","levels":{"recurrence":"good","reach":"poor","quality":"poor"}},{"id":"corner_101","label":"Much comes back, low reach, good entries","levels":{"recurrence":"good","reach":"poor","quality":"good"}},{"id":"corner_110","label":"Much comes back, high reach, poor entries","levels":{"recurrence":"good","reach":"good","quality":"poor"}},{"id":"corner_111","label":"Much comes back, high reach, good entries","levels":{"recurrence":"good","reach":"good","quality":"good"}},{"id":"all_good","label":"All-good setting: every library unknown at its good end","levels":{"recurrence":"good","reach":"good","quality":"good","running_cost":"good"}},{"id":"worst_corner","label":"Much comes back, high reach, poor entries, high running cost","levels":{"recurrence":"good","reach":"good","quality":"poor","running_cost":"poor"}},{"id":"all_good_costly","label":"All-good setting with running cost at its high end","levels":{"recurrence":"good","reach":"good","quality":"good","running_cost":"poor"}}],"reference_settings_note":"Brief section 14, R18a. A group at poo
