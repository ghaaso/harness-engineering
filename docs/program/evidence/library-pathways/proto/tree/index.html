ot on PATH, use node', and 'no Python on the machine'. The last was false when written."],[2,"86 windows started within 22 minutes, so an entry written after the first failure reaches none of them."]],"worked":""}]},"tx":{"title":"The map as a tree","lede":"Follow 100 pieces of work from the top. Each question splits them. Each answer says how many of the 100 take it and what that costs. Every route ends in one of four outcomes.","tag_line":"Every count and cost in this picture is computed by the engine from the middle values. Most middle values are guesses.","controls":{"policy":{"label":"Way of working","says":"Changes whose counts draw the tree. The totals column always shows all three."},"work":{"label":"Which work","says":"All work, or one of the 32 kinds of work. A kind filters the same tree."},"kind":{"label":"Kind of problem","says":"Visible: something signals the problem. Latent: nothing does."},"need":{"label":"The cheap model alone would be","says":"Whether the cheap model gets it right with no help."},"held":{"label":"What the library holds","says":"For this kind of work. Only the library way has a library."},"distractor":{"label":"A look-alike can be retrieved","says":"A misleading entry that could come back on top."},"period":{"label":"Library as it stands at period","says":"The library fills over 12 periods of 30 days. Its entries change the lookup counts."},"compare":{"label":"Counts shown","says":"Adds the counts of the other two ways beside every answer."},"forks":{"label":"Questions","says":"Open or close every question at once. Questions with no work start closed."}},"short_val":{"visible":"Visible","latent":"Latent","cheap_ok":"Right","cheap_wrong":"Wrong","exact":"The same problem","similar":"One entry, adapted","composite":"Several parts","nothing":"Nothing","yes":"Yes","no":"No"},"stage_q":{"L1":"Is a lookup made?","L2":"What comes back?","L3":"Does it pass the screen?","L4":"Is it in the window when needed?","L5":"Is the cheap output right?","L6":"Does the gate catch a wrong output?","L7":"Is the cheap retry right?","L8":"Does Opus get it right?","L9":"Does Fable get it right?","L10":"Is an entry written?","L11":"Is an escape found later?","outcome":"Where the work ends"},"question":{"L1_trigger":"Is the library looked up?","L2_lookup":"What comes back from the library?","L3_exact":"A good exact entry came back. Does it pass the screen?","L3_similar":"A good similar entry came back. Does it pass the screen?","L3_full":"All the parts came back, good. Do they pass the screen?","L3_part":"Some parts came back, good. Do they pass the screen?","L3_wrong":"A wrong entry came back. Does the screen stop it?","L4_exact":"Is the exact entry in the window when it is needed?","L4_similar":"Is the similar entry in the window when it is needed?","L4_full":"Are all the parts in the window when they are needed?","L4_part":"Are the parts in the window when they are needed?","L4_wrong":"Is the accepted wrong entry in the window when needed?","L5_none":"With no entry in hand, is the cheap output right?","L5_exact":"With the good exact entry, is the cheap output right?","L5_similar":"With the good similar entry, is the cheap output right?","L5_full":"With all the good parts, is the cheap output right?","L5_part":"With some good parts, is the cheap output right?","L5_wrong":"With the wrong entry in hand, is the cheap output still right?","L6_right":"The right cheap output goes through the gate.","L6_wrong":"The cheap output is wrong. Does the gate catch it?","L7_retry":"The cheap model retries with the gate's feedback. Is the retry right?","L7_right":"The right retry goes through the gate.","L7_wrong":"The retry is wrong. Does the gate catch it?","L8_handoff":"The work is handed up to Opus.","L8_opus":"Opus does the work. Is its output right?","L8_right":"The right Opus output goes through the gate.","L8_wrong":"The Opus output is wrong. Does the gate catch it?","L9_fable":"Fable does the work. Is its output right?","L9_right":"The right Fable output goes through the gate.","L9_wrong":"The Fable output is wrong. Does the gate catch it?","L10_opus":"Opus solved it. Is the solve written to the library?","L10_fable":"Fable solved it. Is the solve written to the library?","L10_opus_escape":"A wrong Opus output got through. Is it written to the library?","L10_fable_escape":"A wrong Fable output got through. Is it written to the library?","L11_escaped":"A wrong output got through. Is it found later?","L11_stored":"A wrong output got through and was stored. Is it found, and is the entry corrected?","EQUAL":"Accepted and right","ESCAPED_FOUND":"Wrong, got through, found later","ESCAPED_SILENT":"Wrong, got through, never found","UNRESOLVED":"Caught, but never solved"},"outcome_says":{"EQUAL":"The output is right and accepted.","ESCAPED_FOUND":"A wrong output passed the gate. It was found later and reworked by Opus.","ESCAPED_SILENT":"A wrong output passed the gate. Nobody found it.","UNRESOLVED":"Every tier failed and the gate caught each failure. No tier is left."},"why":{"start":"{way} starts at “{start}”. It never passes here.","upstream":"No work reaches “{state}”.","rule":"Its chance rule gives zero here.","factor_kind":"Its chance is zero for this kind of work: {words}.","factor_all":"Its chance is zero for all work here: {words}.","words":{"capture=0":"this way of working writes nothing to the library","held_exact=0":"the library holds no entry for the same problem","held_similar=0":"the library holds no entry that fits after adapting","held_composite=0":"the library holds no entry in parts","held_nothing=1":"the library holds nothing for it","distractor=0":"no misleading look-alike can be retrieved","f=0":"no look-alike can come back on top","ok=1":"the cheap model alone would be right","ok=0":"the cheap model alone would be wrong","need_wrong=0":"the cheap model alone would be right","need_wrong=1":"the cheap model alone would be wrong","visible=0":"the problem is latent","visible=1":"the problem is visible","wrong_share=0":"no stored entry is bad yet","fill=0":"the library is still empty","distract=0":"no look-alike can be retrieved yet","E_good=0":"the library holds no good entry yet","E_bad=0":"the library holds no bad entry yet","r_hit=0":"the lookup can return nothing held"}},"legend":{"count":"Pieces of the 100 that take this answer. The bar is drawn against 100.","nest":"Indented: the next question for those pieces.","shared":"Goes to a shared question, drawn once further down. Click to jump.","same":"Goes to the same next question as the answer above it.","quiet":"Faint: carries no work under this choice. “Why 0?” gives the reason.","lims":"Limitations whose main design step is this stage (M).","cases":"Real cases that broke at this design step (M). They show where steps break, not how often.","promo":"Checks promoted into the shared tests. They reach every gate from the stock of good entries, with no lookup.","tiers":"Cost is in cheap-call equivalents. One cheap call costs 1. The pattern shows who is paid.","tags":"Tags: M measured on this PC; S outside study or price list; G guess."},"routes":{"title":"Every route, one by one","says":"A route is one full path from the first question to an outcome. Pick one to light it in the tree and step through it.","loop_note":"Routes are listed exactly as the engine walks them."},"design_steps_note":"The real-case walks used the design's ten steps; the model has eleven stages. The match was set by hand. Steps 1 and 2 sit with the trigger. Step 6 covers the screen and the cheap attempt. Step 8 covers the retry, Opus and Fable.","stock_note":"The two stocks at the start of the chosen period. Only the library way of working has them.","promo_note":"Promoted checks need no lookup, so they act even when nothing is looked up."},"ptx":{"design_steps":{"1":["L1"],"2":["L1"],"3":["L2"],"4":["L2"],"5":["L4"],"6":["L3","L5"],"7":["L6"],"8":["L7","L8","L9"],"9":["L10"],"10":["L11"]},"tags":{"M":"measured on this PC","S":"outside study or price list","G":"guess"},"computed_tag":"A computed number takes the weakest tag of its inputs. Almost every computed number here is a guess (G). In a table, the tag in the heading covers its column.","policy_names":{"top_first":"Strong model directly","cheap_ladder":"Cheap model with the ladder","library":"Cheap model with the library"},"policy_short":{"top_first":"Strong directly","cheap_ladder":"Cheap + ladder","library":"Cheap + library"},"policy_says":{"top_first":"Opus does the work. If the gate catches a wrong answer, Fable tries. No library.","cheap_ladder":"The cheap model tries first. A caught failure gets one cheap retry, then Opus, then Fable. No library.","library":"The same ladder, plus the library. A lookup comes before the cheap attempt. Opus and Fable solves are written back as entries."},"todays_notes":"Today's notes are in every way of working: CLAUDE.md, the memory notes, checks in the shared test run. So they cancel out."}}</script>
