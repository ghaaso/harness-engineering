<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library map tree</title>
<style>:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0f0ec; --ink: #1c1d1f; --ink-2: #4a4c50; --ink-3: #6c6f74;
  --line: #d8d8d2; --line-2: #c4c4bc; --accent: #1f5fbf; --accent-soft: #e3ecfa; --accent-ink: #ffffff;
  --quiet: .42; --bar: #2b2d31; --bar-track: #ececE6; --flash: #fff3c4;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1d2024; --surface-2: #24282d; --ink: #ecedef; --ink-2: #c3c6cb; --ink-3: #9a9ea5;
    --line: #353a41; --line-2: #4a5059; --accent: #7fb0ff; --accent-soft: #1f2d44; --accent-ink: #0d1520;
    --bar: #dfe2e6; --bar-track: #2c3137; --flash: #3d3720; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --surface-2: #24282d; --ink: #ecedef; --ink-2: #c3c6cb; --ink-3: #9a9ea5;
  --line: #353a41; --line-2: #4a5059; --accent: #7fb0ff; --accent-soft: #1f2d44; --accent-ink: #0d1520;
  --bar: #dfe2e6; --bar-track: #2c3137; --flash: #3d3720; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 90px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); overflow-x: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; z-index: 50; background: var(--surface); padding: 6px 10px; }
.muted { color: var(--ink-3); }
b, strong { font-weight: 650; }

/* ---------------------------------------------------------------- header and controls */
.top { padding: 18px 24px 6px; }
.top-in { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; max-width: 1840px; margin: 0 auto; }
.kicker { margin: 0; font-size: 14px; color: var(--ink-3); letter-spacing: .02em; }
h1 { margin: 2px 0 4px; font-size: 28px; line-height: 1.2; letter-spacing: -.01em; }
.lede { margin: 0; max-width: 72ch; color: var(--ink-2); }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 15px; }
.btn:hover { border-color: var(--ink-3); }
.btn.ghost { background: transparent; white-space: nowrap; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; text-align: left; }

.controls { max-width: 1840px; margin: 10px auto 0; padding: 12px 24px 14px; display: flex; flex-wrap: wrap; gap: 14px 30px; align-items: flex-start;
  background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ctl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ctl > .lab { font-size: 14px; font-weight: 650; color: var(--ink-2); }
.ctl > .says { font-size: 14px; color: var(--ink-3); max-width: 34ch; line-height: 1.3; }
.ctl.kindset { flex-direction: row; flex-wrap: wrap; gap: 10px 18px; padding: 8px 12px; border: 1px dashed var(--line-2); border-radius: 10px; }
.ctl.kindset[hidden] { display: none; }
.ctl.kindset .ctl { gap: 3px; }
.share { font-size: 15px; align-self: center; padding: 4px 10px; border-radius: 8px; background: var(--surface-2); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 6px 12px; font-size: 15px; cursor: pointer; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button[disabled] { opacity: .45; cursor: default; }
.per { display: flex; align-items: center; gap: 10px; }
.per input { width: 180px; accent-color: var(--ink); }
.per b { min-width: 6ch; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- the three columns */
.layout { max-width: 1840px; margin: 0 auto; padding: 16px 24px 80px; display: grid; grid-template-columns: 250px minmax(0, 1fr) 410px; gap: 22px; align-items: start; }
.strip, .totals { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.treecol { min-width: 0; container-type: inline-size; container-name: tree; }

/* ---------------------------------------------------------------- stage strip */
.strip h2, .totals h2 { font-size: 15px; margin: 0 0 6px; text-transform: none; color: var(--ink-2); }
.stg-list { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.stg-list li { margin: 0; }
.stg-btn { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 6px 7px 8px; cursor: pointer; border-left: 4px solid transparent; margin-left: -3px; border-radius: 0 8px 8px 0; }
.stg-btn:hover { background: var(--surface-2); }
.stg-btn .no { font-weight: 700; font-size: 15px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.stg-btn .nm { font-size: 15px; font-weight: 650; line-height: 1.25; }
.stg-btn .q { grid-column: 2; font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.stg-btn .wk { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.stg-btn .wk .trk { flex: 1; height: 8px; background: var(--bar-track); border-radius: 4px; overflow: hidden; }
.stg-btn .wk .trk i { display: block; height: 100%; background: var(--bar); }
.stg-btn .ev { grid-column: 2; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.stg-btn.inview { border-left-color: var(--accent); background: var(--accent-soft); }
.stg-btn.inview .no { color: var(--accent); }
.stg-btn.zero .nm, .stg-btn.zero .q, .stg-btn.zero .wk { opacity: var(--quiet); }
.strip .cap { display: none; }
.legend { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.legend h2 { margin-bottom: 8px; }
.legend dl { margin: 0; display: grid; grid-template-columns: 44px 1fr; gap: 8px 8px; align-items: start; }
.legend dt { display: flex; justify-content: center; padding-top: 2px; }
.legend dd { margin: 0; line-height: 1.35; }

/* ---------------------------------------------------------------- swatches: outcomes and tiers */
.sw { display: inline-block; width: 15px; height: 15px; border: 1.5px solid var(--ink); border-radius: 3px; vertical-align: -2px; flex: none; }
.o-EQUAL { background: var(--surface); border-radius: 50%; }
.o-ESCAPED_FOUND { background: repeating-linear-gradient(45deg, var(--ink) 0 1.5px, transparent 1.5px 4.5px); }
.o-ESCAPED_SILENT { background: var(--ink); }
.o-UNRESOLVED { background: radial-gradient(circle, var(--ink) 1.3px, transparent 1.6px) 0 0 / 4.5px 4.5px; }
.t-cheap { background: var(--surface); }
.t-opus { background: repeating-linear-gradient(45deg, var(--ink) 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, var(--ink) 0 1px, transparent 1px 4px); }
.t-fable { background: var(--ink); }
.tag { display: inline-block; font: 700 11px/14px var(--font); min-width: 15px; padding: 0 3px; border: 1px solid currentColor; border-radius: 3px; text-align: center; vertical-align: 1px; margin-left: 3px; color: var(--ink-2); font-style: normal; }
.tag.G { border-style: dashed; }
.tag.M, .tag.S { background: var(--ink-2); color: var(--surface); border-color: var(--ink-2); }

/* ---------------------------------------------------------------- tree header */
.treehead { padding: 4px 0 2px; }
.colsbar { position: sticky; top: 0; z-index: 6; background: var(--bg); padding: 6px 0 6px; border-bottom: 1px solid var(--line); }
.totals .tlegend { display: none; }
.quietroot { margin: 0 0 4px; }
.quietroot .fork > .fh { padding: 2px 0; }
.quietroot .fh .q { font-size: 15.5px; }
.treehead .what { font-size: 16px; margin: 0 0 6px; }
.treehead .what b { font-weight: 700; }
.cols { display: grid; align-items: end; font-size: 13px; color: var(--ink-3); font-weight: 650; }
.cols span { padding: 0 4px; }
[hidden] { display: none !important; }
.r { display: grid; }
.r, .cols { grid-template-columns: minmax(0, 1fr) 70px 190px 180px; column-gap: 10px; }
.compare .r, .compare .cols { grid-template-columns: minmax(0, 1fr) 66px 100px 100px 100px 170px; }
.cols .num, .r .num { text-align: right; }

/* ---------------------------------------------------------------- forks and answers */
.tree { padding-top: 6px; }
.root { margin: 0 0 18px; }
.root-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 18px 0 6px; padding-top: 10px; border-top: 2px solid var(--line-2); }
.root-head .kind { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.root-head .from { font-size: 14px; color: var(--ink-2); }
.fork { position: relative; }
.fh { display: grid; align-items: center; padding: 7px 4px 7px 0; border-radius: 8px; }
.fh .qcell { grid-column: 1 / 3; display: flex; align-items: flex-start; gap: 6px; min-width: 0; }
.tog { border: 1px solid var(--line-2); background: var(--surface); width: 26px; height: 26px; border-radius: 7px; cursor: pointer; flex: none; font-size: 13px; line-height: 1; padding: 0; margin-top: 1px; }
.fh .q { font-size: 16.5px; font-weight: 650; line-height: 1.3; }
.fh .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13.5px; color: var(--ink-3); margin-top: 2px; }
.fh .meta .stgchip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 1px 9px; font-size: 13.5px; cursor: pointer; color: var(--ink-2); }
.fh .meta .stgchip:hover { border-color: var(--ink-3); }
.fh .meta .stgchip[aria-expanded="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.fh .meta .start { font-weight: 650; color: var(--ink); background: var(--accent-soft); padding: 0 8px; border-radius: 999px; }
.ctwrap { display: contents; }
.fh .arrive { grid-column: 3 / span 1; font-size: 14px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.compare .fh .arrive { grid-column: 3 / span 3; }
.fh .arrive b { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.fh .arrive .tri { display: inline-grid; grid-template-columns: repeat(3, 100px); column-gap: 10px; text-align: right; }
.fh .arrive .tri span { padding-right: 4px; }
.fh .arrive .tri .me b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.fork.quiet > .fh .q, .fork.quiet > .fh .arrive { opacity: var(--quiet); }
.fork.quiet > .fh .q { font-weight: 500; }
.reason { margin: 0 0 6px 32px; font-size: 14px; color: var(--ink-3); }
.reason b { color: var(--ink-2); font-weight: 600; }
.inc { margin: 0 0 4px 32px; font-size: 14px; }
.inc ul { margin: 4px 0 6px; padding-left: 18px; color: var(--ink-2); }
.inc li { margin: 2px 0; }

.ans { list-style: none; margin: 0 0 4px 10px; padding: 0 0 0 0; border-left: 2px solid var(--line-2); }
.a { position: relative; margin: 0; padding-left: 0; }
.a > .r { position: relative; padding: 5px 4px 5px 18px; border-radius: 6px; align-items: center; min-height: 36px; }
.a > .r::before { content: ""; position: absolute; left: 0; top: 50%; width: 12px; border-top: 2px solid var(--line-2); }
.a:last-child { }
.a > .r:hover { background: var(--surface-2); cursor: pointer; }
.a .lbl { font-size: 15.5px; line-height: 1.3; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.a .lbl .de { flex-basis: 100%; }
.a .lbl .why { margin-left: 6px; font-size: 13.5px; }
.a .ch { font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.ct { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
.ct .trk { width: 110px; height: 12px; background: var(--bar-track); border-radius: 3px; overflow: hidden; flex: none; }
.ct .trk i { display: block; height: 100%; background: var(--bar); min-width: 0; }
.ct b { font-size: 16px; min-width: 52px; text-align: right; }
.compare .ct .trk { width: 34px; height: 10px; }
.compare .ct b { min-width: 44px; font-size: 15px; }
.compare .ct.me b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.ct.zero { opacity: var(--quiet); }
.co { font-size: 14px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; justify-content: flex-end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.co .each { color: var(--ink-3); }
.de { font-size: 14px; min-width: 0; }
.dest { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px 8px; background: var(--surface); cursor: pointer; text-align: left; font-size: 14px; line-height: 1.3; max-width: 100%; }
.dest:hover { border-color: var(--ink-3); }
.dest .arrow { font-weight: 700; }
.dest.same { border-style: dashed; color: var(--ink-2); }
.dest.end { font-weight: 650; }
.dest .st { color: var(--ink-3); font-weight: 400; }
.nest { color: var(--ink-3); font-size: 14px; }
.a.quiet > .r .lbl, .a.quiet > .r .ch, .a.quiet > .r .co, .a.quiet > .r .de { opacity: var(--quiet); }
.whyline { margin: 0 0 4px 22px; padding: 4px 10px; font-size: 14px; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; }
.a > .fork { margin-left: 14px; }
.promo { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--ink-2); border: 1.5px dashed var(--ink-3); border-radius: 999px; padding: 0 8px; margin-left: 8px; white-space: nowrap; }

/* on a lit route */
.a.onroute > .r { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.a.onroute > .r .lbl { font-weight: 650; }
.a.current > .r { outline: 3px solid var(--accent); outline-offset: 1px; }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: var(--flash); } 100% { background: transparent; } }

/* evidence panel (limitations and cases at a design step) */
.evp { margin: 2px 0 10px 32px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; }
.evp h3 { margin: 0 0 4px; font-size: 16px; }
.evp .sub { margin: 0 0 8px; font-size: 14px; color: var(--ink-3); }
.evp .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
.evp h4 { margin: 8px 0 4px; font-size: 15px; }
.evp ul { margin: 0; padding-left: 0; list-style: none; }
.evp li { margin: 3px 0; font-size: 15px; }
.evp details summary { cursor: pointer; }
.evp details p { margin: 4px 0 8px 16px; font-size: 14px; color: var(--ink-2); }
.evp .fam { font-size: 13.5px; color: var(--ink-3); }
.evp .also summary { color: var(--ink-2); font-size: 14px; }

/* ---------------------------------------------------------------- ends (outcomes) */
.ends h2, .routes h2 { font-size: 20px; margin: 22px 0 6px; }
.ends .endrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 8px; border-top: 1px solid var(--line); }
.ends .endrow .nm { font-weight: 650; font-size: 16px; }
.ends .endrow .says { font-size: 14px; color: var(--ink-2); }
.ends .endrow .v { font-size: 17px; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------------------------------------------------------------- routes */
.routes .says { font-size: 15px; color: var(--ink-2); margin: 0 0 8px; }
.routes .tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; font-size: 14px; }
.rlist { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.rlist li { border-top: 1px solid var(--line); }
.rbtn { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) 110px 90px; gap: 10px; align-items: start; text-align: left; border: 0; background: none; padding: 8px 6px; cursor: pointer; border-radius: 6px; }
.rbtn:hover { background: var(--surface-2); }
.rbtn[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.rbtn .no { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rbtn .path { font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.rbtn .path .end { color: var(--ink); font-weight: 650; }
.rbtn .v { text-align: right; font-variant-numeric: tabular-nums; }
.rbtn .v small { display: block; color: var(--ink-3); font-size: 13px; }

/* ---------------------------------------------------------------- stepper */
.stepper { position: sticky; bottom: 10px; z-index: 8; margin-top: 16px; background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
.stepper .rt { font-size: 14px; color: var(--ink-3); }
.stepper .now { font-size: 16px; }
.stepper .now b { font-weight: 700; }
.stepper .nums { font-size: 14px; color: var(--ink-2); }
.stepper .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------------------------------------------------------------- totals column */
.totals .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.totals h2 { font-size: 17px; color: var(--ink); margin-bottom: 2px; }
.totals .sub { font-size: 14px; color: var(--ink-3); margin: 0 0 8px; }
.ttab { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ttab th { font-size: 13.5px; font-weight: 650; color: var(--ink-2); text-align: right; padding: 4px 4px 6px; vertical-align: bottom; line-height: 1.2; }
.ttab th:first-child { text-align: left; }
.ttab th.me { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.ttab td { padding: 5px 4px; border-top: 1px solid var(--line); text-align: right; font-size: 15px; vertical-align: middle; }
.ttab td:first-child { text-align: left; font-size: 14px; }
.ttab td .lc { display: flex; gap: 6px; align-items: center; }
.ttab td.me { background: var(--accent-soft); font-weight: 700; }
.ttab td .mb { display: block; height: 5px; background: var(--bar-track); border-radius: 3px; margin-top: 3px; overflow: hidden; }
.ttab td .mb i { display: block; height: 100%; background: var(--bar); margin-left: auto; }
.ttab tr.sum td { border-top: 2px solid var(--line-2); font-weight: 650; }
.cbars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: end; height: 150px; margin: 8px 0 4px; padding: 0 4px; }
.cbar { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; align-items: stretch; text-align: center; font-size: 14px; }
.cbar .stack { display: flex; flex-direction: column-reverse; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
.cbar .stack i { display: block; border-top: 1px solid var(--ink); }
.cbar .stack i:last-child { border-top: 0; }
.cbar b { font-size: 16px; }
.cbar.me b { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.cnames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 13.5px; text-align: center; color: var(--ink-2); padding: 0 4px; line-height: 1.25; }
.tierkey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; margin-top: 8px; }
.tierkey span { display: inline-flex; gap: 5px; align-items: center; }
.stock .note { font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }
.stock ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }

/* ---------------------------------------------------------------- medium widths: the strip becomes a band over the tree */
@media (max-width: 1499px) {
  .layout { grid-template-columns: minmax(0, 1fr) 340px; gap: 8px 18px; padding-left: 16px; padding-right: 16px; }
  .controls, .top { padding-left: 16px; padding-right: 16px; }
  .strip { grid-column: 1; grid-row: 1; }
  .treecol { grid-column: 1; grid-row: 2; }
  .totals { grid-column: 2; grid-row: 1 / span 2; }
  .cbars { height: 110px; }

  .strip { position: sticky; top: 0; z-index: 12; max-height: none; overflow: visible; background: var(--bg); padding: 6px 0 4px; border-bottom: 1px solid var(--line); }
  .strip > h2, .strip .legend { display: none; }
  .stg-list { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; border-left: 0; }
  .stg-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 0 4px; margin: 0; border-left: 0; border-bottom: 3px solid transparent; border-radius: 6px; }
  .stg-btn .nm, .stg-btn .q, .stg-btn .ev { display: none; }
  .stg-btn .no { font-size: 13px; }
  .stg-btn .wk { margin: 0; width: 100%; padding: 0 3px; }

 escapes pass, fewer bad entries written, a smaller bad share","path":["E_good","promoted_checks","l8_caught","W_bad_escape","E_bad","wrong_share"]}]}],"links_note":"A link is an influence on branch chances that is not a step of a piece of work. promoted_checks: in the library way of working, an entry's mechanical check can also run in the shared tests. It needs no lookup, so it does not pass through the funnel. It can only raise the gate's catch chance, at every gate pass: g_lib = g + (1 - g) * promo. That equals 1 - (1 - g) * (1 - promo). It acts on exact and similar entries, weighed by the share of good entries. Left out: a bad entry's promoted check can pin a defect in place. Leaving it out leans toward the library.","limitations":[],"limitations_note":"Filled in after the real-case walkthroughs. Each entry will name a limitation and the parameters it acts through; each branch carries the ids of the limitations that act on it."},"params":{"title":"Parameter table for the pathway map of the reasoning library","version":4,"map":"map.json","note":"Facts only. Tags: M measured on this PC in the owner's repositories or session records; S taken from an outside study; G a guess. A number that only loosely relates to a parameter is a hint: the tag is G and the note says how it differs. Each parameter has a low, a high and a best value. The best value is the middle value the map starts from. The map draws values evenly between low and high. Each row has a side: library (exists only because of the library) or other. A library-side row also has a good_end: the end at which the mechanism works as intended. It also has a lib_group, one of the four groups map.json declares (brief section 14, R18). With tied draws, library-side values share one level per group per run (R18b).","tags":{"M":"Measured on this PC, in this owner's repositories or session records","S":"Taken from an outside study or the vendor's price list","G":"A guess. The note may cite a hint and say how it differs from the parameter"},"assumptions":["Cost unit: one call by the cheap model (Sonnet) is 1. Calls are treated as equal in size inside a tier.","One period is 30 days and one piece of work is a fix-sized task of about ten cheap calls (brief section 12, R6).","Revision 2 (brief section 12): z_wrongstore removed; s_exact, s_similar, s_comp, s_part, ok_coverage_factor and fix_on_found added; c_carry, rho_retry, w_write, r_exact and h_harm re-tagged G (hints, not measurements); the k_fill source corrected.","m_opus runs from 1 to 2 and m_fable from 2 to 4. The tops come from the vendor price ratios supplied for this task (2026-11-12), which are per token; the settings are per call.","Map refuter pass (2026-11-12, refute-map.md): m_opus re-tagged G (a per-token price standing in for a per-call setting); e_right re-tagged S (one of its three sources is an outside study); the notes of m_fable and u_similar now say where their best values sit.","Where a refuter corrected a first-round number, the corrected number is used.","Revision 3 (brief section 13): m_opus is an unknown from 1 to 2, best 2, tag G (R10); retire_bad added, 0 to 0.3, best 0.05, tag G (R12); every row has a side, and library-side rows a good_end (R13); k_fill now counts every stored entry, good or bad (R11).","Revision 4 (brief section 14): every library-side row has a lib_group: recurrence, reach, quality or running_cost (R18). Three unknowns were added (R21): p_promote, k_promo_exact and k_promo_similar. All are library side, group quality, good end high, tag G. Their ranges are 0 / 0.5 / 1, 0.3 / 0.7 / 0.95 and 0 / 0.05 / 0.3. The three are drawn from a stream of their own, so every earlier draw stays the same.","Check of the third build (2026-11-13, check-third-build.md): the visible notes of u_similar, s_review, m_fable and retire_bad say 'the middle value' instead of 'best'. No number changed.","Today's notes are CLAUDE.md, the memory notes and the checks in the shared test run. They are present in every way of working, so they cancel out. need_visible and need_latent describe the cheap model as it works today, with those notes. The ceilings u_exact, u_similar and u_composite mean what the library could hold beyond today's notes."],"source_key":{"F1":"scratchpad/lib/facts/F1-ks-mechanics.md","F2":"scratchpad/lib/facts/F2-ks-research-and-refutes.md","F3":"scratchpad/lib/facts/F3-v2-numbers.md","F4":"scratchpad/lib/facts/F4-lit-positive.md","F5":"scratchpad/lib/facts/F5-lit-negative.md","F6":"scratchpad/lib/facts/F6-lit-tiers-baselines.md","D1":"scratchpad/lib/dives/D1-token-arithmetic.md","D7":"scratchpad/lib/dives/D7-write-side.md","P-proponent":"scratchpad/lib/dives/P-proponent.md","R1":"scratchpad/lib/refute/R1-ceiling.md","R2":"scratchpad/lib/refute/R2-drain.md","R3":"scratchpad/lib/refute/R3-flat.md","R4":"scratchpad/lib/refute/R4-gap-coverage.md (table re-read from scratchpad/lib/refute/r4/clinic-gates-out.txt)","R5":"scratchpad/lib/refute/R5-price-time.md","R6":"scratchpad/lib/refute/R6-clock.md","R8":"scratchpad/lib/refute/R8-push-precision.md","R9":"scratchpad/lib/refute/R9-trust-cost.md (and R9-git.json, R9-econ.out.txt)","R10":"scratchpad/lib/refute/R10-critic.md","W":"docs/program/evidence/library-pathways/walkthroughs/ (the 59 real-case walkthroughs; case ids such as L01 C3a name the file and section)","V2":"docs/program/HARNESS-V2-DESIGN-2026-11.md","HB":"docs/program/HARNESS-BOTTLENECKS-2026-11.md","TB":"docs/program/TOKEN-BOTTLENECK-2026-11.md","scratchpad":"C:/Users/User/AppData/Local/Temp/claude/192654871f6b1294/0bf1c4f3-76dc-4144-995c-2af5a213db41/scratchpad/lib (prefix of the scratchpad paths above, minus the leading 'scratchpad/lib')"},"parameters":[{"id":"p_visible","group":"workload","low":0.1,"high":0.8,"best":0.4,"tag":"G","side":"other","source":"No source. Hints: F3 s4 (tool errors are 2.2 % of calls); R10 s1.2 (windows with an edit or a failed check: 10.9 % of FixFlow tokens, 77.9 % of Clinic).","note":"Hint only. Errors are 2.2 % of calls. And 11 to 78 % of tokens sit in windows with an edit or a failed check. Neither counts pieces of work."},{"id":"need_visible","group":"workload","low":0.15,"high":0.6,"best":0.3,"tag":"G","side":"other","source":"No source. Hints: F6 s(iii) and R4 s1 (vendor scores, Sonnet 5.5 vs Opus 5.5); F6 s(i) (AgentBrew student alone 45.3 on Terminal-Bench 2.0).","note":"Hint. On whole benchmarks Sonnet 5.5 fails about 29 % (Terminal-Bench 4.0) to 54 % (FrontierCode 1.1). Those are whole tasks, not one error or one failing check."},{"id":"need_latent","group":"workload","low":0.2,"high":0.7,"best":0.4,"tag":"G","side":"other","source":"No source. Hint: R4 s1 (Clinic slice table, read again in this run).","note":"Hint. Round-one review found a serious defect in 9 of 14 Opus-built slices. It found one in 2 of the 4 Sonnet slices that have counts. These are slices, found by review."},{"id":"u_exact","group":"workload","low":0.02,"high":0.22,"best":0.06,"tag":"M","side":"library","good_end":"high","lib_group":"recurrence","source":"R3 s1 (3 to 5 same-cause repeats in 48 to 50 fix commits on main; 95 % interval on 5 of 50 reaches 22 %); F5 H2 (outside study: 2.1 to 3.2 % of fixes rebuildable from past fixes).","note":"3 to 5 of 48 to 50 fix commits repeated an earlier cause (6 to 10 %). One repository, 64 days. The ceiling now means beyond today's notes; this count does not separate them."},{"id":"u_similar","group":"workload","low":0.03,"high":0.45,"best":0.15,"tag":"S","side":"library","good_end":"high","lib_group":"recurrence","source":"F2 s1 (X-05 F01 to F03: 17 to 45 % of bug fixes follow recurring fix patterns, secondary reads); F5 H2 (2.1 to 3.2 % rebuildable from past fixes in one project, unconfirmed summary).","note":"Outside studies: 17 to 45 % of fixes follow recurring patterns; one project: 2.1 to 3.2 %. The middle, 0.15, sits between. They had nothing like today's notes: a lean toward the library, unsized."},{"id":"u_composite","group":"workload","low":0,"high":0.25,"best":0.05,"tag":"G","side":"library","good_end":"high","lib_group":"recurrence","source":"No source. Hints: F4 (one retrieved item scored best in ReasoningBank and SWE-Exp); F5 H2 (2.1 and 3.2 % of fixes buildable from one or several past fixes).","note":"No study counts problems made of several stored parts. One project found 2.1 % and 3.2 % of fixes buildable from past fixes. The range predates reading ceilings as beyond today's notes."},{"id":"latent_coverage_factor","group":"workload","low":0.05,"high":1,"best":0.3,"tag":"G","side":"library","good_end":"high","lib_group":"recurrence","source":"No source. Hints: F1 s5 (the diff check is the only route to problems the agent does not notice); F3 s4 (0 of 200 sampled search steps judged likely saved by an index).","note":"No measurement. The design reaches silent problems only through a diff check. A 200-step sample found no step an index would likely save. The range runs from almost nothing to no penalty."},{"id":"ok_coverage_factor","group":"workload","low":0.05,"high":1,"best":0.4,"tag":"G","side":"library","good_end":"high","lib_group":"recurrence","source":"No source. Brief section 12, R2 (entries come from strong-tier solves, and under the library the strong tier works only on what the cheap model failed).","note":"No measurement. Entries exist for problems the cheap model failed. So a piece of work it gets right alone is less likely to have one. The top, 1, means no penalty."},{"id":"k_fill","group":"workload","low":10,"high":300,"best":40,"tag":"S","side":"library","good_end":"low","lib_group":"recurrence","source":"F4 (APC: hit rate 2 % at 1 entry and 46 to 48 % at 100 entries; its 14.29 % is at the 20th percentile of queries, a cold-start curve over the query stream, not at 20 entries; AWM: most gain within about 40 examples; SWE-Exp: gains level off near 300). Corrected in revision 2 after verify-engine.md section 6.","note":"A plan-caching study: 2 % at 1 entry, 46 % at 100, ceiling near 55 %. A fit gives 27 to 55 entries. Another study levelled off near 300. Both templated."},{"id":"v_max","group":"workload","low":0.1,"high":0.9,"best":0.4,"tag":"G","side":"library","good_end":"low","lib_group":"quality","source":"No source for a lookup. Hint: R8 s2 (forward replay over 154 changes, projected to 133 entries: some entry fired wrongly on 16 to 51 % of changes for the selective key types).","note":"Hint. Diff-keyed warnings were replayed forward over 154 changes, projected to 133 entries. Some entry fired falsely on 16 to 51 % of changes. That is a push channel, not a lookup."},{"id":"k_distract","group":"workload","low":15,"high":250,"best":60,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: R8 s2 (projections from per-entry false-fire rates).","note":"Hint. Projected from replay fire rates, the false-fire chance reaches about 63 % of its top. That happens near 20 entries for loose keys and near 180 for selective keys."},{"id":"t_visible","group":"mechanism","low":0.2,"high":1,"best":0.5,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hints: F1 s5 and s8 (pull-only design; compliance is self-reported and escalations without a lookup are undercounted).","note":"No measured lookup rate exists. The design relies on the agent choosing to look up, and compliance is self-reported. The top of the range means every visible problem triggers a lookup."},{"id":"t_latent","group":"mechanism","low":0.02,"high":0.6,"best":0.15,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hint: F6 s(ii) (agents that succeed 22 % of the time predict 77 %).","note":"No measured rate. Some agents that succeeded 22 % of the time predicted 77 %, so asking only when in doubt is unreliable. Nothing signals these problems, so the rate is set low."},{"id":"c_lookup","group":"mechanism","low":0.1,"high":2,"best":1,"tag":"G","side":"library","good_end":"low","lib_group":"running_cost","source":"No source. Hints: F3 s7 (no measured number for one lookup turn exists); R1 s2 (one extra call per exploration run costs 11 to 16 % of tokens).","note":"Hint. A pulled lookup is one extra model call, which is 1 by this map's unit. Low end: a script with no model turn. High end: a lookup plus a follow-up turn."},{"id":"r_exact","group":"mechanism","low":0.4,"high":0.95,"best":0.75,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source for a lookup's recall. Hints: F2 s1 (KS-O19 table: duplicate bug reports sharing no words, 33.6 % by title, 19.0 % by description, 5.1 % in both); F1 s1 (pilot target: recall at shown at least 60 %, a target not a result).","note":"Hint. 5 to 34 % of duplicate bug reports share no words with their twin, so word-matching misses them. That is bug-report text, not stored fixes. The design's pilot target is 60 %."},{"id":"r_similar","group":"mechanism","low":0.2,"high":0.8,"best":0.5,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source for a chance. Hint: F2 s1 (BM25 scored 10.2 to 18.45 points lower on dissimilar duplicate bug reports than on similar ones).","note":"Hint. Word-matching scored 10 to 18 points lower on dissimilar duplicate bug reports than on similar ones. That is a ranking score on bug reports, not a hit chance."},{"id":"r_comp_full","group":"mechanism","low":0.02,"high":0.4,"best":0.1,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hints: F1 s3 (a lookup shows at most one lead and one candidate); F4 (one retrieved item beat several in ReasoningBank and SWE-Exp; Memento found more cases did not help).","note":"No measurement. One lookup shows at most one lead and one candidate, and three outside studies did best with one retrieved item. Returning every part at once is therefore unlikely."},{"id":"r_comp_part","group":"mechanism","low":0.1,"high":0.6,"best":0.35,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hint: F1 s3 (display cap of one lead and one candidate).","note":"No measurement. One lookup shows at most two items, so some parts is likelier than all. Its good end is high: some parts beat none. With the previous value, at most 1."},{"id":"f_false","group":"mechanism","low":0.1,"high":0.8,"best":0.35,"tag":"G","side":"library","good_end":"low","lib_group":"quality","source":"No source for a chance. Hints: F2 s2 (KS-C7: one error template with 2 to 3 causes scores a full match on the wrong cause); F4 (MeanCache test: 12.7 to 33 % false hits on queries that should all miss, search summary only).","note":"Hint. Error templates here carry 2 to 3 causes, so a wrong-cause match scores full. Semantic caches gave 13 to 33 % false hits on queries that should miss (unconfirmed summary)."},{"id":"c_check_share","group":"mechanism","low":0.03,"high":0.4,"best":0.2,"tag":"M","side":"library","good_end":"high","lib_group":"quality","source":"F1 s3, R9 s1.6 (3 of about 15 worked-example entries can return 'applies' without Docker, 6 of 15 with it; about 3 of 116 entry-bearing seed rows).","note":"Counted in the design's seed. 3 of 15 worked-example entries carry a check usable without Docker, and 6 of 15 with it. Across the whole seed it is about 3 of 116."},{"id":"c_screen","group":"mechanism","low":1,"high":3,"best":2,"tag":"G","side":"library","good_end":"low","lib_group":"running_cost","source":"F1 s1 (design estimate, labelled inferred: a native verify adds 2 to 3 turns).","note":"Design estimate, not measured: a verify adds 2 to 3 extra turns. The check itself runs in 0.2 s with no tokens, so the low end is one call."},{"id":"a_right","group":"mechanism","low":0.5,"high":0.98,"best":0.85,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: F5 A1 (Xiong: agents copy stored records whose inputs resemble the new one, correlation near 1).","note":"Hint. Agents tend to copy stored records that look like the current input. One study found a correlation near 1. So good entries are probably accepted. Not measured on coding work."},{"id":"a_wrong","group":"mechanism","low":0.35,"high":0.95,"best":0.65,"tag":"S","side":"library","good_end":"low","lib_group":"quality","source":"F5 C1 (ClashEval, arXiv 2404.10198: six top models adopted wrong retrieved content over a correct prior more than 60 % of the time).","note":"Six top models took wrong retrieved content over their own correct answer more than 60 % of the time. Question answering with planted wrong values, not look-alike repair notes."},{"id":"d_deliver","group":"mechanism","low":0.5,"high":0.98,"best":0.85,"tag":"G","side":"library","good_end":"high","lib_group":"reach","source":"No source. Hint: F3 s1 (48 compactions in Clinic main sessions; what a compaction drops was never measured).","note":"Hint. An entry stays in the window until a compaction or a handoff drops it. Clinic main sessions compacted 48 times. What compaction loses has not been measured here."},{"id":"c_carry","group":"mechanism","low":0.1,"high":1.5,"best":0.73,"tag":"G","side":"library","good_end":"low","lib_group":"running_cost","source":"No measurement of carrying cost. Hint: D1 s2 (860 tokens x about 260 remaining calls / 306k tokens per call = 0.73, derived); answer size from KS-C9 (0.4 tokens per character on 2,904 results); 306k and 519 calls from F3 s1 and s7.","note":"Hint, derived not measured. It assumes an 860-token answer, 306k tokens per slice call and 519 calls per slice. It also assumes 260 remaining calls (half the session)."},{"id":"q_exact","group":"mechanism","low":0.35,"high":0.99,"best":0.75,"tag":"S","side":"library","good_end":"high","lib_group":"quality","source":"F4 (Dynamic Cheatsheet: Game of 24 10 to 99, Equation Balancer 44.8 to 100, both one repeated template).","note":"On a repeated template a stored solution fixed 89 of 90 failures (Game of 24). Net gain over baseline failures, on same-template puzzles. The design stores a diagnosis, not the whole fix."},{"id":"q_similar","group":"mechanism","low":0.07,"high":0.5,"best":0.2,"tag":"S","side":"library","good_end":"high","lib_group":"quality","source":"F4 and F5 (net gain divided by baseline failures, my arithmetic: SWE-Exp 6.8 %, ReasoningBank 7.0 to 7.4 %, AgentBrew 11.5 to 20.8 %, Agent KB 11.4 %, AWM 15.7 %, ExpeL 15 to 32 %).","note":"Net gain over baseline failures: 7 % (SWE-Exp, ReasoningBank), 12 to 21 % (AgentBrew, Agent KB), 16 to 32 % (AWM, ExpeL). These average over all retrievals, so a good fit should do better."},{"id":"q_comp","group":"mechanism","low":0.03,"high":0.5,"best":0.15,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: F4 (ReasoningBank 49.7 at one item vs 44.4 at four; SWE-Exp 42.0 vs 39.0).","note":"No study measures all parts of a composite. Two studies scored lower with more retrieved items, so this is set at or under the similar-entry value."},{"id":"q_part","group":"mechanism","low":0,"high":0.3,"best":0.08,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: same as q_comp.","note":"No measurement. With only some parts the cheap model must work out the rest, so this is set below the all-parts value."},{"id":"h_harm","group":"mechanism","low":0.2,"high":0.9,"best":0.55,"tag":"G","side":"library","good_end":"low","lib_group":"quality","source":"No source for this step on its own. Hints: F5 C1 (ClashEval: wrong content beat a correct prior over 60 % of the time; the same figure a_wrong cites); F5 C3 (MemCollab raw memory: HumanEval 42.7 to 34.1, GSM8K 73.0 to 56.6, MATH500 27.4 to 18.8).","note":"Hint. The over-60 % figure is the one a_wrong cites, so one figure supports two steps. Raw stronger-model memory cut weaker models' scores by 4 to 31 %. Question answering, not repair."},{"id":"n_cheap","group":"mechanism","low":3,"high":30,"best":10,"tag":"G","side":"other","source":"No source. Hints: F3 s1 (FixFlow agent windows average about 12 calls); R9 s1.2 (median agent window 7 calls, p25 4).","note":"Hint. FixFlow agent windows average about 12 calls (median 7). That is a whole agent run. The map sets one piece of work at about ten cheap calls (brief R6)."},{"id":"s_exact","group":"mechanism","low":0.1,"high":0.9,"best":0.5,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: W L01 C3a and C3b (a stored route would have cut 2 to 8 calls per wave-2 agent; one wave-1 agent spent about 8; with the route in its brief an agent recovered in 2 calls).","note":"Hint. In one real case a stored route would have saved 2 to 8 calls per agent, of about 8 spent. On a ten-call task that is 0.2 to 0.8. One case only."},{"id":"s_similar","group":"mechanism","low":0,"high":0.7,"best":0.25,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: W L05-4 (a stored fix would have saved a detour of a commit, its revert, stopped full runs and one Opus review; the entry showed the cause, not the fix, so adapting was needed).","note":"Hint. In one case a stored fix would have saved a wrong commit, its revert and a review. It gave the cause, not the fix, so adapting still costs calls."},{"id":"s_comp","group":"mechanism","low":0,"high":0.6,"best":0.2,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: same as s_similar; F4 (two outside studies scored lower with more retrieved items).","note":"No measurement. Several parts must be read and joined, so the saving is set at or below the similar-entry value."},{"id":"s_part","group":"mechanism","low":0,"high":0.4,"best":0.1,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Hint: same as s_comp.","note":"No measurement. With only some parts, the cheap model must work out the rest. So the saving is set below the all-parts value."},{"id":"g_tests_visible","group":"gate","low":0.5,"high":0.95,"best":0.8,"tag":"G","side":"other","source":"No source for a catch rate. Hints: R2 s1 (CI caught both mypy repeats; CI stayed green on both Expo pin failures); F2 s1 (SapFix: 131 of 165 patches passed tests, only 27 of 57 crashes fixed correctly).","note":"Hint. CI caught both mypy repeats but passed both Expo pin failures. In SapFix, passing tests alone let wrong patches through. No catch rate was counted."},{"id":"g_tests_latent","group":"gate","low":0.05,"high":0.5,"best":0.25,"tag":"G","side":"other","source":"No source for a catch rate. Hint: R4 s1 (serious defect in 9 of 14 Opus-built slices at round-one review).","note":"Hint. Opus-built slices still had a serious defect found by round-one review in 9 of 14. The record does not split what tests had already passed from what review found."},{"id":"s_review","group":"gate","low":0.2,"high":1,"best":0.5,"tag":"G","side":"other","source":"No source for the share per piece of work. Hints: R4 s1 (every slice in the Clinic table had an Opus review); V2 (a reviewer on every PR).","note":"Measured per slice: every Clinic slice had an Opus review. A slice holds many pieces of work, so the share per gate pass is lower. The middle value is a guess."},{"id":"g_review","group":"gate","low":0.3,"high":0.85,"best":0.65,"tag":"G","side":"other","source":"No source for a catch rate. Hints: HB s3.3 (19 serious findings at round one; at least 5 more later, made by the fixes); R4 s1.","note":"Hint. Round one found 19 serious defects; at least 5 more appeared later, made by the fixes. What reviews missed was never counted, so no catch rate exists."},{"id":"c_review","group":"gate","low":2,"high":15,"best":5,"tag":"G","side":"other","source":"No source for review length. Hints: R9 s1.2 (reviewer as a fresh agent of 3 to 7 calls); D7 s2 (reviewer 3 to 5 turns).","note":"Estimates only: a reviewer agent of 3 to 7 calls (R9) or 3 to 5 turns (D7). The length of an actual Opus review was not measured."},{"id":"p_promote","group":"gate","low":0,"high":1,"best":0.5,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Brief section 14, R21 (the orchestrator's ruling on the range).","note":"No measurement. It counts only checks that exist because an entry was written. Regression tests a team writes anyway are in every way of working. At 0 nothing is promoted."},{"id":"k_promo_exact","group":"gate","low":0.3,"high":0.95,"best":0.7,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Brief section 14, R21 (the orchestrator's ruling on the range). Hint: W, LIM-35 (tests written with the work asserted the wrong behaviour).","note":"No measurement. A check aimed at the very problem catches much of what goes wrong on it. The walks also saw tests that asserted the wrong behaviour."},{"id":"k_promo_similar","group":"gate","low":0,"high":0.3,"best":0.05,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source. Brief section 14, R21 (the orchestrator's ruling on the range). Hint: W L04 C4 (a stored check tested the old defect while the same cause returned in a new form).","note":"No measurement. A check written for one problem rarely tests a different one. One walk saw a stored check miss the same cause in a new form."},{"id":"rho_retry","group":"ladder","low":0.2,"high":0.6,"best":0.36,"tag":"G","side":"other","source":"No source for one cheap retry. Hint: V2 table row R1 and HB s3.3 (Clinic: 64 % of reviews sent a slice back; 2.8 rounds per slice). R4 clinic-gates-out.txt read again in this run.","note":"Hint. 64 % of Clinic reviews sent a whole slice back, so a round passes 36 % of the time. Slices, not pieces of work; first and later rounds mixed; fixes mostly Opus-led."},{"id":"c_handoff","group":"ladder","low":1,"high":10,"best":3,"tag":"G","side":"other","source":"No source for a price. Hints: R9 s1.2 (a fresh agent's first call is about 66k tokens); R1 s3.4 (opening exploration is 55 to 61 % of subagent tokens efore refuters found it. An outside study rejected 24 to 38 % of drafted notes."},{"id":"l_found","group":"capture","low":0.2,"high":0.95,"best":0.6,"tag":"G","side":"other","source":"No source for a chance. Hints: R9 s1.1 (50 of 233 non-merge commits on main are fixes); F1 s3 (about 128 open defects stay in the register); F3 s8 (183 minor findings with no status).","note":"Hint. 50 of 233 commits on main were fixes. About 128 known defects sit open in the register, and 183 findings have no status. None counts escapes found against escapes never found."},{"id":"R_rework","group":"capture","low":5,"high":60,"best":15,"tag":"G","side":"other","source":"R9 s1.4 (a fix in a main session at 430 to 544k per call, 10 to 30 calls; R9 marks it an estimate).","note":"Estimate: a fix in a main session takes 10 to 30 calls (R9, itself a guess). The high end allows a production incident."},{"id":"fix_on_found","group":"capture","low":0.05,"high":0.8,"best":0.3,"tag":"G","side":"library","good_end":"high","lib_group":"quality","source":"No source for a chance. Hints: W L09-4 (a correction reached two files; verdicts.txt:30 still carries 742 s); W L10-2 (a refuted line was rewritten and still stands); W L08-2 (the record still says \"They can\").","note":"Hint. In three real cases a correction did not reach every stored copy. An old figure, a refuted line and a refuted claim all still stand. Three cases, no rate."},{"id":"delta_stale","group":"capture","low":0.01,"high":0.25,"best":0.05,"tag":"G","side":"library","good_end":"low","lib_group":"quality","source":"No source for a rate. Hints: R3 s1 (the fix's own lines stay in main: 47 of 50 keep half or more); R10 s1.5 (fix footprint unchanged: 61 % at 1 day, 13 % at 30 days); R6 (value half-life 2 to 11 months, unmeasured).","note":"Hint. 3 of 50 fixes lost half their lines within about two months. Yet 87 % of fix footprints changed within 30 days. One period is 30 days (brief R6)."},{"id":"retire_bad","group":"capture","low":0,"hi ier was not who caught the error (12 cases, 3 families)","LIM-32 Reviews are costly and still pass wrong conclusions (11 cases, 4 families)","LIM-28 In the window is not the same as used (10 cases, 5 families)"],"works_items":15,"walks_with_at_least_one_item":59},"items":[{"id":"LIM-01","key":"start_load","main_step":1,"title":"Too much applies at the start of a task","what":"At the start of a task many stored entries could apply at once. Loading them all crowds the window; loading a few risks leaving out the one that matters.","steps":[1,5],"real":{"cases":0,"families":0,"tag":"M","family_ids":[],"case_ids":[],"examples":[]},"contradicted":[{"family":"L05","family_name":"race flaky data","cases":["L05:L05-3","L05:L05-4"],"reason":"Lookups came at a failed check in the middle of the task, not at its start. L05-3 looked up at transcript line 1152 of 1892, and L05-4 from line 1369 of 4070."}],"origin":"thought experiment only","params":["c_carry","d_deliver"],"shown":"yes","merged_from":1,"absorbed":{"breaks":[],"known_titles":["12 too much applies at task start"],"later_additions":[]}},{"id":"LIM-02","key":"subagent_empty","main_step":1,"title":"Short helper windows start without the session's lessons","what":"Work is split across many short helper windows. Each starts fresh, so it must look up or relearn what the parent session already knew.","steps":[1,5],"real":{"cases":0,"families":0,"tag":"M","family_ids":[],"case_ids":[],"examples":[]},"contradicted":[{"family":"L01","family_name":"same mistake new session","cases":[],"reason":"Helper windows in the same folder receive CLAUDE.md and the memory index at transcript line 6. They lack only what the session learned since the last memory write."},{"family":"L02","family_name":"silent defect found later","cases":["L02:C1","L02:C2","L02:C5"],"reason":"Fresh windows found every defect: the adversarial audit, the red team, the adversarial re-read, the root reviews. Emptiness was the asset here."},{"family":"L03","family_ eriment only","params":["e_right","w_write"],"shown":"yes","merged_from":1,"absorbed":{"breaks":[],"known_titles":[],"later_additions":["untrusted text becomes trusted memory"]}}],"works":[{"case":"L01:C3a","family":"L01","tag":"G","basis":"estimate","caveat":"The same walk rates capture as broken: no note anywhere ever recorded the route. It rates the trigger as not specified.","text":"A stored pdftoppm route, served to the second wave, would have saved 2 to 8 calls per agent. Four Opus agents were in that wave."},{"case":"L01:C4a","family":"L01","tag":"G","basis":"estimate","caveat":"The same walk rates the trigger as not specified and the afterlife as broken. The cause went away about three hours after the note. The walk's own first figure is zero to one call saved per agent.","text":"One git flag with an exact error template, served before cloning, would have saved the 15 failed clones of 11-04."},{"case":"L10:L10-3","family":"L10","tag":"M","basis":"seen","channel":"a pushed note","text":"The pushed Python note worked at no extra cost. Three agents carried its remedy in the same command as the probe, on 11-09 and 11-12."},{"case":"L08:L08-1","family":"L08","tag":"M","basis":"seen","channel":"the memory index","text":"The memory index put the long-paths fix into a sibling session before its first clone; that clone never failed."},{"case":"L05:L05-4","family":"L05","tag":"G","basis":"estimate","text":"A lookup by the failing test's name would have hit the root's entry. It would have saved a wrong fixture commit, its revert, stopped runs and one Opus review."},{"case":"L05:L05-3","family":"L05","tag":"G","basis":"estimate","caveat":"The check that held belongs to the earlier knowledge-store design, not to the owner's library design. The same walk rates the check step as broken: the only verdict on the failure was a rerun.","text":"The check held. An exact match to an old, fixed cause was tested and came back 'does not apply'. No wrong fix was applied."},{"case":"L06:C4","family":"L06","tag":"G","basis":"estimate","channel":"CLAUDE.md","text":"After the first solve, a do-not-apply entry would block the handoff's wrong advice. That advice would let a 4-digit PIN be guessed without limit. CLAUDE.md already warns of it."},{"case":"L06:C2","family":"L06","tag":"G","basis":"estimate","text":"The action words 'enable dispatcher' reach the stored hazard. That prevents the measured replay: 36 messages about months-old jobs, plus permanent suppressed rows."},{"case":"L03:C5","family":"L03","tag":"G","basis":"estimate","text":"The builder's own words 'offline presence outbox' reach the right entry. Had a lookup fired, it would have saved three days of stuck badges and a rework commit."},{"case":"L09:L09-2","family":"L09","tag":"M","basis":"seen","channel":"the project's own conventions file","caveat":"The same walk says a lookup would have saved nothing at the time. No entry could exist before the first failure, and the fix took about a minute.","text":"A red check handed raw output to Fable. Fable fixed the defect in about a minute and wrote the rule, with its reason, within two minutes."},{"case":"L09:L09-1","family":"L09","tag":"G","basis":"estimate","text":"The entry from slice two, fetched at slice four's check, would have stopped the top tier's wrong premise. That saves one finding's round trip."},{"case":"L07:L07-4","family":"L07","tag":"M","basis":"seen","channel":"CLAUDE.md and the stored design documents","caveat":"The walk also says the reuse avoided at least two failed cloud builds. That is the walker's inference, not something seen.","text":"A later change reused two stored traps that earlier failed cloud builds had paid for. A later design reused a stored design that had cost about 15M helper tokens."},{"case":"L07:L07-5","family":"L07","tag":"M","basis":"seen","channel":"the project documents","caveat":"The same walk rates use, capture and afterlife as broken. It notes that an older playbook still names the sign-in system the team turned down.","text":"A design 'no' stored with its reason held for five months and was never argued again."},{"case":"L10:L10-1a","family":"L10","tag":"G","basis":"estimate","caveat":"The scan is a mechanism of the earlier knowledge-store design, not of the owner's library design.","text":"The earlier knowledge-store design scans for fixes not on the main branch. That scan fits June exactly. It removes one of build 15's two causes and 16 days of broken main."},{"case":"L10:L10-1b","family":"L10","tag":"M","basis":"seen","channel":"a check in the shared test run","text":"The empty-value check promoted into the shared test run blocks that mistake for every agent and human, with no lookup."}]},"cases":{"families":[{"id":"same-mistake","name":"Same mistake, new session","covers":"Errors on this PC that came back in later sessions, other projects and subagents."},{"id":"silent-defect","name":"Silent defect found later","covers":"Faults that passed every test and were found weeks later."},{"id":"build-new-from-old","name":"Building new beside old","covers":"New features built next to older ones that held the same hazard."},{"id":"vendor-build-deploy","name":"Outside vendor causes","covers":"Build and deploy failures caused by Expo, Railway, Docker and Windows."},{"id":"flaky-race-data","name":"Races and flaky failures","covers":"Failures that do not repeat on demand, or depend on timing and other processes."},{"id":"composite-merge","name":"Two correct pieces, one fault","covers":"Fixes that were right alone but wrong when merged."},{"id":"research-design","name":"Research and design cases","covers":"Research verdicts, plans and lessons that later proved wrong or ignored."},{"id":"cross-project","name":"Across projects","covers":"Facts learned in one project that another project needed."},{"id":"ladder-real-life","name":"The ladder in real life","covers":"Cases where top models made or endorsed the error."},{"id":"libraries-over-time","name":"Existing notes over time","covers":"How the owner's small libraries behaved as facts aged."}],"cases":[{"id":"f01-C1a","family":"same-mistake","title":"Python is missing on this PC","story":"A session found no usable python on this PC and wrote the fix down. Ten minutes after a compaction dropped the 'no Python' line, a top model typed a python heredoc again.","when":"First fix 2026-10-06; repeat 2026-11-01","source":"Clinic session 1f10835f; session e24f17dc line 2928","entry":"Python or python3 exits 49 (Microsoft Store stub). A real Python 3.12.14 sits in the Codex app folder. Call that full path, or use node or PowerShell for small JSON work. Check: the path with --version prints 3.12.14.","steps":[[1,"The window points toward Python, because CLAUDE.md names Python 3.12. A summary that said 'no Python' was replaced by one without it."],[3,"The owner's design names no trigger. A shell tool error is not a trigger in the earlier knowledge-store design. Only the exit-49 result could start a lookup, after the call.",1],[0,"The error text is word for word and easy to recognise."],[0,"One entry matches exactly."],[1,"This is the main session. The entry is held until the next compaction, and this session already lost the fact once at a compaction."],[0,"Swap python for the full path. A plain JSON script runs on 3.12."],[0,"The rerun's exit code decides, at no cost."],[4,"The failing model is already the top rung. A stronger model would make the same call."],[2,"Python was a side stumble. The earlier knowledge-store design needs a fix commit and a control pair, which a PC fact lacks. Memory got it 29 days later.",1],[2,"The interpreter belongs to another app, which rewrote its folder on 2026-10-21. Newer Pythons arrived later. No repository event marks any of this.",1]],"worked":""},{"id":"f01-C1b","family":"same-mistake","title":"Python error, but this project uses uv","story":"A subagent typed bare python while its window held the project's 'uv run --locked python' route. It failed, then recovered with diff and grep on the next call.","when":"2026-11-09","source":"Clinic subagent agent-a87e4f07079fc62e5","entry":"Same as the python entry, or the memory line. Python is not on PATH in Git Bash (a Windows Store alias); use node for JSON.","steps":[[1,"The project's right route, uv run, was already in the window. The agent typed bare python anyway."],[3,"Same as before. No trigger fires before the call."],[0,"The error text is the same word for word."],[1,"Same error, different right answer. The entry says node or Codex 3.12. This project uses uv with locked 3.13 packages."],[0,"The subagent window holds it for its short life."],[1,"Fine for a JSON compare. For anything that imports project code it points to the wrong interpreter and away from uv run."],[0,"The result is immediate."],[4,"The agent is already Opus."],[3,"No rule says whether the clinic variant is stored as a sibling, a revision, or not at all."],[2,"Two project memories disagree about one PC. EMS says use node for JSON. The clinic says uv run python. The design has no project field.",1]],"worked":""},{"id":"f01-C1c","family":"same-mistake","title":"A stored 'no' about tools that exist","story":"A design note said no Python and no gh. Six minutes later gh was installed. Python had been in use since 10-06. Clinic memory later stored 'no uv', then uv was installed.","when":"2026-10-31 to 2026-11-02","source":"Commit 53f3a5c, ORCHESTRATION-DESIGN line 39; HARNESS-REVIEW line 276","entry":"No Python and no gh on this PC. Design around them. Run backend gates only in Docker.","steps":[[0,"A session planning work here would look up which tools exist."],[3,"No error occurs when an agent avoids a tool it wrongly believes is missing."],[1,"'Is there Python?' is a plain-language question. Only plain-language handles could match it.",1],[0,"The entry is returned. That is the problem."],[0,"Any window can hold it."],[2,"The cheap model designs around tools that exist, such as Docker-only gates. Nothing it does fails."],[2,"A stored 'no' never fails loudly. The agent just does not try. Only a separate review caught it on 11-01."],[4,"There is no failure to hand up."],[2,"The writer checked PATH only. It wrote 'no gh' six minutes before installing gh, and 'no Python' while Python had been in use since 10-06."],[2,"gh arrived 10-31 and uv 11-02. Corrections landed separately in a doc, a memory note and the design. The clinic copy is stale.",1]],"worked":""},{"id":"f01-C2a","family":"same-mistake","title":"Bash cuts long heredoc commands","story":"Bash commands over about 8 KB fail with an unexpected-EOF error and write nothing. Four later moments repeated it, once by the note's own writer a day after writing it.","when":"First 2026-10-31; repeats to 2026-11-12","source":"Session e24f17dc; sessions 701c2346, agent-ac87b78","entry":"A Bash cat heredoc fails at about 9,800 characters with 'unexpected EOF while looking for matching quote'. The file is not written. The tool cuts long commands. Write the file with the Write tool. Dead end: re-sending the heredoc.","steps":[[1,"The entry is in the window, pushed at start. So is the Bash tool's own advice to use a heredoc. They pull opposite ways."],[2,"The cost is the failed call itself, 8.6k to 18.6k characters sent twice. A lookup can only follow the error. Nothing fires before the call."],[0,"'unexpected EOF while looking for matching' is word for word."],[0,"One entry matches exactly."],[0,"It was delivered by push into main and subagent windows. The pull-only route in the earlier knowledge-store design would deliver less.",1],[2,"The condition is the length of the agent's next output, which it does not measure."],[0,"Exit code 2 comes at once."],[4,"Sonnet, Opus and Fable all fail the same way."],[1,"First failure was 10-31. The note came on 11-11 after the 40-error peak day, in a batch memory edit, not at a solve.",1],[1,"The limit belongs to the tool version, not a repository. No footprint item sees a tool upgrade."]],"worked":""},{"id":"f01-C2b","family":"same-mistake","title":"Four agents, same long command, same day","story":"Four Opus agents each wrote four slide files in one cat command of 10 to 11k characters. All failed within six seconds. One recovered with four Reads and four Writes.","when":"2026-11-10","source":"Codex slides project, workflow wf_b4e7b31a-874","entry":"The Bash heredoc entry from the previous case. That project's memory has no Bash note.","steps":[[1,"This is a different project's memory. It has nothing about Bash limits."],[2,"As before, the cost comes before any trigger."],[0,"The error text is word for word."],[1,"It hits only if the library is shared across projects. The owner says it is. The earlier knowledge-store design is silent.",1],[2,"Four windows opened six seconds apart. No sibling could finish, record and serve another in time."],[4,"Nothing was delivered."],[0,"The result is immediate."],[4,"All agents were Opus."],[3,"Four equal solvers of one stumble. The design does not say who writes, or how four near-duplicates merge."],[4,"No entry was written."]],"worked":""},{"id":"f01-C3a","family":"same-mistake","title":"Read cannot open PDF pages here","story":"Read on a PDF failed because pdftoppm is missing. The parent found a PowerShell route. Five hours later four new Opus agents hit the same error, because the briefs never mentioned PDFs.","when":"2026-10-16 to 2026-10-17","source":"Session e56a900a, parent and wave-2 agents","entry":"Read with pages on a PDF fails: pdftoppm is not installed. Python is the Store stub. Route: PowerShell reads the bytes, inflates FlateDecode streams and pulls the text. Works for the 41-page Google Docs PDF. Avoid the reserved variable $PID.","steps":[[1,"The brief, written by a parent that knew, has no word 'pdf'. Wave 1 hit the error four seconds before the parent did."],[3,"A Read tool error is not on the list of triggers.",1],[0,"The error text is word for word."],[0,"This works if the parent's route was stored by 14:16Z."],[0,"The subagent window holds it."],[1,"Some agents found cheaper pre-extracted text. The entry may pull toward the costlier route."],[0,"Text appears or it does not."],[4,"Parent and children were all Opus and all failed alike."],[2,"It was solved as an aside, with no mid-session capture point. Wave 2 started 5.5 hours later with nothing written. No note ever recorded pdftoppm.",1],[1,"The route depends on how the PDF was made. Pre-extracted text exists for some files in one project only."]],"worked":""},{"id":"f01-C3b","family":"same-mistake","title":"PDF route, in another project, a month on","story":"Research subagents read saved PDFs. The brief named the Codex Python. A Sonnet agent extracted the text in two calls using pypdf. An Opus agent gave up on the PDF.","when":"2026-11-12","source":"Session e24f17dc, workflow wf_548351eb-ab1","entry":"The PDF entry from the previous case: PowerShell inflate, or the clinic's pre-extracted text folder.","steps":[[0,"The brief carried a PC fact that was half of the answer."],[3,"Same as the previous case."],[0,"The error text is word for word."],[1,"It returns the clinic route. Its text folder does not exist in this repository, and inflate fits some PDFs only."],[0,"The subagent window holds it."],[1,"The best route needs the PDF entry joined with the Python fact. Sonnet made the join unaided. Opus gave up on the source."],[0,"Pages of text appear or they do not."],[4,"Sonnet solved it. Opus did not."],[3,"Who records the pypdf route, as a sibling or a revision, is not said."],[2,"pypdf lives in another app's private runtime, which that app rewrote on 10-21. A stored path to it can change with no event here."]],"worked":""},{"id":"f01-C4a","family":"same-mistake","title":"Git 'Filename too long' in the scratchpad","story":"Refuters cloning repos in the scratchpad hit Windows' 260-character path limit. Six refused alone on 11-03. Next day 15 of 15 clones failed. The tool then shortened the path.","when":"2026-11-03 to 2026-11-04","source":"Workflow wf_2e148d62-c8f, agent-a49d44b2bf294a604","entry":"git add, clone or cherry-pick in the scratchpad fails 'Filename too long'. The scratchpad path is about 170 characters. In the throwaway repo run git config core.longpaths true. Check: git add -A succeeds.","steps":[[1,"Refuters were building throwaway repos in the scratchpad. Nothing in their window mentioned it."],[3,"A git error in a scratch repo is not a trigger in the earlier knowledge-store design.",1],[0,"'Filename too long' is word for word."],[0,"One entry matches exactly."],[1,"Siblings run in parallel. A mid-workflow entry reaches only agents started after it, and only by pull."],[0,"One flag fixes it."],[0,"git add succeeds or it does not."],[4,"All agents were Opus."],[1,"None of the six had capture duty. Each got out alone. The note came next day from another session after 15 more failures."],[2,"A tool update removed the cause about three hours after the note. The note still says the path is about 170 characters."]],"worked":""},{"id":"f01-C4b","family":"same-mistake","title":"'Name too long' with a different cause","story":"'ENAMETOOLONG' came from commands over Windows' 32,767-character line limit, not from paths. Two of these contain no git at all.","when":"2026-11-01 to 2026-11-10","source":"Clinic Opus 11-01; two Sonnet agents 11-04; Codex Sonnet 11-10","entry":"The git longpaths entry and the Bash heredoc entry.","steps":[[1,"Agents pasted very large scripts into one Bash call."],[3,"Same as before."],[1,"The error words name a path. The cause is command length. The query carries the wrong cause."],[2,"'name too long' is a piece of 'Filename too long'. The design matches template fragments, so the git entry is the hit.",1],[0,"The match works mechanically."],[2,"The git flag cannot shorten a 40k command. A shorter scratchpad path does not either."],[0,"The rerun fails again, one wasted call before real diagnosis."],[4,"No escalation happens."],[1,"The agents' own fix, shorter commands and then Write, was never recorded."],[1,"After the path change the git entry is stale for its own symptom, yet still matches this one."]],"worked":""},{"id":"f01-C5","family":"same-mistake","title":"A constant-time compare copied to a webhook","story":"The ops token gate used hmac.compare_digest on text. Seven days later the same pattern guarded the WhatsApp webhook. A non-ASCII byte turns it into a server error. Review found it 20 days on.","when":"2026-07-01 stored; 2026-07-08 copied; found 2026-07-28","source":"Commits bfb5714, 834311f, 2fe77f5","entry":"Ops proxy-token gate. A FastAPI dependency reads X-Ops-Proxy-Token. 401 if unset. Constant-time compare with hmac.compare_digest(x or '', expected). 401 on mismatch. Router tests for right, wrong and missing token pass.","steps":[[0,"The later author had the ops gate file in the repository either way."],[2,"Nothing failed. Writing new code is not a trigger. The diff warning fires only on stored hazards, and none existed before 07-28.",1],[1,"If asked, 'constant-time compare of a webhook token' is a plain-language query."],[2,"It returns the ops gate solution, which contains the defect, stored as solved by a top model."],[0,"The match works mechanically."],[2,"Copying the stored pattern spreads the defect to a public webhook. That is what happened without a library."],[2,"Tests passed. Output equal to the strong model's was the defect."],[2,"Both writers were the top rung of their day. The bug surfaced only through a later review."],[0,"The 07-28 fix is a clean capture: a safe helper, tests and a CLAUDE.md rule. It can be stored as a do-not-apply entry.",1],[1,"compare_digest also fires on the safe PIN check. Stored tests cover three fixed sites, not a new one."]],"worked":""},{"id":"f01-C6","family":"same-mistake","title":"Subagents refused report files","story":"A clinic note said subagents cannot write report files. Eleven days later in EMS, eight subagents were refused for report.md. Yet 22 other .md files and 156 .js files were written fine.","when":"2026-11-01; repeated 2026-11-12","source":"Clinic memory note 11-01; session e24f17dc 11-12","entry":"Subagents cannot write report files; the harness refuses. Ask them to return the full result in their reply. Earlier Sonnet extractors did write files, so the refusal may depend on agent type or output size.","steps":[[1,"The brief, written by the main session, asks for report.md."],[2,"The error fires in the subagent. Its cause is the brief in the main session, which sees no error and has no trigger."],[0,"The error text is word for word."],[1,"The entry's condition, agent type or output size, is wrong. The record points to the file name."],[2,"It is delivered to the one window that cannot change the brief."],[0,"Return text. The error message already says so, so the library adds nothing."],[0,"The result is immediate."],[4,"No escalation happens."],[1,"It was captured the same day but too broadly. The writer had two refusals and one counter-example and could not tell which detail mattered."],[2,"Read as 'subagents cannot write files', it would push other file writes into replies too."]],"worked":""},{"id":"f02-C1","family":"silent-defect","title":"A queued 'ready' could reopen a billed job","story":"Job status changes never read the current status. A queued 'ready' replayed after a close reopened a settled, billed job. Tests were green. A technician noticed in production weeks later.","when":"Landed 2026-06-07; found 2026-07-27","source":"Commits 187ebb1, 383dea7, f440222 (PR #162)","entry":"Job lifecycle. Append-only job_event rows. POST /jobs/{id}/transition with action ready, close, abandon, reschedule or haul. Each action updates the job and appends an event. Check: 7 service tests, 4 router tests, 2 real-database tests.","steps":[[1,"A later session got 'wire the bill sheet', which is a task. Nothing in its window says a button can strand a job."],[2,"Tests were green. Nothing failed, so nothing asks. The first signal was a technician in production weeks later."],[2,"Any query names the task, not the hazard of a 'ready' replayed after 'close'."],[2,"'transition' and 'ready' match the old entry, which is the defect. The correct pattern is filed under money words and does not match."],[3,"The design does not say whether the entry goes to the session or to a subagent writing one screen."],[2,"Adapting the old entry reproduces 'dispatch on the action alone'. Nothing in it says to read the current status."],[2,"The old checks test each transition from one state. The every-action-from-every-status matrix came only with the fix. The stored check passes the copy."],[2,"No model failed. A technician noticed. The failing parts were written by top models."],[1,"Next day a red-team found its freeze parked landed writes as conflicts. Recording before the PR is ready stores the half-right version.",1],[2,"The 07-08 dispatcher handler predates the freeze and never stamps the bill-sent time. A new entry does not look back at existing code.",1]],"worked":""},{"id":"f02-C2","family":"silent-defect","title":"Evidence gate passed with zero bytes","story":"A size check swallowed every error and returned 'unknown', so a technician could satisfy the evidence gate without uploading anything. Tests defaulted to 'unknown' and stayed green for 52 days.","when":"Landed 2026-06-06; found 2026-07-28","source":"Commits ca362c0, 2cf95b8, aa4f589 (PR #164)","entry":"Upload size ceiling for pre-signed uploads. At finalize, read the real size with HEAD. Reject anything over the ceiling. A missing object or a temporary error returns None so the caller can fall back to the client's reported size.","steps":[[1,"'Harden media uploads' is a task. The evidence gate's integrity is not named in it."],[2,"The test fixture defaults to 'unknown' and the suite is green. Nothing fails, so nothing looks up."],[0,"The task's own words, upload, size and R2, find the entry. Retrieval works and delivers the defect."],[2,"Same problem, exact match, wrong answer. The stored text states the mix-up as the design."],[3,"The design does not say which window receives the entry."],[2,"The cheap model copies 'fall back on None', which the entry calls safe."],[2,"The handoff says the no-bytes case was the tested default and nothing asserted existence. The stored check certifies the copy."],[2,"No visible failure for 52 days. An adversarial audit found it. Nothing climbs."],[1,"The fix rule, None means unknown, never zero, is good. Captured at the first commit, it omits the selfie caller found an hour later."],[1,"The handle head_size fires on later diffs to that symbol. The same shape in other words, the mobile bare catch, is a word-level miss.",1]],"worked":""},{"id":"f02-C3","family":"silent-defect","title":"Switching on WhatsApp sending","story":"The entry said the dispatcher is safe to switch on. Switching it on would send the whole job history: 36 real messages about months-old jobs. Suppressed rows are permanent.","when":"Built 2026-07-08; found 2026-08-01","source":"Commits d1f78cd, 834311f, c731e66","entry":"Customer messages through a transactional outbox. A cursor per consumer drains events in order. The WhatsApp consumer is consent-gated and log-only while settings are empty, so enable_dispatcher stays safe to flip.","steps":[[1,"'Turn on WhatsApp Cloud sending' is one settings edit, no code. The owner's design speaks of problems a model solves."],[1,"Nothing fails before the flip. The flip is the failure. The earlier knowledge-store design has a route for actions. The owner's design names none.",1],[0,"'Enable dispatcher' is the entry's own phrase."],[2,"It returns the stored conclusion 'stays safe to flip', at the one moment it can do harm."],[3,"The design does not say which window receives the entry."],[2,"Acting on it sends the whole history, and suppressed rows are permanent."],[2,"No check can say 'safe to flip'. Nothing tested the seed or the age guard. A review found a test that pinned the consent leak.",1],[2,"The author was a top model. Nowhere higher to send it. Later audits found it."],[1,"The fix would be stored. But the 08-01 review found three defects inside the fix branch. 'Solved' was the reviewer's call."],[0,"After the fix, the action handle is the stated only route to operator hazards. It reaches the next operator.",1]],"worked":"The correction, once stored, reaches the next operator before an env flip. That avoids a mass-message incident."},{"id":"f02-C4","family":"silent-defect","title":"Login lock that blocks a correct PIN","story":"A strong model built a self-healing lock. An audit prescribed a different fix. A third strong model said the audit's fix opens 4-digit PIN guessing. Only an owner decision settled it.","when":"Built 2026-07; settled with owner later","source":"Commits 0a40416, f3dfa6f; HANDOFF A2","entry":"Login lockout. Five failures lock 30 seconds, doubling to a 15-minute cap, always self-healing. A correct PIN during a lock returns 429. Counter survives the error. Per-IP window behind the database lock.","steps":[[0,"'Fix HANDOFF A2' is a stated problem with file and line. Here the task is a problem."],[0,"Applying a fix that a document prescribes is a trigger in the earlier knowledge-store design.",1],[0,"The words line up: lock, correct PIN, 429."],[2,"Before the settling commit both hits are wrong. Each came from a strong model and passed its own check."],[3,"The design does not say which window receives the entry."],[2,"Applying A2 inverts two tests and opens 4-digit PIN brute force. A handful of IPs would finish it in under an hour."],[2,"Inverted tests pass. Three strong outputs, two positions. Only an owner decision settled it. 'Equal to the strong model' has no single target."],[2,"The wrong fix is silent too. The audit was already a strong-model product. Climbing reaches the tier that wrote it."],[0,"The settling commit is a model capture: reason, owner deci
