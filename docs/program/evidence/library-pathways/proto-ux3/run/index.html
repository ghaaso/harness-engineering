esign is FixFlow-only and silent on other projects. The existing memory is per project, so nothing crossed.",1],[1,"The entry answers 'is there a Python?', but the task needs Pillow. Whether the Codex Python imported PIL on 11-03 is not recorded."],[0,"The cropped image is its own check."],[0,"No ladder was needed. The agents switched tools in one call. 17 retried python and failed again."],[2,"Three projects, three writers, three scopes. They wrote 'no uv' before uv arrived, 'not on PATH, use node', and 'no Python on the machine'. The last was false when written."],[2,"86 windows started within 22 minutes, so an entry written after the first failure reaches none of them."]],"worked":""}]},"text":{"title":"Library pathways","date":"2026-11-13","policy_names":{"top_first":"Strong model directly","cheap_ladder":"Cheap model with the ladder","library":"Cheap model with the library"},"policy_short":{"top_first":"Strong directly","cheap_ladder":"Cheap + ladder","library":"Cheap + library"},"policy_says":{"top_first":"Opus does the work. If the gate catches a wrong answer, Fable tries. No library.","cheap_ladder":"The cheap model tries first. A caught failure gets one cheap retry, then Opus, then Fable. No library.","library":"The same ladder, plus the library. A lookup comes before the cheap attempt. Opus and Fable solves are written back as entries."},"hero":["A working model of the library design, computed from its own data files.","It shows where a piece of work can go, and how much each limitation holds the result down."],"tags":{"M":"measured on this PC","S":"outside study or price list","G":"guess"},"computed_tag":"A computed number takes the weakest tag of its inputs. Almost every computed number here is a guess (G). In a table, the tag in the heading covers its column.","todays_notes":"Today's notes are in every way of working: CLAUDE.md, the memory notes, checks in the shared test run. So they cancel out.","opus_line":"The cost against the strong model rests on the Opus price ratio. It is {{n:2|S}} per token and may be nearer {{n:1|G}} per call.","words":[["Tags","M: measured on this PC, in the owner's repositories or session records. S: an outside study or the price list. G: a guess. A computed number takes the weakest tag of its inputs."],["Piece of work","One fix-sized task of about ten cheap calls. A result is made and checked."],["Cheap model, Opus and Fable","The cheap model is Sonnet. Opus is the next model up, at a higher price. Fable is the top one."],["Visible or latent","Visible: something signals a problem, such as an error or a failing check. Latent: nothing signals that a choice matters."],["Entry","One stored conclusion in the library."],["Lookup","A search of the library for entries that fit the work in hand."],["Look-alike","A stored entry that looks like a match but has a different cause."],["Several parts","Work that needs two or more entries. A lookup may find all the parts, or only some parts."],["Screen","The test of whether a found entry applies, before the cheap model uses it."],["Mechanical check","A check an entry carries that decides by itself whether the entry applies. No model judges it."],["Window","The text a model has in front of it while it works."],["Stale","A good entry goes stale when what it rests on changes. It then counts as a bad entry."],["Capture","Writing a strong model's solve back into the library as an entry."],["Ceiling","The most of the work that entries could cover in the long run, beyond today's notes."],["Gate","Whatever decides a result is right: tests, and sometimes a review by Opus."],["Escape","A wrong result that passes the gate. It may be found later, or never."],["Ladder","What happens after a caught failure: one cheap retry, then Opus, then Fable."],["Handoff","Handing a piece of work up to Opus. It has a small cost of its own."],["Promoted check","An entry's mechanical check that also runs in the shared tests. It acts at the gate with no lookup."],["Cost","Counted in cheap-call equivalents. One cheap-model call costs one. An Opus call costs the Opus price ratio."],["Wrong rate","The share of pieces of work that do not end accepted and right."],["Ratio","The library's figure divided by the other way's figure. Below one, the library's figure is lower."],["Middle value","The value an unknown starts at, inside its range."],["Library unknown","An unknown that exists only because of the library. Each has a poor end and a good end."],["Good end","The end of a range where the design works as intended. The poor end is the other one."],["Comes back","How much of the work comes back, so an entry could exist for it. A property of the work."],["Reach","Whether an entry gets to the cheap model: written, looked up, found and in the window."],["Entry quality","Whether the entry is right and is used rightly."],["Running cost","What lookups, screens, carrying and writing cost."],["Corner","Comes back, reach and entry quality, each at its poor or its good end. Everything else stays at its middle value."],["All-good setting","Every library unknown at its good end, running cost included. Every other unknown at its middle value."],["Full fall","How far the library's cost and wrong rate fall from the middle values to the all-good setting, averaged."],["Alone","What moving only this gives. Its library unknowns go to their good ends. A share of the full fall."],["Last","What is lost if only this stays. All else is at its good end. A share of the full fall."],["Middle run","The run in the middle when all runs are sorted. Half the runs fall on each side."],["Tie","How far the library unknowns of one group move together across the runs."],["Rank correlation","How steadily a result rises (+) or falls (−) as one unknown rises across the runs. One means always; zero means no steady link."],["Stock and flow","A stock piles up over time and is drawn as a box. A flow fills or drains it, drawn as an arrow with a valve."],["Loop R or B","A chain of causes that returns to its start. R feeds itself. B holds itself back."],["Seed","A whole number that fixes the random draws. The same seed always gives the same runs."],["Knowledge-store design","The owner's earlier design for a store of solved defects in FixFlow. It is not the library mapped here."],["Case family","A group of real cases of one kind, such as races and flaky failures."],["Other way","Real cases where a limitation did not hold. Each limitation lists its own."],["Thought experiment","A limitation no real case showed. It was reasoned out, not seen."],["CI","The shared test run on GitHub that checks every change."],["PR","A pull request: a proposed change, reviewed before it joins the main branch."],["Technical names in the cases","Case notes keep some names from the records. These are the common ones."],["Subagent","A helper session the main session starts for one task. It has its own window."],["Compaction","When a session's window fills, its earlier text is cut down to a summary."],["pdftoppm","A small tool that turns PDF pages into images."],["Heredoc","A way to hand a long block of text to a shell command in one go."],["ENAMETOOLONG","An error that says a command or a name is too long for the system."],["CSRF token","A random value a web form carries, to block forged requests."],["job_event.seq","The running number on each job event in FixFlow's database. It puts all events in one order."],["EXPO_PUBLIC_SENTRY_DSN","The setting that tells the phone app where to send crash reports."],["Migration","A numbered change to the layout of FixFlow's database. Case notes name one by its number."]],"sections":{"map":{"title":"The map","lede":"The map starts with all work. Pick a way of working, or one kind of work. Tap a route in the tree to light it up, then step through it.","graph_note":"Boxes are states and lines are branches. The bold number in a box counts the pieces of work, of a hundred, that pass through it. A thicker line carries more work. Faded boxes and dotted lines carry none under this choice.","scroll_note":"On a narrow screen the map scrolls sideways.","promo_label":"promoted checks, no lookup","promo_legend":"Dashed arrow: checks promoted into the shared tests reach every gate from the stock, with no lookup."},"funnel":{"title":"The funnel","lede":"Start with a hundred pieces of work the cheap model would get wrong alone. The bold number is how many are left after each step. The height of a bar is the share that step keeps.","marks":"Faint mark: the share the step keeps at the all-good setting.","under":"Under each bar: limitations placed at that step, and real cases that broke there. Tap a bar to open its limitations.","match_note":"The match of bars to design steps was set by hand. No step sits at the first bar. Bad entries come from writing (step 9) and from going stale (step 10). So both steps sit at the good-entry bar. Step 6 covers the screen and the cheap attempt, so it sits under the last bar only.","stage_notes":{"0":{"under":"no step","tip":"No design step sits here. This bar is capped by how often a problem recurs and by the cut for latent work. Capture only fills it toward that cap."},"4":{"under":"step 6 sits under the last bar","tip":"Step 6 covers the screen and the cheap attempt. Its limitations sit under the last bar.","opens":[6]}},"after_label":"After the cheap attempt","which_cheap":"Work the cheap model gets wrong alone","which_all":"All work","outside_bar":"Not a share, so not drawn as a bar","promo":"Checks promoted into the shared tests do not pass through this funnel. They reach the gate with no lookup.","promo_at":"Of the same hundred, they catch more at the first gate:"},"conditions":{"title":"Three conditions","lede":"The library side of the model holds three conditions. Each is a group of unknowns with a poor end and a good end.","items":[["recurrence","Much of the work comes back, so an entry could exist for it."],["reach","An entry reaches the cheap model, when one could exist."],["quality","The entry is right, and the cheap model uses it rightly."]],"running_cost":"One more group is what the library costs to run. In the corners it stays at its middle value.","table_title":"The eight corners","table_note":"Each condition at its poor or its good end. Every other unknown stays at its middle value. Last period. Below one, the library's figure is lower.","near_band":0.02,"near_note":"Marks against the ladder: solid is below one, a ring is near one, hatched is above one. Near means within {{n:0.02|G}} of one, a band chosen for reading.","promo_note":"Promoted checks need no lookup, so entry quality acts even at poor reach.","more_title":"Running cost moved as well","square_title":"The square: reach against entry quality","square_lede":"Reach runs across and entry quality runs up, from the poor end to the good end. Running cost stays at its middle value.","square_tap":"Tap a cell for its four ratios.","square_line":"The thick line is where the ratio crosses one. Solid cells are below one and hatched cells above. Darker is further from one.","square_level":"A level is a share of each unknown's range, counted from its poor end."},"cases":{"title":"Where real cases broke","lede":"{{c:cases}} real cases were walked through the design's ten steps. Each cell is one step of one case.","warning":"These are chosen problem cases. They show where steps break, never how often.","ks_note":"Some steps were judged with the owner's earlier knowledge-store design, not the library. {{c:ks_steps}} of the {{c:steps_total}} step judgments name it.","pick":"Tap a row to read the case.","numbers_tag":"Numbers in a case note come from the records (M). A saving is the walker's estimate (G) unless the walk saw it."},"lims":{"title":"The limitations, by step","lede":"Tap a step to list its limitations. Tap a limitation for its description, examples and unknowns.","two_title":"Two weights","alone_def":"Alone: what moving only this gives. Its library unknowns go to their good ends; all else stays at middle values.","last_def":"Last: what is lost if only this stays. All else sits at its good end; this goes back to middle values.","add_def":"Both are shares of the full fall. They do not add up, because the steps multiply.","sign_def":"Alone can be below zero, and last can pass the whole fall.","full_def":"The full fall runs from the middle values to the all-good setting.","bars":"Solid bar: last. Hatched bar: alone.","rank_groups":"The four groups, ranked by last","rank_steps":"The ten steps, ranked by last","seq_title":"Steps moved one after another","seq_note":"Each round adds the step that gives the most. The bar shows the share of the full fall so far.","seq_zero":"add nothing: earlier steps already moved all their library unknowns.","unnamed":"Unknowns no limitation names","shares":"A number after ↔ counts the other limitations with the same library unknowns. Their weights match.","nm_no_setting":"not in the model","nm_gate_or_ladder":"gate or ladder","nm_other_side_only":"shared unknowns","nm_why_no_setting":"Not in the model. It has no setting for this limitation.","nm_why_gate_or_ladder":"It acts only through unknowns all three ways of working share. The weights never move them. The gate and ladder table shows them.","nm_why_other_side_only":"It acts only through unknowns all three ways of working share. The weights never move them.","gate_title":"The gate and the ladder","gate_lede":"These unknowns are shared by all three ways of working. So the weights give them none. Each group moves one way only, to the ends under What moves.","gate_moved":"What moves","works_title":"Savings the walks saw or estimated","works_show":"Each saving, one per line","works_lede":"Savings the walks saw happen (M) or estimated (G). The library has never existed. {{c:works_seen_channel}} of the {{c:works_seen}} savings seen came through notes that exist today.","channel":"existing notes","shown_no":"The model cannot show this.","shown_partly":"The model shows this only in part.","map_note":"Shaded stages: the steps it touches. Heavy lines: branches that use its unknowns.","parts_title":"Each of its library unknowns, alone and last"},"run":{"title":"Run it","lede":"Every unknown has a slider, and the whole page follows it. The corners and the weights stay fixed.","outputs_note":"Cost per piece of work, in cheap-call equivalents. The library is shown at its last period.","ladder_sub":"What the library adds to the ladder.","top_sub":"The owner's goal. It also rests on the ladder and the gate.","usage_title":"How much the library is used, last period"},"many":{"title":"Many runs","lede":"Most unknowns are guesses, so the model runs many times with random draws. The result is a spread, not one answer.","tie":"Tie: how far the library unknowns of one group move together. Each run draws one shared level per group, four in all. No group is tied to another.","follows":"This spread follows from the ranges and the way they are drawn. It is not a measurement of the library.","rank_read":"Rank correlation: how steadily each ratio rises (+) or falls (−) as one unknown rises across the runs.","rank_tied":"At the highest tie, a group's unknowns all move with its shared level. So each group shows one rank correlation, toward its good end.","rank_half":"At the middle tie, half of each library unknown's draw is its group's shared level. So one group's unknowns show correlations of similar size."},"leaves":{"title":"What the map leaves out","lede":"The model's own limits. Tap one to read it."}},"loops":[{"id":"R1","kind":"R","name":"Bad entries bring more bad entries","text":"More bad entries raise the bad share a lookup returns. More wrong entries reach the cheap attempt and spoil work. More work climbs to Opus or Fable. More solves and escapes get written, some of them bad."},{"id":"R2","kind":"R","name":"More entries, more look-alikes","text":"Every entry, good or bad, raises the chance a look-alike is found. Accepted look-alikes sp 's checks join the tests","x":"Promoted checks grow with the library's stock and act at every gate. The other two ways keep a fixed set of tests. Their strong solves may leave checks behind as well. The model does not count those. On the wrong rate, this leans toward the library. The map does not size it."},{"t":"A promoted check can pin a defect","x":"A bad entry's promoted check can hold a defect in place. The real cases show this. The map leaves it out, which leans toward the library."},{"t":"The Opus price ratio is unsure","x":"The price list gives {{n:2|S}} per token. On this PC an Opus call read about {{n:222,000|M}} cached tokens. A Sonnet call read about {{n:440,000|M}}. So per call the ratio may be nearer one. The runs draw it between {{n:1|G}} and {{n:2|G}}. At one, the cost ratio against the strong model is {{g:ct_last_m1}} instead of {{g:ct_last}}."},{"t":"The coverage ceilings lean toward the library","x":"The ceilings now mean what the library could hold beyond today's notes. Their values and sources did not change with that reading. The outside studies behind them had nothing like today's notes. This leans toward the library, by an amount the map cannot size."},{"t":"Chosen cases, not a sample of work","x":"The {{c:cases}} cases were chosen because something went wrong. They show which routes exist and where steps break. They never show how often."},{"t":"Case statuses are judgments","x":"Works, strains and breaks were set by the agents that walked the cases. Another reader could set some differently. {{c:ks_steps}} of the {{c:steps_total}} step judgments name the earlier knowledge-store design. That includes {{c:ks_works}} of the {{c:works_cells}} 'works' cells. This touches the case grid, not the model's numbers."},{"t":"One size of work, and no time","x":"Every piece of work is about ten cheap calls. Real work varies far more in size. Tests at the gate cost nothing. Waiting and the owner's attention are left out."},{"t":"Pieces of work are independent","x":"A piece's kind, its need, what the library holds and any look-alike are combined by multiplying chances. Real work clusters. A hard problem may also be the one the library lacks."},{"t":"Averages, not one library","x":"The stocks change by their expected amounts each period. A real library has one history, with luck in it. Nothing written during a period helps that same period."},{"t":"Entries are all-or-nothing","x":"A good entry is good wherever it applies, and a bad one bad. Partly right shows up only as the 'some parts' result."},{"t":"One pool of entries","x":"Projects are not separated. Facts that differ between projects act only through the look-alike and wrong-entry chances."},{"t":"An entry in hand acts only at the cheap attempt","x":"A wrong entry does not follow the work up the ladder. A good entry does not help the cheap retry or Opus either. Only a promoted check acts later, at the gate."},{"t":"A fixed ladder and one gate","x":"One cheap retry, then Opus, then Fable, in that order. Real sessions skip rungs, repeat them, or end with the owner. The ladder step was 'not reached' in {{c:step8_not_reached}} cases and 'works' in {{c:step8_works}}. In {{c:not_catcher_cases}} cases the higher tier was not the one that caught the error."},{"t":"How bad entries come and go","x":"Staleness moves good entries to bad, never back. A bad entry turns good only when a found escape is repaired. Bad entries leave only at the retiring rate. At the middle values the bad share reaches {{g:bad_share_last}} by the last period."},{"t":"Two simplifications favour the library","x":"The mechanical check accepts every good entry and rejects every wrong one. Repair costs nothing beyond the rework."},{"t":"How ranges are drawn","x":"Drawn on its own, an unknown is spread evenly across its range. Library unknowns can be tied within their group, through that group's shared level. At the middle tie, a library unknown mixes that level with its own draw. Its draws then bunch toward the middle of its range. The middle nine in ten fall between {{n:0.16|G}} and {{n:0.84|G}} of the range. If two chances in a draw add up to more than certainty, both are scaled down. With the current ranges this does not happen. The ranking measures steady rise or fall. It misses an effect that rises and then falls."},{"t":"Some limitations the model cannot show","x":"{{c:noparam}} limitations act through no setting in the model. {{c:partly}} more are shown only in part. Each one says why when opened."},{"t":"Some tags are generous","x":"Several figures tagged M or S were measured on another unit than their setting. Each slider's source says how. One outside figure supports two settings in a row."},{"t":"The step matches are set by hand","x":"A table matches the design's ten steps to the model's stages. Another matches them to the funnel's bars. A limitation is placed through these tables and its unknowns."}],"layout":{"col_w":106,"row_h":70,"x0":60,"y0":134,"node_w":90,"node_h":60,"px_scale":1,"min_text_px":11,"promo_box":[2.6,7.7,1.6],"states":{"L1_trigger":[0,3],"L2_lookup":[1,3],"L3_exact":[2,1],"L3_similar":[2,2],"L3_full":[2,3],"L3_part":[2,4],"L3_wrong":[2,5.2],"L4_exact":[3,1],"L4_similar":[3,2],"L4_full":[3,3],"L4_part":[3,4],"L4_wrong":[3,5.2],"L5_none":[4,0],"L5_exact":[4,1],"L5_similar":[4,2],"L5_full":[4,3],"L5_part":[4,4],"L5_wrong":[4,5.2],"L6_right":[5,1.6],"L6_wrong":[5,4.6],"L7_retry":[6,4.6],"L7_right":[7,3.6],"L7_wrong":[7,5.6],"L8_handoff":[8,5.6],"L8_opus":[9,5.6],"L8_right":[10,4.6],"L8_wrong":[10,6.6],"L9_fable":[11,6.4],"L9_right":[12,5.4],"L9_wrong":[12,7.6],"L10_opus":[13,2.2],"L10_fable":[13,3.4],"L10_opus_escape":[13,7],"L10_fable_escape":[13,8.2],"L11_escaped":[14,7.2],"L11_stored":[14,8.5],"EQUAL":[15,1],"ESCAPED_FOUND":[15,6.6],"ESCAPED_SILENT":[15,8],"UNRESOLVED":[15,9.4]},"lanes":{"l1_no_lookup":-0.95,"l2_nothing":-0.78,"l3_exact_set_aside":-0.6,"l3_similar_set_aside":-0.6,"l3_full_set_aside":-0.6,"l3_part_set_aside":-0.6,"l3_w
