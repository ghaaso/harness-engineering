indow receives the entry."],[2,"Applying A2 inverts two tests and opens 4-digit PIN brute force. A handful of IPs would finish it in under an hour."],[2,"Inverted tests pass. Three strong outputs, two positions. Only an owner decision settled it. 'Equal to the strong model' has no single target."],[2,"The wrong fix is silent too. The audit was already a strong-model product. Climbing reaches the tier that wrote it."],[0,"The settling commit is a model capture: reason, owner decision and comments on both tests. It can be stored as do-not-apply with owner confirmation.",1],[0,"A document reference on A2 stops the next agent. CLAUDE.md already says so. The clinic's check held the same rule.",1]],"worked":""},{"id":"f02-C5","family":"silent-defect","title":"Opening cutoff rules for cash, pay and stock","story":"A rule passed its own tests and an Opus review. Three later root reviews found a double count, a hold that never released, and more. Two correct rules looked like either-or.","when":"2026-11-05","source":"Cutoff-guards session G10-20; transcript 97380a1e; GC-01, GD-01, GE-03","entry":"Opening cutoff guards. One registry of cutoffs, readers per subject. Cash: opening is the balance at the end of the cutoff day. Refuse postings on or before it. Stock: opening is the count when the batch posts. Check: cutoff tests green.","steps":[[1,"G10-20 is a stated gap. Whether stock follows cash on the cutoff day was not known to be a question until GC-01 asked it."],[2,"Session tests and its own review passed. Nothing failed until a separate root review, three rounds running."],[1,"Good words exist. The deciding detail, an import posted on the count day, is in no query."],[2,"It returns a refuted cutoff rule or the half-right stock rule. Two rules, right on different sides, look like either/or."],[1,"The finding arrived at 366,229 tokens. The next call read 87,658 after compaction. A fetched entry rides into a summary."],[1,"The round-1 fix added a hold. Round 2 found the hold never released. Adapting the rule to new state made a new P1 defect."],[2,"Two Opus reviews read the same code and disagreed. The in-session test asserted the double count as correct."],[2,"All work was Opus. The working ladder was a root review per round. Nothing failed visibly, so nothing escalated by itself."],[2,"Which version is the entry: own review, round 1 or round 2? The first rule's reasoning was compacted before the finding arrived."],[0,"The final rule, end of cutoff day for cash, pay and stock, carried unchanged into the real-data switch."]],"worked":"The final rule carried unchanged into the 2026-11-10 real-data switch, reused without re-derivation."},{"id":"f02-C6","family":"silent-defect","title":"Correction form opened blank over a real bill","story":"'Correct the completion' opened a blank form. The server rewrites the bill from the payload, so a blank submit destroyed the bill. A bare catch treated 'offline' and 'no completion' as the same answer.","when":"2026-07-27; found a day later","source":"Commit 37821f5; fix 8dafcec, da988e2","entry":"Completion correction form must not wipe a bill. Load the existing completion and prefill materials, time and remarks. If the fetch fails, return: offline, a blank first completion is still valid. Check: mobile tests green.","steps":[[0,"A stated problem: a blank form wipes a bill."],[2,"Tests were green. Nothing fails. The app has no screen-test harness."],[1,"A query would say prefill, offline. The governing rule is worded evidence, media counts, None."],[2,"The right rule exists and does not match. The same model wrote it 53 minutes earlier in the same PR."],[3,"The design does not say which window receives the entry."],[2,"The catch says 'offline, a blank first completion is still valid'. A fresh self-written rule did not stop it."],[2,"No screen test exists. Logic inside the component is asserted by nothing."],[2,"The red-team found it a day later. No model failed."],[1,"The fix found three doors, not the one the handoff described, plus a fourth route. An entry written from the audit would be incomplete."],[0,"The rule now lives as a tested pure function and in CLAUDE.md. Handles on it fire on later diffs.",1]],"worked":""},{"id":"f03-C1","family":"build-new-from-old","title":"Advance requests built beside the staff ledger","story":"A new advance-request feature reused older ledger patterns. 544 unit tests passed. An Opus audit the next day found stacking races, an actor foreign-key clash and an auto-approve failure.","when":"2026-07 (migration 0042); audit next day","source":"Commits db545cb, bb23851, 842c3dc; HANDOFF lines 449, 478","entry":"staff_ledger: append-only staff money. Unsigned amount with a database CHECK. Corrections void and re-log, never edit. Balances only through one repository function. Writes idempotent on a unique client_id. New money columns end in _minor.","steps":[[0,"CLAUDE.md already summarised the earlier tables when 0042 began. The shapes were in the window before any lookup."],[2,"Building 0042 raised no error. The design's triggers do not cover request stacking or a system actor.",1],[1,"'Exactly-once disbursement' shares words with the ledger entry. No query asks whether two requests can stack."],[1,"Four partial matches come back. The earlier knowledge-store design shows at most one lead and one candidate, so pieces drop out.",1],[0,"The main session pulls the cards into its own window. One session builds the slice.",1],[2,"The working step, a pre-minted client id that becomes the ledger row's id, is in no entry."],[2,"544 unit and 7 integration tests passed. The stacking race and auto-approve failure were invisible. An Opus audit added guards next day."],[4,"Nothing failed during the task, so nothing was handed up. The fixes came from a later audit outside any ladder."],[2,"Stored at 'solved', the entry holds the half-right design. The earlier knowledge-store design's write rule would store nothing. The owner's rule stores the flawed version.",1],[2,"Turning a pay setting on makes the %-of-accrued cap non-binding. The naming rule does not say which style a new key follows."]],"worked":""},{"id":"f03-C2","family":"build-new-from-old","title":"Latest-row-wins ordering by created_at","story":"Two writes in one transaction tie on created_at. A real-Postgres CI test caught it in 14 minutes. Four hours later the new rule pointed the next table, 0041, the wrong way.","when":"2026-07 (migrations 0027 and 0041, same evening)","source":"Commits 0027, 12c16f1; CI run 17:23 to 17:37","entry":"job_event.seq gives a total order: backfill with row_number, create a sequence, then NOT NULL and UNIQUE. Also: latest-row-wins tables must not order by created_at, because now() ties inside one transaction. Use a monotonic seq.","steps":[[0,"The task, CLAUDE.md and tenancy code held the pattern. The seq pattern lived in 0027's code."],[1,"Nothing triggers while designing. In the earlier knowledge-store design, a failure in the shared test run (CI) is a trigger. So a lookup runs only after one CI round.",1],[2,"'Latest row wins per key' shares little with 0027's words. The CI error is a value assertion and names neither now() nor created_at."],[2,"0027's entry is the right neighbour but gives no reason against created_at. At 0041 the fresh entry is a wrong match."],[0,"The main session is where the design happens."],[2,"At 0041 'use a DB sequence' breaks the chain: gaps on rollback, no hash link. 'Never created_at' flags 0041's backfill, which is correct."],[0,"The real-Postgres CI test caught the tie in 14 minutes. The check reproduces the cause."],[1,"A cheap model facing a wrong-value assertion would escalate. The strong model fixed it in 14 minutes in one commit. Any rung costs more."],[1,"The earlier knowledge-store design stores nothing here. The owner's rule stores it, and its general form is too broad for 0041 four hours later.",1],[2,"Within four hours the entry points the next table the wrong way on both its seq and its backfill order."]],"worked":"The real-database test caught the tie in 14 minutes, with a check that reproduced the cause."},{"id":"f03-C3","family":"build-new-from-old","title":"WhatsApp consumer on an old outbox cursor","story":"The new real sender used an old rule: a missing cursor starts at zero and drains all history. Nothing failed while the dispatcher was off. An audit found it 20 days later.","when":"2026-07-08 built; found 2026-07-28","source":"Migrations 0027 and 0034; commit da988e2; HANDOFF line 303","entry":"Transactional outbox. Each job event carries a running number (job_event.seq), so all events have one order without gaps. The table dispatch_cursor holds one row per consumer. The function run_dispatch_once reads past the last number seen and advances only past accepted events. A scheduler runs it behind enable_dispatcher, default OFF. The WhatsApp consumer is log-only for now.","steps":[[0,"0034 was built the same day as 0027, both by Fable. The dispatcher code was fresh."],[2,"Nothing fails, because the dispatcher is off. No trigger exists for 'a new consumer on an old cursor'."],[2,"The builder asked about double-send on replay. The hazard answers a different question: what does the first run do with history?"],[1,"It returns 0027's entry, the right neighbour, without the start-from-zero warning. That is harmless for a log-only consumer."],[0,"The main session window holds it."],[2,"The hazard exists only in the merge. It needs an old default, a new real sender, and a permanent first decision per job and kind."],[2,"Nothing tested a first run against history. An audit found it 20 days later. The fix landed after 24 days."],[4,"No failure was visible, so nothing went up. The finder was a later audit."],[2,"The stored conclusion would be 'enable_dispatcher stays safe to flip'. That is wrong, and fetched by anyone about to flip it."],[1,"After migration 0046, the earlier knowledge-store design has an action handle. Its diff warnings fired on 13 of 154 past commits.",1]],"worked":""},{"id":"f03-C4","family":"build-new-from-old","title":"Database locks that were too weak","story":"Slice sessions copied an item lock and a 32-bit hash lock. Deadlocks were retried silently. An Opus review and a staging drill found the faults. The kernel later went 64-bit but two copies stayed 32-bit.","when":"Built early November 2026; fixes up to 2026-11-06","source":"Slice sessions S01, S03, S04, S07; D04-06; F-S02-2","entry":"Kernel run_command: one transaction per command. Keys serialized with pg_advisory_xact_lock and hashtext. Retry only on 40001/40P01, at most three times. Open item: hashtext is 32-bit, so a collision serializes unrelated keys. Item lock is select_for_update.","steps":[[1,"Slice sessions open on large context. S07 read 392,125 characters in nine minutes before its lock. S04 averaged about 231k cached tokens per call."],[2,"Writing a lock raises no error. The kernel retries deadlocks. select_for_update is too common to pass the selectivity gate.",1],[1,"'Lock the item before posting' finds a lock of the right shape and wrong strength."],[2,"The best matches are the defect sources. The sibling is the problem."],[0,"The row entered S07's main window nine minutes before the copy, with no compaction between."],[2,"S07 wrote the 32-bit lock anyway. The row said 'P3' and named an owner elsewhere. S04 wrote the item lock row FOR UPDATE."],[2,"Tests pass, and deadlocks are retried. An Opus review found S04's deadlock by tracing. A staging drill found the hash collision."],[1,"The higher tier caught it as a diff reviewer, not because the builder failed and handed up. The builder never knew."],[0,"S04 wrote a decision record and a conventions line the same day, naming the sites still wrong. The conventions file did the capture."],[2,"S03 merged before S04 learned the rule, and was fixed five days later. The kernel went 64-bit on 11-06. Two copies are still 32-bit."]],"worked":"The slice's own conventions file captured the rule the same day."},{"id":"f03-C5","family":"build-new-from-old","title":"Mobile offline queues after the jobs outbox","story":"The first outbox deleted any write answered with a non-network error. Later queues copied the lesson. The presence queue lacked a 4xx test for three days. Shared code then fixed it.","when":"2026-06-30 to 2026-07-12","source":"Commits 60c026d, e48c3b4, 436e180, c27bb39","entry":"Mobile outbox v2. A definitive 4xx goes to a visible failed list with Retry or Discard, never auto-deleted. 5xx, 429 and timeouts retry. 401 pauses the queue until re-login. Tag each item with the signed-in tech.","steps":[[0,"The presence task and attendance code were in the window. The outbox lesson lived in the outbox code and the commit body."],[2,"Nothing fails. A 403 or 422 leaves a 'pending' badge forever with no error to look up."],[0,"The builder's words, 'offline presence outbox', share 'offline' and 'outbox' with the entry.",1],[1,"Presence and punches have the same contract. Pings are similar but not the same, because they are droppable by design."],[0,"The main session holds it."],[1,"Pings must drop it while 401 still stops the drain. The ping author broke the rule on purpose, not the classification."],[2,"Jest tests with a mocked network passed, but none sent a 4xx. The ping gap was found five hours later."],[4,"No failure was visible, so nothing went up."],[0,"c27bb39 turned the lesson into shared code. CLAUDE.md states the contract and its two droppable exceptions."],[0,"Later queues imported the shared check from their first commit and chose park or drop correctly."]],"worked":"Later queues reused the shared classification from their first commit and chose park or drop correctly."},{"id":"f04-C1","family":"vendor-build-deploy","title":"Sentry plugin breaks the EAS Android build","story":"Adding the Sentry plugin to app.json broke the cloud Gradle build. CI only runs a JavaScript export, so it stayed green. The fix came from comparing with an earlier working build on a side branch.","when":"2026-06-26","source":"Commits 6928828, b7a5b98, a6f9048","entry":"Trap. EAS Android build errors in 'Run gradlew' after the Sentry package was added to app.json plugins. The plugin adds a Gradle upload step that needs an auth token. Remove it from plugins. The SDK still autolinks. CI cannot see this.","steps":[[1,"Opus 4.8 held the failure and the repo. The decisive fact, that build 14 came from a side branch, was in no window."],[0,"'Before retrying a failed build or deploy' fires.",1],[1,"The query is the build log, which reaches a session only when the owner pastes it. The commit quotes only an error code.",1],[1,"An earlier entry comes back as a candidate or as a lead. Nothing exists for the later version bumps."],[0,"One card in the calling window, at most 2,000 characters."],[0,"Remove one string from app.json plugins. Nothing to adapt."],[2,"The real check is the next EAS build, which fails again on three version bumps.",1],[1,"The second failure escalates with only a lookup id. Opus needs a new pasted log and the build-14 comparison. Neither travels in the brief."],[0,"The fix meets the write rule, because a build was burned. The version-bump cause is stored as a separate pin.",1],[0,"A phase-close scan labels a stranded fix 'fix not on main'. The auth-token precondition is an EAS-side secret and can never be probed.",1]],"worked":""},{"id":"f04-C2","family":"vendor-build-deploy","title":"Empty env value rejected by eas.json","story":"A build profile carried an empty Sentry DSN meant as 'off'. EAS rejects empty env values. Every build failed before starting. CI's JavaScript export never reads eas.json.","when":"2026-07-18 written; 2026-07-20 and 08-03 repeats","source":"PR #143; commits 140428c, 79a8dd4, a31924a","entry":"Trap. Every eas build fails schema validation: an env value is 'not allowed to be empty'. The file eas.json carries EXPO_PUBLIC_SENTRY_DSN, the crash-report address, as an empty string. Remove the keys; unset already means off. To enable Sentry, add the key with a real DSN.","steps":[[1,"The task was a feature, 'wire the DSN, empty means off', run by Fable. A cheap model shares the blind spot."],[0,"At 07-20 the failed build triggers. At 08-03 the diff check runs at the first commit. At 07-18 nothing could fire, because no entry existed.",1],[0,"The EAS message names the key and the rule and is short to paste. At 08-03 the query is the diff itself."],[0,"At 07-20 an out-of-vocabulary rule turns a Sentry-word tie into a miss. At 08-03 the entry matches on the eas.json env key.",1],[0,"One warning line and one card in the session's window."],[0,"Trivial: the value must be non-empty."],[1,"At 07-18 the gate cannot see eas.json validity, and the strong model wrote the defect. A cheap output equal to Fable's is equally broken."],[4,"The error explains itself. No escalation is in the record."],[0,"This is the design's model entry: the data value is the cause, with a control pair present and absent.",1],[0,"At 08-03 the warning fires and is right. It adds nothing measurable over CLAUDE.md, which already carried the rule."]],"worked":"At 08-03 the diff warning fired at the first commit and was right."},{"id":"f04-C3","family":"vendor-build-deploy","title":"Floating base image breaks the Railway build","story":"A Dockerfile hardcoded the bookworm package line, but the floating python:3.12-slim image moved to trixie. The image build failed and production stayed on the old version.","when":"2026-06-16","source":"Commits afb7065, 9c561b0; deploy workflow first run","entry":"Trap. Railway image build fails: postgresql-client-17 cannot be installed. The Dockerfile hardcodes the bookworm-pgdg apt line, but python:3.12-slim now follows trixie. Build the line from the image's VERSION_CODENAME. CI does not build this Dockerfile.","steps":[[1,"The first deploy run failed. The writer believed 'bookworm ships 15', the same picture a cheap model brings from training."],[0,"'Before retrying a failed deploy' fires.",1],[1,"The apt error sits in the Railway build log. The session may reach the Actions log through gh. The Railway log needs a paste.",1],[0,"First time: the store is empty for this. A miss is the right answer."],[4,"Nothing is delivered on a miss."],[4,"Nothing to adapt."],[2,"The authoritative check is a re-triggered Railway deploy. The strong model's own output was the defect, so 'equal to the strong model' is not success."],[1,"Miss, claim, then escalate with the lookup id only. The receiving Opus must fetch the build log again."],[1,"It meets the write rule, because a deploy was burned. 'Won't break on the next base-image change' predicts a vendor.",1],[1,"A floating tag moves with no local trace, so the store cannot re-check the entry. The Dockerfile comment carried the lesson at no cost.",1]],"worked":""},{"id":"f04-C4","family":"vendor-build-deploy","title":"Staging VM unreachable after a PC reboot","story":"After a reboot the Hyper-V switch gets a new address range. The firewall rule allowed ssh only from the old one. The 11-04 entry was half right and spread through three later documents.","when":"2026-11-04 entry; 2026-11-09 recurrence","source":"Staging rig scripts; commit db6c8fa; session S11 lead","entry":"Trap (staging rig). After a PC reboot rig.sh start brings the VM up at a new address, then 'ssh did not come up'. The Default Switch gets a new /20 inside 172.16.0.0/12 each boot. The rule must name 172.16.0.0/12.","steps":[[0,"Sonnet 5.5 held the drills task, the rig scripts and the provision script with its comment in a resumed window."],[0,"rig.sh start failed after 5 min 23 s, so 'before retrying a failed deploy' fires."],[0,"The command output is local. No paste is needed."],[2,"It returns the 11-04 entry, which is half right. The error line is a generic ssh wait failure and fits any reason ssh is down."],[0,"The card lands in the main window. The compaction summary kept the subnet fact."],[4,"The entry's fix was already applied. Nothing to adapt."],[2,"The store then learns 'not this entry' for a recurrence of the entry's own cause.",1],[4,"Sonnet solved it in two turns without escalating."],[2,"Nothing can test the generalisation from two samples, yet it is stored as fact."],[2,"Repair needs two Opus calls for a two-turn Sonnet fix. Cross-project use is not specified. On a real host 'both private blocks' is wrong."]],"worked":""},{"id":"f04-C5","family":"vendor-build-deploy","title":"Queued writes deleted on a non-network error","story":"A fix classified errors by status. Later, Railway's edge answered some requests with 4xx text and phones parked or dropped writes for weeks. No session ran. An agent first saw it on 10-31.","when":"2026-07-03; outage from about 2026-08; seen 2026-10-31","source":"Commit c27bb39; O-08-design.md line 62; O-03-design.md line 7","entry":"A queued write that synced into a non-network error was deleted. A typed ApiError carries the status. 401 pauses the queue. 400, 403, 404, 409 and 422 are definitive: move to a visible failed list. 5xx, 429 and timeouts retry. Bias every ambiguity toward keeping the record.","steps":[[1,"On 07-03 the task is a real defect in the new queues, and the outbox contract is in the window."],[2,"From about 2026-08 phones park and drop for weeks while no session runs. No trigger exists for a failure that never reaches a window."],[4,"Nothing to query during the outage. On 10-31 the only text is the host's 'Application not found', which shares no words with any entry.",1],[0,"The diff check surfaces the outbox contract by its identifiers on the changed lines. It is the right entry for the task as posed."],[0,"The card sits in the window of the session doing the work."],[0,"Adapting to pings, 'droppable, so drop', is what Opus 4.8 did. The output was equal."],[2,"Tests mock a 404. Nothing can test who answers a 404. The equal output carried the same exposure."],[4,"No visible failure until 10-31. Then the top tier ran the program directly."],[1,"The replacement entry comes from a multi-agent workflow. Its premise is dashboard configuration, outside git and outside any footprint."],[2,"The vendor change left no local event, so the entry stayed validated. Reuse spread its premise to queues where a 4xx means drop.",1]],"worked":""},{"id":"f05-1","family":"flaky-race-data","title":"Old queued completion replays over a newer one","story":"An offline completion is replayed over a newer live one. The fix drops the queued copy after a live send. Later it deleted a real queued completion when the live send was a blank form.","when":"Fixed 2026-07-03; door found 27 days later","source":"Commit 76061e0; later 8dafcec; completionPrefill.ts lines 26-30","entry":"Mobile outbox defect. A completion queued offline is replayed over a newer live send under the same stable id. Fix: after a successful live send, remove the queued item. Payments and notes use unique ids, so they never collide.","steps":[[1,"Later tasks are features. The race is not a problem the model has. Only CLAUDE.md's always-loaded known-defect note names it."],[0,"No error, so no lookup after failure. The diff check matches named handles on changed lines, and an outbox edit warns.",1],[0,"The diff check is mechanical. The model does not choose the words."],[1,"Two entries look like one problem: 'stale write over newer send: fixed' and 'same id, concurrent flush: open'."],[0,"One warning line per entry in the main session and the decisions journal. The Opus reviewer rules.",1],[2,"The only stored fix is a rule: on live success, drop the queued copy. Adapting it to a new kind copies the door."],[2,"A race's footprint is identical in a good and a bad run. The old Jest case passes even where its rule destroys a bill.",1],[2,"Nothing fails in a session. In the field the winner is whichever request the server finishes last. Nothing climbs. The finder was code reading."],[1,"Written at solve time, it is stored with 'never collide' true and the deletion unseen.",1],[2,"The entry stayed true by its own test. A later fix found it was a door through screens outside its footprint.",1]],"worked":""},{"id":"f05-2","family":"flaky-race-data","title":"Dispatcher flip sends the whole history","story":"Nothing fails until FIXFLOW_ENABLE_DISPATCHER is switched on. Then an unseeded cursor drains 87 events as live WhatsApp messages, 36 of them triggers. Later tasks are a drain audit and a host move.","when":"Entry from 2026-08-01 review; ship plan later","source":"Commit c731e66; migration 0046; HANDOFF lines 157-166; SHIP-PLAN line 102","entry":"Trap, operator action. With no cursor row, run_dispatch_once starts at last_seq=0 and drains all of job_event as live messages. Measured on prod: 87 events, 36 triggers. Fix: migration 0046 seeds the cursor at the latest seq. A 2-day age skip covers a hand reset.","steps":[[1,"Later tasks are a drain audit and a host move. Neither is 'a dispatcher problem'. The hazard is a state the next operator action meets."],[1,"No error exists. The diff check cannot see state outside git, such as an env flip or database rows.",1],[1,"The entry's action is 'enable dispatcher'. Later sessions act as drain, restore, re-point or close the window. A hit depends on guessing those verbs."],[1,"At best a candidate. Entries about prod data are capped at candidate until a probe and an age-guard test exist.",1],[0,"The main session gets one card."],[2,"Events pile up above the July seed while OFF, and months-old writes count as fresh."],[2,"The probe runs on a throwaway database migrated to head. It cannot count events above the prod cursor. The 36 came from a prod query.",1],[1,"What must go up is a prod query result, which an operator runs, not a model."],[0,"Write-then-approve by a different Opus matched what happened. The review fixed the dead-letter guard, the downgrade and a test that pinned the consent leak.",1],[2,"'Enabling is forward-only' decays with prod rows no footprint item sees. The entry stays validated. The ship plan, not the store, carries the live rule.",1]],"worked":""},{"id":"f05-3","family":"flaky-race-data","title":"Clinic check stalls with no test named","story":"A parallel check ends 'no test made progress for 600s'. The cause is unknown. The related entry from a faster-check session covers a different cause, a crashed worker. The rerun passed with no fix.","when":"2026-11-09 stall; related entry 2026-11-05","source":"Transcript 7b3031d3 line 1152; HARNESS-BOTTLENECKS line 427","entry":"No entry from the 9 Nov stall. The related entry: parallel pass ends 'no test made progress for 600s' after a worker died. Under pytest-xdist loadfile the run hangs. Under load the crash is reported at once. Set DIST_MODE to 'load'.","steps":[[0,"Sonnet was measuring runs mid-task. The log tail, with dots to 96 %, 'exit 1, 961.0s' and the watchdog line, was in the window."],[0,"A cheap agent that hits an unexpected gate error looks it up before retrying.",1],[1,"What may matter is not in it. The watchdog reports no test id, and low memory and load show only in load samples."],[1,"An exact template hit on the 11-05 entry, a different cause. The ambiguity flag needs more than one recorded cause.",1],[0,"The main session holds it."],[1,"Nothing to adapt. The entry only rules out one cause. The model then does what it did without a library: rerun once more."],[2,"But the only verdict on the failure is the rerun. It passed with no fix, so 'resolved' is recorded for nothing.",1],[2,"Escalating hands up the same silence: dots, one watchdog line, no test id, no stack, machine state gone. A higher model gets no more evidence."],[2,"Nothing is solved, so nothing is written. The next stall starts from zero.",1],[1,"The 11-05 entry stays validated and matches every stall's exact line. Each non-crash stall pays a lookup and a 'not applies'."]],"worked":""},{"id":"f05-4","family":"flaky-race-data","title":"Flaky clinic tests read random tags as figures","story":"Attack tests fail by chance. A number helper reads ids, a CSRF token (a random form value) and random hex tags as money figures. Three writers made three fixes in about 7 hours.","when":"2026-11-05, about 7 hours, three fixes","source":"Commits 44d115b, 6ac4577, 8259fa3; transcripts df1db0b9 line 1369","entry":"Flaky test, clinic withholding tests. Attack tests S09 and S07 fail by chance when two numbers on a page differ by a hidden amount. The helper numbers() reads ids, the CSRF token and random hex tags as figures. Fix: strip those; a unit test pins what is read and ignored.","steps":[[0,"Sonnet was in a faster-check session. The task is speed. The failing assertion is in the run log."],[0,"An unexpected gate error is looked up before retry.",1],[1,"The canonicaliser masks hex runs, ids and free numbers. A figure coinciding with a hex tag is the only clue, and masking removes it.",1],[0,"At 23:49 UTC the test frame hits the root's entry. At 23:00, in a file outside its footprint, a miss is likely."],[0,"The main Sonnet session gets a candidate card with a summary and unverified negatives, no fix. The branch lacks the fix commit."],[1,"The summary gives the cause, not the fix. The root's fix is half right: a review found its mask 'would hide SYN Till 654321 moved'."],[1,"A planted-tag unit test makes the chance repeatable, so a control pair can flip. The session's own check was 'tests passing'."],[1,"A second Opus review caught the wrong sequence guess. The same review approved a retry delay that was still over the race window."],[1,"Three writers made three fixes for one cause in about 7 hours. The write trigger likely skips the root's routine fix.",1],[1,"In-project, a later test fails at merge naming random_tag, so the entry becomes redundant. Cross-project, FixFlow's backend has no Hypothesis and no uuid4().hex labels."]],"worked":""},{"id":"f05-5","family":"flaky-race-data","title":"Two pytest runs deadlock on one test database","story":"22 integration tests failed together with no code change. A lone rerun passed. Two pytest processes, from different sessions, shared one test database and deadlocked on its schema setup.","when":"Recorded in commit 65c2c3b","source":"Commit 65c2c3b; HANDOFF lines 133-134","entry":"Trap, FixFlow backend tests. Many integration tests fail together (22 in one run) with no code change; a rerun alone passes. Two pytest processes ran against one test database. Never run two pytest processes against that database at once.","steps":[[0,"In FixFlow, a test run with 22 red tests puts the failure in the window."],[0,"An unexpected gate error is looked up before retry.",1],[2,"The deciding fact, a second pytest process from another session, is in no log the failing session holds."],[1,"At best a candidate. In the clinic, a word match returns a rule with a different mechanism.",1],[1,"In FixFlow the runner can be a subagent in a worktree. Its window starts empty and cannot see the sibling agent holding the lock."],[1,"The fix is a rule about other sessions. The failing agent cannot stop the other process. It can only rerun alone."],[2,"Process state at the moment of failure is gone once the other process exits. No check, no control pair."],[1,"It was traced once. The cost of that trace is recorded nowhere and the session is gone."],[0,"HANDOFF traps are seeded as trap entries. A one-line rule is cheap and true in FixFlow.",1],[2,"In the clinic, 'never two at once' contradicts the designed two slots and misses its mechanism, a database drop.",1]],"worked":""},{"id":"f05-6","family":"flaky-race-data","title":"Clinic socket refusal retry and its timing","story":"A race test failed 2 of 22 runs with 'No buffer space available' on loopback. A 0.05 s retry was added. Reviews found its total delay could make a call look blocked.","when":"Commits dd74a3d and 030c6cb; reviews over several hours","source":"Commits dd74a3d, 030c6cb; round2.md line 8; task.md lines 105, 344","entry":"Gate flake, clinic check on Windows. The serial race pass fails on loopback connect with 'No buffer space available (10055)'. The helper connect_retry retries psycopg.connect up to 6 times, for that message only. Delay is 0.05 s per attempt, under the race window's 0.6 s.","steps":[[0,"A full-check log with a refused connect in a race test is in the window."],[0,"An unexpected gate error is looked up before retry."],[0,"The error line is exact and distinctive."],[0,"Exact template, one recorded cause: a clean hit."],[0,"The main session holds it."],[1,"Copying the retry copies a hidden coupling: its total delay against another test's timing window. The entry's words and footprint do not name that coupling."],[2,"The retry's unit tests pass. The safety claim had no test until later. The race tests it protects passed under load with a broken lock."],[2,"An Opus review approved 0.05 s per attempt. The Fable root caught it at the gate. The middle rung endorsed a wrong fix."],[2,"Written at solve time, the entry stores the record's false sentence that a retry cannot make a call look blocked."],[1,"It was fixed in place within hours. An entry from 030c6cb must be superseded, which needs an Opus actor and a second Opus approver.",1]],"worked":""},{"id":"f06-C1a","family":"composite-merge","title":"Carry-in job loop: five faults composing","story":"A technician reported a job that never left 'ongoing' and photos re-demanded. Five faults composed into one loop. A cheap fix of the visible fault would have stopped there.","when":"Found 2026-07-27","source":"PR #162, commit 4a40423; stored fix from 67218b1 (2026-06-10)","entry":"Two technicians can both claim one job. Fix: one atomic conditional UPDATE, unassigned-or-mine and not closed. The loser gets 409 naming the holder. Re-claiming your own job is an idempotent 200 with no second event. Check: two concurrent claims.","steps":[[1,"A field complaint with no error text. Nothing hints that five faults compose."],[2,"No error, no failed gate. A cheap model fixes the visible fault and stops. The real signal was the technician hitting it again."],[2,"The query is in symptom words. The useful entries are in mechanism words from other slices."],[2,"A miss. The design is word-based. The four patterns become relevant only after the loop is split into five faults.",1],[4,"Nothing to deliver. Had all four matched, only one lead and one candidate show.",1],[4,"Had it arrived, the claim guard had to become a transition table and a migration, not a copy. It is also an Opus-reserved area.",1],[2,"594 unit and 131 integration tests were green. A red team found freeze gaps next morning."],[1,"The failure signal came from the field, twice. Nothing inside a cheap run would have climbed the ladder."],[2,"The captured fix was half right. The later prefill held the next hole. The freeze missed the negotiated-bill field.",1],[2,"The bill-freeze rule it created made the July-08 dispatcher wrong in files the entry never touched."]],"worked":""},{"id":"f06-C1b","family":"composite-merge","title":"Completion correction wipes a bill; replay conflicts","story":"A blank correction form deleted a bill. A replayed completion came back 409 and parked a landed write. A handoff prescribed a guard that closed one route of four.","when":"Late July 2026","source":"Commits 37821f5, 370e83a, 8dafcec, da988e2 (PR #170)","entry":"Correcting a completion wiped the bill, because the server re-prices from the payload. Fix: prefill from the existing completion. Also: a replayed completion came back 409; a byte-identical resubmit is now idempotent. Freeze: bill sent, negotiated, or a payment.","steps":[[0,"The handoff gave file and line and said which guard to reuse."],[0,"A fix that a prose register prescribes is a trigger.",1],[0,"The handoff is in the solvers' own words, so word overlap with both entries is high."],[2,"The stored fix is the code with the hole, and its old cause reads 'not applies'. The outbox replace-by-id race is in neither."],[0,"Two cards fit under 2,000 characters and are pulled into the asking window."],[2,"Reading the entry as server protection leaves done-plus-offline open. The first plan's 'last write wins' claim was wrong."],[2,"Zero screen tests in 39 suites. The doors live in components nothing asserts.",1],[2,"Nothing fails. A red team caught the wrong plan before coding, not a rung."],[0,"The entry is stored with test ids on pure modules. The old entry is superseded, and the stable-id race is an open item.",1],[2,"The refusal depends on the 'unfixed' outbox race existing. Fixing that race in another file changes the entry's meaning. Nothing links them."]],"worked":""},{"id":"f06-C2","family":"composite-merge","title":"Dispatcher seams: three items plus a freeze change","story":"The July dispatcher entry said safe to flip. Each of three register fixes was right alone. Together they put a resurrected fault inside the error path that fixes it.","when":"2026-07-08 built; 2026-08-01 handoff","source":"Commits d1f78cd, 834311f, c731e66, da988e2; handoff items B1-B3","entry":"job_event as a transactional outbox with a WhatsApp dispatcher. A cursor drains in seq order. UNIQUE(job_id, kind) guards idempotency. Claim before send. Consent-gated and log-only while settings are empty, so enable_dispatcher stays safe to flip.","steps":[[0,"At the fix there were three register items with file and line and one-line fixes."],[1,"The design has a trigger for the fix. A change to the bill-sent time's meaning touched jobs, and the dispatcher was never touched."],[0,"The prescriptions share words with the dispatcher entry and the freeze entry."],[2,"The top hit is a Fable entry whose safety claims are false. Four parts meet a two-card cap. Nobody says who stamps the bill-sent time."],[1,"Pull-only at 2,000 characters means at most two of four parts arrive."],[2,"Each fix is right alone. Together one is resurrected inside the error path that fixes it."],[2,"A dead-letter test is named for a property it does not exercise. Nothing tests the seed or the age guard.",1],[2,"The error came from the top rung. A second Opus review found the seam. The last question went to the owner and is still open."],[1,"The entry was seeded by patch id because its commit is not on main.",1],[1,"The Railway env flip is outside git. The design reaches it only by the 'enable dispatcher' wording. A hand cursor reset has no lookup.",1]],"worked":""},{"id":"f06-C3","family":"composite-merge","title":"Clinic opening cutoff: cash rule vs stock rule","story":"A root brief embedded a stock rule that differed from the cash rule. Two partial entries disagreed on what 'cutoff' means. Merging them needed new rules, and no round was solved.","when":"Clinic G10-20, early November 2026","source":"Commits 53906e6, c1fb346, b356158; findings GC-01, GE-03; transcript 97380a1e","entry":"Cash: opening is the balance at the end of the cutoff day. Refuse postings on or before it, after lock_accounts. Stock: a movement whose event is before a count's observation makes the count stale. Refuse the posting.","steps":[[1,"An 11,840-character brief from the root already embeds the divergent stock rule."],[2,"A spec task, no failure. The earlier knowledge-store design's prescription trigger covers prose registers, not a root brief, and that design is FixFlow-only.",1],[0,"If asked, the brief's own words reach both entries."],[2,"Two partial entries disagree on what 'cutoff' means. The brief picked the stock one. A review showed the cash rule was right for stock."],[0,"Both rules sat in one tool call of the implementing window. Delivery was not the gap."],[2,"Holding both, the model kept them apart. The merge needed new rules: no approval on the cutoff day, holds, and set-aside after reversal."],[2,"'Root check: 7/7, 1990 passed.' Every stock test posts the day after. A later finding: the book ended right while the period read -10."],[1,"Two Opus refute-reviews found it and Fable confirmed. The fix was a choice between two options."],[2,"Captured after the first finding, 'stock follows cash and pay' then produced more findings, two of them P1. No round was solved."],[1,"The opening's lock order deadlocked with receipts in another module. Cross-project reuse is not specified.",1]],"worked":""},{"id":"f06-C4","family":"composite-merge","title":"Login lock: handoff prescribes the wrong fix","story":"A handoff prescribed letting a correct PIN through a lock and inverting two tests. An Opus implementer refused an Opus verifier's fix, and the owner made the final call.","when":"Built 2026-07; refused in the settling commit","source":"Commits 0a40416, 1c546a3; HANDOFF A2","entry":"Five failures lock the account for 30 s, doubling up to 15 min, and the lock heals itself. There is one manager account, so a hard lock would let anyone shut it out. A correct PIN during a lock is refused. A2: public roster plus lock-before-verify lets one wrong PIN per 900 s hold every account. Invert the two pinning tests.","steps":[[1,"The task is a prescription carrying the wrong answer and an instruction to invert two tests."],[0,"A trigger fires before applying a register fix.",1],[0,"Prescription wording plus an exact document handle to HANDOFF A2."],[2,"First time, both entries point at denial of service. The per-IP window invites the false comfort a later commit refuted."],[0,"Two cards, pull-only."],[2,"Easy to apply and does damage: a 4-digit PIN with no throttle. A handful of IPs finish in under an hour."],[2,"Inverting the two tests as told turns the suite green. Nothing tests the throttle property."],[2,"No failure, no climb. An Opus implementer refused an Opus verifier's fix. The owner made the final call."],[0,"The entry is do-not-apply with a document reference and protective tests, owner-confirmed. The commit body holds the full argument.",1],[0,"The prohibition is printed, never withheld, while the handoff still prescribes the wrong fix. A new login path would escape the protective test.",1]],"worked":"A stored do-not-apply entry with owner confirmation prints the prohibition to the next agent."},{"id":"f07-1","family":"research-design","title":"A wrong cause for the three-day halt","story":"All clinic sessions stopped on 6 Nov. The top model wrote 'a usage limit stopped every session' unchecked. The real cause was a power-off, shown by a Windows event log. A later lane inherited it.","when":"Halt 2026-11-06; entry 2026-11-09; lane 2026-11-11","source":"HARNESS-BOTTLENECKS line 397; task.md line 832; card A8-06","entry":"All clinic sessions stopped 6 Nov about 14:57; three-day halt. Cause: a usage limit stopped every session. Nothing lost. Recovery: start Docker Desktop, start the nine containers, message each session. Solved by the root, Fable 5.1, 9 Nov.","steps":[[1,"The 11 Nov research lane gets 'find remedies for B03' with the cause in its brief. It has a task, not the problem."],[3,"The triggers do not fire for a research lane. The owner's design does not say when research looks up.",1],[2,"The query is built from the brief, so it carries the wrong hypothesis. The right lead, 'unclean shutdown', shares only '6 November'."],[2,"The best match is the wrong entry, labelled as solved by the top model. Nothing outranks it.",1],[0,"It is delivered to the lane's subagent window and stays for its short life."],[2,"This happened for real through the brief. A lane researched usage-limit pause settings. The later review said the stops were power-offs."],[2,"'Equal to the strong model' means equal to a wrong guess. The truth came from data outside git and a brief to attack."],[2,"The lane's output looks complete. An Opus 5.5 refuter, a rung below the Fable author, corrected it because of its brief and its data."],[2,"Fable wrote the cause 33 seconds after 'Docker down' with nothing checked. Its write rule would exclude the correction too.",1],[2,"Two documents still say 'usage limit'. The evidence is a Windows event log, so nothing watches it for change.",1]],"worked":""},{"id":"f07-2","family":"research-design","title":"Would a graph database cut tokens?","story":"A research verdict said no graph database and no cache. The owner said it was not the strongest form. The new question was about joining reasoning branches, a different meaning of 'graph'.","when":"2026-11-12","source":"Session 0bf1c4f3; HB lines 247-263; HV2 line 371; record #185","entry":"Would a graph database with a traversal cache cut tokens in coding sessions? Built a file-level import graph (618 files, 1,119 links). SQLite answers in 0.05 ms. 13 to 14 of 200 searches were connection questions. Verdict: no graph database, no traversal cache.","steps":[[0,"The session held the owner's expectations, his request for graphs where branches can be merged, and the memory index."],[3,"No failure triggers a lookup in research. The main session dispatched fact gatherers, a lookup by another name. Neither design says when to do that."],[2,"'Graph' in the new question means merging partial solutions during retrieval. In the stored entries it means a code graph for saving tokens."],[2,"Five partial matches disagree: withdrawn, narrowed, refuted but unchanged, skipped and unrun. Withdrawn entries are dropped, but one has no link and stays live.",1],[0,"Sonnet gatherers carried the results to the main window. The withdrawal reached it because it sat in the same file as the verdict."],[2,"None of the five answers the new question. Verdicts about token saving say nothing about joining reasoning branches."],[2,"The standard it failed was to build the strongest form and compare like with like. That standard lived with the owner and in no check."],[2,"Only the owner saw the failure, above every rung. The repair cost six research lanes, three verifiers and a critic."],[1,"The durable lesson was about method, not graphs, and was stored as a memory note. Negatives need a file footprint. A method lesson has none.",1],[2,"The withdrawal reached one document and memory, not the line saying the PC lacks memory for a graph server. That line was refuted at 07:03Z."]],"worked":""},{"id":"f07-3","family":"research-design","title":"Geofence arrival: a ruling, then a blocker","story":"A ruling said enqueue the presence row before the location fix resolves. Twenty minutes later a critic with an invariants lens found it loses every crossing's coordinates. The ruling looked final at 21:27.","when":"early November 2026; v6 21:27, v8 21:50","source":"Commits 3fb8f9c, 4e01c82, 093b793; plan line 825; service.py 402-415","entry":"Problem: the geofence arrival handler overruns its window. Ruling: the phone stops judging; delete the dwell. One bounded fix per crossing. The presence row is enqueued before the fix resolves; the server recomputes every row under R1.","steps":[[0,"The replayed session holds the plan step, which is concrete and names files."],[0,"A fix that a prose register prescribes is a trigger.",1],[0,"The query words match the entry's own words."],[1,"Suppose the v6 entry was stored and the later fix was not recorded as replacing it. Then the lookup returns v6, marked checked.",1],[0,"The main session receives the entry beside the plan text."],[0,"With the v8 entry, applying it is direct. With v6, the implementer enqueues before the fix and every crossing loses its coordinates."],[2,"For v6 the gates were written from the same ruling and pass the defect. Only v7 added a failing Jest test."],[2,"Two judges and the refuters missed it. A critic at the same tier, with an invariants lens, caught it. The lens decided, not the ladder."],[2,"A capture keyed on the commit could store the wrong version: one commit message says v4 and holds v3."],[1,"Dependency changes are watched only where the writer names them, and a spike may swap the SDK.",1]],"worked":""},{"id":"f07-4","family":"research-design","title":"The knowledge-store design itself","story":"The owner asked for a cache of model reasoning conclusions. The store design was built for exact-repeat defects in one repo. The owner said the review was thinking too narrowly.","when":"2026-11-03 to 2026-11-12","source":"Design v1.2 and v1.3.1; session 0bf1c4f3; commits 6928828, 140428c; PR #176","entry":"Design: a knowledge store for FixFlow agents. A node:sqlite index over an append-only git journal. Declarative probes. Lexical BM25 retrieval, pull-only. A miss is cheap and safe. Embeddings only when the index outgrows a prompt.","steps":[[0,"The session holds the owner's five expectations and a pointer to the design."],[0,"The owner's message is the trigger: 'you can find it in the repo hopefully look hard'."],[1,"The owner says 'cache library for model reasoning conclusions'. The design calls itself a store of solved defects and traps. Retrieval is word-based only.",1],[0,"The design has versioned entries and supersession, so v1.3.1 comes back, not v1.2.",1],[1,"It arrived as a 132-line Sonnet summary of a 972-line design, a write-up of a write-up."],[2,"Built for exact repeats in one repo, it priced the owner's cross-project library. The owner said 'you just deny the possibility'."],[2,"No test. v1.2 passed 30 refutations and a critic, then fell to the owner. The owner's v1.3 mechanism then lost 53 of 73 attacked points."],[2,"The authority order flips. The owner overturned the Fable-adjudicated v1.2, and Opus refuters overturned the owner's v1.3 mechanism. No rung is the final judge."],[1,"The design cannot store a design, and does not say which part is stored.",1],[2,"A later PR obeyed it while a project existed. The copy dropped the scope.",1]],"worked":""},{"id":"f07-5","family":"research-design","title":"Auth plan said GoTrue; the build departed","story":"The architecture note planned Supabase GoTrue for auth. The next session correctly built name-and-PIN login instead and did not record why. Later sessions kept assuming GoTrue.","when":"Plan 2026-06-03; departure 2026-06-06","source":"Commits 0256497, 30dc6d4, 223d6b3; PLAYBOOK line 84","entry":"Architecture locked: React and Vite web manager; Expo Android app; FastAPI on Supabase Postgres with R2 media. Auth not built. Planned auth: Supabase GoTrue, with the JWT verified in FastAPI. Traps: IPv6 pooler, R2 signed PUT, Railway CLI flakiness.","steps":[[0,"The identity session held the jobs-vertical plan and the new requirement: name and PIN from a shop roster."],[3,"The store looks up defects, not design choices. The design does not say whether a design task looks up.",1],[0,"'Auth' matches the planned-auth line directly."],[1,"It returns a plan for code that did not exist yet. That is the right topic and the wrong answer for a PIN roster."],[0,"The main session window holds it."],[2,"The Opus solver departed from the plan, correctly. That is the anchoring the entry would cause on every lookup until corrected."],[3,"Nothing compares a design entry with the code. Identity tests test PIN tokens. None can say the stored plan is wrong."],[4,"No failure occurred. The solver did not escalate."],[2,"The departure was not recorded. The commit gives no reason for leaving GoTrue. It was not hard for the solver, so nothing marked a lesson."],[2,"A plan for unwritten code has an empty footprint, so building identity another way invalidated nothing. PLAYBOOK still says GoTrue."]],"worked":""},{"id":"f07-6","family":"research-design","title":"A lesson ignored hours after it was written","story":"A memory note said to build and test the strongest form of an idea. The review priced the owner's idea in its narrowest form 2.5 hours later. Nine refuters checked numbers, not framing.","when":"2026-11-12 07:26Z lesson; failure about 10:00Z","source":"Memory feedback-test-the-best-form.md; session 0bf1c4f3 records #30, #385","entry":"Before judging an idea the owner proposes, research and build its best form and test it fairly. A quick naive prototype against a strong baseline is not a test. Define the scoring first and sweep the parameters.","steps":[[0,"The session held the owner's expectations and the lesson's index line from its first request."],[0,"No trigger is needed. The memory index is pushed into every session."],[0,"No query. It is pushed."],[1,"The task was a plausibility critique. A match needed the reader to see a critique as a test of an idea."],[1,"Only the one-line form was in the window. The full note was opened at 12:49Z, after the failure."],[2,"Delivered, not applied. The review priced the idea in its narrowest form. That is the very mistake the lesson names, made 2.5 hours after it was written."],[2,"Nine Opus refuters and a critic checked numbers, not framing. The memory says the nine refuters shared the framing."],[2,"Only the owner saw it. No rung was climbed. The session was already at the top tier."],[0,"Capture worked. It was written within minutes of the owner's objection by the session that erred, in the owner's words, with steps."],[1,"The entry grew by instances while its rule stayed the same. More text, not more use."]],"worked":""},{"id":"f08-1","family":"cross-project","title":"Git clone 'Filename too long' across projects","story":"A clinic entry covers long clone paths and a second DLL half. A FixFlow top-model session hit 15 of 15 clone failures. It fixed them inline. The clinic entry is not in the FixFlow store.","when":"Clinic note earlier; FixFlow recurrence 2026-11-04","source":"Clinic commits 32dea29, 9982012; session c1797e48; session 9c3f9742","entry":"Windows: git clone fails 'Filename too long' when the destination root is long. Fix per command: git clone -c core.longpaths=true. Limit: longpaths fixes git only. Native Python modules then fail 'DLL load failed ... filename or extension is too long'. Keep the root under about 100 characters.","steps":[[0,"The main session was on the top tier, not a cheap model. 15 of 15 clone errors were in the persisted output."],[2,"A research-script clone is not a trigger in the earlier knowledge-store design. Fable fixed it inline with no rung above. No lookup.",1],[1,"The text 'unable to open loose object: Filename too long' differs from the stored 'cannot create directory'. Only 'Filename too long' overlaps."],[2,"The store is one FixFlow store with a FixFlow seed. The clinic entry is not there. Cross-project matching is not specified.",1],[0,"The main session held it. No compaction came before the note was written."],[0,"One flag. The DLL half is irrelevant to markdown clones and harmless."],[1,"Re-running the clone is the real check. No check kind reads a machine path length, so 'applies' is unreachable and the fix text is withheld.",1],[4,"Solved on the first retry."],[2,"The DLL half qualifies, but its cause is the clone root, not a commit. FixFlow's writer stored only the git half.",1],[1,"The memory index pushed the fix to siblings. A pull-only lookup would not have fired there. The DLL rule never reached FixFlow."]],"worked":"The memory index pushed the fix to sibling sessions. One later session used the flag on its first clone, with zero failures."},{"id":"f08-2","family":"cross-project","title":"Subagents blocked from writing report files","story":"Two clinic subagents could not write report files. A FixFlow correction said 'They can'. Next day eight of eight report.md writes were refused, 187,160 characters in all.","when":"2026-11-11 to 2026-11-12","source":"HARNESS-BOTTLENECKS line 159; session cb58bdc7 line 360","entry":"Two Opus subagents could not write their report files and returned the text instead. Sonnet extractors in the same session wrote .md outputs. Cause not isolated (agent type? output size?). Workaround: brief subagents to return the full result; the parent saves it.","steps":[[0,"One was a Fable session verifying the owner's list. Others were subagents whose brief says 'Put a full report.md there'."],[2,"Checking a claim raises no error. The window that needed the entry was the Fable writing the brief. Nothing triggers then."],[1,"Paraphrase matches paraphrase. The exact harness string matches nothing, because no entry ever stored it."],[2,"The top result would be FixFlow's 11-11 correction 'They can', the opposite of what had just happened to 8 agents."],[3,"The design reads by the escalating session. How a workflow subagent's one-shot window receives an entry is not stated.",1],[2,"The correction was used. 8 of 8 report.md writes were refused, 187,160 characters."],[2,"A probe wrote a .txt in bypass mode. The original refusals were analysis-*.md. A check at another scope 'refuted' a right entry.",1],[4,"No climb. The refusals were absorbed as returned text."],[1,"The root saw only the subagent's paraphrase. The raw error naming 'report files' stayed in subagent transcripts, which the design forbids extracting.",1],[2,"A hedge, a flat rule, a paste to FixFlow, then 'They can', then 8 refusals next day. Nothing links refusals to the refutation."]],"worked":""},{"id":"f08-3","family":"cross-project","title":"Explore subagent inherits the top tier","story":"A FixFlow rule says route every agent explicitly. The clinic root started three sessions with no model. Only the owner's message surfaced it. The rule reached neither the new tool nor FixFlow's own calls.","when":"early November 2026, clinic root session","source":"Clinic root 7f348b2c lines 667, 732, 955, 1018; commit 5816c70","entry":"The built-in Explore subagent runs on the session's model. So from a Fable session, a 'where is X?' search runs on Fable. Use the project agent fixflow-explorer (model: haiku, read-only) for file location. Route every agent explicitly; cheap work must not inherit the top tier.","steps":[[1,"The FixFlow rule was in the window at line 3. The actor is the top-tier orchestrator."],[2,"start_session with no model raises no error. No trigger fires on a session start. Three starts had no model. Only the owner's message surfaced it."],[2,"The stored action is a subagent type for search. The act is a session start. No shared verb or object."],[2,"A meaning-level match returns a fix, pin an agent file to Haiku, that does not apply to start_session."],[0,"It was already in the main window."],[2,"The rule was present and not carried to the neighbouring tool, three times."],[2,"No check decides 'right tier'. The output would be correct, only dearer. The owner's eye was the check."],[3,"The actor is the top rung and the failure is overspend. The ladder climbs on failure and does not see it."],[1,"Write-through worked: memory edited within 30 seconds, a commit seven minutes later. The note bundles five facts of different scope.",1],[2,"It never reached FixFlow, where 7 of 7 start_session calls pass no model. No objection was recorded. A crossed rule cannot tell intended from mistaken."]],"worked":""},{"id":"f08-4","family":"cross-project","title":"Clinic checks: Linux container allowed here","story":"The clinic measured its full check as latency-bound and moved tests to a Linux container. In FixFlow a Fable session chose a workaround and wrote a limit instead. The owner was the escalation.","when":"2026-11-12","source":"Session e24f17dc; HARNESS-BOTTLENECKS line 65; owner decision USER-23","entry":"Clinic full check on Windows is latency-bound, not CPU-bound. Pytest in a Linux container beside Postgres: 230.1 s vs 367.2 s native. Owner decision USER-23: tests go to a Linux container next to the database. Measure before serialising.","steps":[[0,"A Fable 5.2 session held about 380k cached tokens. They included the library import list and its own 230 s Linux line."],[2,"The model did not fail. It chose a workaround and a written limit. No trigger fires on 'about to record a handicap'."],[2,"'function page_rank is not defined' and the arrow and networkit DLL names share no word with the clinic entry."],[2,"The clinic entry is about speed. This is a missing native library. What carries is a permission, 'Linux is approved here', not a solution."],[0,"The main session holds it."],[1,"The real work was new: libssl3, libgomp1, Arrow 26 and icebug 13.5. Nothing in the clinic entry carries it."],[0,"'Extension: all libraries resolved' and a PageRank result are mechanical checks, though outside any check kind.",1],[3,"The owner was the escalation. Accepting a handicap is not a failure any check sees."],[1,"The correction was stored as a memory preference and the recipe as a Dockerfile in evidence. Neither passes the write gate.",1],[1,"Two stored rules now collide: no installs without an owner decision, and Docker/Linux already approved.",1]],"worked":""},{"id":"f08-5","family":"cross-project","title":"Long Bash heredoc from a subagent","story":"A long Bash command failed with ENAMETOOLONG in one agent and 'unexpected EOF' in another. The clinic stored it only inside a subagent-write note. The rule's author sent an 8,720-character call 25 hours later.","when":"2026-11-11 to 2026-11-12","source":"Session 11-12 Fable 5.2, lines 7367 and 7799","entry":"A long Bash heredoc from a subagent failed with ENAMETOOLONG, name too long. In another agent it failed with 'unexpected EOF while looking for matching'. Split long writes into parts. (The clinic stored only 'one also failed a long Bash heredoc' inside the subagent-write note.)","steps":[[1,"A Fable 5.2 main session had the 8 KB rule in its index. It was also in its compaction summary and its own subagent briefs."],[2,"Writing a long command is not an error until it fails. Then the cost is one failed call."],[1,"The EOF line is a clean template, identical to the clinic's. Nothing stored carries it."],[2,"In the clinic the symptom is bundled in the subagent-write note, so a hit returns the wrong fact."],[0,"It was already delivered inside FixFlow."],[2,"The rule's own author sent an 8,720-character Bash call 25 hours after writing it."],[1,"A rerun is the check. No check kind covers the shell.",1],[4,"No climb happens."],[2,"The clinic bundled two facts in one note without the error strings. FixFlow re-derived the second fact on 11-11."],[1,"Only in-project push reached later windows. Nothing crossed projects."]],"worked":""},{"id":"f09-1","family":"ladder-real-life","title":"Race tests that pass without their lock","story":"Race tests named a lock but passed with that lock removed, because a counter row serialized the work. The lesson was in every brief and followed in form. Nine of 11 gates took three rounds.","when":"Clinic gates G02-02 to G10-23, early November 2026","source":"Clinic slice S04 session a9b52f2e; check-summary.md line 75; task.md line 303","entry":"A race test names a lock but passes with that lock removed. Both postings call open_document, which updates a per-type counter before any lock, so the counter serializes them. Rule: a race test proves a lock only if it fails with that lock removed. Method: remove one lock at a time.","steps":[[1,"The slice held the root's brief, which said to record a lock-removal experiment per race. The task is tests to write, not a problem."],[2,"Nothing fails. A cheap model gets no signal and the ladder never starts. The root pushed the lesson into briefs outside the fetch path."],[1,"Task words reach the S02 entry. For S08 the words share only 'race' and 'lock' with it."],[2,"Later failures share the claim, not the cause. Their causes differ: a counter row, a helper after deferred checks, a trigger lock. Others were an earlier variant and no single lock."],[3,"The design does not say which window gets the entry. The error was made by read-only Opus reviewers and the Fable root."],[2,"The lesson was in every brief and followed in form. They held after deferred checks, ran on an earlier variant, or removed the wrong layer."],[1,"What decided was a reviewer reading, then model-run experiments, at least four later shown misleading.",1],[2,"Opus reviewers noticed and handed up finding tables. The Fable root's round-1 premise was wrong. Removing locks one at a time settled it."],[2,"Round 1 said scope lock, round 2 counter, round 3 proved counter. A capture at the strong model's verdict stores the wrong lock.",1],[2,"Any added guard changes the answer without touching the test. Race footprints are identical in good and bad runs.",1]],"worked":""},{"id":"f09-2","family":"ladder-real-life","title":"A reversal test leaves the database short","story":"A migration reversal test migrated forward only to the old step. On the merged tree, 2 of 2570 tests failed in the same worker. The session had copied the template into two new tests.","when":"2026-11-11, merged tree check","source":"Commit 6a2fd45; f6b5c6c; test_followup_guards.py","entry":"Clinic, Django, pytest-xdist. Full check on merged main fails 2 of 2570 with CheckViolation. A test migrates back to 0013 and forward only to 0014; once 0015 exists the worker's database stays at 0014. Fix: in the finally, migrate to the leaf nodes of the app.","steps":[[1,"The Opus session held its design, code and the earlier test it copied. A stored 'how to test a reversal' would be that same test."],[2,"The session's full check passed 2570 and two Opus reviews found no P1. The failure appeared only on the merged tree, in another test order."],[2,"A query in those words finds the real-data guard, not a migration test in another file."],[2,"The nearest stored items are the earlier test, a latent defect, and a rows-left-behind fix. That fix does not cover schema state."],[0,"The failure arrived in the Fable root's main window as test output and stayed through the fix."],[2,"Reuse multiplied the defect. The session copied the template's finally into two new tests."],[2,"2570 passed on the branch; 2 of 2570 failed on the merged tree. The check that judges equality certified a wrong solution."],[0,"A red deterministic check, not a model, noticed it. The handoff was tool output. Fable fixed it in about a minute."],[1,"The root wrote the rule into conventions within two minutes. Under the design's write rule, this one-attempt top-tier fix is routine and not recorded.",1],[1,"The entry covers one reversal helper. A reversal written another way, or failing on another constraint, shares no words. The 12-worker prediction is untested."]],"worked":""},{"id":"f09-3","family":"ladder-real-life","title":"Subagent writes: the probe overruled two Opus","story":"A note said subagents cannot write report files. A Haiku probe wrote a one-line .txt and the root sided with it. Each rewrite widened or flipped the entry. Eight subagents were then refused on report.md.","when":"Note 2026-11-01; probe 2026-11-11; refusals 2026-11-12","source":"Memory note 11-01; map-full.txt line 588; orchestration.md line 14; HARNESS-BOTTLENECKS line 23","entry":"Subagents launched with the Agent tool could not write their reports. Both Opus analysts said the harness blocks subagents from writing report files and returned the text. Sonnet extractors wrote files earlier, so it may depend on agent type or output size. Brief subagents to return the result.","steps":[[0,"On 11 Nov the Fable root had 'subagents cannot write files' as an explicit question. It had also read the memory note."],[0,"The task was the question itself, so a lookup had a clear trigger."],[0,"'Subagent write file refused' matches the entry's words."],[1,"The entry carried a paraphrase, not the tool error, and its hedge pointed at the wrong variables."],[0,"The entry sat in the root's main window and stayed there through the compile."],[2,"It called the rule an unchecked self-report. The probe tested another condition."],[2,"The refusal text that decides it sat in 1 Nov transcripts, never read."],[2,"The ladder ran downward. A Haiku probe overruled two Opus observations and the Fable root sided with the probe. The original observers were right."],[2,"Each write widened or flipped the entry: 'report files', then 'file writes are refused', then 'They can'. Two contradictory entries, neither naming the condition."],[2,"They adapted silently and the root never saw it. The saved compile keeps 'They can' and a remedy the refusal blocks.",1]],"worked":""},{"id":"f09-4","family":"ladder-real-life","title":"A 'not found' that was a search gap","story":"A critic searched task.md files, found no 34-minute wait, and called the owner's figure unsupported. The wait was printed in a root transcript never searched. A wider refuter corrected it.","when":"2026-11-11","source":"Critic check-wait-max; task.md files; root transcript 7f348b2c; verdicts.txt line 30","entry":"Check-wait-max. The owner says check waits reach 34 minutes. Searched docs/tasks/*/task.md for 'waited' and '34 min'. Largest recorded waits: 742 s and 726 s. '34 minutes' not found. The owner's figure is not supported by the records.","steps":[[0,"Each Opus map lane held the sweep cards and the critic's output. Its task was to classify the claim."],[3,"The lanes did not decide to look anything up. The design does not say whether a negative is pushed or fetched."],[0,"'34 minutes' and 'slot wait' hit the critic's entry exactly."],[2,"Exact match, wrong answer. The entry is a 'not found' whose scope excluded the root transcript where the check printed 'waited 2030 s'."],[1,"One entry reached four parallel map lanes and the verdict writers at once, before anything checked it."],[2,"'Not in task.md' became 'in no file', then 'the owner's figure is wrong', then a stop rule."],[2,"Nothing checks a negative. Its footprint, the task.md files, stayed valid. Footprint validity cannot show that the search missed where the evidence lived.",1],[1,"Caught by a same-tier Opus-high refuter with a refute-by-default brief and a wider search, not by a higher tier."],[2,"One verdicts file still says 742 s. The 9 Nov observation was a measurement, not a solved problem, so no capture rule would store it."],[1,"The 742 s copy survives in the evidence file a trial would run from."]],"worked":""},{"id":"f10-1a","family":"libraries-over-time","title":"Sentry plugin trap, first moment","story":"Build 15 failed in Gradle after the Sentry plugin was added. Two causes shared one symptom. The fix commit never reached main. The real session found both causes in one pass.","when":"2026-06-26","source":"Commits 6928828, a6f9048; KS limit 1","entry":"EAS Android build errors in 'Run gradlew'. Cause: expo install added the Sentry config plugin to app.json. That wired in a Gradle step needing an auth token, org and project. Fix: drop the plugin. Holds while no Sentry project or token exists. CI cannot see this.","steps":[[1,"Opus 4.8 has a task and a generic error code. The cause-specific line is on the EAS web log, so the owner must paste it.",1],[0,"'Before retrying a failed build' is a named trigger.",1],[1,"The generic error code is flagged ambiguous. Without the pasted Sentry line, the query reaches a candidate at most.",1],[1,"Two causes, one symptom. One entry matches the stranded plugin. The Dependabot SDK pins have no entry, and nothing says a second cause exists."],[0,"Pulled into the main session that owns the build. On a miss only the lookup id goes into the brief."],[1,"The fix is withheld until verify says it applies. The precondition 'no auth token' is an EAS-side secret, so the verdict is capped at inconclusive."],[1,"After removal the plugin probe reads absent while the build still fails on the Dependabot pins. The only full check is another EAS build."],[0,"A second failing build is visible, and the miss on the second cause escalates as it does today."],[1,"The commit says the plugin re-entered main via #59, but the fix commit never reached main. The fix-reached-main check catches the anchor, not the prose.",1],[1,"A phase close would print 'fix not on main' as one of four counts. The design does not say who must act on that line.",1]],"worked":""},{"id":"f10-1b","family":"libraries-over-time","title":"Sentry trap: copied rule loses its condition","story":"The June note said re-add the plugin once a Sentry project and token exist. A July writer copied it into CLAUDE.md as 'must never be added'. August wired a real DSN without the plugin.","when":"2026-07-18 and 2026-08-03","source":"Commits 6928828, 140428c, a31924a; CLAUDE.md line 84; PR #176","entry":"The first Sentry entry, plus the 06-26 text: re-add the plugin only once a Sentry project and auth token exist. Dependabot was told to ignore the Expo and RN native family.","steps":[[0,"Task windows have CLAUDE.md always loaded. On 08-03 it holds both traps and the PR cites them."],[2,"07-18 is a wiring task, not a failure, so no lookup is triggered. Nothing fires before the commit that breaks every build."],[0,"On 08-03 the changed line, the env key in eas.json, is a usable diff query."],[1,"07-18: a miss, because it is the first time. 08-03: a correct but idle warning. Nothing surfaces the plugin entry's now-relevant condition."],[0,"Warning lines go to the PR's decisions journal and to the Opus reviewer."],[1,"On 08-03 the agent had already obeyed CLAUDE.md. The store adds a warning, a verify run and a reviewer ruling, and saves nothing."],[0,"The empty-value entry is a probe on parsed eas.json, and 'absent' is right. A test capture to the real project proved the DSN."],[4,"Nothing failed on 08-03."],[2,"The 07-18 writer copied the condition into the always-loaded file as 'must never be added'. The store's entry keeps the precondition. Two versions exist."],[2,"The Sentry project was created outside git, so no event fires. If asked, the entry says inconclusive both before and after. CLAUDE.md still says never."]],"worked":"On 08-03 the diff warning fired and was right, though the agent had already obeyed CLAUDE.md, so it saved nothing."},{"id":"f10-2","family":"libraries-over-time","title":"A false 'each job is idempotent' sentence","story":"A truth pass wrote that every scheduler job is idempotent. It was false when written: the orphan sweep mints a fresh client id each run. An audit found it 20 days later. It still stands.","when":"Written 2026-07-08; kept to 2026-11-12","source":"Commits 85c88c0, 8ce9530, da988e2; HANDOFF A7; CLAUDE.md line 312","entry":"Scheduler jobs: weekly payroll export, nightly backup, daily auto-link scan and daily media-orphan sweep. Also a 300 s metric rollup, and the dispatcher (default OFF). Each is idempotent, so a duplicate run is harmless.","steps":[[0,"On 08-02 both documents were in the window: CLAUDE.md always, and the HANDOFF because the PR edits it."],[2,"The diff check joins code and config files only, so no lookup happens."],[4,"No lookup happens, so no query exists."],[4,"If one had run, the store would miss. The register item is unsolved, and entries are written only when solved.",1],[4,"No lookup happens, so nothing is delivered."],[4,"The correction was in the window as prose and did not reach the edit."],[2,"The line stood 20 days, until an audit whose default verdict was REFUTED found it. That audit is the expensive-model judge."],[4,"No failure is ever raised. The sweep re-alarms silently, and nothing reads the alarms."],[2,"The strong model's summary was written from reading, not checked, 86 minutes after the contradicting code landed."],[2,"The refuted line was rewritten five days after the refutation and still stands on 11-12. Contradictions are corrected only at seeding.",1]],"worked":""},{"id":"f10-3","family":"libraries-over-time","title":"Stored 'no Python' read as a hypothesis","story":"The memory index says no python on PATH. Later subagents treated it as a hypothesis and probed with a fallback in one command. The error line appeared, but the library had worked.","when":"Notes 2026-11-01 and 2026-11-04; use 2026-11-09 to 2026-11-12","source":"Subagent transcripts agent-a7d5404af4b1e0cff, agent-a1e89191a0c75a205","entry":"One note: a Python 3 exists in the Codex runtime folder; the earlier 'no Python' note was wrong. Another: python is not on PATH in Git Bash (Store alias); use node for JSON. The index line ends 'no python on PATH'.","steps":[[0,"MEMORY.md with the python line sits near the top of all three later subagent windows."],[1,"A trigger keyed on the error would fire after the call had already succeeded through its fallback."],[0,"'Python was not found' is an exact, stable string."],[0,"Two notes partly match. Both are true. The critic's brief merged them correctly."],[0,"The index line reaches every window. The note body with the path reached the critic through the orchestrator's brief."],[0,"The agents treated the stored 'no' as a hypothesis. They probed python3 with a node fallback in one command, with no extra call."],[0,"The fallback's output came back in the same tool result."],[2,"The error line looks like a failure but comes from a hedged probe. A detector keyed on error text would score these successes as misses."],[1,"The 11-04 note said 'not on PATH' three days after the 11-01 note called an earlier 'no Python' wrong. Neither knew uv arrived 11-02."],[1,"python is still a Store stub. uv is on PATH, and newer Pythons appeared later. No note changed, and no event exists for machine changes."]],"worked":"Agents probed and fell back in one command with no extra call, so the stored 'no' saved calls."},{"id":"f10-4","family":"libraries-over-time","title":"Production is down and phones lose writes","story":"Both Railway hostnames return the edge's own 404. The phone treats that 404 as a definitive rejection, so punches, presence and jobs park and pings drop. Nothing in git changed.","when":"Down about 2026-08; probed 2026-10-31 and 11-01","source":"syncClassification.ts line 18; Critique-3 line 196; commit 093b793; CLAUDE.md","entry":"Production is down. Both Railway hostnames return the edge's own 404 'Application not found'. The phone cannot tell it from FastAPI's 404. 404 is in the definitive-4xx list, so punches, presence and jobs park, and pings and travel drop. Techs must not open the app.","steps":[[0,"The memory index ('prod dead') and the orchestrators' briefs put the state into later windows. CLAUDE.md's stale three-service row sits beside it."],[1,"The hazard is an operator action such as a deploy or clock-in, reachable only through the action handle."],[1,"It works only if the plan's wording overlaps the entry's action handles. Zero overlap is a miss."],[0,"The 404 body string and the definitive-4xx name are exact handles."],[0,"In the record, push delivery already worked. The 11-04 briefs carried 'prod dead'."],[0,"After 10-31 no session live-probed the dead hosts. A critique cites the earlier result rather than re-deriving."],[2,"The code half is capped at candidate. The world half has no probe at all, because production state is not in git."],[4,"No escalation in the record."],[1,"One says 'v4' but never touched the plan file, which stayed at v3. An entry built from the message would anchor the wrong version."],[2,"Production went dark around 2026-08 and nothing in git changed. When production is restored, the entry will go stale just as silently."]],"worked":""},{"id":"f10-5","family":"libraries-over-time","title":"Clinic memory says 'no uv'; uv arrives that night","story":"A probe recorded no uv and no Python 3.13. uv and 3.13 were installed that same evening. Three projects wrote three scoped notes. 86 windows started within 22 minutes.","when":"Probed 2026-11-02; 86 windows 2026-11-03","source":"Clinic note clinic-s00-readiness-2026-11.md line 13; workflow wf_1cc608d4; house-expenses note line 16","entry":"Machine facts probed 2026-11-02: no Python 3.13, no uv, no pipx, no py launcher. The only Python is the Codex runtime 3.12.14 at its folder path. The EMS note of 11-01 had the same path.","steps":[[1,"House-expenses workflow briefs and a MEMORY.md have no Python line. The task does not say 'you need Python'. The agent assumes it."],[1,"There is no signal before the error. Under pull, each of the 86 windows pays one failed python call before any lookup."],[0,"'Python was not found' is exact."],[1,"On 11-03 the EMS and clinic entries agree on the codex path. The clinic's uv run python works only in its venv."],[3,"The d
