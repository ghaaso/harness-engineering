# The harness kit's hook programs (docs/program/harness-kit-2026-11-25/CONTRACT.md section 7; design: DESIGN.md).
# Protected: the [workspace.lints*] and [profile.*] tables are copied whole from the owner's other Rust work
# (docs/program/monitor/round9/rust/Cargo.toml). Builders add crates under crates/ and nothing else here.
# Dependencies: serde_json 1 and regex 1, nothing else. Every cargo call carries --offline.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
serde_json = "1"
regex = "1"
kit-core = { path = "crates/kit-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
float_cmp = "deny"
debug_assert_with_mut_call = "deny"
or_fun_call = "deny"
unwrap_in_result = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"
unused_async = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
needless_pass_by_value = "deny"
mutex_atomic = "deny"
large_enum_variant = "deny"
large_stack_arrays = "deny"
undocumented_unsafe_blocks = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
wildcard_dependencies = "deny"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
strip = true
