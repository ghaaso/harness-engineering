# Local smoke override for docker-compose.prod.yml (ops/selfhost/smoke/smoke.sh). Only what a
# developer machine needs and the host does not: explicit subnets (this machine's Docker address
# pools are exhausted, so a network without one cannot be created), and an `app` network with no
# route out, so nothing in the smoke can reach a real host (S7 runs fixflow-r2-put.sh against a
# placeholder R2 account: it must fail closed, not call Cloudflare). It adds no port, no service
# and no environment.
networks:
  db:
    ipam:
      config:
        - subnet: ${FF_SMOKE_DB_SUBNET:-10.77.30.0/24}
  app:
    internal: true
    ipam:
      config:
        - subnet: ${FF_SMOKE_APP_SUBNET:-10.77.31.0/24}
  opsnet:
    ipam:
      config:
        - subnet: ${FF_SMOKE_OPS_SUBNET:-10.77.32.0/24}
